function skyDome(cols,r){const m=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{cTop:{value:new THREE.Color(cols.top)},cMid:{value:new THREE.Color(cols.mid)},cHor:{value:new THREE.Color(cols.hor)},cLow:{value:new THREE.Color(cols.low)}},vertexShader:'varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform vec3 cTop,cMid,cHor,cLow;varying vec3 vD;void main(){float h=normalize(vD).y;vec3 c;if(h<0.){c=mix(cHor,cLow,smoothstep(0.,.2,-h));}else{c=mix(cHor,cMid,smoothstep(0.,.2,h));c=mix(c,cTop,smoothstep(.2,.85,h));}gl_FragColor=vec4(c,1.);}'});return new THREE.Mesh(new THREE.SphereGeometry(r||90,32,16),m);}
const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
function ray(e,cam){ndc.set(e.clientX/W*2-1,-(e.clientY/H)*2+1);raycaster.setFromCamera(ndc,cam);return raycaster;}

function removeObj(scene,o){scene.remove(o);o.traverse(n=>{if(n.material){(Array.isArray(n.material)?n.material:[n.material]).forEach(m=>m.dispose());}});}

function makeHub(){

  const NX=110,NZ=70,pos=new Float32Array(NX*NZ*3);
  for(let i=0;i<NX;i++)for(let j=0;j<NZ;j++){const k=(i*NZ+j)*3;pos[k]=(i/(NX-1)-.5)*34;pos[k+2]=-24+j/(NZ-1)*30;}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));

  function theme(){const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#1b2338';const d=isDark();scene.background=new THREE.Color(bg);scene.fog=new THREE.Fog(bg,6,27);{const A=new THREE.Color(d?'#8fe0d6':'#3f8f93'),B=new THREE.Color(d?'#b9a8ff':'#7a68b8'),c=new THREE.Color();for(let i=0;i<NX;i++)for(let j=0;j<NZ;j++){c.copy(B).lerp(A,j/(NZ-1));c.toArray(cols,(i*NZ+j)*3);}geo.attributes.color.needsUpdate=true;}mat.opacity=d?.9:.75;mat.blending=d?THREE.AdditiveBlending:THREE.NormalBlending;mat.needsUpdate=true;orbs.forEach(o=>{o.material.blending=d?THREE.AdditiveBlending:THREE.NormalBlending;o.material.opacity=d?.55:.4;o.material.needsUpdate=true;});}
  theme();
  return{scene,camera:cam,isHub:true,theme,
    update(dt,t){const k=t*(reduced?.25:1);const p=geo.attributes.position.array;for(let i=0;i<p.length;i+=3){const x=p[i],z=p[i+2];p[i+1]=Math.sin(x*.32+k*.55)*.32+Math.sin(z*.45+k*.4+x*.12)*.22-.6;}geo.attributes.position.needsUpdate=true;orbs.forEach(o=>{o.position.y=o.userData.y+Math.sin(k*.4+o.userData.ph)*.4;});cam.position.x=Math.sin(k*.06)*.7;cam.lookAt(0,.2,-3);}

  const scene=new THREE.Scene();scene.background=new THREE.Color('#0c2627');
  const cam=new THREE.PerspectiveCamera(42,W/H,.1,140);
  let bx=4,bz=4;
  function fit(){cam.aspect=W/H;const a=cam.aspect;const d=a<1?13/Math.max(a,.45)*.78:13;cam.position.set(0,d,d*.17);cam.lookAt(0,0,0);cam.updateProjectionMatrix();const hh=d*Math.tan(THREE.MathUtils.degToRad(cam.fov/2));bz=hh*.8;bx=hh*a*.82;}

  for(let i=0;i<160;i++){const m=new THREE.Mesh(pebG,pick(pebM));const r=rand(.08,.3);m.scale.set(r,r*.5,r*rand(.7,1));m.position.set(rand(-15,15),-1.4,rand(-14,14));m.rotation.y=rand(0,TAU);scene.add(m);}
  const rip=[];for(let i=0;i<12;i++)rip.push(new THREE.Vector4(0,0,-100,0));
  let ri=0,T=0;
  const wMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime:{value:0},uRip:{value:rip}},
    vertexShader:'varying vec2 vP;void main(){vec4 w=modelMatrix*vec4(position,1.);vP=w.xz;gl_Position=projectionMatrix*viewMatrix*w;}',
    fragmentShader:`uniform float uTime;uniform vec4 uRip[12];varying vec2 vP;
    void main(){
      float n=sin(vP.x*1.1+uTime*.45)*sin(vP.y*1.3-uTime*.35)+.5*sin((vP.x+vP.y)*2.3+uTime*.6);
      float r=0.;
      for(int i=0;i<12;i++){vec4 R=uRip[i];float age=uTime-R.z;if(age>0.&&age<7.){float d=distance(vP,R.xy);float x=d-age*1.5;r+=sin(x*10.)*exp(-x*x*2.5)*exp(-age*.55)*R.w/(1.+d*.35);}}
      vec3 c=mix(vec3(.04,.20,.22),vec3(.10,.36,.36),.5+.3*n);
      float caus=pow(abs(sin(vP.x*2.6+n*1.7+uTime*.5)*sin(vP.y*2.4-n*1.7-uTime*.4)),10.);
      c+=vec3(.5,.8,.75)*caus*.18;
      c+=vec3(.75,.95,.92)*max(r,0.)*.55;c-=vec3(.05,.1,.1)*max(-r,0.);
      gl_FragColor=vec4(c,clamp(.5+.06*n+abs(r)*.25,0.,.9));
    }`});
  const water=new THREE.Mesh(new THREE.PlaneGeometry(90,90),wMat);water.rotation.x=-Math.PI/2;scene.add(water);
  const addRipple=(x,z,s)=>{rip[ri].set(x,z,T,s);ri=(ri+1)%rip.length;};

  // koi
  const sph=new THREE.SphereGeometry(1,18,12);
  const tailShape=new THREE.Shape();tailShape.moveTo(0,0);tailShape.quadraticCurveTo(-.34,-.3,-.24,-.58);tailShape.lineTo(0,-.42);tailShape.lineTo(.24,-.58);tailShape.quadraticCurveTo(.34,-.3,0,0);
  const tailG=new THREE.ShapeGeometry(tailShape);
  const finG=new THREE.CircleGeometry(.13,10);
  const VAR=[{b:'#ff7433'},{b:'#f7f2ea',s:'#ff6a2b'},{b:'#f5c14a'},{b:'#f7f2ea',s:'#262626'},{b:'#ff7a3a',s:'#f7f2ea'},{b:'#f7f2ea',s:'#ff5f24'},{b:'#ff9350'},{b:'#f7f2ea',s:'#ff6a2b'}];
  const mk=c=>new THREE.MeshStandardMaterial({color:c,roughness:.45,emissive:new THREE.Color(c).multiplyScalar(.28),side:THREE.DoubleSide});
  const fish=VAR.map(v=>{
    const g=new THREE.Group();const mb=mk(v.b);
    const body=new THREE.Mesh(sph,mb);body.scale.set(.26,.14,.72);g.add(body);
    if(v.s){const sp=new THREE.Mesh(sph,mk(v.s));sp.scale.set(.2,.11,.28);sp.position.set(rand(-.05,.05),.06,rand(-.15,.35));g.add(sp);}
    const tail=new THREE.Group();tail.position.z=-.62;const tm=new THREE.Mesh(tailG,mb);tm.rotation.x=Math.PI/2;tail.add(tm);g.add(tail);
    [-1,1].forEach(sd=>{const f=new THREE.Mesh(finG,mb);f.rotation.x=-Math.PI/2;f.scale.set(1,.6,1);f.position.set(sd*.28,-.02,.22);f.rotation.z=sd*.6;g.add(f);});
    const sh=glow('#000000',1.5,.35,false);sh.scale.set(.9,1.8,1);scene.add(sh);
    const s=rand(.85,1.15);g.scale.setScalar(s);scene.add(g);
    return{g,tail,sh,x:rand(-bx,bx)*.7,z:rand(-bz,bz)*.7,ang:rand(0,TAU),speed:.6,ph:rand(0,TAU)};
  });
  // nenúfares
  const padG=new THREE.CircleGeometry(1,30,.25,TAU-.5);
  const petalG=new THREE.SphereGeometry(1,10,8);
  const pads=[];
  for(let i=0;i<7;i++){
    const g=new THREE.Group();const r=rand(.45,.85);
    const m=new THREE.Mesh(padG,new THREE.MeshStandardMaterial({color:pick(['#4f8f4a','#5e9f52','#447f44']),roughness:.6,side:THREE.DoubleSide}));
    m.rotation.x=-Math.PI/2;m.scale.setScalar(r);g.add(m);
    if(i<3){const lot=new THREE.Group();[[8,.2,-.5,'#f7b4c9'],[6,.14,-1.0,'#fcd6e2']].forEach(([n,len,tilt,c])=>{const pm=new THREE.MeshStandardMaterial({color:c,roughness:.5,emissive:new THREE.Color(c).multiplyScalar(.15)});for(let k=0;k<n;k++){const h=new THREE.Group();h.rotation.y=k/n*TAU+(n===6?.3:0);const p=new THREE.Mesh(petalG,pm);p.scale.set(.07,.025,len);p.position.z=len*.7;p.rotation.x=tilt;h.add(p);lot.add(h);}});const ctr=new THREE.Mesh(petalG,new THREE.MeshStandardMaterial({color:'#f6d25a',roughness:.6}));ctr.scale.set(.06,.04,.06);ctr.position.y=.05;lot.add(ctr);lot.position.y=.04;lot.position.x=r*.15;g.add(lot);}
    g.position.set(rand(-bx,bx),.03,rand(-bz,bz));g.rotation.y=rand(0,TAU);scene.add(g);
    pads.push({g,x:g.position.x,z:g.position.z,ph:rand(0,TAU)});
  }
  // pétalos flotando
  const petals=[];const ptG=new THREE.CircleGeometry(.07,8);
  for(let i=0;i<14;i++){const m=new THREE.Mesh(ptG,new THREE.MeshBasicMaterial({color:pick(['#ffd0dc','#ffe3ea','#f8b8c9']),side:THREE.DoubleSide,transparent:true,opacity:.9}));m.rotation.x=-Math.PI/2;m.scale.set(1,1.6,1);m.position.set(rand(-bx,bx),.02,rand(-bz,bz));scene.add(m);petals.push({m,vx:rand(-.12,.12),vz:rand(.03,.12),rs:rand(-.4,.4)});}
  // comida
  const food=[];const foodG=new THREE.SphereGeometry(.06,8,6);const foodM=new THREE.MeshStandardMaterial({color:'#d8b068',roughness:.7});
  let nextDrip=3;
  return{scene,camera:cam,
    resize:fit,
    down(e){const p=planeHit(e,cam,new THREE.Plane(new THREE.Vector3(0,1,0),0));if(!p)return;addRipple(p.x,p.z,1);Sound.note((p.x/bx+1)/2,.5);
      for(let k=0;k<3&&food.length<16;k++){const m=new THREE.Mesh(foodG,foodM);const fx=p.x+rand(-.25,.25),fz=p.z+rand(-.25,.25);m.position.set(fx,.02,fz);scene.add(m);food.push({m,x:fx,z:fz,age:0});}},
    update(dt,t){
      T=t;wMat.uniforms.uTime.value=t;
      nextDrip-=dt;if(nextDrip<0){nextDrip=rand(5,10);addRipple(rand(-bx,bx),rand(-bz,bz),.35);Sound.drip();}
      for(let i=food.length-1;i>=0;i--){const f=food[i];f.age+=dt;f.m.position.y=.02-Math.min(.25,f.age*.02);if(f.age>18){scene.remove(f.m);food.splice(i,1);}}
      fish.forEach((f,i)=>{
        let best=null,bd=1e9;food.forEach(p=>{const d=Math.hypot(p.x-f.x,p.z-f.z);if(d<bd&&d<10){bd=d;best=p;}});
        let desired=null,spd=.5+.18*Math.sin(t*.5+f.ph);
        if(best){desired=Math.atan2(best.x-f.x,best.z-f.z);spd=1.5;}
        if(Math.abs(f.x)>bx||Math.abs(f.z)>bz){desired=Math.atan2(-f.x,-f.z);}
        if(desired!==null){f.ang+=clamp(wrapA(desired-f.ang),-2.3*dt,2.3*dt);}else f.ang+=Math.sin(t*.37+f.ph)*.8*dt;
        fish.forEach((o,j)=>{if(j===i)return;const dx=f.x-o.x,dz=f.z-o.z,d=Math.hypot(dx,dz);if(d<.8&&d>0){f.x+=dx/d*(.8-d)*dt*1.5;f.z+=dz/d*(.8-d)*dt*1.5;}});
        f.speed+=(spd-f.speed)*Math.min(1,dt*1.5);
        f.x+=Math.sin(f.ang)*f.speed*dt;f.z+=Math.cos(f.ang)*f.speed*dt;
        f.g.position.set(f.x,-.42+Math.sin(t+f.ph)*.03,f.z);f.g.rotation.y=f.ang;f.g.rotation.z=Math.sin(t*2+f.ph)*.05;
        f.tail.rotation.y=Math.sin(t*(4+f.speed*6)+f.ph)*.5;if(f.speed>.45&&Math.random()<dt*.15)addRipple(f.x,f.z,.1);
        f.sh.position.set(f.x+.25,-1.3,f.z+.15);f.sh.material.rotation=-f.ang;
        if(best&&bd<.35){scene.remove(best.m);food.splice(food.indexOf(best),1);addRipple(best.x,best.z,.45);Sound.drip();}
      });
      pads.forEach(p=>{p.g.position.x=p.x+Math.sin(t*.1+p.ph)*.25;p.g.position.z=p.z+Math.cos(t*.08+p.ph)*.25;p.g.rotation.y+=dt*.02;});
      petals.forEach(p=>{p.m.position.x+=p.vx*dt;p.m.position.z+=p.vz*dt;p.m.rotation.z+=p.rs*dt;if(p.m.position.z>bz+1)p.m.position.z=-bz-1;if(p.m.position.x>bx+1)p.m.position.x=-bx-1;if(p.m.position.x<-bx-1)p.m.position.x=bx+1;});
    }
  };
}

  const cam=new THREE.PerspectiveCamera(55,W/H,.1,220);
  function fit(){cam.aspect=W/H;cam.fov=cam.aspect<1?68:55;cam.position.set(0,1.6,12);cam.lookAt(0,4,0);cam.updateProjectionMatrix();}

  const moon=glow('#ffe9c9',16,.5);moon.position.set(-22,30,-100);scene.add(moon);const moonC=glow('#fff8ea',5,1);moonC.position.copy(moon.position);scene.add(moonC);
  function ridge(z,color,amp,base,seed){const s=new THREE.Shape(),w=260;s.moveTo(-w/2,-3);for(let i=0;i<=80;i++){const x=-w/2+i*w/80;s.lineTo(x,base+Math.sin(i*.33+seed)*amp*.5+Math.sin(i*.87+seed*2)*amp*.28+Math.random()*amp*.1);}s.lineTo(w/2,-3);s.lineTo(-w/2,-3);const m=new THREE.Mesh(new THREE.ShapeGeometry(s),new THREE.MeshBasicMaterial({color}));m.position.z=z;scene.add(m);}
  ridge(-95,'#2c2553',14,5,1);ridge(-70,'#1c1a3e',9,2,4);ridge(-50,'#110f28',5,.4,7);
  const wMat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0}},vertexShader:'varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',fragmentShader:'uniform float uTime;varying vec3 vW;void main(){float d=clamp((12.-vW.z)/70.,0.,1.);vec3 c=mix(vec3(.02,.03,.09),vec3(.32,.21,.36),pow(d,1.8));float s=sin(vW.z*1.7+uTime*.8+sin(vW.x*.3+uTime*.2)*2.)*.5+.5;c+=vec3(.06,.06,.12)*pow(s,6.)*(1.-d);gl_FragColor=vec4(c,1.);}'});
  const water=new THREE.Mesh(new THREE.PlaneGeometry(300,300),wMat);water.rotation.x=-Math.PI/2;scene.add(water);
  const lanternG=new THREE.CylinderGeometry(.24,.18,.46,14,1,true);
  const PAPER=['#ffb45a','#ff9a6b','#ffc76e','#ff8a7a','#ffa94d'];
  const lanterns=[];
  function spawn(x,y,z,quiet){
    const g=new THREE.Group();const col=pick(PAPER);
    const body=new THREE.Mesh(lanternG,new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,transparent:true}));g.add(body);
    const halo=glow(col,2.6,.45);g.add(halo);const core=glow('#fff2cf',.8,.9);core.position.y=-.12;g.add(core);
    g.position.set(x,y,z);g.scale.setScalar(.001);scene.add(g);
    const refl=glow(col,1.6,.3);refl.material.depthTest=false;refl.renderOrder=3;refl.scale.set(1.2,3,1);scene.add(refl);
    lanterns.push({g,body,halo,core,refl,x0:x,y,z,vy:rand(.38,.6),ph:rand(0,TAU),age:0});
    if(!quiet)Sound.note(clamp(y/8,0,1),.45);
  }
  for(let i=0;i<7;i++)spawn(rand(-8,8),rand(2,12),rand(-18,-4),true);
  const flies=[];for(let i=0;i<30;i++){const s=glow('#d8ff9a',.22,.8);s.position.set(rand(-10,10),rand(.2,1.6),rand(-12,6));s.userData={ph:rand(0,TAU),bx:s.position.x,by:s.position.y,bz:s.position.z};scene.add(s);flies.push(s);}
  let auto=2,hold=null,holdT=0;
  const tapPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
  function spawnAt(e){const p=planeHit(e,cam,tapPlane);if(!p)return;spawn(p.x,Math.max(p.y,.5),rand(-1.5,1));}
  let wishes=0;const wishFx=[];
  return{scene,camera:cam,resize:fit,
    extra(){toast(wishes?L('Deseos pedidos: ','Wishes made: ')+wishes:L('Toca un farolillo que ya vuele para pedir un deseo.','Tap a lantern that is already flying to make a wish.'));},
    down(e){const hs=ray(e,cam).intersectObjects(lanterns.map(l=>l.halo));if(hs.length){const Lt=lanterns.find(l=>l.halo===hs[0].object);if(Lt&&!Lt.wished&&Lt.age>.8){Lt.wished=true;Lt.core.scale.setScalar(1.6);Lt.halo.material.color.set('#fff3d0');wishes++;setExtra(L('Deseos: ','Wishes: ')+wishes);Sound.note(.75,.5);Sound.note(1,.4);for(let k=0;k<10;k++){const b=glow('#fff3c0',.5,1);b.position.copy(Lt.g.position);scene.add(b);wishFx.push({s:b,vx:rand(-2,2),vy:rand(-1,3),life:.9});}return;}}

  const ks3=new THREE.Shape();ks3.moveTo(0,-.95);ks3.lineTo(-.75,0);ks3.lineTo(0,0);ks3.lineTo(0,-.95);const q3=new THREE.Mesh(new THREE.ShapeGeometry(ks3),new THREE.MeshStandardMaterial({color:'#5ac8e8',side:THREE.DoubleSide,roughness:.6}));q3.position.z=.01;kite.add(q3);

  const bows=[];for(let i=3;i<TN;i+=4){const b=new THREE.Mesh(new THREE.PlaneGeometry(.9,.35),new THREE.MeshBasicMaterial({color:pick(['#ff6b5a','#ffd166','#5ac8e8','#b58cff']),side:THREE.DoubleSide}));scene.add(b);bows.push({m:b,i});}
  // semillas de diente de león
  const seeds=[];function placeSeed(s){s.s.position.set(rand(0,1)<.5?-30:30,rand(6,30),KZ+rand(-2,2));s.vx=(s.s.position.x<0?1:-1)*rand(1.2,2.4);s.ph=rand(0,TAU);s.s.material.opacity=.95;}

  for(let i=0;i<3;i++){const g=new THREE.Group();const a=new THREE.Mesh(bG,bM),b=new THREE.Mesh(bG,bM);b.scale.x=-1;g.add(a,b);g.position.set(rand(-40,40),rand(26,40),rand(-70,-40));scene.add(g);birds.push({g,a,b,v:rand(2,4)*(Math.random()<.5?-1:1),ph:rand(0,TAU)});}

    down(e){down=true;setTarget(e);},move(e,isDown){if(isDown)setTarget(e);},up(){down=false;},
    update(dt,t){

      // hilo
      for(let i=0;i<24;i++){const k=i/23;const x=anchor.x+(pos.x-anchor.x)*k,y=anchor.y+(pos.y-anchor.y)*k-Math.sin(Math.PI*k)*1.6,z=anchor.z+(KZ-anchor.z)*k;strPts[i*3]=x;strPts[i*3+1]=y;strPts[i*3+2]=z;}strG.attributes.position.needsUpdate=true;

      for(let i=0;i<TN;i++){tailPts[i*3]=tail[i].x;tailPts[i*3+1]=tail[i].y;tailPts[i*3+2]=tail[i].z;}tailG.attributes.position.needsUpdate=true;
      bows.forEach(b=>{b.m.position.copy(tail[b.i]);b.m.rotation.z=Math.atan2(tail[b.i-1].y-tail[b.i].y,tail[b.i-1].x-tail[b.i].x)+Math.sin(t*4+b.i)*.3;});

          for(let k=0;k<8;k++){const b=glow('#ffffff',.6,1);b.position.copy(s.s.position);scene.add(b);bursts.push({s:b,vx:rand(-3,3),vy:rand(-1,4),life:.8});}placeSeed(s);}});
      for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.life-=dt;b.s.position.x+=b.vx*dt;b.s.position.y+=b.vy*dt;b.s.material.opacity=Math.max(0,b.life/.8);if(b.life<=0){removeObj(scene,b.s);bursts.splice(i,1);}}

    }
  };

function makeFrog(){
  const scene=new THREE.Scene();scene.background=new THREE.Color('#06181c');
  const cam=new THREE.PerspectiveCamera(42,W/H,.1,140);
  let bx=4,bz=4;
  function fit(){cam.aspect=W/H;const a=cam.aspect;const d=a<1?13/Math.max(a,.45)*.78:13;cam.position.set(0,d,d*.2);cam.lookAt(0,0,0);cam.updateProjectionMatrix();const hh=d*Math.tan(THREE.MathUtils.degToRad(cam.fov/2));bz=hh*.78;bx=hh*a*.8;}

  const moonL=new THREE.DirectionalLight('#cfe0ff',.7);moonL.position.set(-4,10,3);scene.add(moonL);
  const rip=[];for(let i=0;i<10;i++)rip.push(new THREE.Vector4(0,0,-100,0));let ri=0,T=0;
  const wMat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uRip:{value:rip}},vertexShader:'varying vec2 vP;void main(){vec4 w=modelMatrix*vec4(position,1.);vP=w.xz;gl_Position=projectionMatrix*viewMatrix*w;}',
    fragmentShader:'uniform float uTime;uniform vec4 uRip[10];varying vec2 vP;void main(){float n=sin(vP.x*1.1+uTime*.45)*sin(vP.y*1.3-uTime*.35)+.5*sin((vP.x+vP.y)*2.3+uTime*.6);float r=0.;for(int i=0;i<10;i++){vec4 R=uRip[i];float age=uTime-R.z;if(age>0.&&age<6.){float d=distance(vP,R.xy);float x=d-age*1.5;r+=sin(x*10.)*exp(-x*x*2.5)*exp(-age*.6)*R.w/(1.+d*.35);}}vec3 c=mix(vec3(.03,.13,.16),vec3(.08,.26,.28),.5+.3*n);float q=(vP.x+2.)*(vP.x+2.)+(vP.y+3.)*(vP.y+3.);c+=vec3(.55,.62,.7)*exp(-q*.12)*.35*(.8+.2*n);c+=vec3(.7,.9,.9)*max(r,0.)*.5;gl_FragColor=vec4(c,1.);}'});
  const water=new THREE.Mesh(new THREE.PlaneGeometry(90,90),wMat);water.rotation.x=-Math.PI/2;scene.add(water);
  const addRipple=(x,z,s)=>{rip[ri].set(x,z,T,s);ri=(ri+1)%rip.length;};
  const padG=new THREE.CircleGeometry(1,30,.25,TAU-.5);
  const pads=[];
  for(let i=0;i<10;i++){let x,z,ok=false;for(let k=0;k<30&&!ok;k++){x=rand(-bx,bx);z=rand(-bz,bz);ok=!pads.some(p=>Math.hypot(p.x-x,p.z-z)<2.4);}
    const r=rand(.85,1.3);const m=new THREE.Mesh(padG,new THREE.MeshStandardMaterial({color:pick(['#3f7d45','#4c8f4e','#356b3c']),roughness:.7,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.rotation.z=rand(0,TAU);m.scale.setScalar(r);m.position.set(x,.03,z);scene.add(m);pads.push({m,x,z,r,ph:rand(0,TAU),dx:rand(-.1,.1),dz:rand(-.1,.1)});}
  // rana
  const frog=new THREE.Group();scene.add(frog);
  const fm=new THREE.MeshStandardMaterial({color:'#5fb35a',roughness:.6});
  const body=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),fm);body.scale.set(.42,.3,.5);body.position.y=.3;frog.add(body);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(1,12,8),new THREE.MeshStandardMaterial({color:'#d9f0b0',roughness:.7}));belly.scale.set(.34,.18,.4);belly.position.set(0,.2,.05);frog.add(belly);
  [-1,1].forEach(sd=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.15,12,8),new THREE.MeshStandardMaterial({color:'#ffffff',roughness:.4}));e.position.set(sd*.22,.56,.28);frog.add(e);const pu=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),new THREE.MeshBasicMaterial({color:'#111'}));pu.position.set(sd*.22,.58,.4);frog.add(pu);
    const leg=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),fm);leg.scale.set(.16,.1,.28);leg.position.set(sd*.42,.1,-.15);frog.add(leg);});
  const tongue=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:'#ff7a9a'}));tongue.visible=false;tongue.frustumCulled=false;scene.add(tongue);
  let cur=0,hop=null,tongueT=0,count=0;
  const flies=[];for(let i=0;i<8;i++){const s=glow('#d8ff8a',.5,.9);s.position.set(rand(-bx,bx),rand(.5,1.4),rand(-bz,bz));s.userData={ph:rand(0,TAU),vx:rand(-.4,.4),vz:rand(-.4,.4)};scene.add(s);flies.push(s);}
  const fireflyGlow=new THREE.PointLight('#c8ff7a',.5,4);scene.add(fireflyGlow);
  const petals=[];const ptG=new THREE.CircleGeometry(.07,8);for(let i=0;i<8;i++){const m=new THREE.Mesh(ptG,new THREE.MeshBasicMaterial({color:'#ffd0dc',side:THREE.DoubleSide,transparent:true,opacity:.8}));m.rotation.x=-Math.PI/2;m.position.set(rand(-bx,bx),.02,rand(-bz,bz));scene.add(m);petals.push({m,vx:rand(-.1,.1),vz:rand(.03,.1)});}
  function padPos(p){return new THREE.Vector3(p.m.position.x,.06,p.m.position.z);}
  return{scene,camera:cam,resize:fit,
    extra(){toast(count?L('La rana ha atrapado ','The frog has caught ')+count+L(count>1?' luciérnagas.':' luciérnaga.',count>1?' fireflies.':' firefly.'):L('Salta a un nenúfar cerca de una luciérnaga y la rana la atrapará.','Hop to a lily pad near a firefly and the frog will catch it.'));},
    down(e){const hits=ray(e,cam).intersectObjects(pads.map(p=>p.m));if(hits.length){const i=pads.findIndex(p=>p.m===hits[0].object);if(i!==cur&&!hop){hop={from:padPos(pads[cur]),to:i,t:0};Sound.sweep(320,640,.18,.05);}return;}
      const p=planeHit(e,cam,new THREE.Plane(new THREE.Vector3(0,1,0),0));if(p){addRipple(p.x,p.z,.8);Sound.drip();}},
    update(dt,t){
      T=t;wMat.uniforms.uTime.value=t;
      pads.forEach(p=>{p.m.position.x=p.x+Math.sin(t*.12+p.ph)*.5+p.dx*Math.sin(t*.05);p.m.position.z=p.z+Math.cos(t*.1+p.ph)*.5;p.m.rotation.z+=dt*.02;p.m.position.y=.03+Math.sin(t*1.5+p.ph)*.01;});
      if(hop){hop.t+=dt;const k=Math.min(1,hop.t/.6);const to=padPos(pads[hop.to]);frog.position.lerpVectors(hop.from,to,k);frog.position.y=.06+Math.sin(Math.PI*k)*1.8;frog.rotation.y=Math.atan2(to.x-hop.from.x,to.z-hop.from.z);
        const sq=k<.15?1-k*2:k>.85?1-(k-.85)*2:1+Math.sin(Math.PI*k)*.25;frog.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
        if(k>=1){cur=hop.to;hop=null;frog.scale.setScalar(1);addRipple(to.x,to.z,.6);Sound.drip();
          let best=null,bd=1.9;flies.forEach(f=>{const d=Math.hypot(f.position.x-to.x,f.position.z-to.z);if(d<bd){bd=d;best=f;}});
          if(best){tongueT=.3;const a=tongue.geometry.attributes.position;const m=new THREE.Vector3(frog.position.x,.45,frog.position.z);a.setXYZ(0,m.x,m.y,m.z);a.setXYZ(1,best.position.x,best.position.y,best.position.z);a.needsUpdate=true;tongue.visible=true;frog.rotation.y=Math.atan2(best.position.x-m.x,best.position.z-m.z);
            count++;setExtra(L('Luciérnagas: ','Fireflies: ')+count);Sound.note(rand(.6,1),.55);best.position.set(rand(-bx,bx),rand(.5,1.4),rand(-bz,bz));}}}
      else{const p=padPos(pads[cur]);frog.position.set(p.x,.06,p.z);frog.scale.set(1,1+Math.sin(t*3)*.03,1);}
      if(tongueT>0){tongueT-=dt;if(tongueT<=0)tongue.visible=false;}
      flies.forEach(f=>{const u=f.userData;f.position.x+=(u.vx+Math.sin(t*.7+u.ph)*.3)*dt;f.position.z+=(u.vz+Math.cos(t*.6+u.ph)*.3)*dt;f.position.y=.5+.45*(1+Math.sin(t*.9+u.ph))*.5;if(Math.abs(f.position.x)>bx)u.vx*=-1;if(Math.abs(f.position.z)>bz)u.vz*=-1;f.material.opacity=.35+.65*Math.pow(Math.max(0,Math.sin(t*2+u.ph)),2);});
      fireflyGlow.position.copy(flies[0].position);
      petals.forEach(p=>{p.m.position.x+=p.vx*dt;p.m.position.z+=p.vz*dt;if(p.m.position.z>bz+1)p.m.position.z=-bz-1;if(Math.abs(p.m.position.x)>bx+1)p.m.position.x*=-1;});
    }
  };
}

  velero:{make:makeSail,hint:{es:"Mantén pulsado a un lado de la pantalla para virar. Pasa junto a las boyas de luz.",en:"Hold one side of the screen to turn. Sail past the light buoys."},extra:{es:"Boyas: 0",en:"Buoys: 0"}},
  lluvia:{make:makeRain,hint:{es:"Dibuja con el dedo en el cristal empañado. El vaho volverá poco a poco.",en:"Draw with your finger on the fogged glass. The mist slowly comes back."},extra:{es:"Empañar",en:"Fog it up"}},
  vuelo:{make:makeFlight,hint:{es:"Mantén el dedo en la pantalla para guiar: arriba sube, abajo baja, a los lados gira. Cruza los anillos de luz.",en:"Keep your finger on the screen to steer: up climbs, down dives, sides turn. Fly through the rings of light."},extra:{es:"Anillos: 0",en:"Rings: 0"}},
  aurora:{make:makeAurora,hint:{es:"Toca el cielo para despertar una aurora. Toca una estrella fugaz para cazarla.",en:"Tap the sky to wake an aurora. Tap a shooting star to catch it."},extra:{es:"Estrellas fugaces: 0",en:"Shooting stars: 0"}},
  orbitas:{make:makeOrbits,hint:{es:"Toca cerca del sol para crear un planeta. Cada vuelta suena una nota. Arrastra para girar la vista.",en:"Tap near the sun to create a planet. Every lap plays a note. Drag to turn the view."},extra:{es:"Empezar de nuevo",en:"Start over"}},
  fuego:{make:makeFire,hint:{es:"Toca para echar un tronco. Mantén pulsado para tostar un malvavisco y suelta cuando esté dorado.",en:"Tap to add a log. Hold to roast a marshmallow and release when it turns golden."},extra:{es:"Malvaviscos: 0",en:"Marshmallows: 0"}},
  marea:{make:makeTide,hint:{es:"Las olas van y vienen. Toca las conchas que dejan y deja huellas en la arena seca.",en:"The waves come and go. Tap the shells they leave and make footprints on the dry sand."},extra:{es:"Conchas: 0",en:"Shells: 0"}},
  nieve:{make:makeSnowGlobe,hint:{es:"Toca o agita la bola de nieve. Cuando se pose, toca los tesoros que asoman.",en:"Tap or shake the snow globe. When the snow settles, tap the treasures it uncovers."},extra:{es:"Tesoros: 0",en:"Treasures: 0"}},
  estrellas:{make:makeStars,hint:{es:"Arrastra de una estrella a otra para unirlas. Arrastra el cielo para mirar alrededor.",en:"Drag from one star to another to connect them. Drag the sky to look around."},extra:{es:"Borrar líneas",en:"Clear lines"}},
  cometa:{make:makeKite,hint:{es:'Arrastra para guiar la cometa con el viento. Atrapa las semillas blancas que flotan.',en:'Drag to steer the kite in the wind. Catch the white floating seeds.'},extra:{es:'Semillas: 0',en:'Seeds: 0'}},
  rana:{make:makeFrog,hint:{es:'Toca un nenúfar para que la rana salte. Si aterriza cerca de una luciérnaga, la atrapa con la lengua.',en:'Tap a lily pad to make the frog hop. If it lands near a firefly, it catches it with its tongue.'},extra:{es:'Luciérnagas: 0',en:'Fireflies: 0'}}
};
const hub=$('#hub'),back=$('#back'),gtitle=$('#gtitle'),hint=$('#hint'),extra=$('#extra'),muteBtn=$('#mute');
let current=null,currentId='hub',fromHub=false,hintTimer=0;
function setScene(obj){if(current){if(current.dispose)current.dispose();disposeAll(current.scene);}current=obj;}
let hintIntro=false;
function showHint(txt,ms,intro){hint.textContent=txt;hint.classList.add('show');hintIntro=!!intro;clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.remove('show'),ms||6000);}
function toast(txt){showHint(txt,3200,false);}
function setExtra(txt){extra.textContent=txt;}
const EMB=(()=>{try{return window.parent!==window;}catch(e){return true;}})();
function leaveToSalon(){if(EMB){try{window.parent.postMessage('salon:close','*');}catch(e){}}else{location.replace('../../#sec-relax');}}
function openHub(){if(EMB||!/[?&]hub\b/.test(location.search)){leaveToSalon();return;}currentId='hub';setScene(makeHub());hub.hidden=false;back.hidden=true;gtitle.hidden=true;extra.hidden=true;hint.classList.remove('show');Sound.setMood('hub');document.title=U('title');}
function openGame(id){const G=GAMES[id];currentId=id;if(G.extra){extra.hidden=false;extra.textContent=tx(G.extra);}else extra.hidden=true;setScene(G.make());hub.hidden=true;back.hidden=false;gtitle.hidden=false;gtitle.textContent=tx(META[id].name);showHint(tx(G.hint),7000,true);Sound.setMood(id);document.title=tx(META[id].name)+U('inRG');canvas.focus({preventScroll:true});}
const fadeEl=$('#fade'),mini=$('#mini'),miniWord=$('#miniWord'),breathBtn=$('#breathBtn');
let miniOn=false;try{miniOn=localStorage.getItem('relax-breath')==='1';}catch(e){}
function drawMini(){mini.hidden=!(miniOn&&currentId!=='hub');breathBtn.setAttribute('aria-pressed',miniOn?'true':'false');}
breathBtn.addEventListener('click',()=>{miniOn=!miniOn;try{localStorage.setItem('relax-breath',miniOn?'1':'0');}catch(e){}drawMini();});
function route(){const id=decodeURIComponent(location.hash.slice(1));const go=()=>{if(GAMES[id])openGame(id);else openHub();breathBtn.hidden=currentId==='hub';drawMini();setTimeout(()=>fadeEl.classList.remove('on'),80);};if(reduced||!current){go();return;}fadeEl.classList.add('on');setTimeout(go,430);}
const ART_SVG=id=>'<span class="art" aria-hidden="true"><svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMid slice">'+META[id].art+'</svg></span>';
function goGame(id){Sound.start();fromHub=true;location.hash=id;}
function renderHub(){
  const h=new Date().getHours();
  $('#hola').textContent=(h<6?U('gn'):h<13?U('gm'):h<20?U('ga'):U('gn'))+U('hola');
  $('#lede').textContent=U('lede');$('#surprise').textContent=U('cta');$('#ctan').textContent=U('ctan');$('#foot').textContent=U('foot');
  const slot=h<7?['estrellas','fuego']:h<12?['vuelo','estanque','cometa']:h<17?['velero','burbujas','jardin']:h<21?['marea','pesca','linternas']:['fuego','aurora','rana'];
  const fid=slot[Math.floor((Date.now()/3600000)%slot.length)];
  $('#feat').innerHTML='<button class="fk" data-game="'+fid+'" style="--c:'+META[fid].c+';--b1:'+META[fid].b1+';--b2:'+META[fid].b2+'">'+ART_SVG(fid)+'<span class="ft"><span class="fl">'+U('now')+'</span><b>'+tx(META[fid].name)+'</b><p>'+tx(META[fid].desc)+'</p><span class="cta">'+U('play')+'</span></span></button>';
  let i=0,html='';
  for(const sec of Object.keys(SECTIONS)){html+='<section class="group" aria-labelledby="g-'+sec+'"><h2 id="g-'+sec+'">'+U(sec)+'</h2><div class="games">';
    for(const id of SECTIONS[sec]){const m=META[id];html+='<button class="game" data-game="'+id+'" style="--c:'+m.c+';--b1:'+m.b1+';--b2:'+m.b2+';--i:'+(i++)+'">'+ART_SVG(id)+(NEWG.includes(id)?'<span class="new">'+U('nuevo')+'</span>':'')+'<b>'+tx(m.name)+'</b><span>'+tx(m.desc)+'</span></button>';}
    html+='</div></section>';}
  $('#sections').innerHTML=html;
  document.querySelectorAll('.game,.fk').forEach(b=>{b.addEventListener('click',()=>goGame(b.dataset.game));
    b.addEventListener('pointermove',e=>{if(reduced||e.pointerType!=='mouse')return;const r=b.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;b.style.transform='perspective(700px) rotateY('+(x*8)+'deg) rotateX('+(-y*8)+'deg) translateY(-3px)';});
    b.addEventListener('pointerleave',()=>{b.style.transform='';});});
  breathBtn.textContent=U('breathe');back.lastChild.textContent=U('home');langBtn.textContent=lang==='es'?'EN':'ES';document.documentElement.lang=lang;drawMute();
  if(reduced)breathWord.textContent=U('slow');
  if(currentId==='hub')document.title=U('title');
}
$('#surprise').addEventListener('click',()=>{const ids=Object.keys(GAMES);goGame(ids[Math.floor(Math.random()*ids.length)]);});
$('#langBtn').addEventListener('click',()=>{lang=lang==='es'?'en':'es';try{localStorage.setItem('relax-lang',lang);}catch(e){}lastWord='';renderHub();if(currentId!=='hub'){const G=GAMES[currentId];gtitle.textContent=tx(META[currentId].name);showHint(tx(G.hint),5000,true);}});
{let sparkT=0;hub.addEventListener('pointermove',e=>{if(reduced||e.pointerType!=='mouse')return;const n=performance.now();if(n-sparkT<70)return;sparkT=n;const d=document.createElement('div');d.className='spark';d.style.left=e.clientX+'px';d.style.top=e.clientY+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),900);});}
back.addEventListener('click',()=>{if(fromHub){fromHub=false;history.back();}else{leaveToSalon();}});
extra.addEventListener('click',()=>{Sound.start();if(current&&current.extra)current.extra();});
function drawMute(){const m=Sound.muted;muteBtn.setAttribute('aria-pressed',m?'true':'false');muteBtn.setAttribute('aria-label',m?U('unmute'):U('mute'));muteBtn.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/>'+(m?'<path d="M17 9.5l5 5M22 9.5l-5 5"/>':'<path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>')+'</svg>';}
muteBtn.addEventListener('click',()=>{Sound.start();Sound.toggle();drawMute();});
drawMute();
window.addEventListener('hashchange',route);
window.addEventListener('pointerdown',()=>{Sound.start();Sound.setMood(currentId);},{once:true,capture:true});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentId!=='hub')back.click();});

// punteros
let down=null;
canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||!current)return;Sound.start();try{canvas.setPointerCapture(e.pointerId);}catch(err){}down={x:e.clientX,y:e.clientY,moved:false};if(current.down)current.down(e);if(hintIntro&&hint.classList.contains('show')){hintIntro=false;clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.remove('show'),1800);}});
canvas.addEventListener('pointermove',e=>{if(!e.isPrimary||!current)return;if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>9)down.moved=true;if(current.move)current.move(e,!!down);});
const endP=e=>{if(!e.isPrimary||!current||!down)return;const tap=!down.moved;down=null;if(current.up)current.up(e,tap);};
canvas.addEventListener('pointerup',endP);canvas.addEventListener('pointercancel',endP);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// tema
function onTheme(){if(current&&current.isHub)current.theme();}
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',onTheme);
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function resize(){W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);if(!current)return;if(current.resize)current.resize();else{current.camera.aspect=W/H;current.camera.updateProjectionMatrix();}}
window.addEventListener('resize',resize);

const breathEl=$('#breath'),breathWord=$('#breathWord'),langBtn=$('#langBtn');let lastWord='';
if(reduced){document.documentElement.style.setProperty('--s','.86');}
function updateBreath(t){if(reduced)return;const c=t%12;let sc,w;if(c<4){sc=.62+.38*(.5-.5*Math.cos(Math.PI*c/4));w=U('inhale');}else if(c<6){sc=1;w=U('hold');}else{sc=1-.38*(.5-.5*Math.cos(Math.PI*(c-6)/6));w=U('exhale');}document.documentElement.style.setProperty('--s',sc.toFixed(3));if(w!==lastWord){lastWord=w;breathWord.textContent=w;miniWord.textContent=w;}}
let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;updateBreath(T);if(current){current.update(dt,T);renderer.render(current.scene,current.camera);}requestAnimationFrame(loop);}
renderHub();route();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
