<style>
:root{--ink:#1b2a4a;--y:#ffd23f;--y2:#ff9f1c;--p:#ff4fa3;--c:#38e5ff;--g:#4ade80;--v:#8b5cff;--f:'Fredoka','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffc79a;font-family:var(--f);color:#fff}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.out{-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 8px 18px rgba(27,42,74,.35)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 95% at 50% 50%,transparent 58%,rgba(20,30,70,.34) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:3;background:#fff;opacity:0}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:none}
body.play #hud{display:block}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12));border:1.5px solid rgba(255,255,255,.55);box-shadow:0 8px 24px rgba(27,42,74,.25),inset 0 1px 0 rgba(255,255,255,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#top{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
#qual{font-weight:700;font-size:26px;line-height:1;border-radius:20px;padding:8px 16px 7px;color:#fff;text-align:center;min-width:120px}

#qual span{-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill}
#qual.full{background:linear-gradient(180deg,#ff6b8b,#e2245c)}
#timer{font-weight:700;font-size:26px;line-height:1;border-radius:20px;padding:8px 14px 7px;color:#fff;min-width:84px;text-align:center}
#timer span{-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill}
#timer.low{background:linear-gradient(180deg,#ff6b8b,#e2245c);animation:tb .5s infinite alternate}
@keyframes tb{to{transform:scale(1.08)}}
#rnd{position:absolute;left:10px;top:10px;border-radius:18px;padding:7px 12px;font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(27,42,74,.6);line-height:1.25}
#rnd small{display:block;font-size:11px;font-weight:600;opacity:.85;letter-spacing:.08em;text-transform:uppercase}
#pos{position:absolute;left:10px;top:66px;border-radius:18px;padding:6px 12px;font-weight:700;font-size:22px;color:#fff;line-height:1}

#prog{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(60vw,360px);height:16px;border-radius:9px;background:rgba(27,42,74,.45);border:2.5px solid #fff;box-shadow:0 3px 0 var(--ink);overflow:visible}

#prog b{position:absolute;top:-8px;width:8px;height:24px;margin-left:-4px;border-radius:3px;background:rgba(255,255,255,.45)}
.rb{position:absolute;top:10px;width:46px;height:46px;border-radius:50%;color:#fff;font-size:19px;display:grid;place-items:center;pointer-events:auto;cursor:pointer;padding:0}
#pauseB{right:10px}#muteB{right:62px}

#msg{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:clamp(40px,11vw,84px);font-weight:700;white-space:nowrap;opacity:0;background:linear-gradient(180deg,#fff7c2,#ffd23f 45%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 var(--ink)) drop-shadow(0 0 3px var(--ink)) drop-shadow(0 12px 18px rgba(27,42,74,.35))}
#msg.g{background-image:linear-gradient(180deg,#eafff2,#4ade80 50%,#14b86a)}
#msg.r{background-image:linear-gradient(180deg,#ffe0ea,#ff6b8b 50%,#e2245c)}
#msg.b{background-image:linear-gradient(180deg,#e6fbff,#7af0ff 50%,#38b6ff)}
#msg.on{animation:msg 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes msg{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}26%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1.05)}}
#cnt{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(90px,24vw,180px);font-weight:700;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink),0 16px 30px rgba(27,42,74,.4);display:none;line-height:1}
#cnt.on{display:block;animation:cnt .9s cubic-bezier(.2,1.5,.4,1)}
@keyframes cnt{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}30%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{opacity:1}}
#joy{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(27,42,74,.22));display:none;box-shadow:0 6px 20px rgba(27,42,74,.25)}
#joy u{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9ecff);box-shadow:0 5px 0 rgba(27,42,74,.4),0 0 0 3px rgba(255,255,255,.6)}
.ab{position:absolute;right:max(16px,env(safe-area-inset-right));width:112px;height:112px;border-radius:50%;border:4px solid #fff;display:none;place-items:center;font-weight:700;font-size:15px;color:var(--ink);pointer-events:auto;box-shadow:0 6px 0 var(--ink),0 12px 24px rgba(27,42,74,.3);line-height:1;text-align:center}
.ab em{font-style:normal;font-size:40px;display:block;margin-bottom:2px;pointer-events:none}.ab span{pointer-events:none}
.ab::before{content:'';position:absolute;inset:-22px;border-radius:50%}
.ab:active,.ab.on{transform:translateY(5px) scale(.94);box-shadow:0 1px 0 var(--ink),0 0 0 8px rgba(255,255,255,.35)}
#jumpB{bottom:max(22px,env(safe-area-inset-bottom));font-size:17px;background:linear-gradient(180deg,#fff3a8,#ffd23f 50%,#ffa51c)}
#diveB{bottom:max(118px,calc(env(safe-area-inset-bottom) + 100px));right:max(150px,calc(env(safe-area-inset-right) + 134px));width:84px;height:84px;background:linear-gradient(180deg,#e6fbff,#7af0ff 50%,#38b6ff)}
body.touch .ab{display:grid}
body.touch #prog{left:16px;transform:none;width:min(40vw,240px)}
#hint{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100vw - 200px);font-weight:600;font-size:16px;border-radius:999px;padding:9px 20px;transition:opacity .6s;white-space:nowrap}
@media (max-width:600px){#hint{white-space:normal;width:min(86vw,330px);max-width:none;text-align:center;font-size:15px;border-radius:18px}}
@media (max-aspect-ratio:1/1){#hint{top:calc(112px + env(safe-area-inset-top,0px))}}
#chk{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:none;border-radius:999px;padding:8px 22px;font-weight:700;font-size:22px;background:linear-gradient(180deg,#eafff2,#4ade80 60%,#14b86a);color:var(--ink);border:3px solid #fff;box-shadow:0 5px 0 var(--ink)}
#chk.on{display:block;animation:chk 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes chk{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
#spec{position:absolute;left:50%;bottom:max(70px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;border-radius:999px;padding:8px 20px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(180deg,#ff6b8b,#e2245c);border:3px solid #fff;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
#spec.on{display:block}
/* Pantallas */
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:16px;overflow-y:auto;touch-action:pan-y;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.ov *{touch-action:pan-y}
.ov.show{opacity:1;visibility:visible}
.ov>.card{margin:auto;transform:translateY(24px) scale(.96);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.ov.show>.card{transform:none}
#menu{justify-content:flex-end;padding-bottom:max(22px,env(safe-area-inset-bottom));background:radial-gradient(110% 70% at 50% 42%,rgba(255,220,190,0) 30%,rgba(20,40,90,.38) 100%)}
.logo{position:relative;font-size:clamp(50px,13vw,104px);font-weight:700;line-height:.92;letter-spacing:-.01em;transform:rotate(-4deg);margin-bottom:4px;margin-top:max(40px,env(safe-area-inset-top))}
.logo .w{display:block;padding:0 .08em .1em;background:linear-gradient(180deg,#ffffff 0%,#fff3c4 40%,#ffd23f 70%,#ff9f1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 var(--ink)) drop-shadow(0 0 2px var(--ink)) drop-shadow(0 14px 22px rgba(20,40,90,.35))}
.logo .w2{background:linear-gradient(180deg,#ffe6f0,#ff8fc7 45%,#ff3a7a);-webkit-background-clip:text;background-clip:text;font-size:1.08em}
.logo .tv{position:absolute;right:-.55em;top:-.62em;font-size:.26em;background:linear-gradient(180deg,#ff8fc7,#ff4fa3);color:#fff;padding:.25em .6em;border-radius:999px;border:3px solid #fff;transform:rotate(10deg);box-shadow:0 4px 0 var(--ink);-webkit-text-stroke:0;filter:none;letter-spacing:.05em}
.tag{margin:6px 0 auto;font-weight:600;font-size:clamp(14px,4vw,18px);border-radius:999px;padding:7px 18px}
.btn{position:relative;pointer-events:auto;cursor:pointer;border:3px solid #fff;border-radius:999px;font-family:var(--f);font-weight:700;font-size:clamp(20px,5.5vw,27px);padding:13px 50px 15px;margin:7px;color:var(--ink);background:linear-gradient(180deg,#fff3a8 0%,#ffd23f 45%,#ffa51c 100%);box-shadow:0 6px 0 var(--ink),0 14px 26px rgba(20,40,90,.35);letter-spacing:.02em;overflow:hidden;transition:transform .12s}
.btn::after{content:'';position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:sh 3.2s infinite}
@keyframes sh{0%,70%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.b2{background:linear-gradient(180deg,#e6fbff,#7af0ff 50%,#38b6ff);font-size:clamp(17px,4.6vw,21px);padding:11px 34px 12px}
.btn.b2::after,.btn.b3::after{display:none}
.btn.b3{background:#fff;font-size:16px;padding:8px 24px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.5;pointer-events:none}
#mrow{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
#stats{margin-top:8px;font-weight:600;font-size:14px;border-radius:999px;padding:5px 14px;display:flex;gap:14px}
#stats:empty{display:none}
.corner{position:fixed;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:11}
.corner.l{left:12px}.corner.r{right:12px}
.cbtn{pointer-events:auto;cursor:pointer;height:44px;min-width:44px;border-radius:22px;color:#fff;font-family:var(--f);font-weight:700;font-size:16px;padding:0 12px}
.card{background:linear-gradient(180deg,#ffffff,#eef6ff);color:var(--ink);border-radius:30px;padding:22px 22px 20px;width:min(440px,94vw);border:4px solid #fff;box-shadow:0 8px 0 var(--ink),0 24px 60px rgba(20,40,90,.45)}
.card h2{margin:0 0 10px;font-size:32px;font-weight:700;color:var(--ink)}
.card p{margin:8px 0;font-size:17px;font-weight:500;line-height:1.35}
.how{display:grid;gap:10px;text-align:left;margin:6px 0 12px}
.how div{display:flex;gap:12px;align-items:center;font-weight:500;font-size:16px;line-height:1.3}
.how em{flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:24px;background:linear-gradient(180deg,#e8f4ff,#cfe6ff);box-shadow:0 3px 0 #9dc0ea}
/* Vestuario */
#ward{justify-content:flex-end;padding-bottom:max(14px,env(safe-area-inset-bottom))}
#ward .card{margin:0 auto;width:min(520px,96vw);padding:14px 14px 12px}
#ward h2{font-size:24px;margin-bottom:6px}
.wtabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.wtabs button{pointer-events:auto;cursor:pointer;border:2.5px solid #fff;border-radius:999px;font-family:var(--f);font-weight:700;font-size:14px;padding:6px 14px;color:var(--ink);background:#dfeeff;box-shadow:0 3px 0 #9dc0ea}
.wtabs button.on{background:linear-gradient(180deg,#fff3a8,#ffd23f);box-shadow:0 3px 0 var(--ink)}
.wgrid{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;touch-action:pan-x!important;scrollbar-width:thin}
.wgrid *{touch-action:pan-x!important}
.wi{flex:none;width:76px;height:84px;border-radius:18px;border:3px solid #fff;background:linear-gradient(180deg,#fff,#e4f0ff);box-shadow:0 4px 0 #9dc0ea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;pointer-events:auto;position:relative;font-family:var(--f)}
.wi em{font-style:normal;font-size:30px;line-height:1}
.wi b{font-size:11px;font-weight:700;color:var(--ink);line-height:1.1;text-align:center;padding:0 3px}

.wi.lock::after{content:'🔒';position:absolute;right:4px;top:4px;font-size:13px}
.wi i{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.wi small{position:absolute;left:0;right:0;bottom:-2px;font-size:9.5px;font-weight:700;color:#fff;background:var(--ink);border-radius:0 0 14px 14px;padding:1px 0}
#wname{display:flex;gap:8px;align-items:center;justify-content:center;margin:4px 0 8px}

#rcard{background:rgba(10,20,50,.35);justify-content:center}

#rcard.show .rc{transform:none;opacity:1}
.rnum{display:inline-block;font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,var(--p),var(--v));padding:5px 18px;border-radius:999px;border:3px solid #fff;box-shadow:0 4px 0 var(--ink);margin-bottom:12px}
.rname{font-size:clamp(44px,12vw,96px);font-weight:700;line-height:1;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink),0 14px 28px rgba(20,40,90,.4)}
.rsub{margin-top:14px;font-weight:600;font-size:clamp(16px,4.6vw,22px);border-radius:999px;padding:8px 22px;display:inline-block}
.rico{font-size:clamp(50px,14vw,96px);line-height:1;margin-bottom:8px;filter:drop-shadow(0 6px 0 rgba(27,42,74,.5))}
/* Resultados */
#res .card{padding-top:16px}
#resT{font-size:36px}
#resBig{font-size:56px;font-weight:700;line-height:1;margin:4px 0;color:var(--ink)}
#resSub{font-weight:600;opacity:.8;font-size:16px}
#resList{position:relative;margin:10px 0;text-align:left;max-height:34vh;overflow-y:auto;touch-action:pan-y}
#resList div{display:flex;gap:8px;align-items:center;padding:4px 12px;border-radius:12px;font-weight:600;font-size:14.5px}
#resList div:nth-child(odd){background:#eef5ff}
#resList div.me{background:#ffe680}
#resList div.xo{opacity:.55}
#resList i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink);flex:none}
#resList span{flex:1}
#resList em{font-style:normal;width:24px;opacity:.7;font-weight:700}
#podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:10px 0 6px;height:170px}
#podium .pc{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
#podium .av{width:54px;height:54px;border-radius:50% 50% 45% 45%;border:4px solid #fff;box-shadow:0 0 0 3px var(--ink),0 6px 14px rgba(27,42,74,.3);margin-bottom:8px;display:grid;place-items:center;font-size:26px;animation:pb 1.4s ease-in-out infinite}
@keyframes pb{50%{transform:translateY(-5px)}}
#podium .nm{font-weight:700;font-size:14px;line-height:1.1;margin-bottom:6px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#podium .st{width:100%;border-radius:14px 14px 6px 6px;display:grid;place-items:start center;padding-top:6px;font-weight:700;font-size:28px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;border:3px solid #fff;box-shadow:0 5px 0 var(--ink);transform-origin:bottom;animation:grow .6s cubic-bezier(.2,1.4,.4,1) both}
#podium .p1 .st{height:96px;background:linear-gradient(180deg,#fff3a8,#ffd23f 50%,#ffa51c);animation-delay:.25s}
#podium .p2 .st{height:70px;background:linear-gradient(180deg,#f3f6ff,#c9d4ee 50%,#97a6c8);animation-delay:.1s}
#podium .p3 .st{height:52px;background:linear-gradient(180deg,#ffe0c4,#f0a06a 50%,#c2703d);animation-delay:.4s}

function colBrain(h,dt){const W=WORLD;return wander(h,dt,W,hh=>{let best=null,bs=-1e9;for(const c of W.mats){const d=Math.hypot(c.x-hh.x,c.z-hh.z);let s=-d*.5+(hh.ground===c?3:0);for(const r of HAZ){if(r.rock&&!r.hit&&Math.hypot(r.x-c.x,r.z-c.z)<4)s-=6;}for(const o of G.chars){if(o!==hh&&!o.elim&&Math.hypot(o.x-c.x,o.z-c.z)<3)s-=.7;}s+=Math.random()*(1.3-hh.skill);if(s>bs){bs=s;best=c;}}

canvas.addEventListener('pointermove',e=>{const J=inp.joy;if(!J||J.id!==e.pointerId)return;J.x=e.clientX;J.y=e.clientY;let dx=J.x-J.x0,dy=J.y-J.y0;const L=Math.hypot(dx,dy),M=64;if(L>M){J.x0+=dx*(1-M/L);J.y0+=dy*(1-M/L);dx=J.x-J.x0;dy=J.y-J.y0;const j=$('joy');j.style.left=J.x0+'px';j.style.top=J.y0+'px';}$('joy').firstChild.style.transform=`translate(${dx}px,${dy}px)`;});
const jEnd=e=>{if(inp.joy&&inp.joy.id===e.pointerId){inp.joy=null;$('joy').style.display='none';}};
canvas.addEventListener('pointerup',jEnd);canvas.addEventListener('pointercancel',jEnd);
const bindBtn=(id,k)=>{const b=$(id);const on=e=>{e.preventDefault();ensureAudio();inp[k]=true;buzz();inp[k+'Held']=true;b.classList.add('on');$('hint').style.opacity=0;};const off=e=>{e.preventDefault();inp[k+'Held']=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);};
bindBtn('jumpB','jump');bindBtn('diveB','dive');
function buzz(){try{navigator.vibrate&&navigator.vibrate(25);}catch(_){}}
function tapJump(){inp.jump=true;buzz();const b=$('jumpB');b.classList.add('on');clearTimeout(tapJump.t);tapJump.t=setTimeout(()=>b.classList.remove('on'),130);$('hint').style.opacity=0;}
addEventListener('keydown',e=>{if(e.repeat)return;inp.keys[e.code]=1;if(e.code==='Space'){inp.jump=true;e.preventDefault();}if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyE'){inp.dive=true;}
  if(e.code==='Escape'||e.code==='KeyP'){if(G.paused)resume();else pause();}if(e.code==='KeyM')setMute(!muted);if(playing())$('hint').style.opacity=0;});
addEventListener('keyup',e=>{inp.keys[e.code]=0;});
function readInput(){let x=0,z=0;const K=inp.keys;
  if(K.ArrowLeft||K.KeyA)x-=1;if(K.ArrowRight||K.KeyD)x+=1;if(K.ArrowUp||K.KeyW)z+=1;if(K.ArrowDown||K.KeyS)z-=1;
  let mx=0,mz=0;if(x||z){const l=Math.hypot(x,z);mx=x/l;mz=z/l;}
  else if(inp.joy){const dx=inp.joy.x-inp.joy.x0,dy=inp.joy.y-inp.joy.y0,l=Math.hypot(dx,dy);if(l>=5){let m=clamp((l-5)/50,0,1);m=.25+.75*m;mx=dx/l*m;mz=-dy/l*m;}}
  // relativo a la cámara: derecha de pantalla = derecha del jugador
  if(mx||mz){let fx=camL.x-camP.x,fz=camL.z-camP.z;const fl=Math.hypot(fx,fz);if(fl>.001){fx/=fl;fz/=fl;}else{fx=0;fz=1;}
    const wx=-fz*mx+fx*mz,wz=fx*mx+fz*mz;mx=wx;mz=wz;}
  const o={mx,mz,jump:inp.jump,dive:inp.dive};inp.jump=false;inp.dive=false;return o;}


/* ===================== PASO DE JUEGO ===================== */
function step(dt){if(G.mode==='menu'){stepMenu(dt);return;}
  if(G.phase==='intro'){G.introT-=dt;if(G.introT<=0)roundCountdown();for(const h of G.chars)stepChar(h,IDLE,dt);updCols(G.t,dt);return;}
  if(G.phase==='count'){G.cntT-=dt;const n=Math.ceil(G.cntT-.2);if(n!==G.cntN){G.cntN=n;const el=$('cnt');el.textContent=n>0?n:tx('go');el.className='on';void el.offsetWidth;el.className='on';if(n>0)sfx.tick();else{sfx.go();sfx.rocket();}}
    if(G.cntT<=0){G.phase='play';$('cnt').className='';}for(const h of G.chars)stepChar(h,IDLE,dt);updCols(G.t,dt);return;}
  if(G.phase!=='play'&&G.phase!=='over')return;
  const sub=()=>{G.t+=dt;updCols(G.t,dt);updVines(G.t,dt);if(WORLD.update)WORLD.update(G.t,dt);};
  sub();
  for(const h of G.chars){let i;if(h.me&&!auto&&G.phase==='play'&&!(h.ret>0))i=readInput();else if(h.state==='dead'||h.done)i=IDLE;else i=brain(h,dt);stepChar(h,i,dt);}
  collideChars(G.chars);
  if(G.phase==='play'){checkEnd(dt);
    if(G.elimT>0){G.elimT-=dt;if(G.elimT<=0&&(G.me.elim||G.me.done)){$('spec').textContent=G.me.elim?tx('spec'):tx('finished')+' '+G.me.place+'.º';$('spec').classList.add('on');G.fast=true;}}
    if(G.fast&&G.phase==='play'){for(let k=0;k<2;k++){sub();for(const h of G.chars){if(h.me||h.done||h.state==='dead')continue;stepChar(h,brain(h,dt),dt);}updParts(dt);collideChars(G.chars);checkEnd(dt);if(G.phase!=='play')break;}}}}
/* demo del menú: la vaquilla persigue a unos vecinos */
function stepMenu(dt){G.t+=dt;updCols(G.t,dt);if(WORLD&&WORLD.update)WORLD.update(G.t,dt);for(const h of G.chars){const i=brain(h,dt);stepChar(h,i,dt);}collideChars(G.chars);}
function setupMenuDemo(){clearChars();clearWorld();if(!G.teams)G.teams=[myTeam(),VILLAGES[(PROF.town+3)%8]];WORLD=buildVaquilla();WORLD.pid='vaquilla';G.t=0;const r=mulberry(99);
  for(let i=0;i<8;i++){const t=i%2;const h=makeChar({name:'',hat:HATS[1+(i%(HATS.length-1))],col:G.teams[t].col,team:t,skill:.55+r()*.4,spdMul:.95,seed:i*31,si:i},false);const s=WORLD.starts[i];h.x=s.x;h.y=s.y;h.z=s.z+(i>3?-1:0);G.chars.push(h);}camInit=true;}

/* ===================== HUD ===================== */
let hudT=0;
function fmtT(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function setTeamHud(){const T=G.teams;$('tA').innerHTML=crestHTML(T[0])+'<b>'+esc(T[0].name)+'</b>';$('tB').innerHTML='<b>'+esc(T[1].name)+'</b>'+crestHTML(T[1]);
  $('tbar').style.setProperty('--ca','#'+new THREE.Color(COLORS[T[0].col]).getHexString());$('tbar').style.setProperty('--cb','#'+new THREE.Color(COLORS[T[1].col]).getHexString());}
function bumpScore(t){const el=$(t?'sB':'sA');if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
function updHud(){if(G.mode==='menu'||!WORLD||!WORLD.tsc)return;const me=G.me,W=WORLD;rankAll();const U=W.unit==='pct'?'%':'';
  $('sA').textContent=W.tsc[0]+U;$('sB').textContent=W.tsc[1]+U;
  $('posL').textContent=W.kind==='race'?tx('you'):tx('you');$('posT').textContent=W.kind==='race'?(me.done?me.place+'.º':me.rank+'.º'):W.kind==='surv'?(me.elim?'💦':'✅'):'+'+(me.pts||0)+(W.unit==='pct'?'%':'');
  const left=W.time-G.t;$('timer').firstChild.textContent=fmtT(left);$('timer').classList.toggle('low',left<10&&G.phase==='play');
  const pr=W.kind==='race'?clamp((me.z-0)/(W.finishZ||1),0,1):clamp(G.t/W.time,0,1);$('prog').firstChild.style.width=(pr*100).toFixed(1)+'%';$('prog').lastElementChild.style.left=(pr*100).toFixed(1)+'%';$('prog').lastElementChild.textContent=W.kind==='race'?'🏁':TXT[LANG].P[W.pid][0];}
function flashMsg(t,cls){const m=$('msg');m.textContent=t;m.className=cls||'';void m.offsetWidth;m.className=(cls||'')+' on';}

/* ===================== CÁMARA ===================== */
let camInit=true;const camP=new THREE.Vector3(),camL=new THREE.Vector3();
function updCam(dt){const menu=G.mode==='menu';let tgt=G.me;if(menu||!tgt||tgt.state==='dead'||(tgt.done&&G.phase!=='over')){const alive=G.chars.filter(h=>h.state!=='dead'&&!h.done);if(alive.length){alive.sort((a,b)=>b.z-a.z);tgt=menu?alive[(G.t*.12|0)%alive.length]:alive[0];}}
  let x=0,y=0,z=0;if(tgt){x=tgt.x;y=(tgt.state==='fall'&&tgt.lgy!=null)?Math.max(tgt.y,tgt.lgy-1.5):tgt.y;z=tgt.z;}
  const port=camera.aspect<1;
  if(menu){const V=WORLD&&WORLD.vq;const vx=V?V.x:0,vz=V?clamp(V.z,14,46):24,a=G.t*.16;_p.set(vx*.5+Math.sin(a)*11,7.5,vz-13+Math.cos(a)*3);_s.set(vx*.7,1.6,vz);}
  else if(WORLD&&WORLD.kind==='race'&&G.me&&G.me.done&&G.phase==='over'){const fz=WORLD.finishZ;_p.set(G.me.x*.4,y+3.4,fz+21);_s.set(G.me.x*.4,y+1.1,fz+8);}
  else if(WORLD&&WORLD.survival){const d=port?13:11;const ang=Math.atan2(x,z+.01),dd=port?d*1.05:d*.75;_p.set(x+Math.sin(ang)*dd,y+(port?11.5:8),z+Math.cos(ang)*dd);const k=port?.62:.4;_s.set(x*k,y+.6,z*k);}
  else{const d=port?10.5:9.2,hgt=port?7.6:6.2;const lim=WORLD&&WORLD.hw?WORLD.hw:12;_p.set(clamp(x*.85,-lim,lim),y+hgt,z-d);_s.set(x*.9,y+.4,z+5);if(WORLD&&WORLD.pid==='tobogan'&&y>3){_p.y=y+hgt-1;}}
  if(_p.y<(WORLD?WORLD.killY:-1)+2.5)_p.y=(WORLD?WORLD.killY:-1)+2.5;
  if(camInit){camP.copy(_p);camL.copy(_s);camInit=false;}else{camP.lerp(_p,1-Math.exp(-(menu?1.5:7)*dt));camL.lerp(_s,1-Math.exp(-(menu?2:10)*dt));}
  camera.position.copy(camP);
  shake=Math.max(0,shake-dt*2.5);if(shake>0){const s=shake*shake*.5;camera.position.x+=(Math.random()-.5)*s;camera.position.y+=(Math.random()-.5)*s;}
  camera.lookAt(camL);
  sun.position.copy(SUND).multiplyScalar(60).add(_p2.set(x,0,z));sun.target.position.set(x,0,z);sun.target.updateMatrixWorld();
  const sz=port?34:40;const sc=sun.shadow.camera;if(sc.right!==sz){sc.left=-sz;sc.right=sz;sc.top=sz;sc.bottom=-sz;sc.updateProjectionMatrix();}
  {const on=G.mode==='match'&&!!tgt;if(on){_oT[0].set(x,y+1,z);_oT[1].copy(camL);_oT[2].set(x-2.2,y+1,z+1.5);_oT[3].set(x+2.2,y+1,z+1.5);}updOcc(camera.position,_oT,on,dt);}
  sky.position.copy(camera.position);WATERU.uCam.value.copy(camera.position);}

/* ===================== PANTALLAS ===================== */
function showOv(id){for(const k of ['menu','town','info','pause','res','rcard'])$(k).classList.toggle('show',k===id);}
function playing(){return G.mode==='match'&&!G.paused&&(G.phase==='play'||G.phase==='count');}
function goFull(){const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(f&&!document.fullscreenElement&&!document.webkitFullscreenElement){try{const p=f.call(el);if(p&&p.catch)p.catch(()=>{});}catch(e){}}}
function pause(){if(G.mode!=='match'||G.paused||G.phase==='over'||G.phase==='intro')return;G.paused=true;inp.joy=null;$('joy').style.display='none';music(false);showOv('pause');}
function resume(){if(!G.paused)return;G.paused=false;showOv(null);music(true);last=performance.now();goFull();}
function toMenu(){G.paused=false;G.mode='menu';G.phase='idle';G.fast=false;music(false);document.body.classList.remove('play','peep');CONF.on=false;confMesh.visible=false;G.teams=null;setupMenuDemo();showOv('menu');refreshStats();}
function refreshStats(){$('stats').textContent=STATS.p?tx('stats',{w:STATS.w,p:STATS.p}):'';}
function refreshTownChip(){const t=myTeam();$('townChip').innerHTML=crestHTML(t)+'<b>'+esc(t.name)+'</b>';}
function buildTown(){$('nameI').value=PROF.name;$('townI').value=PROF.townName||'';
  $('vgrid').innerHTML=VILLAGES.map((v,i)=>`<div class="vi ${PROF.town===i?'on':''}" data-i="${i}">${crestHTML(v)}<b>${esc(v.name)}</b></div>`).join('');
  $('vgrid').querySelectorAll('.vi').forEach(el=>el.onclick=()=>{PROF.town=+el.dataset.i;PROF.townName='';LS.set('vp_prof',PROF);buildTown();refreshTownChip();});
  $('hgrid').innerHTML=HATS.map(k=>`<div class="wi ${PROF.hat===k?'on':''}" data-k="${k}"><em>${HAT_ICO2[k]}</em><b>${TXT[LANG].HAT[k]}</b></div>`).join('');
  $('hgrid').querySelectorAll('.wi').forEach(el=>el.onclick=()=>{PROF.hat=el.dataset.k;LS.set('vp_prof',PROF);buildTown();});}
const HAT_ICO2={none:'🚫',boina:'🧢',panuelo:'🟥',straw:'👒',party:'🎉',flower:'🌺',crown:'👑'};
$('nameI').addEventListener('input',()=>{PROF.name=$('nameI').value.trim().slice(0,12);LS.set('vp_prof',PROF);});
$('townI').addEventListener('input',()=>{PROF.townName=$('townI').value.trim().slice(0,22);LS.set('vp_prof',PROF);refreshTownChip();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&playing())pause();});
$('playB').onclick=()=>{goFull();newMatch();};
$('townB').onclick=()=>{buildTown();showOv('town');};$('townX').onclick=()=>{G.teams=null;setupMenuDemo();showOv('menu');};
$('infoB').onclick=()=>showOv('info');
$('infoX').onclick=()=>{if(G.paused)showOv('pause');else showOv(G.mode==='menu'?'menu':null);};
$('howP').onclick=()=>showOv('info');
$('pauseB').onclick=pause;$('resB').onclick=resume;$('quitB').onclick=()=>toMenu();
$('nextB').onclick=()=>{goFull();showOv(null);nextPrueba();};
$('menuB').onclick=()=>toMenu();
$('muteB').onclick=$('muteM').onclick=()=>{ensureAudio();setMute(!muted);};
$('langB').onclick=()=>{LANG=LANG==='es'?'en':'es';LS.set('vp_lang',LANG);applyLang();};

/* ===================== BUCLE ===================== */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();partScale.value=.45*renderer.domElement.height/(2*Math.tan(camera.fov*Math.PI/360));}
addEventListener('resize',resize);
const fps={n:0,t:0,low:0,tick(dt){if(G.mode==='menu'||G.paused||document.hidden||window.__vt||window.__lockQ)return;this.n++;this.t+=dt;if(this.t>=2.5){const f=this.n/this.t;this.n=0;this.t=0;if(f<36&&Q>0){this.low++;if(this.low>=2){Q--;applyQ();this.low=0;}}else this.low=0;}}};
let last=performance.now(),vt=0;
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000,dt=Math.min(.04,raw);last=now;
  if(G.paused)return;
  fps.tick(raw);vt+=dt;
  SKYU.uT.value=vt;WATERU.uT.value=vt;LAVAU.uT.value=vt;FALLU.uT.value=vt;
  step(dt);
  for(const h of G.chars){animChar(h,dt,vt);if(WORLD&&WORLD.anim)WORLD.anim(h,dt,vt);}
  fanAnim(vt);
  for(const f of FLAGS)f.rotation.y=Math.sin(vt*3+f.position.x)*.3;
  if(G.fw>0){G.fw-=dt;G.fwT=(G.fwT||0)-dt;if(G.fwT<=0){G.fwT=.3+Math.random()*.3;const cols=[0xff4fa3,0xffd23f,0x38e5ff,0x4ade80,0x8b5cff,0xffffff,0xff7a2a];const c=cols[(Math.random()*cols.length)|0];
    const cx=G.me?G.me.x:0,cz=G.me?G.me.z:20;const fx=cx+(Math.random()-.5)*30,fy=14+Math.random()*10,fz=cz+8+(Math.random()-.5)*26;burst(fx,fy,fz,70,c,12,4,1,1.7,4);burst(fx,fy,fz,24,0xffffff,4,2,.5,.8,2);if(AC)noise(.5,2500,.18,'highpass');}}
  updParts(dt);updConf(dt);updCam(dt);musicTick();
  if(G.mode==='match'&&(hudT-=dt)<=0){hudT=.12;updHud();}
  renderer.render(scene,camera);
}
applyQ();setupMenuDemo();setMute(muted);applyLang();refreshStats();refreshTownChip();
$('loading').remove();
requestAnimationFrame(frame);
window.__ho={get G(){return G;},get W(){return WORLD;},set auto(v){auto=v;if(v)$('hint').style.opacity=0;},get auto(){return auto;},newMatch,startPrueba,nextPrueba,endPrueba,get Q(){return QL[Q];},setQ(q){Q=QL.indexOf(q);applyQ();},
  setRound(r){G.round=r;},setPrueba(id){G.forceP=id;},setPlan(a){G.forcePlan=a;},get pruebas(){return PRUEBAS.map(p=>p.id);},get plan(){return (G.plan||[]).map(p=>p.id);},snapCam(){camInit=true;},get dbg(){return {renderer,sun,scene,camera};},
  skipIntro(){if(G.phase==='intro')roundCountdown();if(G.phase==='count'){G.cntT=0;G.phase='play';$('cnt').className='';}},hideOv(){showOv(null);},
  sim(sec){const n=Math.round(sec*30);for(let i=0;i<n&&G.phase!=='over';i++){step(1/30);}return {t:+G.t.toFixed(1),phase:G.phase,tsc:WORLD.tsc.slice(),me:G.me?{x:+G.me.x.toFixed(1),y:+G.me.y.toFixed(1),z:+G.me.z.toFixed(1),st:G.me.state,pts:G.me.pts,falls:G.me.falls,place:G.me.place,elim:G.me.elim}:null,score:G.score.slice()};},
  stats:STATS,PROF};
window.__ready=true;
