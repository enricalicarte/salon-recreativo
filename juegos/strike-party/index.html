<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Strike Party — Bolos</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#140a2b;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;color:#fff}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) 8px 0;pointer-events:none;z-index:5}
#frames{display:flex;gap:2px;max-width:640px;margin:0 auto}
.fr{flex:1;background:rgba(20,10,43,.78);border:2px solid rgba(255,255,255,.18);border-radius:7px;text-align:center;overflow:hidden;min-width:0}
.fr.last{flex:1.5}
.fr.cur{border-color:#ffd23f;box-shadow:0 0 10px rgba(255,210,63,.7)}
.fr b{display:block;font-size:clamp(8px,2.2vw,11px);background:rgba(255,255,255,.12);padding:1px 0;color:#cfc4ff}
.fr .rs{display:flex;justify-content:center;height:clamp(13px,3.6vw,18px);font-size:clamp(10px,3vw,14px);font-weight:900;line-height:clamp(13px,3.6vw,18px)}
.fr .rs span{flex:1;border-left:1px solid rgba(255,255,255,.15);color:#ffd23f}
.fr .rs span:first-child{border-left:0}
.fr .tt{font-size:clamp(11px,3.4vw,16px);font-weight:900;height:clamp(15px,4.2vw,20px);line-height:clamp(15px,4.2vw,20px)}
#vs{position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 58px);z-index:6;display:flex;flex-direction:column;gap:4px;font-size:clamp(11px,3.2vw,14px);font-weight:900;pointer-events:none}
#vs div{background:rgba(20,10,43,.75);border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:4px 10px;white-space:nowrap}
#vs div.me{border-color:#ffd23f}#vs div.turn{box-shadow:0 0 12px #ffd23f;background:rgba(80,40,120,.85)}
#wait{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center;z-index:8;pointer-events:none;font-weight:900;font-size:clamp(15px,4.4vw,22px)}
#wait span{background:rgba(20,10,43,.8);border:2px solid #ffd23f;border-radius:20px;padding:9px 18px;display:inline-block}
#vsP .row{display:flex;gap:8px;justify-content:center;margin:10px 0}
#vsP input{font-family:inherit;font-size:clamp(22px,7vw,34px);font-weight:900;text-transform:uppercase;text-align:center;width:6.2ch;letter-spacing:.15em;border-radius:14px;border:3px solid #000;padding:8px;background:#fff;color:#2a0a3a}
#vsCode{font-size:clamp(40px,14vw,70px);font-weight:900;letter-spacing:.18em;color:#ffd23f;text-shadow:0 4px 0 #a35b00;margin:6px 0}
#btns{position:fixed;right:8px;top:calc(env(safe-area-inset-top) + 58px);display:flex;flex-direction:column;gap:6px;z-index:6}
#btns button{width:38px;height:38px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(20,10,43,.7);color:#fff;font-size:18px;cursor:pointer;padding:0}
#msg{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:clamp(40px,13vw,92px);font-weight:900;font-style:italic;pointer-events:none;z-index:7;opacity:0;text-shadow:0 5px 0 #7a1ea8,0 0 26px rgba(255,80,200,.9),-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000;color:#ffe14a;letter-spacing:1px}
#msg.show{animation:pop 1.5s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-8deg)}14%{opacity:1;transform:scale(1.25) rotate(3deg)}26%{transform:scale(.95) rotate(-1deg)}38%{transform:scale(1.05) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-30px)}}
#speed{position:fixed;left:0;right:0;bottom:18%;text-align:center;font-size:clamp(26px,8vw,50px);font-weight:900;pointer-events:none;z-index:6;opacity:0;color:#6cf;text-shadow:0 3px 0 #0a2a66,0 0 16px rgba(80,200,255,.9)}
#speed.show{animation:spd 1.4s ease-out forwards}
@keyframes spd{0%{opacity:0;transform:translateY(20px) scale(.6)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;font-size:clamp(12px,3.4vw,16px);font-weight:700;pointer-events:none;z-index:5;padding:0 18px;text-shadow:0 2px 6px #000}
#hint span{background:rgba(20,10,43,.72);padding:7px 14px;border-radius:20px;display:inline-block;border:1px solid rgba(255,255,255,.2)}
#power{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 64px);width:min(70vw,320px);height:16px;transform:translateX(-50%);background:rgba(20,10,43,.8);border:2px solid #fff;border-radius:10px;overflow:hidden;z-index:6}
#power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ad16b,#ffe14a,#ff4d4d)}
#rays{position:fixed;inset:-25%;pointer-events:none;z-index:3;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,225,74,.55) 0 5deg,rgba(255,61,208,.35) 5deg 10deg);-webkit-mask-image:radial-gradient(circle,transparent 16%,#000 72%);mask-image:radial-gradient(circle,transparent 16%,#000 72%)}
#rays.on{animation:rays 2s ease-out forwards}
@keyframes rays{0%{opacity:0;transform:scale(.5) rotate(0)}14%{opacity:1}100%{opacity:0;transform:scale(1.7) rotate(60deg)}}
#streak{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);text-align:center;font-weight:900;font-style:italic;font-size:clamp(18px,5.4vw,28px);pointer-events:none;z-index:5;opacity:0;transition:opacity .3s;color:#ffb000;text-shadow:0 2px 0 #a33000,0 0 14px rgba(255,120,0,.9),-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
#vig0{position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 14vmin rgba(8,0,30,.65)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(40,10,120,.55) 75%,rgba(10,0,40,.9) 100%)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:radial-gradient(ellipse at center,rgba(40,15,90,.35),rgba(10,4,30,.82));padding:12px;box-sizing:border-box}
.card{width:min(460px,100%);text-align:center;max-height:100%;overflow:auto}
h1{margin:0;font-size:clamp(40px,12vw,76px);line-height:.92;font-weight:900;font-style:italic;color:#ffe14a;text-shadow:0 5px 0 #c2185b,0 9px 0 #5a0f66,0 0 28px rgba(255,80,200,.6),-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000;transform:rotate(-3deg)}
.sub{margin:14px 0 14px;font-size:clamp(13px,3.6vw,17px);color:#d9ccff;font-weight:700}
.chs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:16px}
.ch{border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:14px;padding:8px 2px 7px;color:#fff;cursor:pointer;font-family:inherit}
.ch .em{font-size:clamp(24px,7vw,34px);display:block}
.ch b{display:block;font-size:clamp(12px,3.4vw,15px)}
.ch small{display:block;font-size:clamp(9px,2.5vw,11px);color:#cfc4ff;line-height:1.15;margin-top:2px}
.ch.sel{border-color:#ffe14a;background:rgba(255,225,74,.2);box-shadow:0 0 16px rgba(255,225,74,.55);transform:translateY(-3px)}
.big{font-family:inherit;font-size:clamp(22px,6vw,30px);font-weight:900;font-style:italic;color:#2a0a3a;background:linear-gradient(#ffe14a,#ffb000);border:3px solid #000;border-radius:18px;padding:12px 38px;cursor:pointer;box-shadow:0 6px 0 #a35b00,0 10px 20px rgba(0,0,0,.5)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a35b00}
.big.alt{background:linear-gradient(#9fe8ff,#3aa6ff);box-shadow:0 6px 0 #1b5da8,0 10px 20px rgba(0,0,0,.5);font-size:clamp(15px,4vw,19px);padding:9px 20px;margin-left:8px}
.how{margin-top:14px;font-size:clamp(11px,3vw,13px);color:#b9abf0;line-height:1.4}
#final{font-size:clamp(64px,22vw,130px);font-weight:900;color:#ffe14a;line-height:1;text-shadow:0 5px 0 #c2185b,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000}
.st{font-size:clamp(14px,4vw,19px);font-weight:700;margin:8px 0 18px;color:#e9e0ff}
#vs div.gone{opacity:.45;text-decoration:line-through}
#vsLobby .lcode{font-weight:900;font-size:clamp(13px,3.6vw,16px);color:#cfc4ff;margin:2px 0 8px}
#vsLobby .lcode b{display:block;font-size:clamp(34px,11vw,54px);letter-spacing:.18em;color:#ffd23f;text-shadow:0 4px 0 #a35b00;line-height:1.1}
#vsList{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;text-align:left}
#vsList .pl{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:6px 12px}
#vsList .pl.me{border-color:#ffd23f}
#vsList .pl .em{font-size:24px}
#vsList .pl b{flex:1;font-size:clamp(14px,4vw,17px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vsList .pl i{font-style:normal;font-weight:800;font-size:clamp(11px,3.2vw,13px);color:#cfc4ff;white-space:nowrap}
#vsList .pl.empty{justify-content:center;color:#cfc4ff;font-weight:700;font-size:13px;border-style:dashed}
#vsLobby .lname{align-items:center}
#vsLobby .lname label{font-weight:900;font-size:14px}
#vsP #vsLobby .lname input{font-size:clamp(16px,4.6vw,20px);letter-spacing:0;text-transform:none;width:11ch}
#vsLobby .ch.lock{opacity:.55;pointer-events:none}
#vsLobby .chs{margin-bottom:12px}
#vsGo.off{filter:grayscale(.8);opacity:.7;font-size:clamp(15px,4.2vw,20px)}
#vsLobby input:disabled{opacity:.6}
</style>
</head>
<body>
<div id="top"><div id="frames"></div></div>
<div id="btns"><button id="bFs" title="Pantalla completa">⛶</button><button id="bSnd" title="Sonido">🔊</button></div>
<div id="msg"></div>
<div id="vs" class="hidden"></div>
<div id="wait" class="hidden"><span id="waitT"></span></div>
<div id="speed"></div>
<div id="hint" class="hidden"><span id="hintT"></span></div>
<div id="power" class="hidden"><i></i></div>
<div id="vig0"></div><div id="vig"></div>
<div id="rays"></div><div id="streak"></div>
<div id="flash"></div>

<div id="menu" class="ov">
  <div class="card">
    <h1>STRIKE<br>PARTY</h1>
    <div class="sub">¡Bolos de pista loca! Elige a tu jugador</div>
    <div class="chs" id="chs"></div>
    <button class="big" id="bPlay">¡JUGAR!</button><br>
    <button class="big alt" id="bVs" style="margin:14px 0 0">👥 MULTIJUGADOR · 2 a 4 móviles</button>
    <div class="how" id="how"></div>
  </div>
</div>

<div id="vsP" class="ov hidden">
  <div class="card">
    <div class="sub" style="font-size:clamp(18px,5vw,26px);margin:0">👥 Multijugador</div>
    <div class="sub" id="vsInfo">De 2 a 4 jugadores, cada uno en su móvil y por turnos. Vale con wifi distintos o datos móviles.</div>
    <div id="vsStart">
      <button class="big" id="vsCreate">CREAR SALA</button>
      <div class="sub">— o —</div>
      <div class="row"><input id="vsIn" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters"><button class="big alt" id="vsJoin" style="margin:0">UNIRME</button></div>
    </div>
    <div id="vsLobby" class="hidden">
      <div class="lcode">Código de la sala <b id="vsLCode">----</b></div>
      <div id="vsList"></div>
      <div class="row lname"><label for="vsName">Tu nombre</label><input id="vsName" maxlength="12" autocomplete="off" placeholder="Nombre"></div>
      <div class="chs" id="vsChs"></div>
      <button class="big" id="vsReady">¡LISTO!</button>
      <button class="big" id="vsGo">Esperando jugadores…</button>
    </div>
    <button class="big alt" id="vsBack" style="margin:14px 0 0">Salir</button>
  </div>
</div>

<div id="end" class="ov hidden">
  <div class="card">
    <div class="sub" id="endT" style="font-size:clamp(18px,5vw,26px);margin:0">¡Partida terminada!</div>
    <div id="final">0</div>
    <div class="st" id="endS"></div>
    <button class="big" id="bAgain">OTRA VEZ</button><button class="big alt" id="bMenu">Jugador</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
let pseed=1;function prand(){pseed=(pseed+0x6D2B79F5)|0;let t=Math.imul(pseed^(pseed>>>15),1|pseed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;}
const prnd=(a,b)=>a+prand()*(b-a);
const damp=(k,dt)=>1-Math.exp(-k*dt);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

/* ============================ RENDER BASE ============================ */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement,document.body.firstChild);
const cv=renderer.domElement;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a0f3a);
scene.fog=new THREE.Fog(0x1a0f3a,24,62);
const camera=new THREE.PerspectiveCamera(62,1,0.05,100);

(function(){
  try{
    const pm=new THREE.PMREMGenerator(renderer);const es=new THREE.Scene();es.background=new THREE.Color(0x120a2e);
    const cols=[0xff3dd0,0x3affea,0xffe14a,0x7b5cff,0xffffff,0xff8a1f];
    for(let i=0;i<30;i++){const a=i/30*Math.PI*2;const m=new THREE.Mesh(new THREE.PlaneGeometry(rnd(2,5),rnd(.6,1.8)),new THREE.MeshBasicMaterial({color:cols[i%6],side:THREE.DoubleSide}));m.position.set(Math.cos(a)*9,rnd(-1,6),Math.sin(a)*9);m.lookAt(0,0,0);es.add(m);}
    const top=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));top.position.y=9;top.rotation.x=Math.PI/2;es.add(top);
    scene.environment=pm.fromScene(es,.02).texture;
  }catch(e){}
})();
const gm=new THREE.DataTexture(new Uint8Array([85,160,255]),3,1,THREE.LuminanceFormat);
gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.needsUpdate=true;
const toon=(c,o)=>new THREE.MeshToonMaterial(Object.assign({color:c,gradientMap:gm},o||{}));
const blackMat=new THREE.MeshBasicMaterial({color:0x140a1e,side:THREE.BackSide});
function outline(m,sx,sy,sz){const o=new THREE.Mesh(m.geometry,blackMat);o.scale.set(sx||1.08,sy||sx||1.08,sz||sx||1.08);m.add(o);return o;}
function shadows(g,on){g.traverse(o=>{if(o.isMesh&&o.material!==blackMat){o.castShadow=on!==false;}});}

/* ============================ AUDIO ============================ */
let AC=null,master=null,noiseBuf=null,rollG=null,rollF=null,muted=false,lastClack=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
    const len=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    rollF=AC.createBiquadFilter();rollF.type='lowpass';rollF.frequency.value=300;
    rollG=AC.createGain();rollG.gain.value=0;
    src.connect(rollF);rollF.connect(rollG);rollG.connect(master);src.start();
  }catch(e){AC=null;}
}
function tone(f,d,type,v,slide,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,fc,type,delay,q){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fc||1000;if(q)f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*1.5);s.stop(t+d+.03);
}
const sThud=()=>{tone(95,.2,'sine',.55,.5);noise(.12,.3,500,'lowpass');};
const sClack=v=>{if(!AC)return;const n=performance.now();if(n-lastClack<22)return;lastClack=n;v=clamp(v,.2,1);tone(rnd(650,1900),.08,'triangle',.13*v,.7);noise(.06,.16*v,3500,'highpass');};
const sWhoosh=()=>{noise(.5,.22,900,'bandpass',0,1.2);};
const sCrash=p=>{noise(.7,.5*p,1600,'bandpass',0,.8);for(let i=0;i<7;i++){tone(rnd(500,1800),.09,'triangle',.1*p,.7,i*.045);}};
function sStrike(l){l=l||1;const n=[523,659,784,1047,1319,1568,2093];const c=Math.min(n.length,4+l);for(let i=0;i<c;i++)tone(n[i],.3,'square',.1,1,i*(.09-Math.min(l,5)*.007));tone(110,.6,'sawtooth',.22,.4);tone(55,.8,'sine',.35,.5);noise(1.1+l*.2,.25+l*.04,2200,'bandpass',.1,.6);}
const sPop=()=>{noise(.3,.3,2800,'bandpass',0,1.2);tone(rnd(900,1700),.25,'sine',.09,.4);};
const sSpare=()=>{[587,740,880].forEach((f,i)=>tone(f,.25,'square',.09,1,i*.1));};
const sGutter=()=>{tone(300,.7,'sawtooth',.14,.3);};
const sClick=()=>{tone(700,.07,'square',.08,1.4);};
const sDrop=()=>{tone(220,.12,'sine',.18,.6);};
const sCheer=()=>{noise(1.2,.3,1500,'bandpass',0,.5);};

/* ============================ MUÑECOS (estilo Porrazo) ============================ */
function limb(len,r,mat,hand,lite){
  const g=new THREE.Group();
  const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,len,8),mat);c.position.y=-len/2;g.add(c);
  if(!lite)outline(c,1.3,1.04,1.3);
  if(hand){const h=new THREE.Mesh(new THREE.SphereGeometry(r*1.3,8,6),hand);h.position.y=-len;g.add(h);if(!lite)outline(h,1.22);}
  return g;
}
function mkHat(type,col){
  const g=new THREE.Group(),m=toon(col);
  if(type==='cap'){
    const d=new THREE.Mesh(new THREE.SphereGeometry(.265,16,10,0,Math.PI*2,0,Math.PI/2),m);d.position.y=.05;g.add(d);
    const b=new THREE.Mesh(new THREE.BoxGeometry(.3,.035,.25),m);b.position.set(0,.07,.27);b.rotation.x=.14;g.add(b);outline(b,1.18);
  }else if(type==='top'){
    const c=new THREE.Mesh(new THREE.CylinderGeometry(.17,.18,.3,14),m);c.position.y=.3;g.add(c);outline(c,1.12,1.04,1.12);
    const b=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.035,18),m);b.position.y=.16;g.add(b);outline(b,1.1,2,1.1);
    const r=new THREE.Mesh(new THREE.CylinderGeometry(.181,.181,.05,14),toon(0xff3d81));r.position.y=.2;g.add(r);
  }else if(type==='crown'){
    const gm2=toon(col,{emissive:0x553300});

let gen=0;function after(ms,fn){const g=gen;setTimeout(()=>{if(g===gen)fn();},ms);}
const sym=v=>v===0?'-':String(v);
function scoreFrames(r){
  const out=[];let i=0,cum=0;
  for(let f=0;f<10;f++){
    const o={s:[],t:null};
    if(f<9){
      if(i>=r.length){out.push(o);continue;}
      if(r[i]===10){o.s=['','X'];if(i+2<r.length){cum+=10+r[i+1]+r[i+2];o.t=cum;}i+=1;}
      else{
        const a=r[i];o.s=[sym(a)];
        if(i+1<r.length){const b=r[i+1];
          if(a+b===10){o.s=[sym(a),'/'];if(i+2<r.length){cum+=10+r[i+2];o.t=cum;}}
          else{o.s=[sym(a),sym(b)];cum+=a+b;o.t=cum;}}
        i+=2;
      }
    }else{
      const rr=r.slice(i);if(!rr.length){out.push(o);continue;}
      rr.forEach((v,k)=>{
        if(k===0)o.s.push(v===10?'X':sym(v));
        else if(k===1)o.s.push(rr[0]===10?(v===10?'X':sym(v)):(rr[0]+v===10?'/':sym(v)));
        else o.s.push(rr[0]===10?(rr[1]===10?(v===10?'X':sym(v)):(rr[1]+v===10?'/':sym(v))):(v===10?'X':sym(v)));
      });
      const need=rr[0]===10?3:((rr.length>1&&rr[0]+rr[1]===10)?3:2);
      if(rr.length>=need){cum+=rr.slice(0,need).reduce((a,b)=>a+b,0);o.t=cum;}
    }
    out.push(o);
  }
  return out;
}

const NF=1000;
const fwGeo=new THREE.BufferGeometry();
const fwPos=new Float32Array(NF*3),fwCol=new Float32Array(NF*3);
for(let i=0;i<NF;i++)fwPos[i*3+1]=-50;
fwGeo.setAttribute('position',new THREE.BufferAttribute(fwPos,3));fwGeo.setAttribute('color',new THREE.BufferAttribute(fwCol,3));
const fw=new THREE.Points(fwGeo,new THREE.PointsMaterial({size:.34,map:glowTex,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
fw.frustumCulled=false;scene.add(fw);
const fwP=[];for(let i=0;i<NF;i++)fwP.push({l:0,life:1,v:new THREE.Vector3(),c:new THREE.Color()});
let fwNext=0;const fwQ=[];
function fireworks(level){
  const nb=Math.min(16,2+level*2);
  for(let i=0;i<nb;i++)fwQ.push({t:i*(1.8/nb)+rnd(0,.2),x:rnd(-4.5,4.5),y:rnd(2.4,6),z:rnd(-5.5,-11.5),c:cPal[Math.floor(Math.random()*cPal.length)],n:60+level*12});
}
function burst(q){
  sPop();const col=new THREE.Color(q.c);
  for(let k=0;k<q.n;k++){
    const i=fwNext++%NF,p=fwP[i];
    const th=Math.random()*Math.PI*2,ph=Math.acos(rnd(-1,1)),sp=rnd(2.5,6.5);
    p.v.set(Math.sin(ph)*Math.cos(th)*sp,Math.cos(ph)*sp,Math.sin(ph)*Math.sin(th)*sp);
    p.l=p.life=rnd(1.1,1.8);p.c.copy(col).offsetHSL(rnd(-.05,.05),0,rnd(0,.15));
    fwPos[i*3]=q.x;fwPos[i*3+1]=q.y;fwPos[i*3+2]=q.z;
  }
}
function updateFW(dt){
  for(let i=fwQ.length-1;i>=0;i--){const q=fwQ[i];q.t-=dt;if(q.t<=0){burst(q);fwQ.splice(i,1);}}
  for(let i=0;i<NF;i++){
    const p=fwP[i];
    if(p.l>0){
      p.l-=dt;p.v.y-=3.5*dt;p.v.multiplyScalar(1-1.4*dt);
      fwPos[i*3]+=p.v.x*dt;fwPos[i*3+1]+=p.v.y*dt;fwPos[i*3+2]+=p.v.z*dt;
      const f=Math.max(0,p.l/p.life);fwCol[i*3]=p.c.r*f;fwCol[i*3+1]=p.c.g*f;fwCol[i*3+2]=p.c.b*f;
    }else{fwCol[i*3]=fwCol[i*3+1]=fwCol[i*3+2]=0;}
  }
  fwGeo.attributes.position.needsUpdate=true;fwGeo.attributes.color.needsUpdate=true;
}

const BALL_R=.26,PIN_HIT=.155,PIN_PIN=.31;
function stepBall(dt){
  const b=ball;if(!b.active||b.done)return;
  b.vy-=28*dt;b.y+=b.vy*dt;
  const floorY=b.pit?-9:(b.gutter?.08:.26);
  if(b.y<floorY){b.y=floorY;if(b.vy<-1.6){b.vy=-b.vy*.3;if(!b.pit)sThud();}else b.vy=0;}
  if(!b.gutter&&!b.pit&&b.y<.45){
    const prog=clamp((4-b.z)/9,0,1);const sm=prog*prog*(3-2*prog);
    b.vx+=b.spin*4*sm*dt;
  }
  b.x+=b.vx*dt;b.z+=b.vz*dt;
  b.vx*=1-.3*dt;
  b.spd=Math.hypot(b.vx,b.vz);
  if(!b.gutter&&!b.pit&&Math.abs(b.x)>.93&&b.z<LANE_Z0&&b.z>-9.3){
    b.gutter=true;b.vx=0;sGutter();S.shake=.15;
  }
  if(b.gutter&&!b.pit){b.x=lerp(b.x,Math.sign(b.x)*1.06,damp(14,dt));}
  if(!b.pit&&b.z<LANE_Z1-.05){b.pit=true;b.vy=Math.min(b.vy,-.5);b.vz*=.5;}
  if(b.pit&&b.y<-1.5){b.done=true;b.active=false;ball.mesh.visible=false;}
  if(b.z<-5&&!S.slowSet&&!b.gutter){S.slowSet=true;S.slow=1.5;}
  // choque con bolos
  if(!b.gutter&&!b.pit&&b.y<.45){
    for(const p of pins){
      if(p.gone||p.sweepT>0||p.bh||p.pit)continue;
      const dx=p.x-b.x,dz=p.z-b.z,d=Math.hypot(dx,dz);
      if(d<BALL_R+PIN_HIT&&d>1e-4){
        const nx=dx/d,nz=dz/d,sp=Math.max(b.spd,6);
        p.bh=true;
        if(d>(BALL_R+PIN_HIT)*.88&&prand()<.4){p.wob=.6;b.vx-=nx*sp*.03;sClack(.4);continue;}
        p.vx=b.vx*.38+nx*sp*.28+prnd(-.6,.6);p.vz=b.vz*.38+nz*sp*.2+prnd(-.35,.35);
        p.vy=sp*prnd(.05,.14);
        knock(p,p.vx,p.vz);
        b.vx-=nx*sp*.1;b.vz*=.9;b.vx*=.97;
        if(b.vz>-4.5)b.vz=-4.5;
        if(!b.hit){b.hit=true;S.slow=1.7;S.shake=.6;startCine();sCrash(clamp(sp/20,.4,1));shock(p.x,p.z-.2,0xffe14a);}
        sparks(p.x,.3,p.z,10);
        sClack(clamp(sp/18,.3,1));
      }
    }
  }
}
function stepPins(dt){
  for(const p of pins){
    if(p.gone||p.sweepT>0)continue;
    if(p.drop){
      p.vy-=22*dt;p.y+=p.vy*dt;
      if(p.y<0){p.y=0;if(p.vy<-3){p.vy=-p.vy*.25;sDrop();}else{p.vy=0;p.drop=false;}}
      continue;
    }
    if(p.state===0)continue;
    p.x+=p.vx*dt;p.z+=p.vz*dt;
    p.vy-=24*dt;p.y+=p.vy*dt;
    const fl=p.pit?-3:0;
    if(p.y<fl){p.y=fl;if(p.vy<-2){p.vy=-p.vy*.3;sClack(.35);}else p.vy=0;}
    const ground=p.y<=.001&&!p.pit;
    const fr=Math.exp(-(ground?4:.2)*dt);p.vx*=fr;p.vz*=fr;
    const sp=Math.hypot(p.vx,p.vz);
    if(p.tilt<1.5708){
      p.tilt=Math.min(1.5708,p.tilt+(4+sp*.8+(ground?0:3))*dt);
      if(sp>.3){const k=damp(8,dt);p.dx=lerp(p.dx,p.vx/sp,k);p.dz=lerp(p.dz,p.vz/sp,k);const l=Math.hypot(p.dx,p.dz)||1;p.dx/=l;p.dz/=l;}
    }
    p.yaw+=p.spin*dt;p.spin*=Math.exp(-1.2*dt);
    if(!p.pit&&p.z<LANE_Z1){p.pit=true;}
    if(!p.pit){
      if(p.x>1.32){p.x=1.32;p.vx*=-.4;}if(p.x<-1.32){p.x=-1.32;p.vx*=-.4;}
    }else{
      if(p.x>1.3){p.x=1.3;p.vx*=-.3;}if(p.x<-1.3){p.x=-1.3;p.vx*=-.3;}
      if(p.z<-10.7){p.z=-10.7;p.vz*=-.3;}
      if(p.y<-1.4){p.gone=true;}
    }
  }
  // pin vs pin
  for(let i=0;i<pins.length;i++){
    const a=pins[i];if(a.gone||a.pit||a.sweepT>0||a.drop)continue;
    for(let j=i+1;j<pins.length;j++){
      const b=pins[j];if(b.gone||b.pit||b.sweepT>0||b.drop)continue;
      if(a.state===0&&b.state===0)continue;
      const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
      if(d<PIN_PIN&&d>1e-4){
        const nx=dx/d,nz=dz/d;
        const rel=(a.vx-b.vx)*nx+(a.vz-b.vz)*nz;
        if(rel>.6){
          const jm=rel*.45;
          a.vx-=nx*jm;a.vz-=nz*jm;b.vx+=nx*jm;b.vz+=nz*jm;
          if(rel>1.2){
            if(b.state===0){knock(b,b.vx,b.vz);b.vy=rel*.1;}
            if(a.state===0){knock(a,a.vx,a.vz);a.vy=rel*.1;}
          }
          if(b.state===0&&rel<=1.2){b.vx=0;b.vz=0;b.wob=.5;}
          if(a.state===0&&rel<=1.2){a.vx=0;a.vz=0;a.wob=.5;}
          sClack(clamp(rel/9,.15,.9));if(rel>1.4)sparks(a.x,.3,a.z,3);
        }
        const ov=(PIN_PIN-d);
        const am=a.state?1:0,bm=b.state?1:0,tot=am+bm||1;
        a.x-=nx*ov*am/tot;a.z-=nz*ov*am/tot;b.x+=nx*ov*bm/tot;b.z+=nz*ov*bm/tot;
      }
    }
  }
}
function pinsActive(){
  return pins.some(p=>!p.gone&&p.sweepT===0&&(p.drop||(p.state>0&&(Math.hypot(p.vx,p.vz)>.18||p.y>.03||p.tilt<1.57||p.vy>.1))));
}

function throwBall(v,vx,spin){

function advance(n){
  G.rolls.push(n);G.fRolls.push(n);const fr=G.fRolls;
  if(G.frame<10){
    if((fr.length===1&&n===10)||fr.length===2){G.frame++;G.fRolls=[];return{resetAll:true};}
    return{resetAll:false};
  }
  if(fr.length===1)return{resetAll:n===10};
  if(fr.length===2){
    if(fr[0]===10)return{resetAll:fr[1]===10};
    if(fr[0]+fr[1]===10)return{resetAll:true};
    return{end:true};
  }
  return{end:true};
}
function finishRoll(){
  const spec=V.on&&V.spec;let rm=null;
  if(spec){if(!V.rolls.length){S.state='specwait';return;}rm=V.rolls.shift();vsApplyMask(rm.k);}
  S.state='scoring';
  const n=pins.filter(p=>p.state>0&&!p.removed).length;
  const before=S.standBefore;
  const strike=before===10&&n===10,spare=!strike&&before<10&&n===before&&n>0;
  const fBefore=G.frame;const res=spec?{resetAll:!!rm.ra,end:false}:advance(n);const turnDone=!spec&&(res.end||G.frame!==fBefore);
  if(V.on&&!spec)vsSend({t:'roll',k:pins.map(q=>(q.state>0&&!q.removed)?1:0),ra:res.resetAll?1:0});
  if(V.on&&!spec)V.txts.push(strike?'¡STRIKE!':spare?'SPARE':n+(n===1?' bolo':' bolos'));
  if(res.end){G.over=true;}
  renderFrames();
  let big=0;S.camMode='result';
  if(strike){
    if(!spec)G.strikes++;S.streak++;const L=S.streak,K=Math.min(L,6);
    const names=['','¡STRIKE!','¡DOBLE STRIKE!','¡TRIPLE STRIKE!','¡CUÁDRUPLE STRIKE!','¡IMPARABLE!'];
    showMsg(L<=5?names[L]:'¡LEYENDA x'+L+'!');
    sStrike(L);sCheer();cheer=2+K*.4;big=1;flash(Math.min(.95,.5+K*.09));
    spawnConfetti(Math.min(300,110+K*35),0,2.4,-7.6,2.5+K*.2,9+K);
    if(L>=2){spawnConfetti(70+K*10,-2.4,.3,-4,.3,13);spawnConfetti(70+K*10,2.4,.3,-4,.3,13);}
    shock(0,-8.2,0xff3dd0);if(L>=2)setTimeout(()=>shock(0,-8.2,0x3affea),180);if(L>=3)setTimeout(()=>shock(0,-8.2,0xffe14a),360);
    S.shake=.8+K*.15;S.hype=Math.min(1,.4+K*.15);
    fireworks(L);rays(L);setStreak(L);
    S.camMode='victory';S.vict={t:0,init:false,sg:Math.random()<.5?-1:1};
  }
  else if(spare){if(!spec)G.spares++;showMsg('¡SPARE!');sSpare();sCheer();cheer=1.4;big=1;flash(.35);spawnConfetti(70,0,2.2,-7.6,2,8);}
  else if(n===0){showMsg(ball.gutter?'¡CANAL!':'¡Fallaste!');bowler.mood=-1;}
  else if(n>=8){showMsg('¡Casi! '+n);cheer=.5;}
  else showMsg(n+(n===1?' bolo':' bolos'));
  if(!strike){S.streak=0;setStreak(0);}
  bowler.mood=big?1:(n===0?-1:0);bowler.state='react';bowler.t=0;
  S.standing=res.resetAll?10:before-n;
  after(strike?3300+Math.min(S.streak,5)*400:1500,()=>{
    if(res.end){if(V.on){vsLocalDone();return;}endGame();return;}
    // barrido
    pins.forEach(p=>{if(res.resetAll||(p.state>0&&!p.removed)){p.sweepT=.001;}});
    sDrop();
    after(750,()=>{
      pins.forEach(p=>{if(p.sweepT>0){p.gone=true;p.removed=true;p.sweepT=0;p.root.visible=false;}});
      if(res.resetAll){resetPins(true);}
      else pins.forEach(p=>{if(!p.gone){p.x=p.x0;p.z=p.z0;p.state=0;p.bh=false;p.vx=p.vz=0;p.tilt=0;p.yaw=0;syncPin(p);}});
      after(res.resetAll?1500:700,()=>{if(spec)vsSpecEnd();if(V.on&&turnDone)vsPass(false);nextOrWait();});
    });
  });
}

  {const nw=performance.now(),pp=drag.pts.filter(q=>nw-q.t<170);
   if(pp.length>1&&up>16){const a=pp[0],b=pp[pp.length-1],dy=a.y-b.y,dt=Math.max(.016,(b.t-a.t)/1000);
     const n=clamp(((dy/dt)/innerHeight-.45)/2.6,0,1);const pw=$('power');pw.classList.remove('hidden');pw.firstChild.style.width=(n*100)+'%';}}
  e.preventDefault();
});
function endDrag(e){
  if(!drag.on||e.pointerId!==drag.id)return;
  drag.on=false;if(!S.charging)$('power').classList.add('hidden');
  if(S.state!=='aim')return;
  const now=performance.now();
  const pts=drag.pts.filter(p=>now-p.t<170);
  if(pts.length<2){return;}
  const a=pts[0],b=pts[pts.length-1];
  const dy=a.y-b.y,dt=Math.max(.016,(b.t-a.t)/1000);
  const spdN=(dy/dt)/innerHeight;
  if(dy>28&&spdN>.45){
    const v=lerp(8,26,clamp((spdN-.45)/2.6,0,1));
    let vx=clamp((b.x-a.x)/Math.max(dy,1)*.2,-.12,.12)*v;
    const mid=pts[Math.floor(pts.length/2)];
    const dev=(mid.x-(a.x+b.x)/2)/Math.max(dy,1);
    const spin=clamp(-dev*5,-1,1);
    throwBall(v,vx,spin);
  }else if(dy>20){
    const h=$('hintT');h.textContent='¡Más rápido! Haz el gesto con más energía ↑';
  }
  e.preventDefault();
}

function allOver(){return V.players.every(p=>p.over||p.left);}

function vsPass(over){

  const next=nextSeat(V.me);V.turn=next<0?V.me:next;V.myTurnShown=false;

    +'<br><small>Tus strikes: <b>'+G.strikes+'</b> · spares: <b>'+G.spares+'</b></small>';

function vsApplyMask(k){
  pins.forEach((q,i)=>{
    const want=!!(k&&k[i]),have=q.state>0&&!q.removed;
    if(want&&!have){V.mismatch=(V.mismatch|0)+1;q.state=1;q.tilt=1.55;q.dx=0;q.dz=-1;q.vx=q.vz=0;syncPin(q);}
    else if(!want&&have){V.mismatch=(V.mismatch|0)+1;q.state=0;q.tilt=0;q.vx=q.vz=0;q.x=q.x0;q.z=q.z0;syncPin(q);}
  });

function onLeft(i){

  showMsg((p.name||'Un jugador')+' se ha ido');

    abortSpec();gen++;resetPins(true);S.standing=10;
    const nx=nextSeat(i);

/* ---- mensajes ---- */
function vsHandle(m){
  if(!m||!m.t)return;
  if(m.t==='lobby'){V.me=m.you;V.code=m.code||V.code;V.players=m.players.map(p=>({name:p.name,c:p.c,ready:p.ready,left:p.left}));
    if(V.phase!=='lobby')showLobby();else renderLobby();return;}
  if(m.t==='lobbyshow'){showLobby();return;}
  if(m.t==='start'){vsBegin(m.players);return;}
  if(m.t==='full'){V.on=false;vsInfo(m.why||'La sala está llena.');return;}
  if(V.phase!=='game')return;
  if(m.t==='throw'){V.throws.push(m);if(S.state==='wait')nextOrWait();}
  else if(m.t==='roll'){V.rolls.push(m);if(S.state==='specwait'){S.state='rolling';finishRoll();}}
  else if(m.t==='pass'){
    const p=V.players[m.from];if(p){p.rolls=m.rolls||[];p.over=!!m.over;p.txt=m.txt||'';p.streak=m.streak|0;}
    if(m.next>=0)V.turn=m.next;
    if(S.state==='wait'&&!V.throws.length)nextOrWait();
    renderVS();
  }
  else if(m.t==='left')onLeft(m.seat);
}
/* el anfitrión recibe de un jugador */
function hostOnData(conn,m){
  if(!m||!m.t)return;

  if(m.t==='pick'){const p=V.players[i];p.name=String(m.name||'').slice(0,12)||CHARS[m.c|0].n;p.c=clamp(m.c|0,0,CHARS.length-1);p.ready=!!m.ready;hostLobby();return;}
  if(m.t==='tolobby'){if(V.phase==='game')hostToLobby();return;}
  hostRelay(m,conn);vsHandle(m);
}
function hostToLobby(){
  V.players=V.players.filter(p=>!p.left&&(p===V.players[0]||p.conn&&p.conn.open));
  V.players.forEach(p=>{p.ready=false;p.rolls=[];p.over=false;});
  V.conns=V.players.map(p=>p.conn);V.me=0;
  V.players.forEach(p=>{if(p.conn&&p.conn.open){try{p.conn.send({t:'lobbyshow'});}catch(e){}}});

  try{if(V.conn)V.conn.close();}catch(e){}V.conns.forEach(c=>{try{if(c)c.close();}catch(e){}});try{if(V.peer)V.peer.destroy();}catch(e){}
  V.conn=null;V.peer=null;V.conns=[];V.players=[];abortSpec();

function vsInfo(t){$('vsInfo').textContent=t;}
function vsLoadLib(cb){
  if(window.Peer)return cb(true);
  const urls=window.SP_PEER_URLS||['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
  let i=0;(function next(){
    if(i>=urls.length)return cb(false);
    const sc=document.createElement('script');sc.src=urls[i++];sc.onload=()=>cb(!!window.Peer);sc.onerror=next;document.head.appendChild(sc);
  })();
}
function lostHost(){
  if(!V.on)return;
  const wasGame=V.phase==='game';
  V.on=false;V.phase='off';$('vs').classList.add('hidden');$('wait').classList.add('hidden');$('bAgain').textContent='OTRA VEZ';

  vsInfo('De 2 a '+MAXP+' jugadores, cada uno en su móvil y por turnos. Vale con wifi distintos o datos móviles.');

function vsCreate(attempt){
  vsInfo('Conectando…');
  vsLoadLib(ok=>{
    if(!ok){vsInfo('No se pudo cargar el modo online. Revisa tu conexión.');return;}
    const L='ABCDEFGHJKLMNPQRSTUVWXYZ',code=[0,1,2,3].map(()=>L[Math.floor(Math.random()*L.length)]).join('');
    let peer;try{peer=new Peer('strikeparty-'+code,window.SP_PEER_OPTS||{});}catch(e){vsInfo('Error al crear la sala.');return;}
    V.peer=peer;
    peer.on('open',()=>{
      V.on=true;V.host=true;V.me=0;V.code=code;V.conns=[null];
      V.players=[{name:($('vsName').value||myName||CHARS[charIdx].n).slice(0,12),c:charIdx,ready:true,conn:null}];
      showLobby();hostLobby();
    });
    peer.on('error',e=>{
      if(e&&e.type==='unavailable-id'&&(attempt||0)<4){try{peer.destroy();}catch(_){}vsCreate((attempt||0)+1);}
      else if(V.phase!=='game')vsInfo('Error de conexión ('+(e&&e.type||'?')+'). Inténtalo de nuevo.');
    });
    peer.on('connection',conn=>{
      conn.on('open',()=>{
        const n=V.players.filter(p=>!p.left).length;
        if(V.phase!=='lobby'||n>=MAXP){try{conn.send({t:'full',why:V.phase!=='lobby'?'La partida ya ha empezado. Espera a la siguiente.':'La sala está llena (máximo '+MAXP+').'});}catch(e){}setTimeout(()=>{try{conn.close();}catch(e){}},400);return;}
        V.players.push({name:'Jugador '+(V.players.length+1),c:(V.players.length)%CHARS.length,ready:false,conn});V.conns.push(conn);
        sClick();hostLobby();
      });
      conn.on('data',m=>hostOnData(conn,m));
      conn.on('close',()=>{
        const i=seatOfConn(conn);if(i<0)return;
        if(V.phase==='lobby'){V.players.splice(i,1);V.conns.splice(i,1);hostLobby();return;}
        if(V.phase==='game'){hostRelay({t:'left',seat:i,from:0},conn);onLeft(i);}
      });
    });
  });
}
function vsJoin(){
  const code=($('vsIn').value||'').trim().toUpperCase();
  if(code.length!==4){vsInfo('Escribe el código de 4 letras.');return;}
  vsInfo('Conectando…');
  vsLoadLib(ok=>{
    if(!ok){vsInfo('No se pudo cargar el modo online. Revisa tu conexión.');return;}
    let peer;try{peer=new Peer(window.SP_PEER_OPTS||{});}catch(e){vsInfo('Error de conexión.');return;}
    V.peer=peer;let done=false;
    const fail=m=>{if(done)return;done=true;vsInfo(m);try{peer.destroy();}catch(_){}};
    const to=setTimeout(()=>fail('No se encuentra la sala. Revisa el código (o puede que tu red bloquee la conexión).'),22000);
    peer.on('error',e=>{if(!V.on)fail(e&&e.type==='peer-unavailable'?'No existe esa sala. Revisa el código.':'Error de conexión ('+(e&&e.type||'?')+').');});
    peer.on('open',()=>{
      const conn=peer.connect('strikeparty-'+code,{reliable:true});
      V.conn=conn;V.code=code;
      conn.on('data',vsHandle);
      conn.on('close',lostHost);
      conn.on('open',()=>{
        clearTimeout(to);done=true;V.on=true;V.host=false;
        vsInfo('¡Conectado! Entrando en la sala…');
        setTimeout(()=>{V.ready=false;sendPick();},300);
      });
    });
  });
}

/* ============================ ANIMACIÓN / CÁMARA ============================ */
const camPos=new THREE.Vector3(0,2.7,13.6),camLook=new THREE.Vector3(0,.3,-5);
const tPos=new THREE.Vector3(),tLook=new THREE.Vector3();
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);cv.style.width=w+'px';cv.style.height=h+'px';
  camera.aspect=w/h;camera.updateProjectionMatrix();

window.addEventListener('resize',resize);resize();
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);

function animBowler(dt){
  const b=bowler,R=b.d,t=performance.now()/1000;
  b.root.visible=(S.state==='menu'||S.state==='end'||S.camMode==='victory');
  b.t+=dt;
  const aimX=S.state==='menu'?-.4:ball.x-.4;
  b.x=lerp(b.x,aimX,damp(S.state==='aim'?14:6,dt));
  b.root.position.set(b.x,0,9.85);
  let tg=null,yaw=0,happy=false;
  if(S.state==='menu'){yaw=Math.sin(t*.8)*.4;tg={aRo:2.3,aRe:.4+(Math.sin(t*7)*.5+.5)*.6,hz:-.06,smile:1,open:.3,brow:.4};}
  else if(S.state==='end'&&S.endHappy)happy=true;
  else if(S.state==='end'){yaw=Math.sin(t*.8)*.3;tg={hx:.35,lean:.12,aRo:.2,aLo:.2,smile:-.5,brow:-.5,y:-.02};}
  else if(b.state==='throw'){const k=b.t;tg=k<.15?{aRf:-1.0,aRe:.2,lean:-.15,aLo:.8}:{aRf:2.0,aRe:.2,lean:.35,aLo:.8,lLf:.5,lRk:.3};}
  else if(b.state==='react'&&b.mood>0)happy=true;
  else if(b.state==='react'&&b.mood<0){tg={hx:.55,lean:.18,hy:Math.sin(b.t*14)*.25*Math.exp(-b.t*2),smile:-.8,brow:-.8,y:-.03};}
  else if(b.state==='react')tg={aRf:.5,aLf:.2,smile:.8};
  else tg={aRf:.35+Math.sin(t*2.2)*.05,lean:.04};
  if(happy){
    const k=b.t,tempo=1+Math.min(S.streak,6)*.12,ph=k*tempo*5.2,mv=DANCE[Math.floor(k*tempo/1.2)%DANCE.length];
    tg=danceTarget(mv,ph);
    yaw=S.state==='end'?Math.sin(t*.8)*.4:Math.PI+Math.sin(ph*.5)*.25;
  }
  tg.y=(tg.y||0)+Math.sin(t*2)*.006;
  R.apply(tg,dt);
  R.G.rotation.y=lerp(R.G.rotation.y,yaw,damp(9,dt));
  if(R.shades)R.shades.visible=happy;
  heroL.position.set(b.x+1.4,2.6,8.2);heroL.intensity=lerp(heroL.intensity,S.camMode==='victory'?.5:0,damp(8,dt));
}
function animCrowd(dt){
  const t=performance.now()/1000;
  const cx=camPos.x,cz=camPos.z,hide=S.camMode==='victory'||S.camMode==='cine'||S.camMode==='result'||S.state==='end'||S.state==='menu';
  cheer=Math.max(0,cheer-dt*.45);
  crowd.forEach(c=>{
    const w=Math.sin(t*(4+cheer*4)+c.ph),up=clamp(cheer,0,1.2);
    let tg;
    if(up>.05){const ab=Math.abs(w);tg={y:ab*(.04+up*.12),aRf:.1,aRo:1.9+w*.4,aRe:.4,aLf:.1,aLo:1.9-w*.4,aLe:.4,smile:1,open:1,brow:.5,lRk:.25*ab,lLk:.25*ab,lRf:.12*ab,lLf:.12*ab};}
    else{const cl=Math.max(0,Math.sin(t*3+c.ph));tg={y:Math.abs(w)*.015,aRf:.95,aRo:-.1+.25*cl,aRe:1.55,aLf:.95,aLo:-.1+.25*cl,aLe:1.55,smile:.8};}
    c.d.apply(tg,dt);
    const gp=c.d.G.position;c.d.G.visible=!(hide&&Math.hypot(gp.x-cx,gp.z-cz)<4.2&&Math.abs(gp.x)>.5);
  });
}
const _vh=new THREE.Vector3(),_vp=new THREE.Vector3();
let camRoll=0;
function startCine(){
  const pool=S.streak>=2?['orbit','low','crane','dolly','spin']:['orbit','low','crane'];
  S.cine={type:pool[Math.floor(Math.random()*pool.length)],t:0,sg:Math.random()<.5?-1:1,p0:camPos.clone(),l0:camLook.clone()};
  S.camMode='cine';
}
function updateCamera(dt){
  const fk=window.innerWidth/window.innerHeight<.8?1.18:1;
  let k=3,fov=window.innerWidth/window.innerHeight<.8?66:60,roll=0,direct=false;
  const t=performance.now()/1000;
  const mode=S.camMode;
  if(mode==='menu'){
    const a=Math.sin(t*.4)*.9;tPos.set(bowler.x+Math.sin(a)*3.6,1.5,9.85+Math.cos(a)*3.6);tLook.set(bowler.x,.9,9.85);k=3;
  }else if(mode==='aim'){
    tPos.set(ball.x*.92,1.0+Math.sin(t*1.3)*.012,12.5);tLook.set(ball.x*.3,.38,-6);k=5;
  }else if(mode==='follow'){
    const cz=Math.max(ball.z+1.05,-4.7);
    const sp=clamp(ball.spd/22,0,1);
    tPos.set(ball.x*.97+Math.sin(t*31)*.004*sp,Math.max(ball.y,.26)+.36+Math.sin(t*47)*.006*sp,cz);
    tLook.set(ball.x*.45,.3,Math.max(ball.z-7,-9.2));k=14;
    fov+=ball.spd*.6;roll=-ball.vx*.03;
  }else if(mode==='cine'){
    const c=S.cine;c.t+=dt;
    const u=clamp(c.t/2.4,0,1),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    let a;
    switch(c.type){
      case 'orbit':a=c.sg*e*1.15;tPos.set(Math.sin(a)*3.3,.9+.5*e,-8.2+Math.cos(a)*3.3);tLook.set(0,.35,-8.3);fov=60*fk;break;
      case 'low':tPos.set(c.sg*lerp(1.6,1.3,e),.38+.1*e,lerp(-5.4,-6.4,e));tLook.set(0,.38,-8.4);fov=66*fk;break;
      case 'crane':tPos.set(.7*c.sg*e,lerp(1.2,3.6,e),lerp(-4.9,-6.6,e));tLook.set(0,.1,-8.3);fov=58*fk;break;
      case 'dolly':tPos.set(0,.8,lerp(-5.3,-1.6,e));tLook.set(0,.4,-8.3);fov=lerp(80,34,e)*fk;break;
      default:a=c.sg*e*1.2;tPos.set(Math.sin(a)*3.0,1.1,-8.2+Math.cos(a)*3.0);tLook.set(0,.45,-8.3);fov=56*fk;roll=c.sg*Math.sin(e*Math.PI)*.2;
    }
    tPos.z=Math.max(tPos.z,-7.2);tPos.y=Math.max(tPos.y,.3);
    const b=clamp(c.t/.35,0,1),bb=b*b*(3-2*b);
    camPos.copy(c.p0).lerp(tPos,bb);camLook.copy(c.l0).lerp(tLook,bb);
    direct=true;
    if(c.t>2.7)S.camMode='result';
  }else if(mode==='victory'){
    const v=S.vict;
    if(!v.init){v.init=true;v.p0=camPos.clone();const d=camLook.clone().sub(camPos);v.yaw0=Math.atan2(d.x,d.z);v.pit0=Math.atan2(d.y,Math.hypot(d.x,d.z));}
    v.t+=dt;const K=Math.min(S.streak,6);
    const bx=bowler.root.position.x,BZ=9.85;
    const R=lerp(4.0,3.3,clamp((v.t-1)/2.5,0,1));
    const ph=v.sg*.5*Math.sin(Math.max(0,v.t-1.1)*(1.1+.2*K));
    _vh.set(bx+Math.sin(ph)*R,1.2,BZ-Math.cos(ph)*R);
    const u=clamp(v.t/1.5,0,1),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    _vp.copy(v.p0).lerp(_vh,e);
    const sw=Math.sin(Math.PI*u);
    _vp.x+=v.sg*3.0*sw;_vp.y+=1.3*sw;_vp.y=Math.max(_vp.y,.45);
    camPos.copy(_vp);
    if(u<1){
      const yawF=Math.atan2(bx-_vh.x,BZ-_vh.z);
      const delta=((((yawF-v.yaw0)*v.sg)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      const yaw=v.yaw0+v.sg*delta*e,pit=lerp(v.pit0,.06,e);
      camLook.set(_vp.x+Math.sin(yaw)*Math.cos(pit)*10,_vp.y+Math.sin(pit)*10,_vp.z+Math.cos(yaw)*Math.cos(pit)*10);
    }else camLook.set(bx,1.3,BZ);
    direct=true;
    fov=(lerp(62,50,e)+Math.sin(v.t*7)*2*S.hype)*fk;
    roll=v.sg*sw*.18;
  }else{
    tPos.set(.3,1.0,-3.7);tLook.set(0,.4,-8.4);k=2.2;
  }
  if(!direct){const f=damp(k,dt);camPos.lerp(tPos,f);camLook.lerp(tLook,f*1.4);}
  if(mode==='follow')camPos.z=tPos.z;
  camera.position.copy(camPos);
  if(S.shake>.001){camera.position.x+=rnd(-1,1)*S.shake*.12;camera.position.y+=rnd(-1,1)*S.shake*.12;S.shake*=Math.exp(-6*dt);}
  camRoll=lerp(camRoll,roll,damp(8,dt));
  camera.up.set(Math.sin(camRoll),Math.cos(camRoll),0);
  camera.lookAt(camLook);
  camera.fov=lerp(camera.fov,fov,damp(mode==='cine'?16:6,dt));camera.updateProjectionMatrix();
}
const _qb=new THREE.Quaternion(),_axb=new THREE.Vector3();
function animBall(dt,rawDt){
  const b=ball;if(!b.mesh)return;
  if(b.mesh.visible){
    if(!b.active&&S.state==='aim'){
      b.mesh.scale.setScalar(lerp(b.mesh.scale.x,1,damp(12,rawDt)));
      b.mesh.position.set(b.x,.5+Math.sin(performance.now()/400)*.015,b.z);
      b.mesh.rotation.y+=dt*.8;
      guide.visible=true;guide.position.x=b.x;guide.position.z=b.z-4;
    }else if(b.active){
      guide.visible=false;
      b.mesh.position.set(b.x,b.y,b.z);
      const sp=Math.hypot(b.vx,b.vz);
      if(!b.pit&&b.y<.4&&sp>.01){
        _axb.set(b.vz,0,-b.vx).normalize();_qb.setFromAxisAngle(_axb,sp*dt/BALL_R);
        b.mesh.quaternion.premultiply(_qb);
      }
    }else guide.visible=false;
  }else guide.visible=false;
  // estela
  if(b.active&&!b.pit){trailPos.unshift(new THREE.Vector3(b.x,b.y,b.z));if(trailPos.length>trail.length)trailPos.pop();}
  trail.forEach((m,i)=>{const p=trailPos[i+1];if(p&&b.active&&b.spd>9){m.visible=true;m.position.copy(p);m.scale.setScalar(1-i/trail.length*.8);m.material.opacity=.32*(1-i/trail.length);}else m.visible=false;});
}
function animPins(dt){
  pins.forEach(p=>{
    if(p.wob>0)p.wob=Math.max(0,p.wob-dt*1.2);
    if(p.sweepT>0){p.sweepT+=dt/.6;p.scale=Math.max(0,1-Math.pow(Math.min(1,p.sweepT),2));}
    syncPin(p);
  });
}
function updateAudioLoop(){
  if(!AC||!rollG)return;
  const on=ball.active&&!ball.pit&&ball.y<.4&&S.state==='rolling';
  const sp=ball.spd||0;
  rollG.gain.setTargetAtTime(on?Math.min(.5,sp/30):0,AC.currentTime,.05);
  rollF.frequency.setTargetAtTime(on?(ball.gutter?180+sp*10:260+sp*16):200,AC.currentTime,.08);
}

/* ============================ BUCLE ============================ */
let last=performance.now(),ts=1,acc=0;
const STEP=1/120;
function frame(now){
  requestAnimationFrame(frame);
  let raw=Math.min(.05,(now-last)/1000);last=now;
  S.slow=Math.max(0,S.slow-raw);S.hype=Math.max(0,S.hype-raw*.14);
  ts=lerp(ts,S.slow>0?.33:1,damp(9,raw));
  const dt=raw*ts;
  // teclado
  if(S.state==='aim'){
    ball.x=clamp(ball.x+(S.keyR-S.keyL)*1.3*raw,-.78,.78);
    if(S.charging){S.power+=S.pdir*raw*1.5;if(S.power>=1){S.power=1;S.pdir=-1;}if(S.power<=0){S.power=0;S.pdir=1;}$('power').firstChild.style.width=(S.power*100)+'%';}
  }
  acc+=dt;let n=0;
  while(acc>=STEP&&n<20){stepBall(STEP);stepPins(STEP);acc-=STEP;n++;}
  if(n>=20)acc=0;
  // fin de tirada
  if(S.state==='rolling'){
    S.rollT+=raw;
    if(ball.done||ball.pit){
      if(!pinsActive())S.settle+=raw;else S.settle=0;
      if(S.settle>.6||S.rollT>9||(ball.done&&S.rollT>1.5&&S.settle>.3))finishRoll();
    }else if(S.rollT>9)finishRoll();
  }
  animBall(dt,raw);animPins(raw*ts);animBowler(raw);animCrowd(raw);updateCamera(raw);updateConfetti(raw);updateFW(raw);updateAudioLoop();animScenery(performance.now()/1000,raw);
  if(boardMsgT>0)boardMsgT-=raw;
  S.bt=(S.bt||0)+raw;if(S.bt>.1){S.bt=0;drawBoard();}
  renderer.render(scene,camera);
}

buildFrames();renderFrames();buildMenu();buildBowler();makeBallMesh();
ball.mesh.position.set(0,.5,9.45);
resetPins(false);
camPos.set(2,1.5,13);camera.position.copy(camPos);camLook.set(0,.9,9.8);
document.addEventListener('fullscreenchange',resize);
requestAnimationFrame(t=>{last=t;frame(t);});
})();
