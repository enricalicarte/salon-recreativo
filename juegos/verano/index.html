<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const X0=-260,Y0=-600,X1=1400,Y1=1100,WW=X1-X0,WH=Y1-Y0,S=1.5;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
let seed=11;
function R(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
const rr=(a,b)=>a+R()*(b-a);
const pk=a=>a[Math.floor(R()*a.length)];
function shoreY(x){return 800+14*Math.sin(x/130)+8*Math.sin(x/47)}
function hx(c){const n=parseInt(c.slice(1),16);return[n>>16,n>>8&255,n&255]}
function shade(c,a){const f=v=>clamp(v+a,0,255),p=hx(c);return'rgb('+f(p[0])+','+f(p[1])+','+f(p[2])+')'}
function mk(wu,hu,sc){const cv=document.createElement('canvas');cv.width=Math.ceil(wu*sc);cv.height=Math.ceil(hu*sc);const c=cv.getContext('2d');c.scale(sc,sc);c.lineJoin=c.lineCap='round';return[cv,c]}

/* ================= watercolor primitives ================= */
function rectP(x,y,w,h,st){st=st||36;const p=[];for(let i=x;i<x+w;i+=st)p.push([i,y]);for(let i=y;i<y+h;i+=st)p.push([x+w,i]);
  for(let i=x+w;i>x;i-=st)p.push([i,y+h]);for(let i=y+h;i>y;i-=st)p.push([x,i]);return p}
function ellP(cx,cy,rx,ry,n){n=n||14;const p=[];for(let i=0;i<n;i++){const a=i/n*6.2832;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p}
function box(x,y,w,h){return[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]}
function capP(x1,y1,x2,y2,r1,r2){const a=Math.atan2(y2-y1,x2-x1),p=[];
  [.5,1,1.5].forEach(k=>p.push([x1+Math.cos(a+k*Math.PI)*r1,y1+Math.sin(a+k*Math.PI)*r1]));
  [-.5,0,.5].forEach(k=>p.push([x2+Math.cos(a+k*Math.PI)*r2,y2+Math.sin(a+k*Math.PI)*r2]));return p}
function tracePath(c,pts,j,sharp){
  const p=j?pts.map(q=>[q[0]+rr(-j,j),q[1]+rr(-j,j)]):pts,n=p.length;c.beginPath();
  if(sharp){c.moveTo(p[0][0],p[0][1]);for(let i=1;i<n;i++)c.lineTo(p[i][0],p[i][1])}
  else{c.moveTo((p[0][0]+p[n-1][0])/2,(p[0][1]+p[n-1][1])/2);
    for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}}
  c.closePath();
}
function wash(c,pts,col,o){o=o||{};const L=o.layers||4,j=o.j==null?3:o.j,a=o.a==null?.32:o.a;
  c.fillStyle=col;if(o.solid){c.globalAlpha=1;tracePath(c,pts,j*.5,o.sharp);c.fill()}
  for(let i=0;i<L;i++){c.globalAlpha=o.solid?a*.45:a;if(o.solid)c.fillStyle=i%2?shade(col,-16):shade(col,12);tracePath(c,pts,j,o.sharp);c.fill()}
  const e=o.edge==null?.28:o.edge;if(e>0){c.globalAlpha=e;c.strokeStyle=o.edgeCol||shade(col,-55);c.lineWidth=o.lw||1.1;tracePath(c,pts,j*.5,o.sharp);c.stroke()}
  c.globalAlpha=1;
}
function sh(c,pts,col,o){o=o||{};const j=o.j==null?.4:o.j;c.globalAlpha=1;c.fillStyle=col;tracePath(c,pts,j,o.sharp);c.fill();
  c.globalAlpha=.55;c.strokeStyle='#463848';c.lineWidth=o.lw||.85;tracePath(c,pts,j*1.2,o.sharp);c.stroke();c.globalAlpha=1}
let GRAIN=null,GRAINM=null;
function mkGrain(){
  let g=document.createElement('canvas');g.width=g.height=96;let gc=g.getContext('2d'),id=gc.createImageData(96,96);
  for(let i=0;i<id.data.length;i+=4){id.data[i]=70;id.data[i+1]=55;id.data[i+2]=60;id.data[i+3]=Math.random()*20}
  gc.putImageData(id,0,0);GRAIN=g;
  g=document.createElement('canvas');g.width=g.height=128;gc=g.getContext('2d');id=gc.createImageData(128,128);
  for(let i=0;i<id.data.length;i+=4){const v=238+Math.random()*17;id.data[i]=v;id.data[i+1]=v;id.data[i+2]=v-4;id.data[i+3]=255}
  gc.putImageData(id,0,0);GRAINM=g;
}
function grainAtop(cv){const c=cv.getContext('2d');c.save();c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-atop';c.globalAlpha=1;
  const g=c.createLinearGradient(0,0,cv.width,cv.height*.3);g.addColorStop(0,'rgba(255,244,200,.12)');g.addColorStop(1,'rgba(50,45,110,.2)');c.fillStyle=g;c.fillRect(0,0,cv.width,cv.height);
  c.fillStyle=c.createPattern(GRAIN,'repeat');c.fillRect(0,0,cv.width,cv.height);c.restore()}
function grainMul(c,x,y,w,h){c.save();c.globalCompositeOperation='multiply';c.globalAlpha=1;c.fillStyle=c.createPattern(GRAINM,'repeat');c.fillRect(x,y,w,h);c.restore()}

/* ================= characters ================= */
const KID={leg:15,torso:14,head:9.5,bw:7.5,AL:13,skin:'#f2c9a4',hair:'#3a2a22',shirt:'#24439a',blau:1,sleeve:'#1b2a5c',pants:'#1b2a5c',shorts:1,shoe:'#e9e4da',hs:'kid',size:1};
const ABU={leg:21,torso:19,head:9.4,bw:9.8,belly:1.12,AL:17,skin:'#e8b792',hair:'#f4f2ec',shirt:'#bcd7ee',check:1,pants:'#5b7391',shoe:'#4a3a30',hs:'white',thin:1,glasses:1,size:1.1};
const REM={leg:19,torso:18,head:9.2,bw:10,belly:1.15,AL:15.5,skin:'#f0c6a6',hair:'#7a4b3a',shirt:'#e79aa8',pants:'#c8607a',skirt:1,apron:1,shoe:'#5b3a3a',hs:'bun',size:1.04};
const MAT={leg:12,torso:12,head:9.2,bw:6.8,AL:11,skin:'#f4cfae',hair:'#6b4a34',shirt:'#f2c14e',pants:'#3f9a8a',shorts:1,shoe:'#e2574c',hs:'kid',size:.86};
const POL={leg:15,torso:14,head:9.4,bw:7.8,AL:13,skin:'#e9b48c',hair:'#c99a4a',shirt:'#3f9a8a',sleeve:'#2f7a6e',pants:'#2f3557',shorts:1,shoe:'#2f3557',hs:'kid',size:1.02};
const NIL={leg:15.5,torso:14.5,head:9.5,bw:7.8,AL:13.5,skin:'#f0c8a4',hair:'#b8662e',shirt:'#2f8f4e',pants:'#3a3a52',shorts:1,shoe:'#e8e0d0',hs:'kid',size:1.03};
const MAMA={leg:20,torso:18,head:9.2,bw:9,belly:1,AL:16,skin:'#f0c6a6',hair:'#5a3a2a',shirt:'#7fb0d8',pants:'#e8dcc8',skirt:1,shoe:'#8a5a3a',hs:'bun',size:1.05};
const MAR={leg:15,torso:14,head:9.2,bw:7.4,AL:13,skin:'#f0c6a6',hair:'#5b3a26',shirt:'#e79aa8',pants:'#3d5a80',shorts:1,shoe:'#fbf7ee',hs:'bun',size:.98};
function paintChar(c,sp,P){
  c.save();c.scale(sp.size,sp.size);
  const L=sp.leg,T=sp.torso,HR=sp.head,bw=sp.bw,AL=sp.AL,v=P.view||'f',sit=!!P.sit,skin=sp.skin;
  const hip=-(sit?L*.5:L)+(P.bob||0),shd=hip-T,hy=shd-HR*.78,lean=P.lean||0,hx0=v==='s'?lean*1.2:(P.sx||0);
  const far=col=>shade(col,-24),S1=(pts,col,o)=>sh(c,pts,col,o);
  function arm(side,A,isFar){A=A||{a:.12};const f=A.f||1,a=A.a,b=A.b==null?a:A.b;let sx,sy=shd+3.2,ex,ey,qx,qy;
    if(v==='s'){sx=lean;ex=sx+Math.sin(a)*AL*.5*f;ey=sy+Math.cos(a)*AL*.5*f;qx=ex+Math.sin(b)*AL*.5*f;qy=ey+Math.cos(b)*AL*.5*f}
    else{sx=side*(bw-.5)+(P.sx||0);ex=sx+side*Math.sin(a)*AL*.5*f;ey=sy+Math.cos(a)*AL*.5*f;qx=ex+side*Math.sin(b)*AL*.5*f;qy=ey+Math.cos(b)*AL*.5*f}
    const sc0=sp.sleeve||sp.shirt,sc=isFar?far(sc0):sc0,sk=isFar?far(skin):skin;
    S1(capP(ex,ey,qx,qy,2.3,2.1),sk);S1(capP(sx,sy,ex,ey,2.9,2.6),sc);S1(ellP(qx,qy,2.5,2.5,7),sk)}
  function legs(){
    if(v==='s'){[[P.legL||0,1],[P.legR||0,0]].forEach(q=>{const a=q[0],fr=q[1],pc=fr?far(sp.pants):sp.pants,skc=fr?far(skin):skin;
      if(sit){const kx=L*.52;S1(capP(0,hip+1,kx,hip+1.5,3.6,3.1),pc);S1(capP(kx,hip+1.5,kx+1,-2.5,2.7,2.3),sp.shorts?skc:pc);S1(ellP(kx+3,-1.6,4,2.3,8),sp.shoe)}
      else{const fx=Math.sin(a)*L*.95,fy=hip+Math.cos(a)*L-2.5;S1(capP(0,hip,fx,fy,3.5,2.6),sp.shorts?skc:pc);
        if(sp.shorts)S1(capP(0,hip,fx*.45,hip+(fy-hip)*.45,3.8,3.5),pc);S1(ellP(fx+1.8,fy+1.2,4,2.3,8),sp.shoe)}})}

function fishAct(){const F=G.fish;if(!F)return;

function updFish(dt){const F=G.fish;if(!F)return;F.timer-=dt;
  if(F.state==='wait'&&F.timer<=0){if(!G.matEvent){G.matEvent=true;F.state='hold';matScene()}else{F.state='bite';F.timer=1.05;splash();toast('Pica!',900)}}
  else if(F.state==='bite'&&F.timer<=0){F.state='wait';F.timer=rand(2,4);toast("S'ha escapat")}
  else if(F.state==='pause'&&F.timer<=0){
    if(G.fishCb&&F.count>=(G.fishNeed||2)){G.fish=null;const cb=G.fishCb;G.fishCb=null;G.fishNeed=0;cb()}
    else if(F.count>=2){G.fish=null;say([[MT,"L'hem pescat tots dos!"],[null,"(Dos peixos. I el Mat no ha dit ni piu. L'avi al·lucinarà.)"]],()=>card('Tarda','La llum es torna taronja i el pati fa olor de fusta.',()=>{setTime('sunset');setStage('toSand');G.p.y=900;G.p.dir='b';G.mt.x=1082;G.mt.y=914;G.trail=[]}))}
    else{F.state='wait';F.timer=rand(2.2,4.2)}}
  F.dip+=((F.state==='bite'?7:0)-F.dip)*Math.min(1,dt*14);
}
