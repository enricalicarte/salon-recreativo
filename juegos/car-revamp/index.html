/* ---------- wheel ---------- */
function drawWheel(g,w,p,rim,style){
  const f=1-p,R=w.r,rx=R+f*3,ry=R-f*8,cy=w.y+f*6,Rr=R*.66,ry2=Rr-f*3;
  g.fillStyle='#0f0f11';g.beginPath();g.ellipse(w.x,cy,rx,ry,0,0,7);g.fill();
  if(style===1){g.strokeStyle='#1e1e22';g.lineWidth=6;g.setLineDash([6,5]);g.beginPath();g.ellipse(w.x,cy,rx-3,ry-3,0,0,7);g.stroke();g.setLineDash([])}
  g.strokeStyle='#2c2c31';g.lineWidth=2;g.beginPath();g.ellipse(w.x,cy,rx-5,ry-5,0,0,7);g.stroke();
  g.save();g.translate(w.x,cy);g.scale(1,ry2/Rr);
  if(style===0||style===3){
    g.fillStyle='#262a31';g.beginPath();g.arc(0,0,Rr,0,7);g.fill();
    g.strokeStyle=rim;g.lineWidth=4;g.beginPath();g.arc(0,0,Rr-2,0,7);g.stroke();g.lineCap='round';
    if(style===0){g.lineWidth=5;for(let i=0;i<5;i++){const a=i*Math.PI*2/5-.3,h=Rr*.23;
      for(const d of [-.12,.12]){g.beginPath();g.moveTo(Math.cos(a)*h,Math.sin(a)*h);g.lineTo(Math.cos(a+d)*(Rr-4),Math.sin(a+d)*(Rr-4));g.stroke()}}}
    else{g.lineWidth=3;for(let i=0;i<10;i++){const a=i*Math.PI/5;g.beginPath();g.moveTo(Math.cos(a)*Rr*.22,Math.sin(a)*Rr*.22);g.lineTo(Math.cos(a)*(Rr-3),Math.sin(a)*(Rr-3));g.stroke()}}
    g.fillStyle='#555b64';g.beginPath();g.arc(0,0,Rr*.27,0,7);g.fill();g.fillStyle='#1b1d22';g.beginPath();g.arc(0,0,Rr*.11,0,7);g.fill();
  }else if(style===1){
    g.fillStyle='#3a3e46';g.beginPath();g.arc(0,0,Rr,0,7);g.fill();g.strokeStyle='#15161a';g.lineWidth=5;g.beginPath();g.arc(0,0,Rr-2,0,7);g.stroke();
    g.fillStyle='#262a31';g.beginPath();g.arc(0,0,Rr*.45,0,7);g.fill();
    g.fillStyle=rim;for(let i=0;i<6;i++){const a=i*Math.PI/3;g.beginPath();g.arc(Math.cos(a)*Rr*.68,Math.sin(a)*Rr*.68,3.5,0,7);g.fill()}
    g.fillStyle='#6a717b';g.beginPath();g.arc(0,0,Rr*.2,0,7);g.fill();
  }else{
    const gr=g.createRadialGradient(-Rr*.3,-Rr*.3,2,0,0,Rr);gr.addColorStop(0,'#fbfcfd');gr.addColorStop(.6,'#aab2bb');gr.addColorStop(1,'#6d757f');
    g.fillStyle=gr;g.beginPath();g.arc(0,0,Rr,0,7);g.fill();g.strokeStyle='#3c4148';g.lineWidth=2.5;g.beginPath();g.arc(0,0,Rr-1,0,7);g.stroke();
    g.fillStyle='#d9dde2';g.beginPath();g.arc(0,0,Rr*.28,0,7);g.fill();g.strokeStyle='#7a828c';g.lineWidth=2;g.beginPath();g.arc(0,0,Rr*.28,0,7);g.stroke();
  }
  g.restore();
}

/* ---------- audio ---------- */
let AC=null,noiseG,noiseF;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=b;s.loop=true;
    noiseF=AC.createBiquadFilter();noiseF.type='bandpass';noiseF.frequency.value=3000;
    noiseG=AC.createGain();noiseG.gain.value=0;
    s.connect(noiseF);noiseF.connect(noiseG);noiseG.connect(AC.destination);s.start();
  }catch(e){AC=null}
}
function noise(v,f){if(!AC)return;noiseG.gain.setTargetAtTime(muted?0:v,AC.currentTime,.05);if(f)noiseF.frequency.setTargetAtTime(f,AC.currentTime,.05)}
function tone(f,d,type,v){
  if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);
}

/* ---------- particles ---------- */
const P=[];
function spawn(x,y,n,o){
  for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*o.sp+(o.vx||0),vy:(Math.random()-.5)*o.sp+(o.vy||0),life:0,max:o.max*(.6+Math.random()*.8),r:o.r*(.6+Math.random()*.8),c:o.c,g:o.g||0,sq:o.sq,st:o.st,ring:o.ring});
}

/* ---------- wiping / painting ---------- */
function wipe(layer,x,y,r,s){
  const g=layer.getContext('2d');g.globalCompositeOperation='destination-out';
  const gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,`rgba(0,0,0,${s})`);gr.addColorStop(.6,`rgba(0,0,0,${s*.85})`);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalCompositeOperation='source-over';
}
function dab(layer,x,y,r,s,col){
  const g=layer.getContext('2d');g.globalCompositeOperation='source-over';
  const gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,col);gr.addColorStop(.7,col);gr.addColorStop(1,col.replace('rgb','rgba').replace(')',',0)'));
  g.globalAlpha=s;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1;
}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return `rgb(${n>>16},${n>>8&255},${n&255})`}
const stroke={has:false,x:0,y:0};
function strokeDo(fn,x,y,r){
  if(!stroke.has){fn(x,y)}else{
    const dx=x-stroke.x,dy=y-stroke.y,d=Math.hypot(dx,dy);
    if(d<1&&(frameN&3))return;
    const n=clamp(Math.ceil(d/(r*.4)),1,48);
    for(let i=1;i<=n;i++)fn(stroke.x+dx*i/n,stroke.y+dy*i/n);
  }
  stroke.x=x;stroke.y=y;stroke.has=true;
}

const ptr={x:270,y:780,down:false,consumed:false,has:false,speed:0,px:270,py:780};
let btns=[];

function lpos(e){return{x:(e.clientX-OX)/SC,y:(e.clientY-OY)/SC}}

  if(p.y>=880||locked)ptr.consumed=true;

/* ---------- game flow ---------- */
const ORDER=['wash','rust','tires','paint','result'];
const CHEER={wash:'SPARKLING!',rust:'RUST GONE!',tires:'PUMPED UP!',paint:'GORGEOUS!'};
function goStage(s){
  state=s;touched=false;locked=false;prog=0;stroke.has=false;stageT0=t;tipT=0;
  car.topT=(s==='intro')?220:470;
  if(s==='result'){
    const el=t-lvlT0;stars=el<75?3:el<130?2:1;
    reward=50+level*10+(stars-1)*15;money+=reward;LS.set('money',money);shownReward=0;resT0=t;
    shineT=0;confettiT=2.2;flash=.6;
    tone(523,.2,'triangle');setTimeout(()=>tone(659,.2,'triangle'),120);setTimeout(()=>tone(784,.45,'triangle'),240);
  }
}
function complete(st){
  if(locked)return;locked=true;done[st]=true;prog=1;
  tone(660,.25,'triangle');setTimeout(()=>tone(880,.35,'triangle',.12),110);
  spawn(270,car.top+110,44,{sp:460,max:.9,r:5,c:'255,230,120',g:300,sq:true});
  for(let i=0;i<6;i++)spawn(rnd(60,480),car.top+rnd(40,180),1,{sp:0,max:.7,r:rnd(8,14),c:'255,255,255',st:true});
  flash=.45;shake=6;cheerMsg=CHEER[st];cheerT=1.1;
  if(st==='wash')fade.mud=true;
  if(st==='rust')fade.rust=true;
  if(st==='tires'){pressure=1}
  if(st==='paint'){car.baseCol=paintCol;paintL.getContext('2d').clearRect(0,0,CW,CH)}
  nextStage=ORDER[ORDER.indexOf(st)+1];nextAt=t+1;
}
function pump(){
  if(locked)return;
  pressure=Math.min(1,pressure+.065);pumpAnim=1;
  tone(180+pressure*160,.12,'square',.05);noise(.14,5000);setTimeout(()=>noise(0),90);
  const w=WH[WH.length-1];spawn(CARX+w.x-6,car.top+w.y+w.r*.8,8,{sp:90,max:.5,r:5,c:'220,235,255',g:-40});
  if(pressure>=1)complete('tires');
}
function pickNozzle(i){
  if(unlocked[i]){nozzle=i;return}
  const cost=[0,40,80][i];
  if(money>=cost){money-=cost;unlocked[i]=true;nozzle=i;LS.set('money',money);LS.set('unl',unlocked);tone(880,.2,'triangle')}
  else{toastMsg='¡No tienes suficiente dinero!';toastT=1.6;tone(150,.25,'sawtooth',.08)}
}
function startGame(){pendingFS=true;tone(500,.12,'triangle');lvlT0=t;goStage('wash')}
function nextLevel(){level++;LS.set('level',level);newLevel();car.top=470;goStage('intro')}

/* ---------- update ---------- */
function update(dt){
  car.top+=(car.topT-car.top)*Math.min(1,dt*6);
  platA+=(((state==='intro')?0:1)-platA)*Math.min(1,dt*5);
  pumpAnim=Math.max(0,pumpAnim-dt*5);
  if(toastT>0)toastT-=dt;
  if(cheerT>0)cheerT-=dt;
  flash=Math.max(0,flash-dt*1.6);shake=Math.max(0,shake-dt*20);
  if(shineT<1)shineT+=dt*.9;
  if(state==='result'){
    shownReward=Math.min(reward,shownReward+dt*reward*1.1);
    if(frameN%140===0)shineT=0;
    if(frameN%5===0&&idxSil.length){const i=idxSil[(Math.random()*idxSil.length)|0],q=(i-3)/4;spawn(CARX+q%CW,car.top+Math.floor(q/CW),1,{sp:0,max:.7,r:rnd(7,13),c:'255,255,255',st:true})}
  }
  const sp=Math.hypot(ptr.x-ptr.px,ptr.y-ptr.py);ptr.speed=ptr.speed*.8+sp*.2;ptr.px=ptr.x;ptr.py=ptr.y;
  if(fade.mud){la.mud-=dt*2.2;if(la.mud<=0){la.mud=0;fade.mud=false;mudL.getContext('2d').clearRect(0,0,CW,CH)}}
  if(fade.rust){la.rust-=dt*2.2;if(la.rust<=0){la.rust=0;fade.rust=false;rustL.getContext('2d').clearRect(0,0,CW,CH)}}
  if(nextAt&&t>=nextAt){nextAt=0;goStage(nextStage)}
  const act=ptr.down&&!ptr.consumed&&!locked;
  const cx=ptr.x-CARX,cy=ptr.y-car.top;
  let nz=0,nf=0;
  if(act&&state==='wash'){
    const r=[24,34,46][nozzle],s=[.13,.21,.33][nozzle];
    strokeDo((x,y)=>wipe(mudL,x,y,r,s),cx,cy,r);
    spawn(ptr.x,ptr.y,3+nozzle*2,{sp:160,max:.4,r:3,c:'190,225,255',g:500,vy:-40});
    if(Math.random()<.35)spawn(ptr.x,ptr.y,1,{sp:70,max:.9,r:rnd(5,10),c:'255,255,255',g:-50,ring:true});
    nz=.16+nozzle*.04;nf=2500+nozzle*1500;
  }else if(act&&state==='rust'){
    strokeDo((x,y)=>wipe(rustL,x,y,22,.09),cx,cy,22);
    if(ptr.speed>1)spawn(ptr.x,ptr.y,2,{sp:140,max:.5,r:2.5,c:'210,120,60',g:400,sq:true});
    if(ptr.speed>2&&Math.random()<.3)spawn(ptr.x,ptr.y,1,{sp:0,max:.5,r:rnd(5,9),c:'255,240,200',st:true});
    nz=ptr.speed>1?.12:0;nf=1600+Math.random()*600;
  }else if(act&&state==='paint'){
    strokeDo((x,y)=>dab(paintL,x,y,30,.28,hexToRgb(paintCol)),cx,cy,30);
    spawn(ptr.x,ptr.y,3,{sp:120,max:.35,r:3,c:hexToRgb(paintCol).slice(4,-1),g:0});
    nz=.1;nf=6000;
  }
  noise(nz,nf);
  frameN%5===0&&!locked&&measureStage();
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life>p.max)P.splice(i,1)}
  if(confettiT>0){confettiT-=dt;const cs=['255,80,80','255,210,60','80,220,120','80,170,255','220,100,255'];
    spawn(rnd(20,520),-10,3,{sp:80,max:2.4,r:5,c:cs[(Math.random()*5)|0],g:260,vy:120,sq:true})}
}
function measureStage(){
  if(state==='wash'){const r=measure(mudL,idxSil,30);prog=clamp((1-r)/.965,0,1);if(r<.035)complete('wash')}
  else if(state==='rust'){const r=measure(rustL,idxSil,30);prog=clamp((1-r)/.965,0,1);if(r<.035)complete('rust')}
  else if(state==='paint'){const c=measure(paintL,idxBody,150);prog=clamp(c/.92,0,1);if(c>.92)complete('paint')}
  else if(state==='tires'){prog=pressure}
}

/* ---------- icons ---------- */

    const cone=ctx.createLinearGradient(x+75,0,x+135,0);cone.addColorStop(0,'rgba(150,220,255,.9)');cone.addColorStop(1,'rgba(150,220,255,0)');
    ctx.fillStyle=cone;ctx.beginPath();ctx.moveTo(x+88,y+78);ctx.lineTo(x+138,y+52+(2-i)*-4);ctx.lineTo(x+138,y+98+i*4);ctx.closePath();ctx.fill();
    iconHose(ctx,x+60,y+86,1.05,.5);
    for(let k=0;k<3;k++){ctx.fillStyle=k<=i?'#6bd42a':'#3a3f46';rr(ctx,x+22+k*38,y+144,32,14,3);ctx.fill()}
    if(!unlocked[i]){
      ctx.fillStyle='rgba(0,0,0,.45)';rr(ctx,x,y,w,h,16);ctx.fill();
      ctx.fillStyle='#e23b3b';ctx.beginPath();ctx.arc(x+w-14,y+16,24,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
      txt('$'+costs[i],x+w-14,y+17,16,'#fff');
    }
    btn(x,y,w,h,()=>pickNozzle(i));
  }
}
function drawPalette(){
  ctx.fillStyle='rgba(20,24,30,.96)';rr(ctx,20,905,500,215,22);ctx.fill();ctx.strokeStyle='#6a727c';ctx.lineWidth=3;ctx.stroke();
  txt('PICK A COLOR & SPRAY THE CAR',270,940,20,'#e8edf2');
  for(let i=0;i<PALETTE.length;i++){
    const cx=94+(i%5)*88,cy=1004+Math.floor(i/5)*80,sel=paintCol===PALETTE[i];
    ctx.fillStyle=PALETTE[i];ctx.beginPath();ctx.arc(cx,cy,30,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(cx-8,cy-12,14,7,-.4,0,7);ctx.fill();
    ctx.strokeStyle=sel?'#4cf04c':'rgba(255,255,255,.4)';ctx.lineWidth=sel?6:2;ctx.beginPath();ctx.arc(cx,cy,30,0,7);ctx.stroke();
    btn(cx-34,cy-34,68,68,()=>{paintCol=PALETTE[i];tone(500+i*40,.1,'triangle',.1)});
  }
}
function tipBanner(s){
  ctx.fillStyle='rgba(15,18,24,.88)';rr(ctx,24,975,492,90,24);ctx.fill();ctx.strokeStyle='#6a727c';ctx.lineWidth=3;ctx.stroke();
  ctx.save();ctx.beginPath();ctx.arc(76,1020,40,0,7);ctx.clip();
  const bg=ctx.createLinearGradient(0,980,0,1060);bg.addColorStop(0,'#2a4f80');bg.addColorStop(1,'#16263d');ctx.fillStyle=bg;ctx.fillRect(30,975,100,90);
  const talking=(t-stageT0)<2.2?(Math.sin(t*18)+1)/2:0;
  drawMechanic(ctx,76,1020+354*.34+4,.34,talking);ctx.restore();
  ctx.strokeStyle='#19b6d9';ctx.lineWidth=4;ctx.beginPath();ctx.arc(76,1020,40,0,7);ctx.stroke();
  txt(s,304,1020,24,'#fff');
}
function drawTools(){
  const keys=['wash','rust','tires','paint'],x0=65;
  for(let i=0;i<4;i++){
    const x=x0+i*106,y=190,s=92,act=state===keys[i];
    ctx.fillStyle='rgba(10,10,12,.78)';rr(ctx,x,y,s,s,22);ctx.fill();
    ctx.strokeStyle=act?'#4cf04c':'#9a9a9a';ctx.lineWidth=act?5:3;rr(ctx,x,y,s,s,22);ctx.stroke();
    const cx=x+s/2,cy=y+s/2;
    if(i===0)iconHose(ctx,cx,cy,1.1);else if(i===1)iconBrush(ctx,cx,cy-4,1.05,-.1);else if(i===2)iconPump(ctx,cx,cy,1.05);else iconSpray(ctx,cx,cy+4,1.2,paintCol);
    if(done[keys[i]]){ctx.fillStyle='#35c451';ctx.beginPath();ctx.arc(x+s-6,y+6,15,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(x+s-13,y+6);ctx.lineTo(x+s-7,y+12);ctx.lineTo(x+s+1,y);ctx.stroke()}
  }
  ctx.fillStyle='rgba(10,10,12,.7)';rr(ctx,65,300,410,14,7);ctx.fill();
  if(prog>0.01){const gg=ctx.createLinearGradient(67,0,473,0);gg.addColorStop(0,'#2fd13a');gg.addColorStop(1,'#c4ff3a');ctx.fillStyle=gg;rr(ctx,67,302,406*clamp(prog,0,1),10,5);ctx.fill()}
}
function drawTopBar(){
  ctx.fillStyle='rgba(30,30,34,.9)';rr(ctx,16,28,58,58,14);ctx.fill();ctx.strokeStyle='#999';ctx.lineWidth=3;ctx.stroke();
  gearIcon(ctx,45,57,22);
  if(muted){ctx.strokeStyle='#ff4a4a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(26,38);ctx.lineTo(64,76);ctx.stroke()}
  btn(16,28,58,58,()=>{muted=!muted;LS.set('mute',muted);if(muted)noise(0)});
  ctx.fillStyle='rgba(30,30,34,.9)';rr(ctx,16,96,58,58,14);ctx.fill();ctx.strokeStyle='#999';ctx.lineWidth=3;ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(28,120);ctx.lineTo(28,110);ctx.lineTo(38,110);ctx.moveTo(52,110);ctx.lineTo(62,110);ctx.lineTo(62,120);ctx.moveTo(28,130);ctx.lineTo(28,140);ctx.lineTo(38,140);ctx.moveTo(52,140);ctx.lineTo(62,140);ctx.lineTo(62,130);ctx.stroke();
  btn(16,96,58,58,toggleFS);
  ctx.fillStyle='rgba(10,10,12,.75)';rr(ctx,330,30,190,40,20);ctx.fill();ctx.strokeStyle='#9a9a9a';ctx.lineWidth=3;ctx.stroke();
  ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText('💵',352,50);
  txt(String(money),500,51,26,'#fff',null,'right');
}
function levelPill(){
  ctx.fillStyle='#2a2f38';rr(ctx,190,86,160,48,14);ctx.fill();ctx.strokeStyle='#e6edf5';ctx.lineWidth=3;ctx.stroke();
  txt('LEVEL '+level,270,111,26,'#fff');
  txt(V.name,270,152,20,'#ffd21f','#3a2a00');
}
function bigButton(label,x,y,w,h,fn){
  const pul=1+Math.sin(t*5)*.025;
  ctx.save();ctx.translate(x+w/2,y+h/2);ctx.scale(pul,pul);
  const g=ctx.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'#4dff3a');g.addColorStop(1,'#16b81b');
  ctx.fillStyle=g;rr(ctx,-w/2,-h/2,w,h,h/2.2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.22)';rr(ctx,-w/2+8,-h/2+5,w-16,h*.38,h*.18);ctx.fill();
  ctx.strokeStyle='#d8fff0';ctx.lineWidth=5;rr(ctx,-w/2,-h/2,w,h,h/2.2);ctx.stroke();
  txt(label,0,3,h*.42,'#fff','#0b6a10');ctx.restore();
  btn(x,y,w,h,fn);
}

function draw(){
  btns=[];
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#0b0d14';ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX+(shake?rnd(-shake,shake)*DPR:0),DPR*OY+(shake?rnd(-shake,shake)*DPR:0));
  drawBG();drawPlatform();
  if(platA<.6){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(270,car.top+204,250,14,0,0,7);ctx.fill()}
  composeCar();
  if(platA<.5){ctx.save();ctx.globalAlpha=.12*(1-platA*2);ctx.translate(CARX,car.top+200);ctx.scale(1,-1);ctx.drawImage(carC,0,-200);ctx.restore()}
  if(state==='result'){
    ctx.save();ctx.globalCompositeOperation='lighter';
    const pg=.5+.5*Math.sin(t*3),ug=ctx.createRadialGradient(270,car.top+206,10,270,car.top+206,260);
    const rgb=hexToRgb(car.baseCol).slice(4,-1);ug.addColorStop(0,`rgba(${rgb},${.5+pg*.2})`);ug.addColorStop(1,`rgba(${rgb},0)`);
    ctx.fillStyle=ug;ctx.beginPath();ctx.ellipse(270,car.top+206,270,50,0,0,7);ctx.fill();
    for(const bx of [120,420]){const bg=ctx.createLinearGradient(0,60,0,car.top+190);bg.addColorStop(0,'rgba(255,255,255,.18)');bg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(bx-14,60);ctx.lineTo(bx+14,60);ctx.lineTo(bx+110,car.top+200);ctx.lineTo(bx-110,car.top+200);ctx.closePath();ctx.fill()}
    ctx.restore();
  }
  ctx.drawImage(carC,CARX,car.top);
  if(state==='intro'){
    const n=Math.floor((t-stageT0)*28),lines=V.lines;let left=n,talking=0;
    ctx.fillStyle='#fff';rr(ctx,282,590,236,122,16);ctx.fill();
    ctx.beginPath();ctx.moveTo(284,640);ctx.lineTo(256,654);ctx.lineTo(284,668);ctx.closePath();ctx.fill();
    for(let i=0;i<4;i++){const s=lines[i],k=clamp(left,0,s.length);txt(s.slice(0,k),292,614+i*28,22,'#2d3138',null,'left');left-=s.length}
    if(left<0)talking=(Math.sin(t*18)+1)/2;
    // redraw mechanic head talking effect: overlay by redrawing whole figure with mouth (cheap)
    drawMechanic(ctx,160,1060,1,talking);
    levelPill();
    bigButton("LET'S REVAMP",270,960,250,78,startGame);
  }else{
    if(state==='wash'){drawHoseGun();drawStream();drawPanelWash();if(!touched&&!locked)drawHint(270,car.top+100)}
    if(state==='rust'){
      const bx=ptr.has?ptr.x+34:300,by=ptr.has?ptr.y+30:car.top+200;
      iconBrush(ctx,bx,by,1.5,-.6+Math.sin(t*28)*(ptr.down&&ptr.speed>1?.12:0));
      tipBanner('SCRUB THE RUST AWAY!');if(!touched&&!locked)drawHint(270,car.top+100);
    }
    if(state==='tires'){drawPump();tipBanner('TAP TO PUMP THE TIRES!');if(!touched&&!locked)drawHand(472,car.top+235,0)}
    if(state==='paint'){
      const bx=ptr.has?ptr.x+30:300,by=ptr.has?ptr.y+30:car.top+200;
      iconSpray(ctx,bx,by,1.6,paintCol);drawPalette();if(!touched&&!locked)drawHint(270,car.top+100);
    }
    if(state==='result'){
      const nv=VEH[level%VEH.length];
      ctx.fillStyle='rgba(12,14,20,.9)';rr(ctx,40,730,460,420,26);ctx.fill();ctx.strokeStyle='#ffd21f';ctx.lineWidth=5;ctx.stroke();
      txt('CAR REVAMPED!',270,782,40,'#ffd21f','#7a4a00');
      txt(V.name,270,824,20,'#cfe3ff');
      for(let i=0;i<3;i++){
        const k=clamp((t-resT0-.3-i*.28)*4,0,1),on=i<stars,sc=on?(k<1?.05+k*1.2:1+Math.sin(t*3+i)*.04):1;
        ctx.save();ctx.translate(270+(i-1)*92,894);ctx.scale(sc,sc);ctx.rotate(on?Math.sin(t*2+i)*.06:0);
        star5(ctx,0,0,38);ctx.fillStyle=on?'#ffd21f':'#3a3f48';ctx.fill();ctx.strokeStyle=on?'#8a5a00':'#232830';ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();
        if(on){ctx.fillStyle='rgba(255,255,255,.5)';star5(ctx,-6,-8,14);ctx.fill()}
        ctx.restore();
      }
      txt('+$'+Math.round(shownReward),270,968,46,'#6bff55','#0b4a10');
      bigButton('NEXT LEVEL',120,1010,300,66,nextLevel);
      txt('NEXT: '+nv.name,270,1112,19,'#9fb4cc');
    }
    if(state!=='result')drawTools();
  }
  for(const p of P){
    const a=1-p.life/p.max;
    if(p.st){ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.translate(p.x,p.y);ctx.rotate(p.life*3);ctx.fillStyle=`rgb(${p.c})`;star4(ctx,0,0,p.r*(.5+a));ctx.fill();ctx.restore();continue}
    if(p.ring){ctx.strokeStyle=`rgba(${p.c},${a*.8})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();continue}
    ctx.fillStyle=`rgba(${p.c},${a})`;
    if(p.sq)ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
  }
  if(cheerT>0){const k=clamp(1.1-cheerT,0,.25)/.25,sc=.4+k*.8+(k>=1?Math.sin((1.1-cheerT)*14)*.03:0);
    ctx.save();ctx.globalAlpha=clamp(cheerT*3,0,1);ctx.translate(270,430);ctx.scale(sc,sc);ctx.rotate(-.06);txt(cheerMsg,0,0,58,'#ffe45c','#7a3a00');ctx.restore()}
  drawTopBar();
  if(toastT>0){ctx.globalAlpha=clamp(toastT,0,1);ctx.fillStyle='rgba(180,30,30,.92)';rr(ctx,90,830,360,52,16);ctx.fill();txt(toastMsg,270,857,20,'#fff');ctx.globalAlpha=1}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const vg=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.4,VW/2,VH/2,Math.max(VW,VH)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.6})`;ctx.fillRect(0,0,VW,VH)}
}

/* ---------- boot ---------- */
newLevel();
let last=performance.now();
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;t+=dt;frameN++;
  update(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
