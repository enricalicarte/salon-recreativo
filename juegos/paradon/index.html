  const first=S.mus&&h===0;
  if(!first&&(tA<S.b0+(S.mus?0:2.4)||h%32>=28))return;
  const burst=(S.rule==='boss'||S.rule==='encore')&&el>6&&(h%32)>=18&&(h%32)<(stage>=11?27:stage>=7?26:24);
  if(burst&&(h%32)===18&&BOSS){BOSS.rage=1;sfx.roar();}
  const p=burst?1:(half?lerp(D.h0,D.h1,prog):lerp(D.p0,D.p1,prog))*S.dens;

function updKeeper(dt){

  const up=Math.max(Math.abs(K.lean)/1.1,K.saveT/.28,K.cele>0?1:0),bob=Math.abs(Math.sin(time*5))*.05;
  K.cele=Math.max(0,K.cele-dt*1.5);const cj=K.cele>0?Math.sin(Math.PI*(1-K.cele)):0,sq=K.saveT/.28;
  kp.g.position.set(K.x,Math.abs(K.lean)*.5+bob+cj*1.2,KZ);kp.g.rotation.z=-K.lean;
  kp.g.rotation.y=K.cele>0?(1-K.cele)*Math.PI*2:0;kp.g.scale.set(KS*(1-.1*sq),KS*(1+.14*sq+cj*.08),KS*(1-.1*sq));
  const a=1.15+1.55*up;kp.armR.rotation.z=a;kp.armL.rotation.z=-a;
  kp.legL.rotation.z=-.2-.35*up;kp.legR.rotation.z=.2+.35*up;
  const pw=S&&state==='play'&&S.power>0;
  K.gs+=((pw?2.3:1)-K.gs)*Math.min(1,dt*10);kp.gloves.forEach(g=>g.scale.setScalar(K.gs));
  kShadow.position.x=K.x;
  wall.position.x=K.x;wall.material.opacity+=((pw?.5+.15*Math.sin(time*12):0)-wall.material.opacity)*Math.min(1,dt*8);
  if(pw&&Math.random()<.5)burst(1,K.x+rnd(-2.2,2.2),rnd(.3,2.4),KZ,0xffcf33,1.5,-2);
  if(dt>0&&(Math.abs(K.vx)>2.5||K.cele>0)){const py=kp.g.position.y;for(let k=0;k<2;k++)
    near.emit(K.x+rnd(-.25,.25)+K.lean*1.2,py+1.25,KZ+.62,rnd(-.5,.5)+K.vx*.1,rnd(-5,-2.5),rnd(0,.6),[0x5ef2ff,0xffffff,0xffb020][(Math.random()*3)|0],rnd(.18,.34),-1);}
  if(dt>0&&S&&state==='play'&&(pw||S.mult>=4))kp.gloves.forEach(h=>{h.getWorldPosition(tmp);
    near.emit(tmp.x+rnd(-.15,.15),tmp.y,tmp.z+rnd(-.1,.1),rnd(-.4,.4),rnd(1.5,3.2),rnd(-.4,.4),(pw?GOLD:FIRE)[(Math.random()*3)|0],rnd(.25,.45),-2);});
}
function visuals(dt){

  {const h=$('hint');let show=false;

  rocks.forEach(m=>{m.rotation.x+=dt*m.userData.sp;m.rotation.y+=dt*m.userData.sp*.7;m.position.y=m.userData.y+Math.sin(time*.4+m.userData.ph)*1.2;});
  planet.rotation.y+=dt*.03;moon.rotation.y+=dt*.1;
  arches.forEach((o,i)=>{const k=Math.max(0,Math.sin(time*5+i*1.2));o.a.material.opacity=.55+.45*k;o.gl.material.opacity=.12+.3*k;});
  if(scnCur&&scnCur.up)scnCur.up(dt);updGate(dt);pDisc.rotation.z+=dt*(state==='play'&&S&&S.rule==='swirl'?4.5:.9);
  if(BOSS){const B=BOSS,bt=Math.abs(Math.sin(time*2.2));B.rage=Math.max(0,B.rage-dt*.5);
    if(B.dead>0){B.dead+=dt*1.6;const k=Math.max(0,1-B.dead+1);B.g.scale.setScalar(5.2*k);B.g.rotation.y+=dt*12;if(k<=0){scene.remove(B.g);BOSS=null;}}
    else{const pt=cam.aspect<1;B.g.position.set(pt?0:-8.5,(pt?-.6:-2)+bt*.5,pt?SZ-2.6:SZ+9);B.g.rotation.y=pt?0:.45;B.armL.rotation.z=-.5-bt*.6-B.rage*1.4;B.armR.rotation.z=.5+bt*.6+B.rage*1.4;
      B.head.rotation.z=Math.sin(time*1.3)*.12;B.body.scale.set(1+B.rage*.08,1-B.rage*.05,1);B.pupil.position.x=clamp((K.x)*.03,-.12,.12);}}pGlow.scale.setScalar(19+pulse*3);under.material.opacity=.45+.25*pulse;
  if(dt>0&&Math.random()<dt*.35){const sx=rnd(-60,60);for(let k=0;k<10;k++)sky.emit(sx-k*.9,rnd(24,30)+k*.35,-110,26,-10,0,k?0x9fe8ff:0xffffff,.9-k*.05,0);}
  halo.material.opacity=.6+.4*pulse;halo.material.size=1.4+.5*pulse;
  netBack.position.z=GZ+GD+.7*netFlash*netFlash;netBack.material.opacity=.85*netFlash;
  const glow=[0,0,0,0,0];
  if(state==='play')balls.forEach(b=>{if(b.active&&b.state==='fly'){const u=(S.T-(b.tA-b.d))/b.d;glow[b.lane]=Math.max(glow[b.lane],u*u);}});
  pads.forEach((p,i)=>{p.m.opacity=.45+.55*glow[i];p.r.material.opacity=i===K.lane?.95:0;const ps=1+.25*glow[i];p.p.scale.set(ps,ps,1);const s=i===K.lane?1.12:1;p.r.scale.set(s,s,1);});
  shooters.forEach((f,i)=>{f.kick=Math.max(0,f.kick-dt*3);const sw=Math.sin(Math.PI*f.kick),bt=Math.abs(Math.sin(time*4+i*1.3));
    f.legR.rotation.x=-sw*1.5;f.legL.rotation.x=sw*.4;f.body.rotation.x=-sw*.3;f.g.position.y=bt*.12+sw*.4;
    f.body.scale.set(1+bt*.04-sw*.05,1-bt*.05+sw*.1,1);
    f.armL.rotation.z=-.35-sw*1.7-bt*.15;f.armR.rotation.z=.35+sw*1.7+bt*.15;
    f.head.rotation.z=Math.sin(time*2+i)*.09;f.head.scale.setScalar(1+sw*.14);
    f.pupil.position.x=clamp((K.x-f.g.position.x)*.035,-.12,.12);});
  if(crowdG&&ac)crowdG.gain.value=state==='play'?(S&&S.mus?.03:.075):.02;
  // cámara
  const sway=state==='play'?Math.sin(time*.5)*.25:Math.sin(time*.25)*2.2;
  cam.position.copy(camBase).sub(camL).multiplyScalar(camK).add(camL);
  cam.position.x+=sway+(K.x*.12)+rnd(-1,1)*shake*.35;cam.position.y+=rnd(-1,1)*shake*.3-pulse*.05;
  cam.lookAt(camL.x+K.x*.06,camL.y,camL.z);
}
let last=performance.now(),fpsN=0,fpsT=0;
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000;let dt=Math.min(.05,Math.max(0,raw));last=now;time+=dt;
  if(slow>0){slow-=dt;if(!(S&&S.mus&&state==='play'))dt*=.3;}
  if(state==='play'&&!paused){step(dt);
    if(bloomOn&&composer&&fpsN<150){fpsN++;fpsT+=raw;if(fpsN===150&&fpsT/150>1/38&&!window.__forceBloom){bloomOn=false;}}}
  visuals(paused?0:dt);

}
function resize(){
  const w=window.innerWidth,h=window.innerHeight;R.setSize(w,h,false);cam.aspect=w/h;
  const port=w<h;cam.fov=port?62:52;cam.updateProjectionMatrix();
  camBase.set(0,port?9:8.6,port?9:10.2);camL.set(0,port?.5:-.2,port?-13:-12.5);
  const hf=Math.atan(Math.tan(cam.fov*Math.PI/360)*cam.aspect),dist=Math.hypot(camBase.y,camBase.z-KZ);
  camK=Math.max(1,4.5/(dist*Math.tan(hf)));
  if(composer){composer.setPixelRatio(R.getPixelRatio());composer.setSize(w,h);}
  const py=camL.y+(camBase.y-camL.y)*camK,pz=camL.z+(camBase.z-camL.z)*camK;
  const top=Math.atan2(camL.y-py,pz-camL.z)+cam.fov*Math.PI/360,yMax=py+(pz+74)*Math.tan(top);
  fwHi=Math.max(16,yMax-2.5);fwLo=Math.max(13,fwHi-8);
}
