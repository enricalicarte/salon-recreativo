/* post-proceso: bloom + gradación de color / aberración / viñeta / grano */
const GradeShader={
  uniforms:{tDiffuse:{value:null},uAb:{value:0},uSat:{value:1},uTint:{value:new THREE.Vector3(1,1,1)},uVig:{value:.5},uTime:{value:0},uGrain:{value:.035},uFade:{value:0}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uAb,uSat,uVig,uTime,uGrain,uFade;uniform vec3 uTint;varying vec2 vUv;
  void main(){
    vec2 c=vUv-.5;float d=dot(c,c);
    vec2 off=c*uAb*(.4+d*3.);
    vec3 col=vec3(texture2D(tDiffuse,vUv-off).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv+off).b);
    float l=dot(col,vec3(.299,.587,.114));
    col=mix(vec3(l),col,uSat)*uTint;
    col*=1.-uVig*smoothstep(.12,.62,d*2.2);
    float n=fract(sin(dot(vUv*vec2(1731.,977.)+uTime,vec2(12.9898,78.233)))*43758.5453);
    col+=(n-.5)*uGrain;
    col=mix(col,vec3(0.),uFade);
    gl_FragColor=vec4(max(col,0.),1.);
  }`
};

function mkTex(w,h,draw,rx=1,ry=1,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  if(srgb)t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;
  return t;
}
function bricks(g,w,h,rows,cols,base,vr,cracks){
  g.fillStyle='rgb(18,12,8)';g.fillRect(0,0,w,h);
  const bh=h/rows,bw=w/cols;
  for(let r=0;r<rows;r++){
    const off=(r%2)?bw/2:0;
    for(let c=-1;c<=cols;c++){
      const cc=((c%cols)+cols)%cols,v=(hash(r,cc)-.5)*vr;
      const x=c*bw+off+2,y=r*bh+2;
      g.fillStyle=`rgb(${(base[0]+v)|0},${(base[1]+v*.9)|0},${(base[2]+v*.8)|0})`;
      g.fillRect(x,y,bw-4,bh-4);
      g.fillStyle='rgba(255,240,210,.10)';g.fillRect(x,y,bw-4,3);
      g.fillStyle='rgba(0,0,0,.2)';g.fillRect(x,y+bh-7,bw-4,3);
    }
  }
  for(let i=0;i<w*h/90;i++){
    g.fillStyle=Math.random()<.5?'rgba(0,0,0,'+Math.random()*.12+')':'rgba(255,235,200,'+Math.random()*.07+')';
    g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);
  }
  if(cracks){
    g.strokeStyle='rgba(10,6,3,.8)';g.lineWidth=3;
    for(let i=0;i<6;i++){let x=Math.random()*w,y=Math.random()*h;g.beginPath();g.moveTo(x,y);for(let k=0;k<5;k++){x+=rnd(-40,40);y+=rnd(-14,14);g.lineTo(x,y);}g.stroke();}
  }
}
function radialTex(r,g,b,hard){
  return mkTex(128,128,(c,w,h)=>{
    const gr=c.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    if(hard){gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(.62,`rgba(${r},${g},${b},1)`);gr.addColorStop(.7,`rgba(${r},${g},${b},0)`);}
    else{gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(.4,`rgba(${r},${g},${b},.35)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);}
    c.fillStyle=gr;c.fillRect(0,0,w,h);
  });
}

function lavaTex(seed){
  return mkTex(512,512,(g,w,h)=>{
    g.fillStyle='#3a0800';g.fillRect(0,0,w,h);
    const blob=(x,y,r,col,a)=>{for(const ox of [-w,0,w])for(const oy of [-h,0,h]){const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(x+ox-r,y+oy-r,r*2,r*2);}};
    for(let i=0;i<46;i++)blob(Math.random()*w,Math.random()*h,28+Math.random()*60,'255,92,10',.85);
    for(let i=0;i<30;i++)blob(Math.random()*w,Math.random()*h,14+Math.random()*34,'255,196,40',.8);
    g.globalCompositeOperation='source-over';
    for(let i=0;i<34;i++)blob(Math.random()*w,Math.random()*h,24+Math.random()*50,'20,4,0',.7);

}

function skyTexture(kind){

    const gr=g.createLinearGradient(0,0,0,h);

    g.fillStyle=gr;g.fillRect(0,0,w,h);
    const n=kind==='night'?420:90;
    for(let i=0;i<n;i++){const y=Math.pow(Math.random(),1.5)*h*(kind==='night'?.85:.5);g.fillStyle=`rgba(255,255,255,${.25+Math.random()*.75})`;const s=Math.random()<.08?2.2:1.2;g.fillRect(Math.random()*w,y,s,s*3.2);}

function skylineTex(rgb,win,seed,maxH){
  return mkTex(1024,512,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    let s=seed;const R=()=>{s=(s*16807)%2147483647;return s/2147483647;};
    g.fillStyle=`rgb(${rgb})`;
    let x=-20;
    while(x<w){
      const bw=36+R()*84,bh=h*(.14+R()*maxH),t=R(),y=h-bh;
      g.fillStyle=`rgb(${rgb})`;
      g.fillRect(x,y,bw,bh+4);
      if(t<.3){g.beginPath();g.arc(x+bw/2,y,bw*.42,Math.PI,0);g.fill();g.fillRect(x+bw/2-2,y-bw*.42-24,4,26);}
      else if(t<.5){const mw=12+R()*8,mh=70+R()*90;g.fillRect(x+bw/2-mw/2,y-mh,mw,mh+2);g.beginPath();g.moveTo(x+bw/2-mw*.8,y-mh);g.lineTo(x+bw/2,y-mh-26);g.lineTo(x+bw/2+mw*.8,y-mh);g.fill();}
      else if(t<.78){for(let k=2;k<bw-8;k+=14)g.fillRect(x+k,y-9,8,10);}
      if(win){for(let wy=y+16;wy<h-12;wy+=24)for(let wx=x+9;wx<x+bw-10;wx+=17)if(R()<.2){g.fillStyle=R()<.8?'rgba(255,200,110,.85)':'rgba(255,240,190,.9)';g.fillRect(wx,wy,5,8);}}
      x+=bw*(.62+R()*.4);
    }
  },1,1);
}

function makePool(n,add,tex){
  const arr=[];
  for(let i=0;i<n;i++){
    const m=new THREE.SpriteMaterial({map:tex||tGlow,transparent:true,depthWrite:false,opacity:0,blending:add?THREE.AdditiveBlending:THREE.NormalBlending});
    const s=new THREE.Sprite(m);s.visible=false;scene.add(s);
    arr.push({s,m,life:0,max:1,vx:0,vy:0,size:.5,grow:1,op:.6,g:0});
  }
  return arr;
}
const dustPool=makePool(54,false),sparkPool=makePool(70,true),flamePool=makePool(60,true);
function emit(pool,x,y,n,o={}){
  for(let i=0;i<n;i++){
    const q=pool.find(p=>p.life<=0);if(!q)return;
    q.life=q.max=o.life||rnd(.4,.8);q.s.visible=true;
    q.s.position.set(x+rnd(-.2,.2)*(o.jx??1),y+rnd(-.1,.1),o.z??0.7);
    q.vx=(o.vx??0)+rnd(-1,1)*(o.spread??1.5);q.vy=(o.vy??.8)+rnd(-.3,.8);
    q.size=o.size??.5;q.grow=o.grow??1.2;q.g=o.g??0;
    q.m.color.setHex(o.color??0xcdb998);q.op=o.op??.6;q.m.opacity=q.op;q.s.scale.setScalar(q.size);
  }
}

function updateParticles(dt){
  for(const pool of [dustPool,sparkPool,flamePool])for(const q of pool){
    if(q.life<=0)continue;
    q.life-=dt;
    if(q.life<=0){q.s.visible=false;q.m.opacity=0;continue;}
    q.vy+=q.g*dt;q.s.position.x+=q.vx*dt;q.s.position.y+=q.vy*dt;
    const k=q.life/q.max;q.m.opacity=q.op*k;

function tone(f,d,type='sine',v=.2,slide=0,delay=0){

  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,v=.2,freq=1000,delay=0,q=1){

  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);

}

const SCALES={phr:[0,1,4,5,7,8,10],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],maj:[0,2,4,5,7,9,11]};
const MUSIC={
  dungeon:{root:38,sc:'phr',bpm:78,drums:0,mel:.35,wave:'triangle'},
  palace:{root:40,sc:'phr',bpm:90,drums:1,mel:.5,wave:'triangle'},
  garden:{root:45,sc:'dor',bpm:72,drums:0,mel:.7,wave:'sine'},
  forge:{root:36,sc:'min',bpm:104,drums:2,mel:.35,wave:'sawtooth'},
  clock:{root:43,sc:'dor',bpm:96,drums:1,mel:.45,wave:'square',tick:1},
  dawn:{root:45,sc:'maj',bpm:84,drums:1,mel:.7,wave:'triangle'},

let musKey='dungeon',musOn=false,musT=0,musStep=0,motif=[],combatI=0,combatTarget=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function setMusic(k){musKey=k;musStep=0;motif=[];if(AC)musT=AC.currentTime+.1;}
function mnote(f,t,d,type,v,cut){
  const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
  o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(cut,t);fl.frequency.exponentialRampToValueAtTime(Math.max(200,cut*.25),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0002,t+d);
  o.connect(fl);fl.connect(g);g.connect(musicBus);o.start(t);o.stop(t+d+.05);
}
function mdrum(t,kind,v){
  if(kind==='doum'){
    const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(48,t+.16);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+.3);
  }else{
    const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=kind==='tek'?2600:7500;f.Q.value=1.4;
    const g=AC.createGain();g.gain.setValueAtTime(v*(kind==='tek'?1:.45),t);g.gain.exponentialRampToValueAtTime(.0001,t+(kind==='tek'?.09:.04));
    s.connect(f);f.connect(g);g.connect(musicBus);s.start(t,Math.random()*.4);s.stop(t+.12);
  }
}
function musicTick(){
  if(!AC||!musOn||muted||document.hidden||AC.state!=='running')return;
  combatI=damp(combatI,combatTarget,2,.09);
  const th=MUSIC[musKey]||MUSIC.dungeon,sc=SCALES[th.sc],spb=60/(th.bpm*(1+combatI*.12))/2;
  if(musT<AC.currentTime)musT=AC.currentTime+.05;
  while(musT<AC.currentTime+.35){
    const s=musStep%32,t=musT;
    if(s%16===0){ // bajo + pad
      mnote(mtof(th.root-12),t,spb*15,'sine',.16,500);
      mnote(mtof(th.root),t,spb*15,'triangle',.05,700);
      mnote(mtof(th.root+7),t,spb*15,'sine',.04,600);
    }
    if(s===0||!motif.length){
      motif=[];let deg=Math.floor(rnd(0,4));
      for(let i=0;i<8;i++){
        if(Math.random()<th.mel+combatI*.25){deg=clamp(deg+Math.floor(rnd(-2,3)),0,13);motif.push(deg);}else motif.push(-1);
      }
    }
    const dgi=motif[s%8];
    if(dgi>=0&&s%1===0){
      const oct=Math.floor(dgi/7),n=sc[dgi%7];
      mnote(mtof(th.root+12+oct*12+n),t,spb*(Math.random()<.3?3:1.6),th.wave,.07,2600);
    }
    const dr=th.drums+(combatI>.5?1:0);
    if(dr>0){
      const m=s%8;
      if(m===0||m===3||(dr>1&&m===6))mdrum(t,'doum',.34);
      if(m===4||(dr>1&&m===2)||(dr>2&&m===7))mdrum(t,'tek',.2);
      if(dr>1&&s%2===1)mdrum(t,'hat',.1);
    }
    if(th.tick&&s%2===0)mnote(s%4===0?1320:990,t,.05,'square',.03,4000);
    musStep++;musT+=spb;
  }
}

  for(let i=0;i<n;i++){const l=new THREE.Mesh(new THREE.TorusGeometry(.05,.016,5,8),mIron);l.position.y=-i*.17;l.rotation.y=(i%2)*Math.PI/2;c.add(l);}
  LV.chains.push({c,ph:Math.random()*6});
}
function addPipe(group,x0,x1,y,z=-2.15,r=.14){
  const p=new THREE.Mesh(new THREE.CylinderGeometry(r,r,x1-x0,10),mIron);p.rotation.z=Math.PI/2;p.position.set((x0+x1)/2,y,z);p.castShadow=true;group.add(p);
  for(let x=x0+.8;x<x1;x+=3.2){const f=new THREE.Mesh(new THREE.CylinderGeometry(r*1.35,r*1.35,.12,10),mIron);f.rotation.z=Math.PI/2;f.position.set(x,y,z);group.add(f);}
}
function addTree(group,x,y,s,z){
  const g=new THREE.Group();g.position.set(x,y,z);group.add(g);

function addWindow(group,cx,top,tint,shaftCol){
  const wy=top+.5;
  const fr=new THREE.Mesh(archShape(.82,1.5),mFrame);fr.position.set(cx,wy-.1,-2.37);group.add(fr);
  const wm=new THREE.Mesh(archShape(.68,1.45),new THREE.MeshBasicMaterial({color:tint,toneMapped:false,side:THREE.DoubleSide}));wm.position.set(cx,wy,-2.35);group.add(wm);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(1.6,5.5),new THREE.MeshBasicMaterial({map:tShaft,color:shaftCol,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  sh.position.set(cx+1.1,wy-1.4,-1.35);sh.rotation.z=.4;group.add(sh);
}

function buildLevel(idx){
  disposeLevel();
  const def=LEVELS[idx],th=THEMES[def.theme],set=getSet(def.theme),R=def.rows.length,C=def.rows[0].length;
  const grid=[];for(let i=0;i<R;i++)grid[R-1-i]=[...def.rows[i]];
  const group=new THREE.Group();scene.add(group);
  LV={def,idx,R,C,th,grid,group,solids:[],loose:[],spikes:[],chompers:[],plates:[],gates:[],potions:[],torches:[],guards:[],axes:[],jets:[],gems:[],flags:[],movers:[],waves:[],sway:[],spin:[],chains:[],lanterns:[],drips:[],birds:[],
    exit:null,start:{x:1.5*W,y:0},hints:def.hints.map(h=>({...h,done:false})),swordItem:null,gemTotal:0,gemGot:0,bossName:null,sealed:false,pit:th.pit,outdoor:!!th.outdoor,lava:null,cp:null};
  applyTheme(def.theme);
  const has=(c,r)=>c>=0&&c<C&&r>=0&&r<R&&FLOORCH.includes(grid[r][c]);
  const outdoor=!!th.outdoor;

  /* muro del fondo */
  const x0w=-3*W,x1w=(C+3)*W,y0w=-12,y1w=R*H+1;
  if(!outdoor){
    set.tBack.repeat.set((x1w-x0w)/4,(y1w-y0w)/4);
    const back=new THREE.Mesh(new THREE.PlaneGeometry(x1w-x0w,y1w-y0w),set.back);
    back.position.set((x0w+x1w)/2,(y0w+y1w)/2,-2.4);back.receiveShadow=true;group.add(back);
  }
  /* techo y torres laterales */
  if(!outdoor){
    const ceil=new THREE.Mesh(new THREE.BoxGeometry((C+8)*W,1,DEPTH),mDark);
    ceil.position.set(C*W/2,R*H+.1,ZC);ceil.castShadow=ceil.receiveShadow=true;group.add(ceil);
  }
  addSolid(-4*W,(C+4)*W,R*H-(outdoor?-3:SLAB),R*H+(outdoor?6:.6),'ceil',false);
  for(const side of [0,1]){
    const wx0=side?C*W:-4*W,wx1=side?(C+4)*W:0;
    if(!outdoor){const wmat=set.mBlk.clone();wmat.map=set.mBlk.map.clone();wmat.bumpMap=wmat.map;wmat.map.repeat.set((wx1-wx0)/W,(R*H+22)/3.8);wmat.map.needsUpdate=true;
    const wm=new THREE.Mesh(new THREE.BoxGeometry(wx1-wx0,R*H+22,DEPTH),wmat);
    wm.position.set((wx0+wx1)/2,(-16+R*H+6)/2,ZC);
    group.add(wm);}
    addSolid(wx0,wx1,-16,R*H+8,'bound',false);
  }
  /* foso */
  if(th.pit==='spikes'){
    for(let c=0;c<C;c++){
      if(grid[0][c]==='.'||grid[0][c]==='o'||grid[0][c]==='M'){
        const g=new THREE.Group();g.position.set(c*W+W/2,-3.2,0);
        const base=new THREE.Mesh(new THREE.BoxGeometry(W,.3,DEPTH),mDark);base.position.set(0,-.15,ZC);base.receiveShadow=true;g.add(base);
        for(let i=0;i<9;i++)for(let k=0;k<3;k++){
          const sp=new THREE.Mesh(new THREE.ConeGeometry(.055,.62,6),mMetal);
          sp.position.set(-.9+i*.225,.31,-.6+k*.6);sp.castShadow=true;g.add(sp);
        }
        group.add(g);
      }
    }
  }else if(th.pit==='lava'){
    const lt=lavaTex();lt.repeat.set((C+8)*W/8,3);
    const lm=new THREE.MeshStandardMaterial({color:0xffffff,map:lt,emissiveMap:lt,emissive:0xffffff,emissiveIntensity:1.5,roughness:.8});
    const lava=new THREE.Mesh(new THREE.PlaneGeometry((C+8)*W,10),lm);lava.rotation.x=-Math.PI/2;lava.position.set(C*W/2,-1.75,ZC);group.add(lava);
    LV.lava={mesh:lava,tex:lt};
  }
  /* celdas */
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const ch=grid[r][c],x0=c*W,cx=x0+W/2,top=r*H;
    if(!FLOORCH.includes(ch))continue;
    const loose=ch==='L';
    const sm=new THREE.Mesh(geoSlab,loose?set.loose:set.slab);
    sm.position.set(cx,top-SLAB/2,ZC);sm.castShadow=sm.receiveShadow=true;group.add(sm);
    const solid=addSolid(x0,x0+W,top-SLAB,top,'slab',true);
    switch(ch){
      case 'K':{LV.start={x:cx,y:top};
        const dg=new THREE.Mesh(archShape(.9,1.8),new THREE.MeshBasicMaterial({color:0x05040a,side:THREE.DoubleSide}));dg.position.set(cx-1.3,top,-2.3);if(!outdoor)group.add(dg);
        break;}
      case 'L':LV.loose.push({c,r,cx,top,solid,mesh:sm,state:'solid',touch:0,t:0,vy:0,basey:sm.position.y});break;
      case 'S':{
        const g=new THREE.Group();g.position.set(cx,top,0);
        const plate=new THREE.Mesh(new THREE.BoxGeometry(1.5,.05,1.1),mIron);plate.position.y=.02;g.add(plate);
        const sp=new THREE.Group();g.add(sp);
        for(let i=0;i<5;i++)for(let k=0;k<3;k++){
          const cone=new THREE.Mesh(new THREE.ConeGeometry(.05,.7,6),mMetal);cone.position.set(-.6+i*.3,.35,-.35+k*.35);cone.castShadow=true;sp.add(cone);
        }
        group.add(g);LV.spikes.push({cx,top,sp,off:(c*.9+r*.7)%3.4,ext:0});break;}
      case 'C':{
        const g=new THREE.Group();g.position.set(cx,top,0);group.add(g);
        for(const sx of [-.8,.8]){const post=new THREE.Mesh(new THREE.BoxGeometry(.16,H-SLAB-.3,.4),mIron);post.position.set(sx,(H-SLAB-.3)/2,-.5);post.castShadow=true;g.add(post);}
        const up=new THREE.Group();g.add(up);
        const bar=new THREE.Mesh(new THREE.BoxGeometry(1.7,.2,.5),mIron);bar.position.y=.1;bar.castShadow=true;up.add(bar);
        for(let i=0;i<7;i++){const t=new THREE.Mesh(new THREE.ConeGeometry(.09,.55,6),mMetal);t.rotation.z=Math.PI;t.position.set(-.72+i*.24,-.27,0);t.castShadow=true;up.add(t);}
        const lowBar=new THREE.Mesh(new THREE.BoxGeometry(1.7,.1,.5),mIron);lowBar.position.y=.03;g.add(lowBar);
        for(let i=0;i<7;i++){const t=new THREE.Mesh(new THREE.ConeGeometry(.09,.45,6),mMetal);t.position.set(-.72+i*.24,.28,0);t.castShadow=true;g.add(t);}
        LV.chompers.push({cx,top,up,off:(c*.77+r*1.3)%3,closed:false});break;}
      case 'A':{
        const pivY=top+H-SLAB-.06,L=2.35;
        const g=new THREE.Group();g.position.set(cx,pivY,-.1);group.add(g);
        const beam=new THREE.Mesh(new THREE.BoxGeometry(W,.24,.7),mIron);beam.position.set(cx,pivY+.08,-.1);beam.castShadow=true;group.add(beam);
        const hub=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.4,10),mGold);hub.rotation.x=Math.PI/2;g.add(hub);
        const rod=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,L,8),mIron);rod.position.y=-L/2;rod.castShadow=true;g.add(rod);
        const sh=new THREE.Shape();sh.moveTo(-.58,-L+.02);sh.absarc(0,-L+.02,.58,Math.PI,2*Math.PI,false);sh.lineTo(.58,-L+.02);
        const hole=new THREE.Path();hole.absarc(0,-L+.02,.24,Math.PI,2*Math.PI,false);hole.lineTo(-.24,-L+.02);sh.holes.push(hole);
        const bl=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.08,bevelEnabled:true,bevelSize:.02,bevelThickness:.02,bevelSegments:1,curveSegments:14}),mMetal);
        bl.position.z=-.04;bl.castShadow=true;g.add(bl);
        const tip=new THREE.Mesh(new THREE.BoxGeometry(.1,.2,.12),mIron);tip.position.y=-L+.1;g.add(tip);
        LV.axes.push({cx,top,g,L,pivY,off:(c*1.7+r*2.3)%4.4,theta:0,bx:cx,by:top+.5,pbx:cx,pby:top+.5,snd:false});break;}
      case 'J':{
        const g=new THREE.Group();g.position.set(cx,top,0);group.add(g);
        const nz=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,.12,10),mIron);nz.position.y=.06;g.add(nz);
        const gr=new THREE.Mesh(new THREE.TorusGeometry(.16,.03,6,12),new THREE.MeshStandardMaterial({color:0x2a1008,emissive:0xff4000,emissiveIntensity:.9}));gr.rotation.x=Math.PI/2;gr.position.y=.13;g.add(gr);
        const fl=new THREE.Group();g.add(fl);
        const f1=new THREE.Mesh(new THREE.ConeGeometry(.3,2.4,9,1,true),new THREE.MeshBasicMaterial({color:0xff7a20,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,side:THREE.DoubleSide}));f1.position.y=1.2;fl.add(f1);
        const f2=new THREE.Mesh(new THREE.ConeGeometry(.16,1.8,8,1,true),new THREE.MeshBasicMaterial({color:0xffe090,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,side:THREE.DoubleSide}));f2.position.y=.95;fl.add(f2);
        const gl=glow(0xff6a20,4.5,0);gl.position.y=1.1;g.add(gl);
        fl.visible=false;
        LV.jets.push({cx,top,g,fl,gl,gr,off:(c*1.3+r*.7)%4,on:false,warn:false});break;}
      case 'P':{
        const pm=new THREE.Mesh(new THREE.BoxGeometry(.9,.07,.55),new THREE.MeshStandardMaterial({color:0xc99a3a,metalness:.7,roughness:.4}));
        pm.position.set(cx,top+.035,0);pm.receiveShadow=true;group.add(pm);
        LV.plates.push({c,r,cx,top,solid,mesh:pm,pressed:false,delay:-1});break;}
      case 'G':{
        const g=new THREE.Group();g.position.set(cx,top,0);group.add(g);
        const h=H-.55;
        for(let i=0;i<6;i++){const b=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,h,8),mIron);b.position.set(-.45+i*.18,h/2,0);b.castShadow=true;g.add(b);}
        for(const y of [.4,h*.5,h-.15]){const hb=new THREE.Mesh(new THREE.BoxGeometry(1.0,.07,.07),mIron);hb.position.set(0,y,0);hb.castShadow=true;g.add(hb);}
        const gs=addSolid(cx-.45,cx+.45,top,top+h,'gate',false);
        LV.gates.push({cx,top,g,solid:gs,open:false,amt:0,h});break;}
      case 'F':case 'f':{
        const pg=makePotion(ch==='f');pg.position.set(cx,top,0);group.add(pg);
        LV.potions.push({cx,top,g:pg,big:ch==='f',taken:false,ph:Math.random()*6});break;}
      case 'g':{
        const o=makeGem(false);o.g.position.set(cx,top+.95,0);group.add(o.g);
        LV.gems.push({cx,cy:top+.95,g:o.g,m:o.m,taken:false,ph:Math.random()*6,gold:false});LV.gemTotal++;break;}
      case 'Q':{
        const g=new THREE.Group();g.position.set(cx,top,-.3);group.add(g);
        const pole=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,2.5,8),mIron);pole.position.y=1.25;pole.castShadow=true;g.add(pole);
        const knob=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),mGold);knob.position.y=2.55;g.add(knob);
        const cg=new THREE.PlaneGeometry(.85,.55,6,2);cg.translate(.43,0,0);
        const cloth=new THREE.Mesh(cg,new THREE.MeshStandardMaterial({color:0x6a6a70,roughness:.8,side:THREE.DoubleSide,emissive:0x000000}));cloth.position.set(.04,.75,0);g.add(cloth);
        const gl=glow(0xffc050,2.6,0);gl.position.y=2.0;g.add(gl);
        LV.flags.push({cx,top,g,cloth,cg,base:Float32Array.from(cg.attributes.position.array),gl,active:false,k:0});break;}
      case 's':{
        const sg=new THREE.Group();sg.position.set(cx,top,0);group.add(sg);
        const bl=new THREE.Mesh(new THREE.BoxGeometry(.07,1.0,.015),mMetal);bl.position.y=.7;sg.add(bl);
        const gd=new THREE.Mesh(new THREE.BoxGeometry(.3,.05,.08),new THREE.MeshStandardMaterial({color:0xc9a23a,metalness:.8,roughness:.3}));gd.position.y=.2;sg.add(gd);
        const gp=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.22,8),mWood);gp.position.y=.07;sg.add(gp);
        const gl=glow(0xffe6a0,2.2,.7);gl.position.y=.7;sg.add(gl);
        LV.swordItem={cx,top,g:sg,taken:false};break;}
      case 'E':{
        const sealed=def.theme==='throne';
        LV.exit={cx,top};LV.sealed=sealed;
        const dg=new THREE.Mesh(archShape(.95,1.9),new THREE.MeshBasicMaterial({color:def.theme==='dawn'?0xfff0c8:0xffe2a0,toneMapped:false,side:THREE.DoubleSide}));
        dg.position.set(cx,top,-2.3);group.add(dg);
        const fr=new THREE.Mesh(archShape(1.2,2.0),mFrame);fr.position.set(cx,top,-2.32);group.add(fr);
        const gl=glow(0xffd890,6,.55);gl.position.set(cx,top+1.6,-1.5);group.add(gl);
        const sh=new THREE.Mesh(new THREE.PlaneGeometry(3,5),new THREE.MeshBasicMaterial({map:tShaft,color:0xffd890,transparent:true,opacity:.25,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
        sh.position.set(cx,top+1.2,-1.2);sh.scale.y=-1;group.add(sh);
        const seal=new THREE.Group();seal.position.set(cx,top,-2.2);group.add(seal);
        for(let i=0;i<7;i++){const b=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,2.2,8),mIron);b.position.set(-.8+i*.267,1.1,0);seal.add(b);}
        for(const y of [.5,1.2,1.9]){const hb=new THREE.Mesh(new THREE.BoxGeometry(1.8,.08,.08),mIron);hb.position.set(0,y,0);seal.add(hb);}
        seal.visible=sealed;
        LV.exit.dg=dg;LV.exit.gl=gl;LV.exit.sh=sh;LV.exit.seal=seal;
        if(sealed){dg.material.color.setHex(0x30101a);gl.material.opacity=.1;sh.material.opacity=0;}
        if(outdoor){
          const gh=new THREE.Mesh(new THREE.BoxGeometry(6.2,7,1.2),set.mBlk);gh.position.set(cx,top+3.2,-3.05);gh.castShadow=gh.receiveShadow=true;group.add(gh);
          const dm=new THREE.Mesh(new THREE.SphereGeometry(2.4,20,12,0,Math.PI*2,0,Math.PI/2),mGold);dm.position.set(cx,top+6.7,-3.05);dm.scale.set(1.15,1.1,.6);group.add(dm);
          const sp=new THREE.Mesh(new THREE.ConeGeometry(.12,1.1,6),mGold);sp.position.set(cx,top+9.8,-3.05);group.add(sp);
          for(const sx of [-3.1,3.1]){const tw=new THREE.Mesh(new THREE.CylinderGeometry(.55,.65,8.5,10),set.mBlk);tw.position.set(cx+sx,top+4.0,-2.4);tw.castShadow=true;group.add(tw);const tc=new THREE.Mesh(new THREE.ConeGeometry(.8,1.5,10),mGold);tc.position.set(cx+sx,top+9.3,-2.4);group.add(tc);}
        }
        break;}
      case 'X':case 'Y':case 'V':case 'Z':case 'B':case 'U':LV.guardSpawns=(LV.guardSpawns||[]);LV.guardSpawns.push({type:ch,x:cx,y:top});break;
    }
    if(ch==='Q'||ch==='K')continue;
    if(ch==='g'){/* ya colocada */}
  }
  /* gemas flotantes y plataformas móviles (celdas sin suelo) */
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const ch=grid[r][c],cx=c*W+W/2,top=r*H;
    if(ch==='o'){
      const o=makeGem(true);o.g.position.set(cx,top+2.0,0);group.add(o.g);
      LV.gems.push({cx,cy:top+2.0,g:o.g,m:o.m,taken:false,ph:Math.random()*6,gold:true});LV.gemTotal++;
    }else if(ch==='M'){
      let l=c,rr=c;
      while(l-1>=0&&!has(l-1,r))l--;
      while(rr+1<C&&!has(rr+1,r))rr++;
      const gx0=l*W,gx1=(rr+1)*W,gw=gx1-gx0,pw=W*1.05,amp=Math.min((gw-pw)/2-.12,3.4);
      const sm=new THREE.Mesh(new THREE.BoxGeometry(pw,SLAB,DEPTH*.8),set.slab);sm.castShadow=sm.receiveShadow=true;group.add(sm);
      const trim=new THREE.Mesh(new THREE.BoxGeometry(pw+.1,.06,DEPTH*.8+.1),mGold);trim.position.y=-SLAB/2-.03;sm.add(trim);
      const gl=glow(0xffd080,3.2,.55);gl.position.set(0,-.7,0);sm.add(gl);
      const sol=addSolid(0,1,top-SLAB,top,'mover',false);
      LV.movers.push({cx:(gx0+gx1)/2,amp,top,pw,mesh:sm,solid:sol,ph:c*.9,sp:.72,x:(gx0+gx1)/2,dx:0});
    }
  }
  /* rocas flotantes bajo las islas (exterior) */
  if(outdoor){
    for(let r=0;r<R;r++){
      let c=0;
      while(c<C){
        if(!has(c,r)){c++;continue;}
        let c1=c;while(c1+1<C&&has(c1+1,r))c1++;
        const w=(c1-c+1)*W,hh=Math.min(5.5,2.2+w*.28);
        const rk=makeRock(w,hh,c*13+r*5+idx);rk.position.set((c+c1+1)*W/2,r*H-SLAB-hh/2+.02,ZC);group.add(rk);
        c=c1+1;
      }
    }
  }
  /* decoración */
  decorate(def,th,set,grid,group,has);
  /* pilares decorativos al fondo (interiores) */
  if(!outdoor){
    for(let r=0;r<R;r++)for(let c=0;c<=C;c++){
      if(c%6!==0)continue;
      if(!(has(c,r)||has(c-1,r)))continue;
      const top=r*H,h=H-SLAB;
      const pl=new THREE.Mesh(new THREE.CylinderGeometry(.3,.34,h,14),set.mBlk);
      pl.position.set(c*W,top+h/2,-1.7);pl.castShadow=pl.receiveShadow=true;group.add(pl);
      const cp=new THREE.Mesh(new THREE.BoxGeometry(.8,.18,.8),set.mBlk);cp.position.set(c*W,top+h-.09,-1.7);group.add(cp);
      const bs=new THREE.Mesh(new THREE.BoxGeometry(.8,.18,.8),set.mBlk);bs.position.set(c*W,top+.09,-1.7);group.add(bs);
    }
  }
  /* vínculos placa -> puerta (por orden) */
  LV.plates.forEach((p,i)=>{p.gate=LV.gates[i]||null;});
  /* enemigos */
  for(const gs of (LV.guardSpawns||[])){
    const d=ENEMY[gs.type],ch=makeChar(d.c);scene.add(ch.root);
    const hw=d.hw||.26,hh=1.8*(d.scale||1);
    LV.guards.push({ch,type:gs.type,name:d.name,x:gs.x,y:gs.y,vx:0,vy:0,hw,h:hh,face:def.face,turn:def.face<0?1:0,onGround:false,ground:null,phase:0,t:rnd(0,5),anim:'idleSword',swordOut:true,
      hp:d.hp,maxHp:d.hp,state:'idle',atkT:-1,atkW:d.atkW,atkHit:false,hurtT:0,parryT:0,cd:1,parryChance:d.parry,aggro:d.aggro,speed:d.speed,cdMin:d.cdMin,cdMax:d.cdMax,peakY:gs.y,
      dmg:d.dmg||1,reach:d.reach||2.5,feintP:d.feint||0,feinting:false,isBoss:!!d.boss,heavy:!!d.heavy,special:null,spT:0,introT:0,introDone:false,spCd:3,stun:0,phase3:false,deadT:0});
    if(d.boss)LV.bossName=d.name;
  }

/* ================= física ================= */
function overlap(b,s){const e=1e-4;return b.x+b.hw>s.x0+e&&b.x-b.hw<s.x1-e&&b.y+b.h>s.y0+e&&b.y<s.y1-e;}
function moveBody(b,dt){
  const n=Math.max(1,Math.ceil(dt/.008)),h=dt/n;
  for(let i=0;i<n;i++){
    b.vy-=GRAV*h;if(b.vy<-28)b.vy=-28;
    b.x+=b.vx*h;
    for(const s of LV.solids){
      if(!s.on)continue;
      if(overlap(b,s)){
        if(b.vx>0||(b.vx===0&&b.x<(s.x0+s.x1)/2))b.x=s.x0-b.hw-1e-3;else b.x=s.x1+b.hw+1e-3;
        b.vx=0;
      }
    }
    b.y+=b.vy*h;b.onGround=false;b.ground=null;
    for(const s of LV.solids){
      if(!s.on)continue;
      if(overlap(b,s)){
        if(b.vy<=0){b.y=s.y1;b.vy=0;b.onGround=true;b.ground=s;}
        else{b.y=s.y0-b.h;b.vy=0;}
      }
    }
  }
}
function pointSolid(x,y){for(const s of LV.solids){if(s.on&&x>s.x0&&x<s.x1&&y>s.y0&&y<s.y1)return true;}return false;}
function boxBlocked(xa,xb,ya,yb){
  const x0=Math.min(xa,xb),x1=Math.max(xa,xb);
  for(const s of LV.solids){if(s.on&&x1>s.x0+1e-3&&x0<s.x1-1e-3&&yb>s.y0+1e-3&&ya<s.y1-1e-3)return true;}
  return false;
}
function findLedge(b,d){
  let best=null,bg=9;
  for(const s of LV.solids){
    if(!s.on||!s.edge)continue;
    const top=s.y1,dy=top-b.y;
    if(dy<1.35||dy>2.5)continue;
    const ex=d>0?s.x0:s.x1;
    const gap=d>0?ex-(b.x+b.hw):(b.x-b.hw)-ex;
    if(gap<-.1||gap>.8)continue;
    if(pointSolid(ex-d*.1,top-.15))continue;
    if(boxBlocked(ex,ex+d*.9,top+.05,top+1.75))continue;
    if(boxBlocked(ex-d*.62,ex-d*.04,top-2.05,top-.2))continue;
    if(gap<bg){bg=gap;best={ex,top,d};}
  }
  return best;
}
function findDescend(p){
  const s=p.ground;if(!s||!s.edge)return null;
  const d=p.face,ex=d>0?s.x1:s.x0;
  if(Math.abs(ex-p.x)>.6)return null;
  if(pointSolid(ex+d*.1,s.y1-.15))return null;
  const top=s.y1;
  if(boxBlocked(ex+d*.04,ex+d*.62,top-2.05,top-.2))return null;
  return {ex,top,d:-d};
}

    crouch:false,peakY:0,ledge:null,hangT:0,climbT:0,climbK:0,jumpKind:'',stepT:0,deadKind:'',swordT:0,atkBuf:0,coyote:0,jumpBuf:0,flash:0,squash:0,enemyNear:false,hidden:false};
}
function resetPrince(){
  const p=P;
  p.x=LV.start.x;p.y=LV.start.y;p.vx=p.vy=0;p.face=LV.def.face;p.turn=p.face<0?1:0;
  p.mode='free';p.maxHp=Math.max(LV.def.hp,meta.levelMaxHp);p.hp=p.maxHp;p.hasSword=levelIdx>0;p.swordOut=false;
  p.atkT=-1;p.atkHit=false;p.atkCd=0;p.parryT=0;p.parryCd=0;p.hurtT=0;p.invT=0;p.grabCd=0;p.landT=0;p.crouch=false;
  p.onGround=false;p.peakY=p.y;p.pose=null;p.ch.root.rotation.z=0;p.deadKind='';p.swordT=0;p.atkBuf=0;p.coyote=0;p.jumpBuf=0;p.flash=0;p.squash=0;p.hidden=false;
}
function nearestEnemy(){
  let best=null,bd=1e9;
  for(const g of LV.guards){
    if(g.state==='dead')continue;
    if(Math.abs(g.y-P.y)>1.8)continue;
    const d=Math.abs(g.x-P.x);
    if(d<bd){bd=d;best=g;}
  }
  return best?{g:best,dist:bd}:null;
}
function killPlayer(msg,kind){
  if(P.god||P.mode==='dead'||P.mode==='win')return;
  P.mode='dead';P.hp=0;P.deadKind=kind;P.swordOut=P.hasSword&&kind==='blade'?true:false;
  P.atkT=-1;P.parryT=0;deathMsg=msg;deathTimer=1.1;deaths++;sfx('die');shake(.4);flash();vibe([60,40,120]);updateHud();
  if(kind==='fall'||kind==='void')deathTimer=1.0;
  if(kind==='lava'){emit(sparkPool,P.x,P.y+.4,18,{color:0xff9040,size:.35,grow:-.2,life:.9,spread:3,vy:5,g:-9,op:1});sfx('lava');}
  if(kind==='blade'||kind==='axe'||kind==='chomp'){emit(sparkPool,P.x,P.y+1,10,{color:0xd02020,size:.28,grow:-.15,life:.6,spread:4,vy:3,g:-12,op:1});}
}
function hurtPlayer(n,fromX,msg){
  if(P.god||P.invT>0||P.mode==='dead'||P.mode==='win')return;
  P.hp-=n;P.invT=.9;sfx('hit');shake(.25+n*.1);flash();vibe(40);P.flash=.22;hitstop(.09);
  if(P.hp<=0){P.hp=0;updateHud();killPlayer(msg||'Has caído en combate','blade');return;}
  if(P.mode==='hang'||P.mode==='climb'){P.mode='free';P.grabCd=.5;}
  P.hurtT=.35;P.vx=(P.x>=fromX?1:-1)*(n>1?6:4.2);P.atkT=-1;P.parryT=0;
  updateHud();
}
function enterHang(L){
  P.mode='hang';P.ledge=L;P.face=L.d;P.x=L.ex-L.d*.32;P.y=L.top-2.05;P.vx=P.vy=0;P.hangT=0;
  P.swordOut=false;P.atkT=-1;P.onGround=false;sfx('grab');
}
function land(fall){
  P.squash=clamp(.2+fall/6,.2,1.1);
  if(fall>H*2.1){killPlayer('Una caída mortal','fall');return;}
  if(fall>H*1.15){P.landT=.5;sfx('land');puff(P.x,P.y+.1,8);shake(.3);hurtPlayer(1,P.x,'Una caída mortal');return;}
  if(fall>1.2){P.landT=.2;sfx('land');puff(P.x,P.y+.1,4);}
}
function updatePlayer(dt,I){
  const p=P;p.t+=dt;
  if(p.hurtT>0)p.hurtT-=dt;if(p.invT>0)p.invT-=dt;if(p.parryCd>0)p.parryCd-=dt;if(p.grabCd>0)p.grabCd-=dt;if(p.landT>0)p.landT-=dt;if(p.atkCd>0)p.atkCd-=dt;
  if(p.parryT>0){p.parryT-=dt;if(p.parryT<=0)p.parryCd=.35;}
  p.atkW=.1;p.swordT-=dt;p.atkBuf-=dt;
  if(p.mode==='dead'){
    if(p.deadKind==='spikes'||p.deadKind==='lava'||p.deadKind==='void'){p.vx=0;p.vy=0;}
    else{p.vx=approach(p.vx,0,12*dt);moveBody(p,dt);}
    p.anim='dead';return;
  }
  if(p.mode==='win'){p.vx=0;moveBody(p,dt);p.anim='cheer';return;}
  if(p.mode==='hang'){
    p.vx=p.vy=0;p.hangT+=dt;p.anim='hang';
    if(p.hangT>.25){
      if(I.up){p.mode='climb';p.climbT=0;}
      else if(I.downE){const L=p.ledge;p.mode='free';p.vx=-L.d*1.2;p.vy=0;p.grabCd=.6;p.peakY=p.y;}
    }
    return;
  }
  if(p.mode==='climb'){
    p.climbT+=dt;const T=.75,k=Math.min(1,p.climbT/T);p.climbK=k;p.anim='climb';
    const L=p.ledge,xh=L.ex-L.d*.32,yh=L.top-2.05,xe=L.ex+L.d*.5;
    if(k<.55){const u=ease(k/.55);p.x=xh;p.y=lerp(yh,L.top-.25,u);}
    else{const u=ease((k-.55)/.45);p.x=lerp(xh,xe,u);p.y=lerp(L.top-.25,L.top+.001,u);}
    if(k>=1){p.mode='free';p.x=xe;p.y=L.top+.001;p.vx=p.vy=0;p.grabCd=.3;p.peakY=p.y;puff(p.x,p.y+.1,4);setCheckpoint();}
    return;
  }
  /* ---- modo libre ---- */
  const en=nearestEnemy();
  const want=p.hasSword&&en&&en.dist<9;p.enemyNear=!!en;
  if(want&&!p.swordOut&&p.onGround){p.swordOut=true;sfx('draw');}
  else if(!want&&p.swordOut&&p.onGround&&p.atkT<0&&p.swordT<=0)p.swordOut=false;
  const dir=(I.right?1:0)-(I.left?1:0);
  if(p.onGround)p.coyote=.11;else p.coyote=Math.max(0,p.coyote-dt);
  if(I.upE)p.jumpBuf=.13;else p.jumpBuf=Math.max(0,p.jumpBuf-dt);
  const canAct=p.hurtT<=0&&p.landT<=.28;
  let tv=0;
  if(p.onGround){
    if(p.swordOut&&en){
      p.face=Math.sign(en.g.x-p.x)||p.face;
      p.crouch=false;
      tv=dir*(dir===p.face?2.6:2.0);
    }else{
      p.crouch=I.down&&dir===0&&canAct&&p.landT<=0;
      tv=p.crouch?0:dir*(I.walk?1.9:5.6);
      if(dir!==0&&canAct)p.face=dir;
    }
    if(!canAct)tv=0;
    if(I.walk&&dir!==0&&!p.swordOut&&!pointSolid(p.x+dir*.5,p.y-.15))tv=0;
    if(dir!==0&&Math.sign(p.vx)===-dir&&Math.abs(p.vx)>3.5&&Math.random()<.35)puff(p.x,p.y+.05,1);
    p.vx=approach(p.vx,tv,(p.hurtT>0?10:(tv===0?55:38))*dt);
    /* descolgarse */
    if(I.downE&&dir===0&&!p.swordOut&&canAct){const d=findDescend(p);if(d){enterHang(d);return;}}
    /* espada */
    if(p.hasSword&&I.atkE&&!p.swordOut&&canAct){p.swordOut=true;p.swordT=1.6;sfx('draw');}
    if(p.swordOut){
      if(I.atkE){
        if(p.atkT<0&&p.atkCd<=0&&p.hurtT<=0&&p.parryT<=0){p.atkT=0;p.atkHit=false;sfx('swish');}
        else p.atkBuf=.22;
      }
      if(p.atkBuf>0&&p.atkT<0&&p.atkCd<=0&&p.hurtT<=0&&p.parryT<=0){p.atkBuf=0;p.atkT=0;p.atkHit=false;sfx('swish');}
      if(I.parryE&&p.parryCd<=0&&p.atkT<0&&p.parryT<=0&&p.hurtT<=0)p.parryT=.42;
    }
  }else{
    if(p.jumpKind!=='run'&&dir!==0)p.vx=clamp(p.vx+dir*5*dt,-3.2,3.2);
  }
  /* salto con margen (coyote) y buffer */
  if(p.jumpBuf>0&&p.coyote>0&&canAct&&(!p.swordOut||!en)&&p.landT<=.1){
    if(dir!==0&&Math.abs(p.vx)>3.5&&!I.walk){p.vx=dir*6.7;p.vy=10.6;p.jumpKind='run';}
    else if(dir!==0){p.vx=dir*4.2;p.vy=10.2;p.jumpKind='step';}
    else{p.vx=0;p.vy=10.6;p.jumpKind='vert';}
    p.onGround=false;p.crouch=false;p.coyote=0;p.jumpBuf=0;p.squash=-.45;sfx('jump');puff(p.x,p.y+.05,3);
    if(p.swordOut&&!en)p.swordOut=false;
  }
  if(p.atkT>=0){
    p.atkT+=dt;
    if(p.atkT>=.1&&!p.atkHit){p.atkHit=true;playerStrike();}
    if(p.atkT>=.5){p.atkT=-1;p.atkCd=.12;}
  }
  /* pasos */
  if(p.onGround&&Math.abs(p.vx)>3&&!p.swordOut){p.stepT-=dt;if(p.stepT<=0){p.stepT=.27;sfx('step');puff(p.x-p.face*.15,p.y+.05,1);}}
  /* movimiento */
  const wasGround=p.onGround;
  moveBody(p,dt);
  if(p.onGround){
    if(!wasGround){land(p.peakY-p.y);}
    p.peakY=p.y;
  }else{
    if(wasGround)p.peakY=p.y;else p.peakY=Math.max(p.peakY,p.y);
  }
  if(p.mode==='dead')return;
  /* agarre de cornisas */
  if(!p.onGround&&p.grabCd<=0&&p.hurtT<=0){
    const L=findLedge(p,p.face);
    if(L){enterHang(L);return;}
  }
  /* separar de enemigos */
  for(const g of LV.guards){
    if(g.state==='dead')continue;
    if(Math.abs(g.y-p.y)<1){
      const ov=(p.hw+g.hw+.12)-Math.abs(p.x-g.x);
      if(ov>0){const sd=p.x>=g.x?1:-1;p.x+=sd*ov/(g.heavy?1.6:2);g.x-=sd*ov/(g.heavy?6:2);}
    }
  }
  p.phase+=Math.abs(p.vx)*dt*(p.swordOut?2.4:1.75);
  p.anim=princeAnim(p);
}
function princeAnim(p){
  if(!p.onGround)return p.vy>.5?'jump':'fall';
  if(p.hurtT>0)return 'hurt';
  if(p.swordOut&&(p.enemyNear||p.atkT>=0||p.parryT>0||Math.abs(p.vx)<=3.2)){if(p.atkT>=0)return 'attack';if(p.parryT>0)return 'parry';return 'stance';}
  if(p.landT>.05||p.crouch)return 'crouch';
  if(Math.abs(p.vx)>.4)return Math.abs(p.vx)>3.2?'run':'walk';
  return 'idle';
}
function playerStrike(){
  P.vx=P.face*4.5;
  for(const g of LV.guards){
    if(g.state==='dead')continue;
    const dx=(g.x-P.x)*P.face,dy=Math.abs(g.y-P.y);
    if(dx>-.1&&dx<2.5+(g.hw-.26)&&dy<1.2){
      if(g.stun>0){hurtGuard(g,2,P.face);return;}
      if(g.parryT>0){sfx('clang');sparks((P.x+g.x)/2,P.y+1.2);P.vx=-P.face*2.5;shake(.1);return;}
      if(g.state==='engage'&&g.atkT<0&&g.hurtT<=0&&g.special!=='charge'&&Math.random()<g.parryChance){
        g.parryT=.35;sfx('clang');sparks((P.x+g.x)/2,P.y+1.2);P.vx=-P.face*2.5;g.cd=Math.min(g.cd,.25);shake(.1);return;
      }
      hurtGuard(g,1,P.face);return;
    }
  }
}

/* ================= enemigos (comportamiento) ================= */
function hurtGuard(g,n,dirx){
  if(g.state==='dead')return;
  g.hp-=n;sfx('hit');sparks(g.x,g.y+1.2*(g.h/1.8));shake(.15);g.flash=.2;hitstop(g.heavy?.1:.07);vibe(20);
  if(g.special!=='charge'&&g.special!=='slam')g.atkT=-1;
  if(g.hp<=0){
    g.state='dead';g.vx=dirx*3;g.anim='dead';g.special=null;
    emit(sparkPool,g.x,g.y+1,14,{color:0xffe0a0,size:.3,grow:-.15,life:.6,spread:4,vy:3,g:-9,op:1});
    if(g.isBoss){slowT=1.8;whiteFlash(.7);shake(.6);sfx('boss');say('¡El Sultán Oscuro ha caído!',3600);openExit();}
  }else{
    const kb=g.heavy?1.4:4.5;
    if(g.special==='charge'){g.special=null;g.vx=0;g.stun=.9;g.atkT=-1;}
    else if(g.special!=='slam'){g.hurtT=Math.max(g.hurtT,g.heavy?.28:.4);g.vx=dirx*kb;g.cd=Math.max(g.cd,.7);}
    if(g.state==='idle')g.state='engage';
  }
  updateHud();
}
function killGuard(g){if(g.state==='dead')return;g.hp=0;g.state='dead';g.atkT=-1;g.vx=0;g.special=null;if(g.isBoss){slowT=1.5;whiteFlash(.7);openExit();}updateHud();}
function guardStrike(g){
  if(P.mode!=='free'||P.invT>0)return;
  const dx=(P.x-g.x)*g.face,dy=Math.abs(P.y-g.y);
  if(dx<-.2||dx>g.reach+.1||dy>1.4)return;
  if(P.parryT>0&&P.face===-g.face){
    sfx('clang');sparks((P.x+g.x)/2,P.y+1.2);shake(.12);
    if(P.parryT>.28){
      g.hurtT=g.heavy?1.5:.95;g.atkT=-1;g.vx=-g.face*3;g.cd=1.3;g.flash=.25;P.parryT=0;P.parryCd=0;
      say('¡Parada perfecta!',900);sfx('perfect');sparks(g.x,g.y+1.2);hitstop(.1);vibe(25);
    }else{g.cd+=.5;g.vx=-g.face*2.5;P.vx=g.face*1.5;hitstop(.05);}
    return;
  }
  hurtPlayer(g.dmg,g.x,'Has caído en combate');
}
function startAttack(g){
  g.atkT=0;g.atkHit=false;g.cd=rnd(g.cdMin,g.cdMax);
  g.feinting=g.feintP>0&&Math.random()<g.feintP;
}
function updateGuard(g,dt){
  g.t+=dt;
  if(g.state==='dead'){g.vx=approach(g.vx,0,10*dt);moveBody(g,dt);g.anim='dead';g.swordOut=true;g.deadT+=dt;return;}
  if(g.hurtT>0)g.hurtT-=dt;if(g.parryT>0)g.parryT-=dt;if(g.stun>0)g.stun-=dt;
  const dx=P.x-g.x,adx=Math.abs(dx),dy=Math.abs(P.y-g.y);
  const live=P.mode==='free'||P.mode==='hang'||P.mode==='climb';
  const sees=live&&dy<1.9&&adx<g.aggro;
  if(g.isBoss){
    if(g.introT>0){g.introT-=dt;g.vx=0;moveBody(g,dt);g.anim='stance';g.face=dx>=0?1:-1;return;}
    if(!g.enraged&&g.hp<=g.maxHp*.5){g.enraged=true;g.cdMin*=.7;g.cdMax*=.7;g.speed*=1.2;say('¡El Sultán se enfurece!',1800);sfx('alert');shake(.35);}
    if(!g.phase3&&g.hp<=g.maxHp*.28){g.phase3=true;g.parryChance+=.1;say('¡Cuidado con las ondas de choque!',2200);sfx('boss');shake(.4);}
  }
  if(g.state==='idle'&&sees){
    g.state='engage';g.cd=.7;sfx('alert');
    if(g.isBoss&&!g.introDone){g.introDone=true;g.introT=1.8;sfx('boss');shake(.5);say(g.name.toUpperCase(),2200);}
  }
  let tv=0;
  /* ---- ataques especiales del jefe ---- */
  if(g.special==='charge'){
    g.spT+=dt;
    if(g.spT<.75){tv=0;g.face=dx>=0?1:-1;g.flash=Math.max(g.flash||0,.05);}
    else if(g.spT<1.35){
      tv=g.face*10.5;
      if(g.spT-dt<.75){sfx('axe');}
      if(!g.atkHit&&P.mode==='free'&&Math.abs(P.x-g.x)<1.1&&Math.abs(P.y-g.y)<1.5&&P.invT<=0){
        g.atkHit=true;
        if(P.parryT>.28&&P.face===-g.face){sfx('perfect');sparks(g.x,g.y+1.4);g.special=null;g.stun=1.6;g.vx=-g.face*5;P.parryT=0;say('¡Parada perfecta!',900);hitstop(.14);shake(.3);}
        else hurtPlayer(2,g.x,'Arrollado por el Sultán');
      }
      if(Math.random()<.5)emit(dustPool,g.x-g.face*.4,g.y+.1,1,{});
      if(g.vx===0&&g.spT>.9){g.special=null;g.stun=1.0;shake(.3);sfx('land');}
    }else{g.special=null;g.stun=.9;}
    g.vx=approach(g.vx,tv,45*dt);
    if(g.special==null&&g.state!=='dead'){g.atkT=-1;}
    moveBody(g,dt);g.anim=g.spT<.75?'stance':'run';g.phase+=Math.abs(g.vx)*dt*1.4;return;
  }
  if(g.special==='slam'){
    g.spT+=dt;g.vx=approach(g.vx,0,30*dt);
    if(g.spT<.55){g.anim='attack';g.atkT=Math.min(g.spT,g.atkW-.01);g.face=dx>=0?1:-1;}
    else if(!g.slamJump){g.slamJump=true;g.vy=11;g.onGround=false;sfx('jump');}
    moveBody(g,dt);
    if(g.slamJump&&g.onGround&&g.vy===0&&g.spT>.8){
      g.special=null;g.slamJump=false;g.stun=.7;shake(.6);sfx('land');sfx('boss');puff(g.x,g.y+.1,14);
      LV.waves.push({x:g.x,dir:1,y:g.y,t:0},{x:g.x,dir:-1,y:g.y,t:0});
    }
    if(!g.onGround)g.anim='fall';
    return;
  }
  if(g.state==='engage'){
    if(!sees&&(adx>g.aggro+4||dy>=3))g.state='idle';
    if(g.atkT<0&&g.hurtT<=0&&g.stun<=0)g.face=dx>=0?1:-1;
    g.cd-=dt;
    if(g.atkT<0&&g.hurtT<=0&&g.parryT<=0&&g.onGround&&g.stun<=0){
      if(adx>g.reach-.35)tv=g.face*g.speed;else if(adx<1.35)tv=-g.face*1.7;
      if(tv!==0&&!pointSolid(g.x+Math.sign(tv)*.6,g.y-.15))tv=0;
      if(g.cd<=0&&dy<1.4&&P.mode==='free'){
        if(g.isBoss&&adx>3.5&&adx<10&&g.hp<=g.maxHp*.66&&Math.random()<.7){g.special='charge';g.spT=0;g.atkHit=false;g.cd=rnd(g.cdMin,g.cdMax)+.8;sfx('alert');}
        else if(g.isBoss&&g.phase3&&adx<5&&Math.random()<.4){g.special='slam';g.spT=0;g.slamJump=false;g.cd=rnd(g.cdMin,g.cdMax)+.8;}
        else if(adx<g.reach-.1)startAttack(g);
      }
    }
  }
  if(g.atkT>=0){
    g.atkT+=dt;tv=0;
    if(g.feinting&&g.atkT>=g.atkW*.75){g.atkT=-1;g.feinting=false;g.cd=.28;g.parryT=0;}
    else{
      if(g.atkT>=g.atkW&&!g.atkHit){g.atkHit=true;g.vx=g.face*(g.heavy?2.2:3.5);guardStrike(g);if(g.heavy){shake(.12);sfx('axe');}}
      if(g.atkT>=g.atkW+.5)g.atkT=-1;
    }
  }
  if(g.hurtT>0||g.stun>0)g.vx=approach(g.vx,0,9*dt);else g.vx=approach(g.vx,tv,30*dt);
  const wasGround=g.onGround;
  moveBody(g,dt);
  if(g.onGround){
    if(!wasGround){const f=g.peakY-g.y;if(f>H*2.1){killGuard(g);}else if(f>H*1.15){hurtGuard(g,1,0);}}
    g.peakY=g.y;
  }else{if(wasGround)g.peakY=g.y;else g.peakY=Math.max(g.peakY,g.y);}
  g.phase+=Math.abs(g.vx)*dt*2.2;
  if(!g.onGround)g.anim='fall';
  else if(g.hurtT>0||g.stun>0)g.anim='hurt';
  else if(g.atkT>=0)g.anim='attack';
  else if(g.parryT>0)g.anim='parry';
  else if(g.state==='idle')g.anim='idleSword';
  else g.anim='stance';
}

/* ================= peligros y objetos ================= */
function bodies(){return [P,...LV.guards.filter(g=>g.state!=='dead')];}
function updateMovers(dt){
  for(const m of LV.movers){
    const nx=m.cx+m.amp*Math.sin(gt*m.sp+m.ph);
    m.dx=nx-m.x;m.x=nx;
    const s=m.solid;s.x0=nx-m.pw/2;s.x1=nx+m.pw/2;
    m.mesh.position.set(nx,m.top-SLAB/2,ZC);
    for(const b of bodies())if(b.onGround&&b.ground===s&&b.mode!=='dead')b.x+=m.dx;
  }
}
function updateLevel(dt){
  /* losas sueltas */
  for(const L of LV.loose){
    if(L.state==='solid'){
      let on=false;for(const b of bodies())if(b.onGround&&b.ground===L.solid)on=true;
      if(on){L.touch+=dt;if(L.touch>.12){L.state='shake';L.t=0;sfx('rumble');}}
    }else if(L.state==='shake'){
      L.t+=dt;L.mesh.position.x=L.cx+Math.sin(L.t*70)*.03;L.mesh.position.y=L.basey+Math.sin(L.t*55)*.012;
      if(L.t>.7){L.state='fall';L.solid.on=false;L.vy=0;puff(L.cx,L.top,10);sfx('rumble');shake(.18);}
    }else if(L.state==='fall'){
      L.vy+=GRAV*dt;L.mesh.position.y-=L.vy*dt;L.mesh.rotation.z+=dt*.6;L.mesh.rotation.x+=dt*.4;
      const lowerRow=L.r-1;
      if(lowerRow>=0&&FLOORCH.includes(LV.grid[lowerRow][L.c])&&L.mesh.position.y<lowerRow*H+.2){
        const pl=LV.plates.find(p=>p.c===L.c&&p.r===lowerRow);
        if(pl&&!pl.pressed)pressPlate(pl);
        puff(L.cx,lowerRow*H+.2,10);sfx('land');L.mesh.visible=false;L.state='gone';
      }else if(L.mesh.position.y<-12){L.mesh.visible=false;L.state='gone';}
    }
  }
  /* placas y puertas */
  for(const pl of LV.plates){
    if(!pl.pressed){for(const b of bodies())if(b.onGround&&b.ground===pl.solid){pressPlate(pl);break;}}
    if(pl.pressed)pl.mesh.position.y=pl.top+.01;
  }
  for(const g of LV.gates){
    const tgt=g.open?1:0;g.amt=approach(g.amt,tgt,dt*.7);
    const lift=g.amt*(g.h-.35),sc=1-.88*g.amt;
    g.g.position.y=g.top+lift;g.g.scale.y=sc;g.solid.y0=g.top+lift;g.solid.y1=g.top+lift+g.h*sc;
  }
  /* espinas */
  for(const s of LV.spikes){
    const ph=((gt+s.off)%3.4);
    let ext=0;
    if(ph<1.5)ext=0;else if(ph<1.8)ext=.18+Math.sin(gt*40)*.03;else if(ph<2.0)ext=lerp(.2,1,(ph-1.8)/.2);else if(ph<2.9)ext=1;else ext=1-(ph-2.9)/.5;
    if(ext>.55&&s.ext<=.55)sfx('spike');
    s.ext=ext;s.sp.scale.y=Math.max(.01,ext);s.sp.position.y=0;
    if(ext>.55)for(const b of bodies())if(Math.abs(b.x-s.cx)<.85&&b.y<s.top+.6&&b.y>s.top-.8){
      if(b===P)killPlayer('Empalado por las espinas','spikes');else killGuard(b);
    }
  }
  /* cuchillas */
  for(const c of LV.chompers){
    const ph=((gt+c.off)%3);
    let u;
    if(ph<2)u=1+Math.sin(gt*1.5+c.off)*.01;else if(ph<2.1)u=lerp(1,0,(ph-2)/.1);else if(ph<2.5)u=0;else u=ease((ph-2.5)/.5);
    const closed=ph>=1.97&&ph<2.6;
    if(closed&&!c.closed)sfx('chomp');
    c.closed=closed;
    c.up.position.y=lerp(1.0,2.75,u);
    if(closed)for(const b of bodies())if(Math.abs(b.x-c.cx)<.6&&b.y<c.top+1.9&&b.y+b.h>c.top){
      if(b===P)killPlayer('Cortado por la cuchilla','chomp');else killGuard(b);
    }
  }
  /* péndulos con hacha: permanecen en los extremos y barren rápido el centro */
  for(const a of LV.axes){
    const s=Math.sin((gt+a.off)*1.43);
    const u=clamp(s*2.2,-1,1),h=u*1.5-u*u*u*.5;
    a.theta=1.4*h;a.g.rotation.z=a.theta;
    const R_=a.L+.22;
    a.bx=a.cx+R_*Math.sin(a.theta);a.by=a.pivY-R_*Math.cos(a.theta);
    const sweeping=Math.abs(a.theta)<1.28;
    if(sweeping&&!a.snd){a.snd=true;sfx('axe');}else if(!sweeping)a.snd=false;
    if(sweeping)for(const b of bodies()){
      if(b.mode==='dead')continue;
      const nx=clamp(a.bx,b.x-b.hw,b.x+b.hw),ny=clamp(a.by,b.y+.05,b.y+b.h-.1);
      if(Math.hypot(a.bx-nx,a.by-ny)<.5){if(b===P)killPlayer('Partido por el hacha','axe');else killGuard(b);}
    }
  }
  /* chorros de fuego */
  for(const j of LV.jets){
    const ph=((gt+j.off)%4.2);
    const warn=ph>=1.9&&ph<2.5,on=ph>=2.5&&ph<3.6;
    if(on&&!j.on){sfx('flame');}
    j.on=on;j.warn=warn;
    j.fl.visible=on;
    if(on){
      j.fl.scale.set(1+Math.sin(gt*30)*.1,1+Math.sin(gt*23+j.off)*.08,1);j.gl.material.opacity=.75+Math.sin(gt*19)*.15;
      emit(flamePool,j.cx,j.top+rnd(.2,2.2),1,{color:0xffa040,size:.5,grow:-.25,life:.4,spread:.4,vy:1.6,op:.7,jx:2});
      for(const b of bodies())if(b.mode!=='dead'&&Math.abs(b.x-j.cx)<.5&&b.y<j.top+2.3&&b.y+b.h>j.top){
        if(b===P)hurtPlayer(1,j.cx,'Abrasado por el fuego');else if(Math.random()<.02)hurtGuard(b,1,0);
      }
    }else{
      j.gl.material.opacity=warn?.12+Math.sin(gt*40)*.1:0;
      if(warn&&Math.random()<.4)emit(sparkPool,j.cx,j.top+.2,1,{color:0xff8030,size:.16,grow:-.1,life:.3,spread:.5,vy:2,g:-3,op:1,jx:1});
    }
    j.gr.material.emissiveIntensity=on?2.5:(warn?1.6:.7);
  }
  /* ondas de choque del jefe */
  for(let i=LV.waves.length-1;i>=0;i--){
    const w=LV.waves[i];w.t+=dt;w.x+=w.dir*8*dt;
    emit(sparkPool,w.x,w.y+.2,2,{color:0xff8a50,size:.5,grow:-.2,life:.35,spread:.5,vy:.8,op:.9,jx:.5});

  /* pozos */

        popGems();

    }
  }
  /* banderas */
  for(const f of LV.flags){

    f.cloth.position.y=.75+f.k*1.55;

    for(let i=0;i<pa.count;i++){const bx=f.base[i*3],by=f.base[i*3+1];pa.setZ(i,Math.sin(gt*5+bx*5)*.07*bx);pa.setY(i,by+Math.sin(gt*4+bx*3)*.02*bx);}
    pa.needsUpdate=true;

      f.active=true;sfx('flag');LV.cp={x:f.cx,y:f.top};
      for(const o of LV.flags)if(o!==f&&o.active&&o!==f){o.active=false;}
      f.active=true;
      emit(sparkPool,f.cx,f.top+2,12,{color:0xffd070,size:.3,grow:-.15,life:.7,spread:3,vy:2.5,g:-4,op:1});
      say('Punto de control',1500);vibe(20);
    }
  }
  /* pociones y espada */
  for(const po of LV.potions){
    if(po.taken)continue;
    po.g.position.y=po.top+Math.sin(gt*2.5+po.ph)*.05;po.g.rotation.y=gt*1.2;
    if(P.mode==='free'&&Math.abs(P.x-po.cx)<.6&&Math.abs(P.y-po.top)<1.2){

      emit(sparkPool,P.x,P.y+1,8,{color:po.big?0x7fb0ff:0xff8a70,size:.3,grow:-.1,life:.6,vy:2,spread:2,op:1});
      updateHud();
    }
  }
  const si=LV.swordItem;
  if(si&&!si.taken){
    si.g.rotation.y=gt*1.4;si.g.position.y=si.top+Math.sin(gt*2)*.04;
    if(P.mode==='free'&&Math.abs(P.x-si.cx)<.7&&Math.abs(P.y-si.top)<1.2){
      si.taken=true;si.g.visible=false;P.hasSword=true;sfx('item');setCheckpoint();say(T_?'¡Espada! Botón espada: atacar · escudo: parar':'¡Has recogido la espada! J atacar · K parar');
    }

  /* enemigos */
  const live=state==='play'||state==='dead'||state==='win'||state==='ending';
  if(live)for(const g of LV.guards)updateGuard(g,dt);
  /* salida */
  if(live&&LV.exit&&!LV.sealed&&P.mode==='free'&&Math.abs(P.x-LV.exit.cx)<.9&&Math.abs(P.y-LV.exit.top)<.6){

  /* pistas */
  for(const h of LV.hints){
    if(!live||h.done)continue;
    if(Math.abs(P.x-h.c*W)<1.1&&Math.abs(P.y-h.r*H)<1.2&&P.mode==='free'){h.done=true;say(h.text,4200);}
  }
  /* gotas del techo */
  for(const d of LV.drips){
    d.t-=dt;
    if(d.t<=0){d.t=rnd(1.5,4);emit(dustPool,d.x,d.y,1,{color:0x8fd0ff,size:.07,grow:0,life:.9,spread:0,vy:-3,g:-14,op:.8,jx:.1});}
  }
}

const camTmp=new THREE.Vector3();
function updateCamera(dt,snap){
  const lead=clamp(P.vx*.35,-2.2,2.2);let tx=P.x+(P.face>0?1:-1)*1.0+lead,ty=P.y+2.1-(P.vy<-9?1.4:0);
  if(state==='intro'){tx=introCam.x;ty=introCam.y;}
  if(state==='title'){tx=titleCam.x;ty=titleCam.y;}
  if(state==='play'){const bi=LV.guards.find(g=>g.isBoss&&g.introT>0&&g.state!=='dead');if(bi){tx=(P.x+bi.x)/2;ty=P.y+2.3;camZoomT=1.22;}else camZoomT=1;}
  if(state==='ending'){tx=P.x+1.5;ty=P.y+2.6;}
  if(snap){camX=tx;camY=ty;camZoom=camZoomT;}
  else{camX=damp(camX,tx,state==='intro'?12:3.5,dt);camY=damp(camY,ty,state==='intro'?12:3,dt);camZoom=damp(camZoom,camZoomT,3,dt);}
  let sx=0,sy=0;
  if(shakeT>0){shakeT-=dt;const k=Math.max(0,shakeT/.35);sx=rnd(-1,1)*shakeA*k;sy=rnd(-1,1)*shakeA*k;if(shakeT<=0)shakeA=0;}
  const cz=camDist*camZoom*(state==='intro'?introCam.z:1);
  const sw=Math.sin(gt*.3)*.08;
  camera.position.set(camX+sx+sw,camY+sy,cz);
  camera.lookAt(camX+sx+sw,camY+sy,0);
  moon.position.set(camX-4,camY+8,9);moon.target.position.set(camX,camY-1,0);
  fillLight.position.set(P.x+P.face*.4,P.y+1.5,1.4);
  /* antorchas: las más cercanas iluminan */
  const ts=LV.torches.map(t=>({t,d:Math.hypot(t.x-camX,(t.y-camY)*.7)}));
  ts.sort((a,b)=>a.d-b.d);
  for(let i=0;i<lightPool.length;i++){
    const l=lightPool[i],e=ts[i];
    if(e&&e.d<22){const fk=1+Math.sin(gt*13+e.t.ph)*.08+Math.sin(gt*7.3+e.t.ph*2)*.06;l.position.set(e.t.x,e.t.y,-.6);l.intensity=30*fk;}
    else l.intensity=0;
  }
  for(const t of LV.torches){const fk=1+Math.sin(gt*13+t.ph)*.15;t.fl.scale.set(1,fk*(1+Math.sin(gt*21+t.ph)*.1),1);t.gl.material.opacity=.65+Math.sin(gt*11+t.ph)*.15;}
  /* lava */
  if(LV.lava){
    LV.lava.tex.offset.x=gt*.012;LV.lava.tex.offset.y=gt*.02;
    lavaLight.position.set(camX,-.6,1.6);lavaLight.intensity=34+Math.sin(gt*3)*6;
    if(Math.random()<.25)emit(flamePool,camX+rnd(-9,9),-1.7,1,{color:0xff8030,size:.3,grow:-.1,life:1.1,spread:.4,vy:2.2,g:-1.5,op:.9,jx:1});
  }else lavaLight.intensity=0;
  /* sway / giros / cadenas / linternas */
  for(const s of LV.sway){
    const pa=s.geo.attributes.position;
    for(let i=0;i<pa.count;i++){
      const bx=s.base[i*3],by=s.base[i*3+1];
      if(s.flag){pa.setZ(i,Math.sin(gt*4+bx*4+s.ph)*.12*bx);pa.setY(i,by+Math.sin(gt*3+bx*3+s.ph)*.03*bx);}
      else{const k=(-by/s.len+.5);pa.setZ(i,Math.sin(gt*1.4+s.ph+by*1.2)*.09*k);pa.setX(i,bx+Math.sin(gt*1.1+s.ph+by)*.05*k);}
    }
    pa.needsUpdate=true;
  }
  for(const s of LV.spin)s.o.rotation.z+=s.s*dt;
  for(const c of LV.chains)c.c.rotation.z=Math.sin(gt*.9+c.ph)*.04;
  for(const l of LV.lanterns){l.g.position.y=l.y+Math.sin(gt*1.2+l.ph)*.04;l.g.rotation.z=Math.sin(gt*1.1+l.ph)*.06;}
  /* motas */
  const pa=moteGeo.attributes.position;
  for(let i=0;i<MOTES;i++){
    let x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i);
    if(moteMode===1){x+=Math.sin(gt*.5+i)*.3*dt;y+=(.5+Math.sin(i)*.2)*dt;}
    else if(moteMode===2){x+=Math.sin(gt*.4+i)*.35*dt;y+=Math.cos(gt*.5+i*1.7)*.3*dt;}
    else{x+=Math.sin(gt*.3+i)*.1*dt;y+=(Math.cos(gt*.2+i*1.7)*.12-.02)*dt;}
    if(x<-10)x+=20;if(x>10)x-=20;if(y<-6)y+=12;if(y>6)y-=12;
    pa.setXYZ(i,x,y,z);
  }
  pa.needsUpdate=true;motes.position.set(camX,camY,0);
  /* cielo exterior con paralaje */
  if(sky.visible){
    sky.position.set(camX,camY,0);
    skyPlane.position.set(0,6,-96);
    const night=skyKind==='night';
    sunSprite.position.set(night?-18-camX*.01:22-camX*.012,night?14:-2+0,-92);sunSprite.scale.setScalar(sunSprite.userData.s);
    sunCore.position.set(sunSprite.position.x,sunSprite.position.y,-91);sunCore.scale.setScalar(sunCore.userData.s);
    const ks=[.03,.07,.12];
    skylines.forEach((m,i)=>{m.position.set(-camX*ks[i],SKY_B[i]+SKY_H[i]/2-camY*.04,SKY_Z[i]);});
    cloudPlane.position.set(-camX*.04+Math.sin(gt*.02)*3,9,-84);
    tCloud.offset.x=gt*.002;
    mistPlane.visible=true;mistPlane.scale.set(160,7,1);mistPlane.position.set(camX,-3.0,1.6);
    for(const b of LV.birds){b.s.position.x+=b.v*dt;if(b.s.position.x>70)b.s.position.x=-70;b.s.scale.y=.5+Math.sin(gt*9+b.ph)*.25;}
  }
}

    return `<button class="tile" data-lv="${i}" style="--g:linear-gradient(160deg,${THEME_COL[L.theme]}66,transparent 70%)"><span class="n">${L.roman}</span><span class="t">${L.name}</span><span class="s">${[0,1,2].map(k=>k<st?'<b>★</b>':'★').join('')}</span>${bt?`<span class="t" style="min-height:0">${fmt(bt)}</span>`:''}</button>`;
  }).join('');
  showOverlay(`<h2>SELECCIONA NIVEL</h2><p>★ ${totalStars()} / ${LEVELS.length*3}</p><div class="lvgrid">${tiles}</div><button class="sm" data-act="title">Volver</button>`,true);
}
function titleScreen(){
  hideOverlay();paused=false;
  buildLevel(6);
  if(!P)P=makePrince();
  meta.levelMaxHp=0;
  resetPrince();state='title';
  document.body.className=(isTouch?'touch ':'')+'title';
  titleCam.x=LV.start.x+3;camZoomT=.92;
  updateCamera(0,true);
  $('lvname').textContent='';$('hearts').innerHTML='';$('enemy').innerHTML='';$('gems').innerHTML='';$('bossbar').classList.remove('on');
  GU.uFade.value=1;fadeT=0;
  const done=save.stars.filter(Boolean).length;
  const how=isTouch
    ?'<div><b>◀ ▶</b>mover (desliza entre ambos)</div><div><b>▲</b>saltar · corriendo = salto largo</div><div><b>▼</b>agacharse · en un borde, descolgarse</div><div><b>Espada</b>atacar · <b>Escudo</b>parar</div><div><b>Lento</b>paso cuidadoso junto a trampas</div>'
    :'<div><b>← →</b>mover · <b>↑ / Espacio</b> saltar (corriendo = salto largo)</div><div><b>↓</b>agacharse o descolgarse de un borde</div><div><b>Shift</b>andar con cuidado</div><div><b>J</b>atacar · <b>K</b>parar · <b>R</b>reiniciar · <b>P</b>pausa · <b>F</b>pantalla completa · <b>M</b>sonido</div>';
  const hintIOS=(isIOS&&!standalone)?'<div class="hintios">En iPhone: Compartir → «Añadir a pantalla de inicio» para jugar a pantalla completa.</div>':'';
  showOverlay(`<div class="title"><div class="tl"><div class="kicker">Aventura de plataformas · 8 niveles</div><h1>CIUDADELA<br>DE ARENA</h1>
   <p>Un prisionero, una torre llena de trampas y una sola salida.<br>Escapa antes del amanecer.</p></div>
   <div class="tr"><button data-act="start">${done?'Continuar':'Comenzar'}</button>
   <button class="sm" data-act="select">Seleccionar nivel${done?` · ★ ${totalStars()}`:''}</button>
   <div class="how">${how}</div>${hintIOS}
   ${canFS?'<button class="sm ghost" data-act="fs">Pantalla completa</button>':''}</div></div>`);
}
$('ov').addEventListener('click',e=>{
  const t=e.target.closest?e.target.closest('button'):e.target;if(!(t instanceof HTMLElement))return;
  initAudio();
  const act=t.dataset.act;
  if(act==='start'){enterFS();let n=0;for(let i=0;i<LEVELS.length;i++){if(save.stars[i])n=i+1;}meta.levelMaxHp=0;startLevel(Math.min(n,LEVELS.length-1));}
  else if(act==='retry')startLevel(levelIdx,true);
  else if(act==='next'){meta.levelMaxHp=P.maxHp;startLevel(levelIdx+1);}
  else if(act==='title')titleScreen();
  else if(act==='select')selectScreen();
  else if(act==='resume')setPause(false);
  else if(act==='respawn')respawn();
  else if(act==='restart')startLevel(levelIdx,true,true);
  else if(act==='snd'){setMuted(!muted);t.textContent=muted?'Activar sonido':'Silenciar';}
  else if(act==='fs'){toggleFS();setTimeout(()=>{if(t.dataset.act==='fs'&&t.textContent.length>0&&paused)t.textContent=fsActive()?'Salir de pantalla completa':'Pantalla completa';},400);}
  else if(t.dataset.lv!==undefined){enterFS();meta.levelMaxHp=0;startLevel(+t.dataset.lv);}
});

/* ================= flujo del nivel ================= */
function setCheckpoint(){
  if(!LV||!LV.cp)return;
  for(const g of LV.guards)if(g.state!=='dead'&&Math.abs(g.x-P.x)<7&&Math.abs(g.y-P.y)<2)return;
  if(Math.abs(P.x-LV.cp.x)<2&&Math.abs(P.y-LV.cp.y)<.5)return;
  LV.cp={x:P.x,y:P.y};say('Punto de control',1800);sfx('item');
}
function respawn(){
  const p=P;
  p.x=LV.cp.x;p.y=LV.cp.y;p.vx=p.vy=0;p.mode='free';p.hp=p.maxHp;p.invT=1.6;p.hurtT=0;p.atkT=-1;p.parryT=0;p.swordOut=false;
  p.crouch=false;p.landT=0;p.grabCd=0;p.peakY=p.y;p.deadKind='';p.pose=null;p.ch.root.rotation.z=0;p.swordT=0;p.atkBuf=0;p.hidden=false;
  for(const g of LV.guards)if(g.state!=='dead'){g.state='idle';g.atkT=-1;g.cd=1;g.special=null;g.stun=0;if(g.isBoss&&g.hp<g.maxHp){g.hp=Math.min(g.maxHp,g.hp+3);}}
  LV.waves.length=0;
  state='play';paused=false;deathTimer=0;hideOverlay();updateCamera(0,true);updateHud();
  GU.uFade.value=.8;fadeT=0;
}
function startLevel(idx,restart,quick){
  levelIdx=idx;
  buildLevel(idx);
  if(!P)P=makePrince();
  resetPrince();LV.cp={x:P.x,y:P.y};
  paused=false;hideOverlay();timeSec=0;lvDeaths=0;keys.ShiftLeft=false;$('bW').classList.remove('on');requestWake();
  $('lvname').textContent=LEVELS[idx].roman+' · '+LEVELS[idx].name;
  camZoomT=1;hudA=hudB=hudC='';
  for(const k in keys)keys[k]=false;
  updateHud();
  if(restart&&quick){beginPlay();return;}
  /* introducción cinemática */
  state='intro';introT=0;
  INTRO_DUR=clamp(2.6+LV.C*.035,3.0,4.6);
  const d=LEVELS[idx];
  $('intN').textContent='NIVEL '+d.roman;$('intT').textContent=d.name;$('intS').textContent=d.intro;
  document.body.className=(isTouch?'touch ':'')+'intro';
  void document.body.offsetWidth;
  document.body.classList.add('in');
  introCam.x=LV.exit?LV.exit.cx:P.x;introCam.y=(LV.exit?LV.exit.top:P.y)+2.4;introCam.z=1.5;
  updateCamera(0,true);
  GU.uFade.value=1;fadeT=0;
}
function skipIntro(){if(state==='intro')beginPlay();}
function beginPlay(){
  state='play';
  document.body.className=(isTouch?'touch':'')+(P.hasSword?' sword':'');
  updateCamera(0,true);updateHud();
  say(LEVELS[levelIdx].name,2600);
  GU.uFade.value=.6;fadeT=0;
}
function finishLevel(){
  state='win';
  const last_=levelIdx>=LEVELS.length-1;
  const L=LEVELS[levelIdx];
  const allGems=LV.gemGot>=LV.gemTotal,fast=timeSec<=L.par;
  const stars=1+(allGems?1:0)+(fast?1:0);
  const prev=save.best[levelIdx],rec=!prev||timeSec<prev;
  if(rec)save.best[levelIdx]=Math.round(timeSec*10)/10;
  save.stars[levelIdx]=Math.max(save.stars[levelIdx]||0,stars);
  save.gems[levelIdx]=Math.max(save.gems[levelIdx]||0,LV.gemGot);
  writeSave();
  if(last_){startEnding();return;}
  const stat=`<div class="stat"><span>⏱ ${fmt(timeSec)}</span>${rec?'<span class="rec">¡Nuevo récord!</span>':`<span>Récord ${fmt(prev)}</span>`}<span>◆ ${LV.gemGot} / ${LV.gemTotal}</span>${lvDeaths?`<span>☠ ${lvDeaths}</span>`:''}</div>`;
  const crit=`<div class="crit"><span class="ok">★ Completado</span><span class="${allGems?'ok':''}">★ Todas las gemas</span><span class="${fast?'ok':''}">★ Bajo ${fmt(L.par)}</span></div>`;
  showOverlay(`<div class="kicker">Nivel ${L.roman} superado</div><h2>${L.name}</h2>${starsHtml(stars)}${crit}${stat}<button data-act="next">Siguiente nivel</button><br><button class="sm" data-act="retry">Repetir</button><button class="sm" data-act="select">Niveles</button><button class="sm" data-act="title">Menú</button>`,true);
}
function startEnding(){
  state='ending';endT=0;endBurstT=0;document.body.className=(isTouch?'touch ':'')+'ending';
  camZoomT=1.25;whiteFlash(.9);sfx('win');
  say('¡LIBERTAD!',5000);
}
function burst(x,y,color){
  const n=26;
  for(let i=0;i<n;i++){
    const q=sparkPool.find(p=>p.life<=0);if(!q)return;
    const a=i/n*Math.PI*2+rnd(-.1,.1),sp=rnd(3,5.5);
    q.life=q.max=rnd(.9,1.4);q.s.visible=true;q.s.position.set(x,y,-1.5);
    q.vx=Math.cos(a)*sp;q.vy=Math.sin(a)*sp;q.size=.4;q.grow=-.25;q.g=-3.5;q.m.color.setHex(color);q.op=1;q.m.opacity=1;q.s.scale.setScalar(.4);
  }
  sfx('item');
}
function showEnding(){
  state='end';
  const tot=totalStars(),gems=save.gems.reduce((a,b)=>a+(b||0),0),time=save.best.reduce((a,b)=>a+(b||0),0);
  showOverlay(`<div class="kicker">Fin</div><h2>¡LIBERTAD!</h2><p>Has escapado de la Ciudadela de Arena.<br>El sol sale sobre la ciudad por primera vez en años.</p><div class="stat"><span>★ ${tot} / ${LEVELS.length*3}</span><span>◆ ${gems}</span><span>⏱ ${fmt(time)} <small>(suma de mejores)</small></span></div><button data-act="title">Volver al inicio</button><br><button class="sm" data-act="select">Niveles</button>`,true);
}

/* ================= bucle ================= */
let last=performance.now();
let qAcc=0,qN=0,qLevel=0,qCool=3;
function qualityTick(raw){
  if(paused||document.hidden||raw>.5||MANUAL)return;
  qAcc+=raw;qN++;
  if(qN>=120){
    const avg=qAcc/qN;qAcc=0;qN=0;
    if(qCool>0){qCool--;return;}
    if(avg>1/40&&qLevel<3){
      qLevel++;
      if(qLevel===1&&bloomPass)bloomPass.enabled=false;
      else if(qLevel===2){maxRatio=Math.max(1,maxRatio*.75);renderer.setPixelRatio(maxRatio);resize();}
      else if(qLevel===3){maxRatio=Math.max(.75,maxRatio*.75);renderer.setPixelRatio(maxRatio);resize();}
      qCool=2;
    }
  }
}
function step(dt){
  if(!LV||!P)return;
  gt+=dt;
  musOn=true;
  let eng=false;for(const g of LV.guards)if(g.state==='engage'&&Math.abs(g.x-P.x)<12)eng=true;combatTarget=eng&&state==='play'?1:0;
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('on');}
  if(state==='play'||state==='dead'||state==='win'||state==='ending'||state==='end'){
    const I=getInput();
    updateMovers(dt);
    updatePlayer(dt,I);
    updateLevel(dt);
    if(state==='play')timeSec+=dt;
    if(P.mode==='dead'&&state==='play'){
      deathTimer-=dt;
      if(deathTimer<=0){
        state='dead';lvDeaths++;
        showOverlay(`<h2>HAS MUERTO</h2><p>${deathMsg}</p><button data-act="respawn">Continuar</button><br><button class="sm" data-act="restart">Reiniciar nivel</button><button class="sm" data-act="select">Niveles</button><button class="sm" data-act="title">Menú</button>`);
      }
    }
    if(P.mode==='win'&&state==='play'){
      winTimer-=dt;
      if(winTimer<=.5&&!LV.faded){LV.faded=true;fadeT=1;}
      if(winTimer<=0)finishLevel();
    }
    if(state==='ending'){
      endT+=dt;endBurstT-=dt;renderer.toneMappingExposure=lerp(LV.th.expo,LV.th.expo*1.9,clamp(endT/5,0,1));
      if(endBurstT<=0&&endT<7){endBurstT=rnd(.25,.55);burst(camX+rnd(-7,7),camY+rnd(2,5.5),[0xffd060,0xff6a6a,0x7fd0ff,0xb08aff,0x9fffb0][Math.floor(rnd(0,5))]);}
      if(endT>8)showEnding();
    }
    $('time').textContent=fmt(timeSec);
    updateHud();
  }else if(state==='intro'){
    introT+=dt;
    const k=ease(clamp(introT/INTRO_DUR,0,1));
    const ex=LV.exit?LV.exit.cx:P.x,ey=(LV.exit?LV.exit.top:P.y)+2.4;
    introCam.x=lerp(ex,P.x+1,k);introCam.y=lerp(ey,P.y+2.1,k);introCam.z=lerp(1.5,1,k);
    updateMovers(dt);updateLevel(dt);
    P.t+=dt;P.anim='idle';P.phase=0;
    if(introT>=INTRO_DUR+.9)beginPlay();
  }else{ /* título / menús */
    updateMovers(dt);updateLevel(dt);
    P.t+=dt;P.anim='idle';P.phase=0;
    titleCam.x=Math.min(titleCam.x+.45*dt,LV.C*W-14);
  }
  updateParticles(dt);
}
function renderFrame(dt){
  if(!LV||!P)return;
  P.anim=P.anim||'idle';
  P.climbK=P.mode==='climb'?Math.min(1,P.climbT/.75):0;
  renderEnt(P,dt||.016);
  for(const g of LV.guards){renderEnt(g,dt||.016);}
  if(state==='title')updateCameraTitle();
  updateCamera(dt||.016,false);
  if(P.flash>.15)abK=1;
  abK=Math.max(0,abK-(dt||.016)*3);
  GU.uAb.value=abK*.016;GU.uTime.value=gt%100;
  const fadeTo=(state==='dead'&&P.deadKind==='void')?.85:fadeT;
  GU.uFade.value=damp(GU.uFade.value,fadeTo,state==='dead'?3:5,dt||.016);
  document.body.classList.toggle('sword',!!P.hasSword&&state!=='intro'&&state!=='title');
  if(composer)composer.render();else renderer.render(scene,camera);
}
function updateCameraTitle(){}
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000;last=now;
  if(MANUAL){if(needRender){needRender=false;renderFrame(.016);}return;}
  let dt=Math.min(.033,raw);
  qualityTick(raw);
  if(hitStopT>0){hitStopT-=raw;dt*=.06;}
  if(slowT>0){slowT-=raw;dt*=.25;}
  if(paused)dt=0;
  if(dt>0)step(dt);
  renderFrame(dt);
  for(const k in edge)edge[k]=false;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true);else if(state==='play')requestWake();});

/* ================= API de pruebas (?debug&manual) ================= */
if(DEBUG){
  window.__t={
    get state(){return state;},get P(){return P;},get LV(){return LV;},get gt(){return gt;},
    start(i,skipIntro_=true){meta.levelMaxHp=0;startLevel(i,skipIntro_,skipIntro_);for(const k in keys)keys[k]=false;GU.uFade.value=0;fadeT=0;needRender=true;},
    key(code,down=true){if(down){if(!keys[code])edge[code]=true;keys[code]=true;}else keys[code]=false;},
    release(){for(const k in keys)keys[k]=false;},
    step(n=1,dt=1/60){for(let i=0;i<n;i++){step(dt);for(const k in edge)edge[k]=false;if(state==='dead'||state==='win')break;}needRender=true;},
    tp(x,y){P.x=x;P.y=y;P.vx=P.vy=0;P.peakY=y;updateCamera(0,true);needRender=true;},
    cam(x,y){camX=x;camY=y;},
    render(){renderFrame(.016);},
    title(){titleScreen();},
    setCp(){LV.cp={x:P.x,y:P.y};},
    info(){return{x:+P.x.toFixed(2),y:+P.y.toFixed(2),vx:+P.vx.toFixed(2),vy:+P.vy.toFixed(2),mode:P.mode,hp:P.hp,anim:P.anim,og:P.onGround,state,gems:LV.gemGot+'/'+LV.gemTotal};},
    guards(){return LV.guards.map(g=>({t:g.type,x:+g.x.toFixed(1),hp:g.hp,st:g.state}));},
    win(){P.mode='win';winTimer=0;},
    god(v=true){P.god=v;},
    stats(){renderer.info.autoReset=false;renderer.info.reset();renderFrame(.016);const r=renderer.info.render;const o={calls:r.calls,tris:r.triangles,geo:renderer.info.memory.geometries,tex:renderer.info.memory.textures};renderer.info.autoReset=true;return o;},
    prep(){for(const g of LV.guards){g.state='dead';}LV.loose.forEach(L=>L.touch=-1e9);LV.gates.forEach(g=>{g.open=true;g.amt=1;});},
  };
}
titleScreen();
requestAnimationFrame(frame);
</script>
