<script>
'use strict';
/* ============ utilidades ============ */

/* ===== MARCA (cambia aquí para una versión de cliente) ===== */
const BRAND={name:'Kauai',sub:'Minigolf',url:'kauai.es',color:'#1e6bff',
  lead:{enabled:false,endpoint:'',text:'Recibe novedades y ofertas'}};

/* ============ papel de acuarela (overlay) ============ */

/* ============ renderer / escena ============ */
const cv=$('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;const PRMAX=Math.min(window.devicePixelRatio||1,TOUCH?1.5:2);renderer.setPixelRatio(PRMAX);

const sun=new THREE.DirectionalLight(0xfff1d6,1.05);
sun.castShadow=true;sun.shadow.mapSize.set(TOUCH?1536:2048,TOUCH?1536:2048);sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;

/* ===== postproceso: bloom + gradación acuarela ===== */
const GradeShader={uniforms:{tDiffuse:{value:null},time:{value:0},night:{value:0},res:{value:new THREE.Vector2(1000,600)}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform sampler2D tDiffuse;uniform float time,night;uniform vec2 res;varying vec2 vUv;
 float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
 float L(vec3 c){return dot(c,vec3(.299,.587,.114));}
 void main(){
  vec2 uv=vUv;
  vec2 w=vec2(n(uv*vec2(70.,42.)+time*.04),n(uv*vec2(70.,42.)+17.3-time*.04))-.5;uv+=w*.0016;
  vec2 d=uv-.5;float r=dot(d,d);
  float ts=smoothstep(.22,.64,abs(vUv.y-.55))*2.4;vec3 c=vec3(0.);for(int i=0;i<8;i++){float a=float(i)*.785398;c+=texture2D(tDiffuse,uv+vec2(cos(a),sin(a))*ts*2.4/res).rgb;}c=(c+texture2D(tDiffuse,uv).rgb*2.)/10.;
  vec2 px=1./res;float l0=L(c);
  float e=abs(l0-L(texture2D(tDiffuse,uv+vec2(px.x*1.,0.)).rgb))+abs(l0-L(texture2D(tDiffuse,uv+vec2(0.,px.y*1.)).rgb));
  c*=1.-smoothstep(.08,.34,e)*.2;
  float lum=L(c);
  c=mix(vec3(lum),c,1.22);
  c=(c-.5)*1.1+.5;
  c*=mix(vec3(.92,.97,1.07),vec3(1.05,1.0,.92),smoothstep(.25,.85,lum));
  float g=h(vUv*res+time)*.5+n(vUv*res*.22)*.5;c*=.955+g*.075;
  c*=1.-smoothstep(.10,.55,r)*.42;
  c=mix(c,c*vec3(.86,.9,1.18),night*.3);
  gl_FragColor=vec4(max(c,0.),1.);}`};
let composer=null,gradePass=null,bloomPass=null;
(function initPost(){
  if(!THREE.EffectComposer||!THREE.UnrealBloomPass||!THREE.WebGLMultisampleRenderTarget)return;
  try{const sz=renderer.getDrawingBufferSize(new THREE.Vector2());
    const rt=new THREE.WebGLMultisampleRenderTarget(sz.x||2,sz.y||2,{format:THREE.RGBAFormat});
    composer=new THREE.EffectComposer(renderer,rt);composer.addPass(new THREE.RenderPass(scene,camera));
    bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.3,.6,.93);composer.addPass(bloomPass);
    gradePass=new THREE.ShaderPass(GradeShader);composer.addPass(gradePass);
    document.getElementById('vig').style.display='none'}catch(e){composer=null}
})();

const grad=(()=>{const d=new Uint8Array([100,152,205,244]);const t=new THREE.DataTexture(d,4,1,THREE.LuminanceFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t})();
const M=(c,o)=>{o=Object.assign({color:c,gradientMap:grad},o||{});delete o.flatShading;const m=new THREE.MeshToonMaterial(o);
  m.onBeforeCompile=sh=>{sh.fragmentShader=sh.fragmentShader.replace('#include <dithering_fragment>','\nfloat rim=pow(1.0-clamp(dot(normalize(normal),normalize(vViewPosition)),0.,1.),2.6);gl_FragColor.rgb+=rim*vec3(1.,.92,.78)*.24;\n#include <dithering_fragment>')};return m};
const outlineMat=new THREE.MeshBasicMaterial({color:0x2b3a5c,side:THREE.BackSide});
const outline=(m,s)=>{const o=new THREE.Mesh(m.geometry,outlineMat);m.geometry.computeBoundingSphere();const r=Math.max(m.geometry.boundingSphere.radius,.05);o.scale.setScalar(1+Math.min((s||1.08)-1,.02/r));m.add(o);return m};
const shadowed=(o,c,r)=>{o.traverse(m=>{if(m.isMesh&&m.material!==outlineMat){m.castShadow=c!==false;m.receiveShadow=r!==false}});return o};

/* ============ texturas procedurales ============ */
const grassTex=(()=>{const c=cvs(512,512),g=c.getContext('2d');
  for(let i=0;i<8;i++){g.fillStyle=i%2?'#7fcb63':'#8ed46c';g.fillRect(i*64,0,64,512)}
  for(let i=0;i<260;i++){const x=Math.random()*512,y=Math.random()*512,r=10+Math.random()*34;const gr=g.createRadialGradient(x,y,0,x,y,r);const l=Math.random()<.5;gr.addColorStop(0,l?'rgba(190,240,130,.16)':'rgba(40,120,70,.12)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
  g.lineWidth=1.4;for(let i=0;i<1800;i++){const x=Math.random()*512,y=Math.random()*512;g.strokeStyle=Math.random()<.5?'rgba(60,140,70,.35)':'rgba(200,245,150,.35)';g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.random()*3-1.5,y-3-Math.random()*5);g.stroke()}
  return mkTex(c,1/8,1/8)})();
const sandCanvas=(()=>{const c=cvs(256,256),g=c.getContext('2d');g.fillStyle='#e8c58b';g.fillRect(0,0,256,256);
  for(let i=0;i<60;i++){const x=Math.random()*256,y=Math.random()*256,r=14+Math.random()*34;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,Math.random()<.5?'rgba(255,240,200,.16)':'rgba(220,180,120,.12)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
  for(let i=0;i<1600;i++){g.fillStyle=Math.random()<.5?'rgba(190,150,95,.5)':'rgba(255,250,225,.6)';g.fillRect(Math.random()*256,Math.random()*256,1.5,1.5)}
  return c})();
const sandMirror=(()=>{const c=cvs(512,512),g=c.getContext('2d');for(const[tx,ty,sx,sy] of [[0,0,1,1],[512,0,-1,1],[0,512,1,-1],[512,512,-1,-1]]){g.save();g.translate(tx,ty);g.scale(sx,sy);g.drawImage(sandCanvas,0,0);g.restore()}return c})();const sandTex=(rx)=>mkTex(sandMirror,rx/2,rx/2);
const chevTex=(()=>{const c=cvs(64,128),g=c.getContext('2d');g.fillStyle='#ff9a3d';g.fillRect(0,0,64,128);g.fillStyle='#ffd34d';g.fillRect(0,0,6,128);g.fillRect(58,0,6,128);
  g.strokeStyle='#fff6cf';g.lineWidth=10;g.lineJoin='round';g.lineCap='round';for(let i=0;i<2;i++){const y=22+i*64;g.beginPath();g.moveTo(14,y+26);g.lineTo(32,y);g.lineTo(50,y+26);g.stroke()}
  const t=mkTex(c);t.repeat.set(1,1);return t})();
const ballTex=(()=>{const c=cvs(256,128),g=c.getContext('2d');g.fillStyle='#fffaf0';g.fillRect(0,0,256,128);g.fillStyle='#1e6bff';g.fillRect(0,0,28,128);g.fillStyle='#ffc94d';g.fillRect(28,0,28,128);g.fillStyle='#ffc94d';g.fillRect(128,52,256,24);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t})();
const cupTex=(()=>{const c=cvs(128,128),g=c.getContext('2d');const gr=g.createRadialGradient(64,64,6,64,64,62);gr.addColorStop(0,'#05080f');gr.addColorStop(.7,'#101a2a');gr.addColorStop(.88,'#2b3a5c');gr.addColorStop(.9,'#fff7e6');gr.addColorStop(1,'rgba(255,247,230,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const woodTex=(()=>{const c=cvs(128,128),g=c.getContext('2d');g.fillStyle='#d9a066';g.fillRect(0,0,128,128);for(let i=0;i<5;i++){g.fillStyle=i%2?'#c98d55':'#e2ae75';g.fillRect(0,i*25.6,128,24)}g.strokeStyle='rgba(120,70,30,.4)';g.lineWidth=1.2;for(let i=0;i<40;i++){const y=Math.random()*128,x=Math.random()*100;g.beginPath();g.moveTo(x,y);g.lineTo(x+20+Math.random()*20,y);g.stroke()}return mkTex(c)})();

const plankCanvas=(()=>{const c=cvs(128,64),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,128,64);g.fillStyle='rgba(120,90,60,.13)';g.fillRect(0,29,128,3);for(let i=0;i<260;i++){g.fillStyle='rgba(120,90,60,'+Math.random()*.12+')';g.fillRect(Math.random()*128,Math.random()*64,6+Math.random()*20,1)}g.fillStyle='rgba(255,255,255,.3)';g.fillRect(0,0,128,3);return c})();
const plankClone=L=>{const t=new THREE.CanvasTexture(plankCanvas);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(Math.max(1,L/2.2),1);t.anisotropy=4;return t};
const aoTex=(()=>{const c=cvs(4,64),g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,64);gr.addColorStop(0,'rgba(20,70,50,0)');gr.addColorStop(.5,'rgba(20,70,50,.6)');gr.addColorStop(1,'rgba(20,70,50,0)');g.fillStyle=gr;g.fillRect(0,0,4,64);return new THREE.CanvasTexture(c)})();
const radTex=(col,a)=>{const c=cvs(64,64),g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(.5,`rgba(${col},${a*.35})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)};
const blobTex=radTex('20,30,50',.7),glowTex=radTex('255,255,255',1);
const bandTex=(()=>{const c=cvs(64,256),g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#5aa85a');gr.addColorStop(.05,'#4d9a52');gr.addColorStop(.07,'#c0623e');gr.addColorStop(.45,'#a4543a');gr.addColorStop(.75,'#6a4a44');gr.addColorStop(1,'#443c4a');g.fillStyle=gr;g.fillRect(0,0,64,256);
  for(let i=0;i<500;i++){g.fillStyle=Math.random()<.5?'rgba(70,50,40,.18)':'rgba(255,240,210,.18)';g.fillRect(Math.random()*64,Math.random()*256,4+Math.random()*14,1+Math.random()*2)}return mkTex(c,7,1)})();
const lampMat=new THREE.MeshBasicMaterial({color:0xfff2c8});
const islandTex=(()=>{const c=cvs(512,512),g=c.getContext('2d');const gr=g.createRadialGradient(256,256,0,256,256,256);gr.addColorStop(0,'#5cc46c');gr.addColorStop(.62,'#4fb35f');gr.addColorStop(.74,'#a9c97a');gr.addColorStop(.80,'#ecd3a0');gr.addColorStop(.95,'#e2c08a');gr.addColorStop(1,'#bfa17a');g.fillStyle=gr;g.fillRect(0,0,512,512);
  for(let i=0;i<500;i++){const x=Math.random()*512,y=Math.random()*512,r=6+Math.random()*26,d=Math.hypot(x-256,y-256)/256,gg=g.createRadialGradient(x,y,0,x,y,r),gn=d<.72;gg.addColorStop(0,gn?(Math.random()<.5?'rgba(120,220,120,.22)':'rgba(30,110,60,.2)'):(Math.random()<.5?'rgba(255,240,200,.2)':'rgba(190,150,100,.15)'));gg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gg;g.fillRect(x-r,y-r,r*2,r*2)}
  for(let i=0;i<4500;i++){const x=Math.random()*512,y=Math.random()*512,d=Math.hypot(x-256,y-256)/256;if(d>1)continue;g.fillStyle=d<.72?(Math.random()<.5?'rgba(40,120,60,.5)':'rgba(170,240,140,.4)'):(Math.random()<.5?'rgba(190,150,95,.45)':'rgba(255,250,225,.5)');g.fillRect(x,y,1.6,1.6)}

  id.forEach((i,k)=>{const p=P.P[i],a=P.P[Math.max(0,i-1)],b=P.P[Math.min(P.P.length-1,i+1)];let tx=b[0]-a[0],ty=b[1]-a[1],tz=b[2]-a[2];const tl=Math.hypot(tx,ty,tz)||1;
    const n=loopNrm(sx,sz,tx/tl,ty/tl,tz/tl);
    for(let j=0;j<=N;j++){const th=-1.9+3.8*j/N,sn=Math.sin(th),cs=1-Math.cos(th);pos.push(p[0]+n[0]*R*cs+sx*R*sn,p[1]+n[1]*R*cs,p[2]+n[2]*R*cs+sz*R*sn);uv.push(j/N,P.s[i]/1.1)}
    for(const [arr,sg] of[[rimA,-1],[rimB,1]]){const sn=Math.sin(1.9)*sg,cs=1-Math.cos(1.9);arr.push(new THREE.Vector3(p[0]+n[0]*R*cs+sx*R*sn,p[1]+n[1]*R*cs,p[2]+n[2]*R*cs+sz*R*sn))}
    if(k){const o=(k-1)*(N+1);for(let j=0;j<N;j++)ix.push(o+j,o+j+N+1,o+j+1,o+j+1,o+j+N+1,o+j+N+2)}});
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(ix);geo.computeVertexNormals();
  const tx=rampTex.clone();tx.needsUpdate=true;tx.repeat.set(1,.5);const g=new THREE.Group(),m=new THREE.Mesh(geo,M(0xffffff,{map:tx,side:THREE.DoubleSide}));m.castShadow=true;g.add(m);
  for(const rim of[rimA,rimB]){const t=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rim),rim.length*2,.06,6,false),M(0xffc94d));g.add(t)}
  return g}

  for(const s of[-1,1]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.14,14).rotateZ(Math.PI/2),M(0xef6f5a));wh.position.set(s*.62,.32,L*.55);outline(wh,1.05);g.add(wh);
    const hb=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.18,8).rotateZ(Math.PI/2),M(0xffc94d));hb.position.set(s*.7,.32,L*.55);g.add(hb)}

  for(const z of[.15,.5,.85]){const r=new THREE.Mesh(new THREE.TorusGeometry(.4,.06,6,16),M(0x2fb7a8));r.position.set(0,.62+(z-.5)*L*Math.sin(.32),L*z);r.rotation.x=-.32;g.add(r)}
  const fun=new THREE.Mesh(new THREE.ConeGeometry(.62,.55,16,1,true).rotateX(-Math.PI/2),M(0xd9b45a,{side:THREE.DoubleSide}));fun.position.set(0,.28,-.05);g.add(fun);

  g.position.set(T.mx,0,T.mz);g.rotation.y=Math.atan2(T.ex,T.ez);shadowed(g);return g}
function buildObs(){
  for(const o of HD.waves||[]){const tx=waveTex.clone();tx.needsUpdate=true;const m=new THREE.Mesh(new THREE.PlaneGeometry(o.w,o.l).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:tx,transparent:true,opacity:.85,depthWrite:false}));
    m.position.set(o.x,.025,o.z);m.rotation.y=Math.atan2(-o.dz,o.dx)+Math.PI/2;course.add(m);dyn.push({t:'wave',m,tx,o})}
  for(const o of HD.streams||[]){const tx=streamTex.clone();tx.needsUpdate=true;tx.repeat.set(1,o.l/1.2);const m=new THREE.Mesh(new THREE.PlaneGeometry(o.w,o.l).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:tx,transparent:true,opacity:.92,depthWrite:false}));
    m.position.set(o.x,.024,o.z);m.rotation.y=Math.atan2(-o.dx,-o.dz);course.add(m);dyn.push({t:'stream',tx});

    const fx=new THREE.Mesh(new THREE.PlaneGeometry(o.w*.8,1.1),new THREE.MeshBasicMaterial({map:tx,transparent:true,opacity:.8,depthWrite:false,side:THREE.DoubleSide}));fx.position.set(o.x-o.dx*(o.l/2+.15),.55,o.z-o.dz*(o.l/2+.15));fx.rotation.y=Math.atan2(o.dx,o.dz);fx.rotation.x=-.15;course.add(fx);
    const fo=new THREE.Mesh(new THREE.RingGeometry(.2,.55,14).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55,depthWrite:false}));fo.position.set(o.x-o.dx*(o.l/2-.3),.04,o.z-o.dz*(o.l/2-.3));course.add(fo);dyn.push({t:'foam',m:fo})}
  // terraza elevada
  if(HD.deck){const D=HD.deck,dy=D.y,sh=new THREE.Shape();D.poly.forEach((p,i)=>i?sh.lineTo(p[0],-p[1]):sh.moveTo(p[0],-p[1]));
    const eg=new THREE.ExtrudeGeometry(sh,{depth:dy,bevelEnabled:false});eg.rotateX(-Math.PI/2);const dm=new THREE.Mesh(eg,[M(0xe2b57a,{map:deckTex}),M(0x9d8672)]);dm.castShadow=dm.receiveShadow=true;course.add(dm);
    const cross=[];for(const T of HD.tracks||[]){if(T.lv!==1)continue;for(const q of T.A.P){if(!inPoly(D.poly,q[0],q[2])){cross.push([q[0],q[2]]);break}}}
    D.poly.forEach((p,i)=>{const q=D.poly[(i+1)%D.poly.length],dx=q[0]-p[0],dz=q[1]-p[1],L=Math.hypot(dx,dz);let nx=dz/L,nz=-dx/L;if(!inPoly(D.poly,(p[0]+q[0])/2+nx*.1,(p[1]+q[1])/2+nz*.1)){nx=-nx;nz=-nz}
      let gaps=[];for(const c of cross)if(segDist(c[0],c[1],p[0],p[1],q[0],q[1])<.6){const t=((c[0]-p[0])*dx+(c[1]-p[1])*dz)/(L*L);gaps.push([t-.75/L,t+.75/L])}
      const inGap=t=>gaps.some(gp=>t>gp[0]&&t<gp[1]);const n=Math.max(2,Math.round(L/1.0));
      for(let k=0;k<=n;k++){const t=k/n;if(inGap(t))continue;const po=new THREE.Mesh(new THREE.CylinderGeometry(.07,.08,.62,7),M(0x9a7a45));po.position.set(p[0]+dx*t+nx*.12,dy+.31,p[1]+dz*t+nz*.12);po.castShadow=true;course.add(po)}
      const pieces=[];let t0=0;gaps.sort((a,b)=>a[0]-b[0]).forEach(gp=>{pieces.push([t0,clamp(gp[0],0,1)]);t0=clamp(gp[1],0,1)});pieces.push([t0,1]);
      for(const pc of pieces){if(pc[1]-pc[0]<.02)continue;const ll=(pc[1]-pc[0])*L,cx=p[0]+dx*(pc[0]+pc[1])/2+nx*.12,cz=p[1]+dz*(pc[0]+pc[1])/2+nz*.12;
        for(const hy of[.28,.56]){const r=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,ll,7).rotateZ(Math.PI/2),M(0xd9b45a,{map:bambooTex}));r.position.set(cx,dy+hy,cz);r.rotation.y=-Math.atan2(dz,dx);r.castShadow=true;course.add(r)}}});
    for(let i=0;i<6;i++){const a=srand()*6.28,R=.4+srand()*.3,rk=makeRock(R);const p=D.poly[i%D.poly.length];rk.position.set(p[0]+Math.cos(a)*.3,0,p[1]+Math.sin(a)*.3);course.add(rk)}}
  // crestas de roca (los túneles pasan por debajo)
  for(const k of HD.blocks||[]){const w=k.x1-k.x0,d=k.z1-k.z0,dark=k.t==='lava';const b=new THREE.Mesh(new THREE.BoxGeometry(w+.2,.8,d+.2),M(dark?0x4a3e40:0x9a8e84));b.position.set((k.x0+k.x1)/2,.4,(k.z0+k.z1)/2);outline(b,1.02);shadowed(b);course.add(b);
    const tp=new THREE.Mesh(new THREE.BoxGeometry(w+.1,.12,d+.1),M(dark?0x2c2426:0x5fae5a));tp.position.set(b.position.x,.84,b.position.z);course.add(tp);
    const n=Math.max(2,Math.round(w*d/2.2));for(let i=0;i<n;i++){const rk=makeRock(sr(.3,.55));if(dark)rk.traverse(m=>{if(m.isMesh&&m.material!==outlineMat)m.material.color.set(0x3a3234)});rk.position.set(sr(k.x0+.3,k.x1-.3),.78,sr(k.z0+.2,k.z1-.2));shadowed(rk);course.add(rk)}
    if(!dark)for(let i=0;i<Math.round(w/1.6);i++){const f=new THREE.Mesh(new THREE.ConeGeometry(.2,.55,5),M(0x3ea35c));f.position.set(sr(k.x0+.2,k.x1-.2),1.05,sr(k.z0,k.z1));f.rotation.set(sr(-.4,.4),0,sr(-.4,.4));course.add(f)}
    else{const gl=new THREE.Mesh(new THREE.BoxGeometry(w*.8,.04,.12),new THREE.MeshBasicMaterial({color:0xff6a2a}));gl.position.set(b.position.x,.91,b.position.z);course.add(gl)}}
  // rampas
  for(const o of HD.ramps||[]){const sh=new THREE.Shape();sh.moveTo(-o.l/2,0);sh.lineTo(o.l/2,0);sh.lineTo(o.l/2,o.h);sh.closePath();const eg=new THREE.ExtrudeGeometry(sh,{depth:o.w,bevelEnabled:false});eg.translate(0,0,-o.w/2);
    const tx=rampTex.clone();tx.needsUpdate=true;tx.repeat.set(.5,.5);const g=new THREE.Group(),m=new THREE.Mesh(eg,[M(0xffc94d),M(0xffffff,{map:tx})]);m.castShadow=m.receiveShadow=true;outline(m,1.02);g.add(m);
    const lip=new THREE.Mesh(new THREE.BoxGeometry(.14,.1,o.w+.04),M(0xfff7e6));lip.position.set(o.l/2-.07,o.h+.03,0);g.add(lip);
    for(const s of[-1,1]){const f=new THREE.Mesh(new THREE.ConeGeometry(.12,.4,8),M(0xef6f5a));f.position.set(o.l/2,o.h+.25,s*(o.w/2+.08));g.add(f)}
    g.position.set(o.x,0,o.z);g.rotation.y=Math.atan2(-o.dz,o.dx);course.add(g)}
  // balancines
  for(const o of HD.saws||[]){const g=new THREE.Group();g.position.set(o.x,0,o.z);g.rotation.y=Math.atan2(-o.dz,o.dx);
    for(const s of[-1,1]){for(const k of[-1,1]){const lg=new THREE.Mesh(new THREE.BoxGeometry(.12,o.h*1.15,.12),M(0x8a5a35));lg.position.set(k*o.h*.22,o.h*.5,s*(o.w/2+.14));lg.rotation.z=-k*.38;lg.castShadow=true;g.add(lg)}}
    const ax=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,o.w+.5,10).rotateX(Math.PI/2),M(0xffc94d));ax.position.y=o.h;g.add(ax);
    const pv=new THREE.Group();pv.position.y=o.h;g.add(pv);const n=Math.max(4,Math.round(o.l/.7));
    for(let i=0;i<n;i++){const pl=new THREE.Mesh(new THREE.BoxGeometry(o.l/n*.96,.12,o.w),M(i%2?0xd49a5e:0xe2ae75));pl.position.set(-o.l/2+o.l/n*(i+.5),-.06,0);pl.castShadow=pl.receiveShadow=true;pv.add(pl)}
    for(const s of[-1,1]){const tr=new THREE.Mesh(new THREE.BoxGeometry(o.l,.06,.07),M(0xef6f5a));tr.position.set(0,0,s*o.w/2);pv.add(tr)}
    for(const s of[-1,1]){const st=new THREE.Mesh(new THREE.BoxGeometry(.1,.14,o.w),M(0x2fb7a8));st.position.set(s*(o.l/2-.05),-.13,0);pv.add(st)}
    course.add(g);dyn.push({t:'saw',m:pv,o})}
  // tubos
  for(const T of HD.tracks||[]){const sc=T.sc||1;
    if(T.kind==='slide'){course.add(slideMesh(T.A));
      for(let u=.6;u<T.A.L-.5;u+=1.3){const q=pAt(T.A,u);if(q.y<.45||(HD.deck&&inPoly(HD.deck.poly,q.x,q.z)))continue;const po=new THREE.Mesh(new THREE.CylinderGeometry(.06,.07,q.y,6),M(0x9a7a45));po.position.set(q.x,q.y/2,q.z);po.castShadow=true;course.add(po)}
      if(T.pole){let my=0;for(const q of T.A.P)my=Math.max(my,q[1]);const pl=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,my+1.3,10),M(0xd9b45a,{map:bambooTex}));pl.position.set(T.pole[0],(my+1.3)/2,T.pole[1]);outline(pl,1.04);shadowed(pl);course.add(pl);
        const rf=new THREE.Mesh(new THREE.ConeGeometry(1.3,.9,10),M(0xc9a24a));rf.position.set(T.pole[0],my+1.7,T.pole[1]);outline(rf,1.04);shadowed(rf);course.add(rf)}
      const nx=-T.ez,nz=T.ex,y0=HD.deck&&T.lv===1?HD.deck.y:0;for(const s of[-1,1]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1.5,6),M(0xd9b45a,{map:bambooTex}));p.position.set(T.mx+nx*s*.65,y0+.75,T.mz+nz*s*.65);course.add(p)}
      const bar=new THREE.Mesh(new THREE.BoxGeometry(1.6,.28,.08),M(0xef6f5a));bar.position.set(T.mx,y0+1.45,T.mz);bar.rotation.y=Math.atan2(-T.ez,T.ex)+Math.PI/2;outline(bar,1.04);course.add(bar);continue}
    if(T.kind==='loop'){course.add(loopMesh(T.A));for(let u=1.6;u<T.A.L-1.6;u+=1.1){const q=pAt(T.A,u);if(q.y<.3)continue;const po=new THREE.Mesh(new THREE.CylinderGeometry(.05,.06,q.y,6),M(0x9a7a45));po.position.set(q.x,q.y/2,q.z);course.add(po)}continue}

      const gl=new THREE.Mesh(new THREE.SphereGeometry(.9,12,8),new THREE.MeshBasicMaterial({color:0xff7a2a,transparent:true,opacity:.3,depthWrite:false,blending:THREE.AdditiveBlending}));gl.position.set(T.cx,ch+.1,T.cz);course.add(gl);
      for(let i=0;i<5;i++){const a=i*1.26+.4,d=new THREE.Mesh(new THREE.BoxGeometry(.16,.9,.08),new THREE.MeshBasicMaterial({color:i%2?0xff7a2a:0xffb347}));d.position.set(T.cx+Math.cos(a)*1.05*cr/1.9,ch*.78,T.cz+Math.sin(a)*1.05*cr/1.9);d.lookAt(T.cx,ch*.78,T.cz);d.rotateX(-.5);course.add(d)}

    course.add(tubeMesh(T.A,T.col?0x6a5e60:0xd9b45a,.34));if(T.B)course.add(tubeMesh(T.B,T.col?0x6a5e60:0xc9a24a,.34))}
}

const course=new THREE.Group();scene.add(course);
let dyn=[],cupFlag=null,cupPos=new THREE.Vector3(),bboxC={x:0,z:0},bboxExt=16,platR=12;
function clearCourse(){course.traverse(o=>{if(o.geometry&&!o.userData.keep)o.geometry.dispose();if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if(m!==outlineMat)m.dispose()})}});while(course.children.length)course.remove(course.children[0]);dyn=[]}
function makePalm(h,lean){const g=new THREE.Group(),tm=M(0xb98a5a);const seg=5;
  for(let i=0;i<seg;i++){const t=(i+.5)/seg,x=lean*t*t*h*.5,y=t*h;const c=new THREE.Mesh(new THREE.CylinderGeometry(.15-.02*i*.6,.19-.02*i*.6,h/seg*1.08,7),tm);c.position.set(x,y,0);c.rotation.z=-Math.atan(lean*t);g.add(c)}
  const crown=new THREE.Group();crown.position.set(lean*h*.5,h,0);g.add(crown);
  for(let i=0;i<8;i++){const pv=new THREE.Group();pv.rotation.y=i/8*Math.PI*2;const l=new THREE.Mesh(new THREE.SphereGeometry(1,8,5),M(i%2?0x4fb96a:0x3ea35c));l.scale.set(1.25,.09,.3);l.position.x=1.0;pv.rotation.z=0;const lp=new THREE.Group();lp.rotation.z=-.42;lp.add(l);pv.add(lp);crown.add(pv)}
  for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),M(0x7a4a2a));c.position.set(Math.cos(i*2.1)*.2,-.15,Math.sin(i*2.1)*.2);crown.add(c)}
  g.userData.crown=crown;return g}
function makeRock(r){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(r,0),M(0xbdb4d0,{flatShading:true}));m.scale.y=.85;m.position.y=r*.6;m.rotation.set(Math.random(),Math.random()*6,Math.random()*.5);outline(m,1.1);const g=new THREE.Group();g.add(m);
  const m2=new THREE.Mesh(new THREE.DodecahedronGeometry(r*.5,0),M(0xa79cc0,{flatShading:true}));m2.position.set(r*.8,r*.25,r*.3);g.add(m2);return g}
function makeBarrel(r){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.05,.85,16),M(0xef6f5a));b.position.y=.42;outline(b,1.07);g.add(b);
  for(const y of[.25,.6]){const t=new THREE.Mesh(new THREE.TorusGeometry(r*1.02,.06,6,20),M(0xfff7e6));t.rotation.x=Math.PI/2;t.position.y=y;g.add(t)}
  const top=new THREE.Mesh(new THREE.CylinderGeometry(r*.7,r*.7,.08,16),M(0xffd34d));top.position.y=.88;g.add(top);
  const gl=new THREE.Mesh(new THREE.RingGeometry(r*1.15,r*1.45,24),new THREE.MeshBasicMaterial({color:0xffd34d,transparent:true,opacity:.55,side:THREE.DoubleSide}));gl.rotation.x=-Math.PI/2;gl.position.y=.03;g.add(gl);g.userData.glow=gl;return g}
function makeTower(r,light){const g=new THREE.Group();
  if(light){const cols=[0xef6f5a,0xfff7e6,0xef6f5a,0xfff7e6];for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(r*(.78-.1*i*.5),r*(.85-.1*i*.5),1.1,16),M(cols[i]));c.position.y=.55+i*1.1;g.add(c)}
    const l=new THREE.Mesh(new THREE.CylinderGeometry(r*.5,r*.5,.7,12),new THREE.MeshBasicMaterial({color:0xfff2a0}));l.position.y=4.75;g.add(l);g.userData.lamp=l;
    const roof=new THREE.Mesh(new THREE.ConeGeometry(r*.7,.8,12),M(0x2b3a5c));roof.position.y=5.5;g.add(roof)}
  else{const b=new THREE.Mesh(new THREE.CylinderGeometry(r*.65,r*.9,2.2,14),M(0xfff4e0));b.position.y=1.1;outline(b,1.05);g.add(b);const roof=new THREE.Mesh(new THREE.ConeGeometry(r*.85,.95,14),M(0xef6f5a));roof.position.y=2.65;outline(roof,1.06);g.add(roof);
    const door=new THREE.Mesh(new THREE.BoxGeometry(.3,.5,.1),M(0x8a5a35));door.position.set(0,.3,r*.88);g.add(door)}
  return g}
function makeRotor(r){const g=new THREE.Group();const n=r.arms/2;
  for(let j=0;j<n;j++){const arm=new THREE.Group();arm.rotation.y=-j*Math.PI/2;const segN=6,L=r.len*2/segN;
    for(let i=0;i<segN;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(L*1.01,.26,.2),M(r.t==='totem'?(i%2?0x2fb7a8:0x8a5a35):i%2?0xfff7e6:(r.t==='beam'?0xffc94d:0xef6f5a)));b.position.set(-r.len+L*(i+.5),.45,0);arm.add(b)}
    if(r.t==='mill'){for(const s of[-1,1]){const sail=new THREE.Mesh(new THREE.BoxGeometry(r.len*.8,.05,.55),M(s>0?0x2fb7a8:0xffc94d));sail.position.set(s*r.len*.55,.6,.0);arm.add(sail)}}

  if(!$('mpName').value)$('mpName').value=mpName||'Jugador';
  mpRender();
}
function mpPick(){
  const name=($('mpName')&&$('mpName').value||'').trim().slice(0,12)||'Jugador';mpName=name;try{localStorage.setItem('kauaigolf_name',name)}catch(e){}
  if(MP.host){const p=MP.players[0];p.name=name;p.b=prog.ball;mpLobbyBroadcast()}
  else mpSend({t:'pick',name,b:prog.ball,ready:MP.ready});
}
function mpLobbyData(){return MP.players.map(p=>({name:p.name,b:p.b,ready:!!p.ready}))}
function mpLobbyBroadcast(){
  MP.players.forEach((p,i)=>{if(p.conn&&p.conn.open){try{p.conn.send({t:'lobby',you:i,code:MP.code,tour:MP.tour,n:MP.n,players:mpLobbyData()})}catch(e){}}});
  mpRender();
}
const ballBg=i=>'url('+ballTexFor(i).image.toDataURL()+')';
const ballUrl={};function ballImg(i){return ballUrl[i]||(ballUrl[i]=ballBg(i))}
function mpRender(){
  if(MP.phase!=='lobby'||!$('mpLobby'))return;
  $('mpCode').textContent=MP.code||'----';
  $('mpList').innerHTML=MP.players.map((p,i)=>'<div class="mppl'+(i===MP.me?' me':'')+'"><i class="chip" style="background-image:'+ballImg(p.b|0)+'"></i><b>'+esc(p.name)+(i===MP.me?' (tú)':'')+'</b><em>'+(i===0?'Anfitrión':p.ready?'✅ ¡Listo!':'Eligiendo…')+'</em></div>').join('')
    +(MP.players.length<MAXP?'<div class="mppl empty">'+(MP.players.length<2?'Esperando jugadores… comparte el código':'Puede entrar alguien más (máx. '+MAXP+')')+'</div>':'');
  // bolas (solo las desbloqueadas en este móvil)
  const bl=$('mpBalls');if(!bl.children.length||bl.dataset.sel!=String(prog.ball)||bl.dataset.lk!=String(MP.ready)){bl.innerHTML='';bl.dataset.sel=prog.ball;bl.dataset.lk=MP.ready;
    BALLS.forEach((o,i)=>{if(!ballOpen(i))return;const c=document.createElement('button');c.className='chip'+(prog.ball===i?' sel':'');c.title=o.n;c.style.backgroundImage=ballImg(i);
      c.onclick=()=>{if(MP.ready)return;S.ui();prog.ball=i;saveProg();applyBall(i);mpPick();mpRender()};bl.appendChild(c)})}
  bl.classList.toggle('lock',MP.ready);$('mpName').disabled=MP.ready;
  // torneo y hoyos (lo elige el anfitrión)
  const cp=$('mpCopa'),ln=$('mpLen');
  if(MP.host){
    cp.innerHTML=TOURS.map((o,t)=>tourOpen(t)?'<button class="btn mpopt'+(MP.tour===t?' sel':'')+'" data-t="'+t+'"><i style="background:'+o.col+'"></i>'+o.name+'</button>':'').join('');
    if(!mpLens(MP.tour).includes(MP.n))MP.n=Math.min(9,(TOURS[MP.tour]||TOURS[0]).h.length);ln.innerHTML=mpLens(MP.tour).map(n=>'<button class="btn mpopt'+(MP.n===n?' sel':'')+'" data-n="'+n+'">'+n+' hoyos</button>').join('');
    cp.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.ui();MP.tour=+b.dataset.t;mpLobbyBroadcast()});
    ln.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.ui();MP.n=+b.dataset.n;mpLobbyBroadcast()});
  }else{
    const o=TOURS[MP.tour]||TOURS[0];cp.innerHTML='<div class="mpsel"><i style="background:'+o.col+'"></i>'+o.name+' · '+MP.n+' hoyos</div>';ln.innerHTML='';
  }
  const rb=$('mpReady'),go=$('mpGo');
  if(MP.host){rb.style.display='none';go.style.display='';
    const others=MP.players.slice(1),allR=others.length>=1&&others.every(p=>p.ready);
    go.disabled=!allR;go.classList.toggle('off',!allR);
    go.textContent=others.length<1?'Esperando jugadores…':allR?'¡Empezar partida! ('+MP.players.length+')':'Esperando a que estén listos…';
    mpInfo('Cada jugador elige nombre y bola y pulsa «¡Listo!». Tú eliges el torneo y empiezas.');
  }else{go.style.display='none';rb.style.display='';rb.textContent=MP.ready?'✓ ¡Listo! (cambiar)':'¡Listo!';rb.classList.toggle('c2',MP.ready);
    mpInfo(MP.ready?'Esperando a que el anfitrión empiece la partida…':'Elige tu nombre y tu bola y pulsa «¡Listo!».')}
}
function mpGo(){
  if(!MP.host||$('mpGo').disabled)return;S.ui();mpPick();
  const pl=MP.players.map(p=>({name:p.name,b:p.b}));
  MP.players.forEach((p,i)=>{if(p.conn&&p.conn.open){try{p.conn.send({t:'lobby',you:i,code:MP.code,tour:MP.tour,n:MP.n,players:mpLobbyData()});p.conn.send({t:'start',tour:MP.tour,n:MP.n,players:pl})}catch(e){}}});
  mpBegin(MP.tour,MP.n,pl);
}
/* ---------- partida ---------- */
function mpBegin(tour,n,pl){
  MP.tour=tour;MP.n=n;MP.seq=TOURS[tour].h.slice(0,n);MP.first=MP.seq[0];MP.res={};MP.shown=-1;
  pl.forEach((q,i)=>{const p=MP.players[i]||(MP.players[i]={});p.name=q.name;p.b=q.b|0;p.left=false;p.h=-1;p.s='';p.x=p.z=0});
  MP.players.length=pl.length;MP.phase='game';
  closePanel();$('map').classList.remove('on');$('title').classList.remove('on');
  dailyMode=false;scores=[];runStart=totalStars();mpClearGhosts();mpBoard(true);startHole(MP.first);
}
function mpActive(){return MP.players.map((p,i)=>i).filter(i=>!MP.players[i].left)}
function mpTotal(i){let t=0,d=0;for(const h of MP.seq){const r=MP.res[h];if(r&&r[i]!=null){t+=r[i];d+=r[i]-HOLES[h].par}}return{t,d}}
function mpSendHole(s,pk){(MP.res[hIdx]=MP.res[hIdx]||{})[MP.me]=s;mpSend({t:'hole',h:hIdx,s,pk:pk?1:0});mpBoardRender();}
function mpAfterHole(){if(!MP.on||MP.phase!=='game'){showHoleCard();return}mpBoardRender();mpCheck()}
function mpCheck(){
  if(MP.phase!=='game'||MP.shown===hIdx)return;
  const r=MP.res[hIdx]||{};if(r[MP.me]==null||!(state==='done'||state==='sunk'))return;
  const wait=mpActive().filter(i=>r[i]==null);
  if(wait.length){$('mpWait').textContent='⏳ Esperando a '+wait.map(i=>MP.players[i].name).join(', ')+'…';$('mpWait').classList.add('on');return}
  $('mpWait').classList.remove('on');MP.shown=hIdx;
  const last=MP.seq.indexOf(hIdx)>=MP.seq.length-1;
  const rows=MP.players.map((p,i)=>({i,p,s:r[i],tot:mpTotal(i)})).filter(o=>o.s!=null||!o.p.left).sort((a,b)=>a.tot.t-b.tot.t||(a.s||99)-(b.s||99));
  if(last){mpFinal();return}
  let h='<div class="mp"><h2>Hoyo '+(MP.seq.indexOf(hIdx)+1)+' · '+HD.name+'</h2><p>Par '+HD.par+'</p><table><tr><th></th><th>Jugador</th><th>Hoyo</th><th>Total</th></tr>';
  rows.forEach((o,k)=>{const d=o.s!=null?o.s-HD.par:0;h+='<tr><td>'+(k+1)+'º</td><td style="text-align:left"><i class="chip mini" style="background-image:'+ballImg(o.p.b)+'"></i> '+esc(o.i===MP.me?'Tú':o.p.name)+'</td><td class="'+(d<0?'sc-good':d>0?'sc-bad':'')+'"><b>'+(o.s!=null?o.s:'—')+'</b></td><td><b>'+o.tot.t+'</b> <small>('+fmtD(o.tot.d)+')</small></td></tr>'});
  h+='</table><button class="btn big" id="mpNext">Siguiente hoyo ▶ <small id="mpCnt">5</small></button></div>';
  openPanel(h);let c=5;const go=()=>{clearInterval(MP.adv);if(MP.phase!=='game')return;closePanel();startHole(MP.seq[MP.seq.indexOf(hIdx)+1])};
  $('mpNext').onclick=()=>{S.ui();go()};
  clearInterval(MP.adv);MP.adv=setInterval(()=>{c--;const e=$('mpCnt');if(e)e.textContent=c;if(c<=0)go()},1000);
}
function mpFinal(){
  const rk=MP.players.map((p,i)=>({i,p,tot:mpTotal(i)})).filter(o=>!o.p.left||o.tot.t>0).sort((a,b)=>a.tot.t-b.tot.t);
  const top=rk[0],tie=rk.length>1&&rk[1].tot.t===top.tot.t&&rk.filter(o=>o.tot.t===top.tot.t).some(o=>o.i===MP.me);
  const med=['🥇','🥈','🥉','4º'];
  let h='<div class="mp"><h2>'+(tie?'¡Empate!':top.i===MP.me?'🏆 ¡Has ganado!':'¡Gana '+esc(top.p.name)+'!')+'</h2><p>'+TOURS[MP.tour].name+' · '+MP.n+' hoyos</p><table><tr><th></th><th>Jugador</th><th>Golpes</th><th>Par</th></tr>';
  rk.forEach((o,k)=>{const pos=rk.filter(q=>q.tot.t<o.tot.t).length;h+='<tr><td>'+(med[pos]||'')+'</td><td style="text-align:left"><i class="chip mini" style="background-image:'+ballImg(o.p.b)+'"></i> '+esc(o.i===MP.me?'Tú':o.p.name)+(o.p.left?' <small>(se fue)</small>':'')+'</td><td><b>'+o.tot.t+'</b></td><td class="'+(o.tot.d<0?'sc-good':o.tot.d>0?'sc-bad':'')+'">'+fmtD(o.tot.d)+'</td></tr>'});
  h+='</table><button class="btn big" id="mpAgain">Volver a la sala</button><br><button class="btn big c2" id="mpOut" style="font-size:16px;padding:8px 22px">Salir</button></div>';
  openPanel(h);state='final';S.hole(true);burst(cupPos.x,.5,cupPos.z,80,[0xff6b6b,0xffd34d,0x4cd8c0,0x6aa8ff,0xff9ae0],6,9,.12,1.6,14);
  $('mpAgain').onclick=()=>{S.ui();$('mpAgain').textContent='Volviendo…';if(MP.host)mpHostLobby();else mpSend({t:'tolobby'})};
  $('mpOut').onclick=()=>{S.ui();mpLeave();closePanel();toMap()};
}
function mpHostLobby(){
  MP.players=MP.players.filter((p,i)=>i===0||(!p.left&&p.conn&&p.conn.open));
  MP.players.forEach(p=>{p.ready=false});MP.me=0;
  MP.players.forEach(p=>{if(p.conn&&p.conn.open){try{p.conn.send({t:'lobbyshow'})}catch(e){}}});
  mpPanel();mpShowLobby();mpLobbyBroadcast();
}
/* ---------- bolas de los demás ---------- */
function mpGhost(i){
  const p=MP.players[i];let g=MP.ghosts[i];
  if(g&&g.b===p.b)return g;
  if(g){scene.remove(g.m);scene.remove(g.sp);scene.remove(g.sh)}
  const m=new THREE.Mesh(new THREE.SphereGeometry(BR,24,16),new THREE.MeshStandardMaterial({map:ballTexFor(p.b),roughness:.3}));m.scale.setScalar(1.2);outline(m,1.1);scene.add(m);
  const c=cvs(256,72),x=c.getContext('2d');x.font='bold 34px Fredoka,Trebuchet MS,sans-serif';const w=Math.min(240,x.measureText(p.name).width+30);
  x.fillStyle='rgba(255,248,232,.95)';x.strokeStyle='#2b3a5c';x.lineWidth=5;const r=18,x0=(256-w)/2;x.beginPath();x.moveTo(x0+r,8);x.arcTo(x0+w,8,x0+w,60,r);x.arcTo(x0+w,60,x0,60,r);x.arcTo(x0,60,x0,8,r);x.arcTo(x0,8,x0+w,8,r);x.closePath();x.fill();x.stroke();
  x.fillStyle='#2b3a5c';x.textAlign='center';x.textBaseline='middle';x.fillText(p.name,128,35);
  const tx=new THREE.CanvasTexture(c),sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false,transparent:true}));sp.scale.set(1.7,.48,1);sp.renderOrder=999;scene.add(sp);
  const sh=new THREE.Mesh(new THREE.CircleGeometry(BR*1.1,20).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.22,depthWrite:false}));scene.add(sh);
  g={m,sp,sh,b:p.b,x:p.x,z:p.z};MP.ghosts[i]=g;return g;
}
function mpClearGhosts(){Object.values(MP.ghosts).forEach(g=>{scene.remove(g.m);scene.remove(g.sp);scene.remove(g.sh)});MP.ghosts={}}
function mpTick(dt){
  if(MP.phase!=='game')return;
  MP.sendT+=dt;const key=B.x.toFixed(2)+','+B.z.toFixed(2)+','+(B.y||0).toFixed(2)+','+state+','+hIdx;
  if(MP.sendT>.08&&key!==MP.last||MP.sendT>1.5){MP.sendT=0;MP.last=key;mpSend({t:'pos',x:+B.x.toFixed(3),z:+B.z.toFixed(3),y:+(B.y||0).toFixed(2),s:state,h:hIdx})}
  MP.players.forEach((p,i)=>{
    if(i===MP.me)return;
    const vis=!p.left&&p.h===hIdx&&state!=='title'&&state!=='final'&&p.s!=='sunk'&&p.s!=='done'&&p.s!=='final'&&p.s!=='fly'&&p.s!=='title';
    const g=vis?mpGhost(i):MP.ghosts[i];if(!g)return;
    g.m.visible=g.sp.visible=g.sh.visible=vis;if(!vis)return;
    const f=Math.min(1,dt*12);if(Math.hypot(p.x-g.x,p.z-g.z)>6){g.x=p.x;g.z=p.z}else{g.x+=(p.x-g.x)*f;g.z+=(p.z-g.z)*f}
    const y=p.s==='sink'?BR*.4:p.s==='water'?0:BR*1.2+(p.y||0);
    g.m.position.set(g.x,y,g.z);g.sh.position.set(g.x,.03,g.z);g.sp.position.set(g.x,1.15,g.z);
  });
}
/* ---------- marcador lateral ---------- */
function mpBoard(on){$('mpBoard').classList.toggle('on',!!on);$('mpWait').classList.remove('on');if(on)mpBoardRender()}
function mpBoardRender(){
  if(MP.phase!=='game')return;
  const r=MP.res[hIdx]||{};
  $('mpBoard').innerHTML=MP.players.map((p,i)=>{const t=mpTotal(i);return '<div class="'+(i===MP.me?'me':'')+(p.left?' gone':'')+'"><i class="chip mini" style="background-image:'+ballImg(p.b)+'"></i><b>'+esc(i===MP.me?'Tú':p.name)+'</b><span>'+(r[i]!=null?'✓ '+r[i]:'⛳')+'</span><em>'+fmtD(t.d)+'</em></div>'}).join('');
}
/* ---------- mensajes ---------- */
function mpHandle(m){
  if(!m||!m.t)return;
  if(m.t==='lobby'){MP.me=m.you;MP.code=m.code||MP.code;MP.tour=m.tour|0;MP.n=m.n||9;
    const keep=MP.players;MP.players=m.players.map((q,i)=>Object.assign(keep[i]||{},{name:q.name,b:q.b|0,ready:q.ready}));
    if(MP.phase!=='lobby'&&MP.phase!=='game')mpShowLobby();else mpRender();return}
  if(m.t==='lobbyshow'){mpPanel();mpShowLobby();return}
  if(m.t==='start'){mpBegin(m.tour|0,m.n||9,m.players);return}
  if(m.t==='full'){MP.on=false;mpInfo(m.why||'La sala está llena.');return}
  if(MP.phase!=='game')return;
  const p=MP.players[m.from];if(!p)return;
  if(m.t==='pos'){p.x=m.x;p.z=m.z;p.y=m.y||0;p.s=m.s;p.h=m.h}
  else if(m.t==='hole'){(MP.res[m.h]=MP.res[m.h]||{})[m.from]=m.s;p.s='done';p.h=m.h;
    if(m.h===hIdx&&state!=='done'&&state!=='final')toast(p.name+': '+(m.pk?'recogida':scoreName(m.s,HOLES[m.h].par)),m.s+' golpes',1300);
    mpBoardRender();mpCheck()}
  else if(m.t==='left')mpLeft(m.seat);
}
function mpLeft(i){const p=MP.players[i];if(!p||p.left)return;p.left=true;const g=MP.ghosts[i];if(g){g.m.visible=g.sp.visible=g.sh.visible=false}
  if(MP.phase==='game'){toast(p.name,'se ha ido de la partida',1500);mpBoardRender();mpCheck()}}
function mpHostData(conn,m){
  if(!m||!m.t)return;const i=MP.players.findIndex(p=>p.conn===conn);if(i<0)return;m.from=i;
  if(m.t==='pick'){const p=MP.players[i];p.name=String(m.name||'').slice(0,12)||'Jugador';p.b=clamp(m.b|0,0,BALLS.length-1);p.ready=!!m.ready;mpLobbyBroadcast();return}
  if(m.t==='tolobby'){if(MP.phase==='game')mpHostLobby();return}
  mpRelay(m,conn);mpHandle(m);
}
function mpCreate(attempt){
  mpInfo('Conectando…');
  mpLoadLib(ok=>{
    if(!ok){mpInfo('No se pudo cargar el modo online. Revisa tu conexión.');return}
    const L='ABCDEFGHJKLMNPQRSTUVWXYZ',code=[0,1,2,3].map(()=>L[Math.floor(Math.random()*L.length)]).join('');
    let peer;try{peer=new Peer('kauaigolf-'+code,window.MG_PEER_OPTS||{})}catch(e){mpInfo('Error al crear la sala.');return}
    MP.peer=peer;
    peer.on('open',()=>{MP.on=true;MP.host=true;MP.me=0;MP.code=code;MP.tour=Math.min(MP.tour,TOURS.length-1);if(!tourOpen(MP.tour))MP.tour=0;
      MP.players=[{name:($('mpName')&&$('mpName').value||mpName||'Anfitrión').slice(0,12),b:prog.ball,ready:true,conn:null}];mpShowLobby();mpLobbyBroadcast()});
    peer.on('error',e=>{if(e&&e.type==='unavailable-id'&&(attempt||0)<4){try{peer.destroy()}catch(_){}mpCreate((attempt||0)+1)}else if(MP.phase!=='game')mpInfo('Error de conexión ('+(e&&e.type||'?')+'). Inténtalo de nuevo.')});
    peer.on('connection',conn=>{
      conn.on('open',()=>{
        if(MP.phase!=='lobby'||MP.players.length>=MAXP){try{conn.send({t:'full',why:MP.phase!=='lobby'?'La partida ya ha empezado. Espera a la siguiente.':'La sala está llena (máximo '+MAXP+').'})}catch(e){}setTimeout(()=>{try{conn.close()}catch(e){}},400);return}
        MP.players.push({name:'Jugador '+(MP.players.length+1),b:0,ready:false,conn});S.ui();mpLobbyBroadcast()});
      conn.on('data',m=>mpHostData(conn,m));
      conn.on('close',()=>{const i=MP.players.findIndex(p=>p.conn===conn);if(i<0)return;
        if(MP.phase==='lobby'){MP.players.splice(i,1);mpLobbyBroadcast();return}
        if(MP.phase==='game'){mpRelay({t:'left',seat:i,from:0},conn);mpLeft(i)}});
    });
  });
}
function mpJoin(){
  const code=($('mpIn').value||'').trim().toUpperCase();if(code.length!==4){mpInfo('Escribe el código de 4 letras.');return}
  mpInfo('Conectando…');
  mpLoadLib(ok=>{
    if(!ok){mpInfo('No se pudo cargar el modo online. Revisa tu conexión.');return}
    let peer;try{peer=new Peer(window.MG_PEER_OPTS||{})}catch(e){mpInfo('Error de conexión.');return}
    MP.peer=peer;let done=false;const fail=t=>{if(done)return;done=true;mpInfo(t);try{peer.destroy()}catch(_){}};
    const to=setTimeout(()=>fail('No se encuentra la sala. Revisa el código (o puede que tu red bloquee la conexión).'),22000);
    peer.on('error',e=>{if(!MP.on)fail(e&&e.type==='peer-unavailable'?'No existe esa sala. Revisa el código.':'Error de conexión ('+(e&&e.type||'?')+').')});
    peer.on('open',()=>{const conn=peer.connect('kauaigolf-'+code,{reliable:true});MP.conn=conn;MP.code=code;
      conn.on('data',mpHandle);conn.on('close',mpLostHost);
      conn.on('open',()=>{clearTimeout(to);done=true;MP.on=true;MP.host=false;mpInfo('¡Conectado! Entrando en la sala…');setTimeout(()=>{MP.ready=false;mpPick()},300)})});
  });
}
function mpLostHost(){
  if(!MP.on)return;const g=MP.phase==='game';MP.on=false;MP.phase='off';mpClearGhosts();mpBoard(false);clearInterval(MP.adv);
  if(g){toast('Se ha cerrado la sala','Sigues jugando solo',2200);if(state==='done'||state==='sunk')showHoleCard()}
  else if($('mpStart')){$('mpLobby').style.display='none';$('mpStart').style.display='';mpInfo('Se ha cerrado la sala. Crea una nueva o únete con otro código.')}
}
function mpLeave(){
  const was=MP.on;MP.on=false;MP.phase='off';MP.host=false;clearInterval(MP.adv);
  try{if(MP.conn)MP.conn.close()}catch(e){}MP.players.forEach(p=>{try{if(p.conn)p.conn.close()}catch(e){}});try{if(MP.peer)MP.peer.destroy()}catch(e){}
  MP.conn=null;MP.peer=null;MP.players=[];mpClearGhosts();mpBoard(false);return was;
}
$('bMp').onclick=mpOpen;
if(window.SalaInvita)SalaInvita.alEntrar(c=>{mpOpen();$('mpIn').value=c;mpJoin();},2500);

/* ============ arranque ============ */
setPal(0,true);cam.fov=56;
buildHole(0);applyPal(1,true);ballMesh.visible=false;
if(!ballOpen(prog.ball))prog.ball=0;applyBall(prog.ball);$('best').textContent='⭐ '+totalStars()+' / '+MAXSTARS;
$('ttl').innerHTML=BRAND.name+'<em>'+BRAND.sub+'</em>';$('tUrl').textContent=BRAND.url.toUpperCase();$('mapUrl').textContent=BRAND.url;document.title=BRAND.name+' · '+BRAND.sub;
requestAnimationFrame(t=>{last=t;frame(t)});
</script>
