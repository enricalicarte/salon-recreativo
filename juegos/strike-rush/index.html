let hudScore=-1,hudMult=-1;
function updHUD(force){
  if(force||hudScore!==G.score){hudScore=G.score;$('#score').firstChild.nodeValue=G.score.toLocaleString('es');}
  if(force||hudMult!==G.mult){hudMult=G.mult;const m=$('#mult');m.textContent='x'+G.mult;m.className=G.mult>1?'':'x1';}
  $('#dist').textContent=Math.floor(G.s)+' m';$('#spd').textContent=Math.round(G.v*3.6)+' km/h';
  if(force)[...$('#lives').children].forEach((e,i)=>e.classList.toggle('off',i>=G.lives));
}
function show(id){for(const o of ['menu','pause','over'])$('#'+o).classList.toggle('on',o===id);}

/* ======================= bucle ======================= */
let last=performance.now(),fpsAcc=0,fpsN=0,fpsT=0,qChecked=false;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);composer.setSize(w,h);bloom.resolution.set(w/2,h/2);camera.aspect=w/h;camera.updateProjectionMatrix();lc.width=w*Math.min(devicePixelRatio||1,1.5);lc.height=h*Math.min(devicePixelRatio||1,1.5);}
addEventListener('resize',resize);
function loop(now){
  requestAnimationFrame(loop);
  let rdt=Math.min(.05,(now-last)/1000);last=now;if(rdt<=0)rdt=1/60;
  if(G.mode!=='paused'&&G.mode!=='over'){
    if(G.slowT>0){G.slowT-=rdt;G.ts=G.slowT>0?.28:1;}
    else if(G.mode==='play')G.ts+=(1-G.ts)*Math.min(1,rdt*4);
    const dt=rdt*G.ts;const n=dt>1/45?2:1;for(let i=0;i<n;i++)step(dt/n);
    updSparks(rdt);updConf(rdt);updTrail();
  }
  updCam(rdt*(G.mode==='paused'?0:1),rdt);updSky(rdt);
  if(G.mode==='play')updHUD(false);
  drawLines();
  // calidad automática
  if(G.mode==='play'&&!QUAL.locked&&!qChecked){fpsT+=rdt;fpsN++;if(fpsT>4){const fps=fpsN/fpsT;qChecked=true;if(fps<40){useBloom=false;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1));resize();}}}
  if(useBloom)composer.render();else renderer.render(scene,camera);
}

/* ======================= entrada ======================= */
let drag=null;
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button,.ov,a'))return;AU.init();if(AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume();
  if(G.mode!=='play')return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),moved:0,type:e.pointerType};
  if(e.pointerType==='mouse'){doJump();drag=null;}});
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&G.mode==='play'){mouseX=e.clientX;lastMouseT=performance.now();}
  if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x;drag.x=e.clientX;drag.moved+=Math.abs(dx);
  const xm=xmaxOf(F.a,F.rc,F.mt);G.xCtl=clamp(G.xCtl+SCR*dx/Math.min(innerWidth,620)*TOUCH_SENS*3.6,-xm,xm);
  if(!drag.j&&drag.y-e.clientY>48&&performance.now()-drag.t<350&&drag.moved<40){drag.j=1;doJump();}});
addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.id)drag=null;});
addEventListener('pointercancel',()=>drag=null);
$('#jumpB').addEventListener('pointerdown',e=>{e.stopPropagation();doJump();});
addEventListener('keydown',e=>{keys[e.code]=true;AU.init();if(G.mode==='play'){if(['Space','ArrowUp','KeyW'].includes(e.code)){doJump();e.preventDefault();}if(['KeyP','Escape'].includes(e.code))pause();}
  else if(G.mode==='paused'&&['KeyP','Escape','Space'].includes(e.code))resume();
  else if((G.mode==='menu'||G.mode==='over')&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();start();}
  if(e.code.startsWith('Arrow'))mouseX=null;});
addEventListener('keyup',e=>{keys[e.code]=false;});
function goFS(){const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(f&&!document.fullscreenElement&&!document.webkitFullscreenElement){try{const r=f.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{});}catch(e){}}}
function start(){AU.init();if(AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume();goFS();G.auto=!!QS.get('bot')||G.botAll;newRun('play');G.mode='play';G.music=true;show(null);$('#hud').classList.add('on');
  const h=$('#hint');h.textContent=isTouch?'Arrastra para mover · SALTA o desliza arriba para saltar':'Ratón o ← → para mover · Clic o espacio para saltar';h.classList.add('on');setTimeout(()=>h.classList.remove('on'),3800);}
function pause(){if(G.mode!=='play')return;G.mode='paused';AU.rollSet(0,false);show('pause');}
function resume(){if(G.mode!=='paused')return;G.mode='play';show(null);last=performance.now();}
function toMenu(){newRun('menu');G.mode='menu';G.music=false;show('menu');$('#hud').classList.remove('on');$('#bestM').textContent='Récord: '+G.best.toLocaleString('es');}
$('#playB').onclick=start;$('#againB').onclick=start;$('#rstB').onclick=start;$('#menB').onclick=toMenu;$('#menu2B').onclick=toMenu;$('#resB').onclick=resume;$('#pauseB').addEventListener('pointerdown',e=>{e.stopPropagation();pause();});
const sndLbl=()=>{for(const b of ['#sndB','#snd2B'])$(b).textContent=AU.on?'🔊 Sonido':'🔇 Sin sonido';};sndLbl();
for(const b of ['#sndB','#snd2B'])$(b).onclick=()=>{AU.init();AU.setOn(!AU.on);sndLbl();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

/* ======================= arranque ======================= */
resize();toMenu();$('#bestM').textContent='Récord: '+G.best.toLocaleString('es');
requestAnimationFrame(t=>{last=t;loop(t);});
setTimeout(()=>{const l=$('#loading');l.style.opacity=0;setTimeout(()=>l.remove(),500);},150);

/* ganchos para pruebas automáticas */
window.__sr={G,F,forms,obst,dyn,TS:()=>TS,GEN,chunks,start,toMenu,pause,resume,doJump,newRun,
  sim(sec,dt=1/30){let n=Math.round(sec/dt);while(n-->0&&G.mode!=='over'){if(G.fall||G.mode==='dying'){step(dt);continue;}step(dt);updSparks(dt);updConf(dt);}updTrail();},
  snap(){for(let i=0;i<4;i++)updCam(1,5);},
  bot(b){G.auto=b;G.botAll=b;},check(){let gaps=0;for(let i=1;i<TS.length;i++){if(TS[i].p.distanceTo(TS[i-1].p)>1.6)gaps++;}return {n:TS.length,gaps,chunks:chunks.size,forms:forms.length,obst:obst.length,dyn:dyn.length,decor:decor.length,scene:scene.children.length};}};
</script>
