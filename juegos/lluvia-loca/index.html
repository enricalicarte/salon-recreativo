<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lluvia Loca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--neon:#35f0ff;--pink:#ff3d8b;--yellow:#ffd93d;--green:#5dff9a;--violet:#8a5cff;--ink:#140832}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#07051a;overflow:hidden;color:#fff;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#stage{touch-action:none;position:fixed;left:0;top:0;width:100vw;height:100dvh;display:block}
#cam{position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}
.disp{font-family:"Lilita One","Nunito",system-ui,sans-serif;font-weight:400;letter-spacing:.5px}
/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));pointer-events:none;z-index:5;transition:opacity .3s}
.hud.off{opacity:0}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.22);box-shadow:0 8px 30px rgba(10,0,40,.35),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px}
.sc{justify-self:start;padding:8px 16px 8px 14px;min-width:120px}
.sc small{display:block;font-size:11px;font-weight:900;letter-spacing:2px;color:#cfd2ff;opacity:.85}
#score{font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(28px,6vw,46px);line-height:1;text-shadow:0 0 18px rgba(53,240,255,.8),0 3px 0 rgba(20,8,50,.6)}
#score.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.18)}}
#lives{display:flex;gap:4px;margin-top:4px}
#lives i{width:18px;height:16px;display:block;background:var(--pink);clip-path:path('M9 16 L1.6 8.6 A4.4 4.4 0 0 1 9 3 A4.4 4.4 0 0 1 16.4 8.6 Z');filter:drop-shadow(0 0 4px var(--pink))}
#lives i.x{background:rgba(255,255,255,.25);filter:none}
.r{justify-self:end;display:flex;gap:8px}
.ib{pointer-events:auto;width:46px;height:46px;border-radius:14px;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.ib svg{width:22px;height:22px}
#big{position:fixed;left:0;right:0;top:40%;text-align:center;font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(40px,12vw,120px);line-height:1;color:#fff;
  text-shadow:0 0 30px var(--neon),0 6px 0 rgba(20,8,50,.7);pointer-events:none;z-index:6;transform:translateY(-50%);-webkit-text-stroke:2px rgba(20,8,50,.5)}
#big.small{font-size:clamp(26px,6vw,56px)}
#big.pop{animation:bigpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bigpop{0%{transform:translateY(-50%) scale(.3);opacity:0}100%{transform:translateY(-50%) scale(1);opacity:1}}
#toast{position:fixed;left:0;right:0;top:24%;text-align:center;font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(30px,8vw,76px);pointer-events:none;z-index:6;opacity:0;transform:scale(.6);
  transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1);-webkit-text-stroke:2px rgba(20,8,50,.55)}
#toast.on{opacity:1;transform:scale(1)}
#toast.gold{background:linear-gradient(180deg,#fff6b0,#ffc400 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,196,0,.7)) drop-shadow(0 4px 0 rgba(20,8,50,.6))}
#toast.good{color:var(--green);text-shadow:0 0 24px rgba(93,255,154,.8),0 4px 0 rgba(20,8,50,.6)}
#toast.bad{color:#ff5c6c;text-shadow:0 0 24px rgba(255,60,90,.8),0 4px 0 rgba(20,8,50,.6)}
#toast.rainbow{background:linear-gradient(90deg,#ff3d8b,#ffd93d,#5dff9a,#35f0ff,#b05cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(20,8,50,.6)) drop-shadow(0 0 20px rgba(255,255,255,.5))}
/* menú y resultados */
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,8,60,.35),rgba(5,3,20,.78));z-index:10;padding:20px;transition:opacity .35s}
.panel.hide{opacity:0;pointer-events:none}
.card{max-width:520px;width:100%;text-align:center;padding:26px 24px 22px;border-radius:28px}
.logo{margin:0 0 4px;font-family:"Lilita One",system-ui,sans-serif;font-weight:400;white-space:nowrap;font-size:clamp(46px,12.5vw,92px);line-height:.9;letter-spacing:1px;transform:rotate(-3deg)}
.logo span{display:block;background:linear-gradient(180deg,#fff 0%,#ffe6f3 40%,#ff3d8b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #3a0a3a) drop-shadow(0 0 26px rgba(255,61,139,.7))}
.logo span+span{background:linear-gradient(180deg,#fff 0%,#c9fbff 40%,#18c8e8 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 0 #082a4a) drop-shadow(0 0 26px rgba(53,240,255,.7));margin-left:.4em}
.tag{font-weight:900;color:#e6e2ff;font-size:clamp(15px,3.6vw,18px);margin:12px 0 4px}
#msg{font-size:clamp(14px,3.4vw,17px);margin:6px 0 16px;color:#cfd2ff;min-height:1.4em}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 18px}
.stats div{padding:10px 8px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.stats b{display:block;font-family:"Lilita One",system-ui,sans-serif;font-weight:400;font-size:clamp(26px,6vw,38px);line-height:1.1}
.stats small{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#cfd2ff;margin:0}
.stats .main{grid-column:1/-1}.stats .main b{font-size:clamp(44px,11vw,68px);color:var(--yellow);text-shadow:0 0 22px rgba(255,200,0,.6)}
.rec{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:99px;background:linear-gradient(90deg,#ff3d8b,#ffb300);font-size:12px;font-weight:900;letter-spacing:1px;animation:bump 1s infinite}
.btn{display:block;width:100%;padding:16px 20px;margin:8px 0;border:0;border-radius:18px;font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(22px,5.4vw,28px);letter-spacing:1px;color:#2a1200;
  background:linear-gradient(180deg,#fff27a,#ffc400 55%,#ff9500);box-shadow:0 6px 0 #a35200,0 0 34px rgba(255,180,0,.55),inset 0 2px 0 rgba(255,255,255,.7);cursor:pointer;transition:transform .08s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35200}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:wait;transform:none}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.28);font-family:"Nunito",system-ui,sans-serif;font-weight:900;font-size:16px;letter-spacing:0;padding:12px}
.how{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.how span{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.09);font-size:13px;font-weight:800}
.panel small.note{display:block;margin-top:12px;color:#a9acd9;font-size:12px;line-height:1.4}
@media (max-height:640px){.card{padding:16px 20px 14px}.logo{font-size:clamp(44px,11vh,80px)}.tag{margin-top:6px}.how{margin:8px 0 0}.how span{padding:4px 8px;font-size:12px}#msg{margin:4px 0 8px}.btn{padding:11px 16px;margin:6px 0}.panel small.note{margin-top:6px}.stats{margin:8px 0 10px;gap:6px}.stats div{padding:6px}}
[hidden]{display:none!important}

.tm{position:relative;width:clamp(74px,15vw,96px);aspect-ratio:1;justify-self:center}
.tm svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 4px 14px rgba(10,0,40,.4))}
.tm .tb{fill:rgba(20,8,50,.45);stroke:rgba(255,255,255,.18);stroke-width:8}
.tm .tf{fill:none;stroke:var(--yellow);stroke-width:8;stroke-linecap:round;stroke-dasharray:100;transition:stroke .3s;filter:drop-shadow(0 0 6px rgba(255,217,61,.8))}
.tm b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(28px,6vw,38px);text-shadow:0 3px 0 rgba(20,8,50,.6)}
.tm.hurry .tf{stroke:#ff4d6d;filter:drop-shadow(0 0 8px rgba(255,77,109,.9))}
.tm.hurry b{animation:bump .5s infinite;color:#ffd0d8}
#combo{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);white-space:nowrap;font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(16px,3.6vw,22px);padding:4px 12px;border-radius:99px;
  background:linear-gradient(90deg,#16c46a,#5dff9a);color:#05301a;box-shadow:0 0 18px rgba(93,255,154,.6);opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#combo.fever{background:linear-gradient(90deg,#ff3d8b,#ffc400,#ff3d8b);background-size:200% 100%;color:#2a0a00;box-shadow:0 0 26px rgba(255,196,0,.9);animation:slide 1s linear infinite}
@keyframes slide{to{background-position:200% 0}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div class="hud off" id="hud">
  <div class="sc glass"><small>PUNTOS</small><div id="score">0</div><div id="lives"></div></div>
  <div class="tm" id="tm"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="tb"/><circle id="rp" cx="50" cy="50" r="44" pathLength="100" class="tf"/></svg><b id="time" class="disp">60</b><div id="combo"></div></div>
  <div class="r"><button class="ib glass" id="snd" title="Sonido"></button><button class="ib glass" id="fs" title="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</div>
<div id="big"></div>
<div id="toast"></div>

<div id="panel" class="panel">
  <div class="card glass">
    <h1 class="logo"><span>LLUVIA</span><span>LOCA</span></h1>
    <div class="tag" id="tag">¡Atrapa la fruta con tus propias manos!</div>
    <div class="how" id="how"><span>🍎 Fruta +10</span><span>🪙 Moneda +50</span><span>⏳ Cámara lenta</span><span>💣 ¡Ni tocarla!</span></div>
    <div class="stats" id="res" hidden></div>
    <p id="msg">Cargando detector de poses…</p>
    <button class="btn" id="btn" disabled>Cargando…</button>
    <button class="btn ghost" id="btnDemo" hidden>Jugar sin cámara (ratón o dedo)</button>
    <small class="note">Ponte de frente a 1,5–2 m y que se te vean las manos.<br>El vídeo se procesa en tu dispositivo y no se envía a ningún sitio.</small>
  </div>
</div>
<script type="module">
/* ===== Base común de los juegos con cámara: lienzo, audio, música, cámara, MediaPipe, recorte del jugador y efectos ===== */
const $=s=>document.querySelector(s);
const cv=$('#stage'),ctx=cv.getContext('2d'),video=$('#cam');
let W=0,H=0,DPR=1;
const onResize=[];
function resize(){
  W=innerWidth;H=innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,W*H>1000000?1.25:2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const f of onResize)f();
}
addEventListener('resize',resize);
/* calidad adaptativa: si el dispositivo no llega a ~35 fps se apagan los efectos más caros (?hq la fuerza alta) */
const lerp=(a,b,t)=>a+(b-a)*t;
const HQ=new URLSearchParams(location.search).has('hq');
let lowFx=false,fpsAvg=60,fpsT=0;
function perf(dt,active){if(HQ||lowFx||!active||dt<=0)return;fpsAvg=lerp(fpsAvg,1/dt,.05);fpsT+=dt;if(fpsT>3&&fpsAvg<35){lowFx=true;console.info('Efectos reducidos para ir fluido');}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}

/* ---------- audio: efectos y música ---------- */
let ac=null,master=null,noiseBuf=null;
let muted=false;try{muted=localStorage.getItem('camgames-mute')==='1';}catch(e){}
function audio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function setMute(m){muted=m;try{localStorage.setItem('camgames-mute',m?'1':'0');}catch(e){}if(master)master.gain.setTargetAtTime(m?0:1,ac.currentTime,.05);const b=$('#snd');if(b)b.innerHTML=m?ICON_OFF:ICON_ON;}
const ICON_ON='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function tone(f,d=.12,type='sine',vol=.15,slide=0,at=0,dest){
  if(!ac)return;const t=(at||ac.currentTime),o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.02);
}
function noise(d=.1,vol=.1,hp=4000,at=0,dest){
  if(!ac)return;const t=at||ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+d+.02);
}
const sfx={
  ok(){tone(660,.1,'triangle',.16);setTimeout(()=>tone(990,.16,'triangle',.16),80);},
  perfect(){[660,880,1320,1760].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.15),i*70));},
  bad(){tone(160,.5,'sawtooth',.22,-110);noise(.35,.25,300);},
  boom(){tone(90,.6,'sine',.5,-60);noise(.5,.35,150);},
  tick(){tone(1200,.04,'square',.05);},
  whoosh(){if(!ac)return;const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;f.type='bandpass';f.Q.value=1.2;
    f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3000,t+.35);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.3,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+.45);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.5);},
  calib(){tone(520,.1,'triangle');setTimeout(()=>tone(780,.14,'triangle'),80);},
  count(n){tone(n?660:1320,n?.15:.4,'square',.08);}
};
/* música: secuenciador sencillo (bombo, charles, bajo y arpegio) */
const music={g:null,next:0,step:0,bpm:116,prog:[[110,130.8,164.8],[87.3,110,130.8],[130.8,164.8,196],[98,123.5,146.8]],lead:true,
  start(){if(!ac||this.g)return;this.g=ac.createGain();this.g.gain.value=0;this.g.gain.linearRampToValueAtTime(.55,ac.currentTime+1);this.g.connect(master);this.next=ac.currentTime+.1;this.step=0;},
  stop(){if(!this.g)return;const g=this.g;g.gain.setTargetAtTime(0,ac.currentTime,.2);setTimeout(()=>{try{g.disconnect();}catch(e){}},800);this.g=null;},
  tick(){if(!this.g)return;const spb=60/this.bpm/4;while(this.next<ac.currentTime+.15){this.play(this.step,this.next);this.next+=spb;this.step++;}},
  play(s,t){const b=s%16,ch=this.prog[Math.floor(s/16)%4],d=this.g;
    if(b%4===0){tone(150,.22,'sine',.5,-110,t,d);}
    if(b%2===1)noise(.04,.06,7000,t,d);
    if(b===4||b===12)noise(.12,.12,1800,t,d);
    if(b%2===0)tone(ch[0]/2,.18,'sawtooth',.09,0,t,d);
    if(this.lead&&b%2===0)tone(ch[(b/2)%3]*4,.12,'triangle',.035,0,t,d);
  }
};

/* ---------- cámara y modelo ---------- */
const MP_BASE='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
let landmarker=null,camOK=false,demo=new URLSearchParams(location.search).has('demo');
async function initCamera(){
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:540}},audio:false});
  video.srcObject=stream;video.muted=true;video.playsInline=true;
  await video.play();
  if(!video.videoWidth)await new Promise(r=>{video.onloadedmetadata=r;});
  camOK=true;
}
async function initModel(){
  const {PoseLandmarker,FilesetResolver}=await import(MP_BASE+'/vision_bundle.mjs');
  const fileset=await FilesetResolver.forVisionTasks(MP_BASE+'/wasm');
  const mk=delegate=>PoseLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:MODEL,delegate},runningMode:'VIDEO',outputSegmentationMasks:true,numPoses:1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});
  try{landmarker=await mk('GPU');}catch(e){console.warn('GPU no disponible, uso CPU',e);landmarker=await mk('CPU');}
}

/* ---------- recorte del jugador y aura de neón ---------- */
const mCv=mkCanvas(2,2),mCx=mCv.getContext('2d');
const pCv=mkCanvas(2,2),pCx=pCv.getContext('2d');
const aCv=mkCanvas(2,2),aCx=aCv.getContext('2d');
let segOK=false,segAt=0,mImg=null,auraCol='#35f0ff';
function useMask(res){
  const ms=res&&res.segmentationMasks;
  if(!ms||!ms.length)return;
  try{
    const m=ms[0],w=m.width,h=m.height,f=m.getAsFloat32Array();
    if(mCv.width!==w||mCv.height!==h){mCv.width=w;mCv.height=h;mImg=mCx.createImageData(w,h);}
    const u=new Uint32Array(mImg.data.buffer);
    for(let i=0;i<f.length;i++){const v=f[i];const a=v<.3?0:v>.7?255:((v-.3)*637)|0;u[i]=(a<<24)|0xffffff;}
    mCx.putImageData(mImg,0,0);
    const vw=video.videoWidth,vh=video.videoHeight;
    if(pCv.width!==vw||pCv.height!==vh){pCv.width=vw;pCv.height=vh;}
    pCx.globalCompositeOperation='copy';pCx.drawImage(video,0,0,vw,vh);
    pCx.globalCompositeOperation='destination-in';pCx.filter='blur(1.5px)';pCx.drawImage(mCv,0,0,vw,vh);pCx.filter='none';
    pCx.globalCompositeOperation='source-over';
    const aw=Math.max(32,w>>2),ah=Math.max(18,h>>2);
    if(aCv.width!==aw||aCv.height!==ah){aCv.width=aw;aCv.height=ah;}
    aCx.globalCompositeOperation='copy';aCx.filter='blur(3px)';aCx.drawImage(mCv,0,0,aw,ah);aCx.filter='none';
    aCx.globalCompositeOperation='source-in';aCx.fillStyle=auraCol;aCx.fillRect(0,0,aw,ah);aCx.globalCompositeOperation='source-over';
    segOK=true;segAt=performance.now();
  }catch(e){}
  finally{for(const m of ms){try{m.close();}catch(e){}}}
}
function coverMap(){const vw=video.videoWidth||16,vh=video.videoHeight||9,s=Math.max(W/vw,H/vh);return{vw,vh,s,ox:(W-vw*s)/2,oy:(H-vh*s)/2};}
/* dibuja al jugador recortado (espejado) con aura; si no hay máscara, la cámara entera atenuada */
function drawPlayer(now,dim){
  if(!camOK||video.readyState<2)return false;
  const m=coverMap(),cut=segOK&&now-segAt<1500;
  ctx.save();ctx.translate(W,0);ctx.scale(-1,1);
  if(cut){
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.75+.2*Math.sin(now/220);

  return[P(cx,H*.28),s1,s2,P((s1.x+a.x)/2,(s1.y+a.y)/2+H*.04),P((s2.x+b.x)/2,(s2.y+b.y)/2+H*.04),P(a.x,a.y),P(b.x,b.y),

}
function drawGrid(now){
  const vx=W/2-par*W*.08,spd=fever()?.0011:now<slowUntil?.0002:.0005;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const col=fever()?'255,196,0':'255,61,139';
  ctx.lineWidth=1.6;
  for(let i=-18;i<=18;i++){ctx.strokeStyle='rgba('+col+','+(.28-Math.abs(i)*.008)+')';ctx.beginPath();ctx.moveTo(vx+i*W*.016,hz);ctx.lineTo(vx+i*W*.19,H);ctx.stroke();}
  gridPh=(gridPh+spd*16.7)%1;
  for(let i=0;i<14;i++){const p=(i+gridPh)/14,y=hz+(H-hz)*p*p;ctx.strokeStyle='rgba('+col+','+(.1+.6*p)+')';ctx.lineWidth=1+2.5*p;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const hg=ctx.createLinearGradient(0,hz-H*.05,0,hz+H*.03);hg.addColorStop(0,'rgba(255,120,180,0)');hg.addColorStop(.6,'rgba(255,150,190,.45)');hg.addColorStop(1,'rgba(255,120,180,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,hz-H*.05,W,H*.08);
  ctx.restore();
}
let gridPh=0;
function drawPalms(now){
  const ph=palmCv.height/DPR,pw=palmCv.width/DPR;
  const sw=(a,x,s,flip)=>{ctx.save();ctx.translate(x,H+6);ctx.rotate(Math.sin(now/1700+a)*.035);ctx.scale(flip*s,s);ctx.drawImage(palmCv,-pw*.3,-ph,pw,ph);ctx.restore();};
  sw(0,W*.05-par*W*.12,1,1);sw(2,W*.95-par*W*.12,.85,-1);
}
function drawFireflies(now){
  ctx.save();ctx.globalCompositeOperation='lighter';const d=tintDot(fever()?'#ffd23f':'#ffe7b0');
  for(let i=0;i<24;i++){const x=rnd(i+3)*W+Math.sin(now/2100+i)*W*.03,y=H*(.35+.55*rnd(i+50))+Math.cos(now/1700+i*1.3)*H*.03,a=.35+.35*Math.sin(now/500+i*2),s=6+rnd(i)*8;
    ctx.globalAlpha=a;ctx.drawImage(d,x-s,y-s,s*2,s*2);}
  ctx.restore();
}
function drawBg(now,dt){
  buildScene();
  ctx.drawImage(sky,0,0,W,H);
  if(!lowFx)drawAurora(now);drawStars(now,dt);drawSun(now);
  mtn.forEach((m,i)=>{const off=-W*.125-par*W*[.03,.06,.1][i];ctx.drawImage(m,off,0,m.width/DPR,m.height/DPR);});
  drawGrid(now);drawPalms(now);if(!lowFx)drawFireflies(now);
  if(mode==='cam'&&state!=='menu')drawPlayer(now,.3);
  if(now<slowUntil){ctx.fillStyle='rgba(53,240,255,.10)';ctx.fillRect(0,0,W,H);}
  if(fever()){ctx.save();ctx.globalCompositeOperation='lighter';const a=.12+.08*Math.sin(now/120),g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)*.6);
    g.addColorStop(0,'rgba(255,180,0,0)');g.addColorStop(1,'rgba(255,140,0,'+a+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();}
}

/* ---------- objetos ---------- */
function pickType(){
  if(Math.random()<Math.min(.26,.10+elapsed*.0028))return BOMB;
  let r=Math.random()*TOT_W;
  for(const t of TYPES){if((r-=t.w)<=0)return t.k==='heart'&&lives>=5?TYPES[0]:t;}
  return TYPES[0];
}
function mkItem(t,x,speedK=1){const s=size();return{t,s,x:x??s+Math.random()*(W-2*s),y:-s,vy:H*Math.min(.62,.30+elapsed*.0055)*(.85+Math.random()*.35)*speedK,vx:(Math.random()-.5)*W*.03,rot:Math.random()*6,spin:(Math.random()-.5)*3,ph:Math.random()*6,dead:false};}
function drawItem(it,k){
  const sp=sprite(it.t),D=sp.D,bomb=it.t.k==='bomb';
  const sc=clamp((it.y+it.s*1.2)/(it.s*1.2),.35,1)*(bomb?1+Math.sin(it.ph*12)*.06:1);
  if(!lowFx)for(let i=3;i>=1;i--){ctx.globalAlpha=.09*(4-i);const q=sc*(1-i*.09),tx=it.x-it.vx*k*.03*i,ty=it.y-it.vy*k*.03*i;ctx.drawImage(sp.c,tx-D*q/2,ty-D*q/2,D*q,D*q);}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(it.x,it.y);ctx.rotate(Math.sin(it.rot)*.35);ctx.scale(sc,sc);ctx.drawImage(sp.c,-D/2,-D/2,D,D);ctx.restore();
  if(bomb){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.ph*2);ctx.setLineDash([it.s*.18,it.s*.14]);ctx.lineWidth=3;ctx.strokeStyle='rgba(255,50,70,'+(.45+.45*Math.sin(it.ph*12))+')';
    ctx.beginPath();ctx.arc(0,0,it.s*.85*sc,0,7);ctx.stroke();ctx.restore();
    if(Math.random()<.5)parts.push({x:it.x+it.s*.28,y:it.y-it.s*.42,vx:(Math.random()-.5)*120,vy:-60-Math.random()*120,life:.5,dec:2.5,c:Math.random()<.5?'#ffd93d':'#ff7a1f',r:2+Math.random()*2,g:300,k:'dot',rot:0});}
}

/* ---------- capturas ---------- */
function grab(it,now){
  it.dead=true;const k=it.t.k,s=it.s;
  if(k==='bomb'){
    lives--;combo=0;shake=1.3;flashT=1;flashC='255,40,60';
    burst(it.x,it.y,['#ff7a1f','#ffd93d','#ff2a3a','#fff'],46,1.5,500,1.4);ring(it.x,it.y,'#ff7a1f',s*3.2,14,.6);ring(it.x,it.y,'#fff',s*2,6,.35);
    pop(it.x,it.y,'¡BOOM!','#ff5c6c',1.3);sfx.boom();hud();
    if(lives<=0)endGame('¡Sin vidas!');
  }else if(k==='heart'){
    lives=Math.min(5,lives+1);burst(it.x,it.y,['#ff3d8b','#ffd0e4'],20);ring(it.x,it.y,'#ff3d8b',s*1.8);pop(it.x,it.y,'+1 ♥','#ff7ab0');sfx.calib();
  }else if(k==='slow'){
    slowUntil=now+5000;burst(it.x,it.y,['#35f0ff','#fff'],22);ring(it.x,it.y,'#35f0ff',Math.max(W,H)*.6,10,.8);toast('CÁMARA LENTA','good');tone(300,.6,'sine',.18,300);
  }else{
    combo++;caught++;bestCombo=Math.max(bestCombo,combo);
    const p=it.t.pts*(1+Math.floor(combo/5))*(fever()?2:1);score+=p;
    const gold=k==='gold';
    burst(it.x,it.y,[it.t.j,'#fff',it.t.j],gold?28:16,gold?1.2:1);ring(it.x,it.y,gold?'#ffd93d':it.t.j,s*(gold?2.2:1.5),gold?10:7);
    pop(it.x,it.y-s*.3,'+'+p,gold?'#ffd93d':'#ffffff',gold?1.2:1);
    gold?sfx.perfect():tone(520+Math.min(combo,16)*40,.1,'triangle',.15);
    el.score.classList.remove('bump');void el.score.offsetWidth;el.score.classList.add('bump');
    if(combo===10||combo===20||combo===30||combo===50){
      toast('¡FRENESÍ x'+combo+'!','rainbow');confetti(W/2,H*.35,70);sfx.perfect();flashT=.6;flashC='255,210,80';
      for(let i=0;i<6;i++)items.push(mkItem(COIN,W*(.12+.76*i/5),.8));
    }else if(combo%5===0)toast('COMBO x'+combo,'good');
  }
  auraCol=fever()?'#ffc400':combo>=5?'#5dff9a':'#35f0ff';
  hud();
}
function endGame(title){
  if(state!=='play')return;
  state='over';items.forEach(i=>{if(!i.dead){i.dead=true;burst(i.x,i.y,[i.t.j,'#fff'],6,.6);}});items=[];
  const rec=score>best;if(rec){best=score;try{localStorage.setItem('lluvialoca-best',best);}catch(e){}}
  hud();toast(title,title.includes('Tiempo')?'gold':'bad');music.stop();
  setTimeout(()=>{
    el.how.hidden=true;el.res.hidden=false;
    el.res.innerHTML='<div class="main"><small>PUNTOS</small><b>'+score+'</b>'+(rec&&score>0?'<span class="rec">¡NUEVO RÉCORD!</span>':'')+'</div>'+
      '<div><small>RÉCORD</small><b>'+best+'</b></div><div><small>MEJOR COMBO</small><b>x'+bestCombo+'</b></div>'+
      '<div><small>COGIDOS</small><b>'+caught+'</b></div><div><small>VIDAS</small><b>'+Math.max(0,lives)+'</b></div>';
    el.tag.textContent=title;el.msg.textContent='';
    el.btn.textContent='JUGAR OTRA VEZ';el.btn.disabled=false;el.panel.classList.remove('hide');el.hud.classList.add('off');
    if(rec&&score>0){confetti(W*.3,H*.4,60);confetti(W*.7,H*.4,60);sfx.perfect();}
  },1300);
}
function startGame(){
  items=[];parts=[];pops=[];rings=[];score=0;shown=0;lives=3;livesShown=-1;combo=0;bestCombo=0;caught=0;timeLeft=ROUND;elapsed=0;spawnT=.6;slowUntil=0;shake=0;flashT=0;last10=false;auraCol='#35f0ff';
  dh=[{x:W*.38,y:H*.6},{x:W*.62,y:H*.6}];trails=[];
  el.panel.classList.add('hide');el.hud.classList.remove('off');cd=3.2;lastCd=-1;state='count';hud();
  audio();music.start();
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
}

/* ---------- bucle de juego ---------- */
function update(dt,now){
  elapsed+=dt;timeLeft-=dt;
  const k=now<slowUntil?.45:1;
  spawnT-=dt;
  if(spawnT<=0){items.push(mkItem(pickType()));spawnT=Math.max(.36,.9-elapsed*.009)*(.7+Math.random()*.6)*(fever()?.75:1);}
  hands=getHands(dt);
  for(const it of items){
    if(it.dead)continue;
    it.y+=it.vy*k*dt;it.x+=it.vx*k*dt;it.rot+=it.spin*dt;it.ph+=dt;
    for(const h of hands){if(Math.hypot(it.x-h.x,it.y-h.y)<h.r+it.s*.35){grab(it,now);break;}}
    if(!it.dead&&it.y>H+it.s){
      it.dead=true;
      if(it.t.k==='fruit'||it.t.k==='gold'){if(combo>0){combo=0;auraCol='#35f0ff';hud();tone(200,.18,'sine',.08,-60);}pop(it.x,H-60,'✗','#ff8a8a',.8);}
    }
  }
  items=items.filter(i=>!i.dead);
  if(timeLeft<=10&&!last10){last10=true;toast('¡ÚLTIMOS 10!','bad');music.bpm=132;}
  if(timeLeft<=0){timeLeft=0;endGame('¡Tiempo!');}
  if(mode==='cam'){noBodyT=curJ?0:noBodyT+dt;if(noBodyT>.8)bigText('¡No te veo!');else if($('#big').textContent==='¡No te veo!')bigText('');}
  const sec=Math.ceil(timeLeft);if(sec!==lastSec){lastSec=sec;hud();if(sec<=5&&sec>0)sfx.tick();}
}
function drawSkeleton(){
  const j=curJ;if(!j||mode==='cam')return;  /* con cámara real te ves a ti, sin esqueleto */
  const B=[[1,2],[1,3],[3,5],[2,4],[4,6],[1,7],[2,8],[7,8],[7,9],[9,11],[8,10],[10,12]];
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=auraCol;const lw=Math.max(6,H*.012);
  ctx.beginPath();for(const[a,b]of B){ctx.moveTo(j[a].x,j[a].y);ctx.lineTo(j[b].x,j[b].y);}ctx.moveTo(j[0].x+H*.045,j[0].y);ctx.arc(j[0].x,j[0].y,H*.045,0,7);
  ctx.globalAlpha=.25;ctx.lineWidth=lw*3;ctx.stroke();ctx.globalAlpha=.9;ctx.lineWidth=lw;ctx.stroke();ctx.restore();
}
function drawHands(now){
  if(!hands.length){trails=[];return;}
  const col=auraCol;
  hands.forEach((h,i)=>{const t=trails[i]||(trails[i]=[]);t.push({x:h.x,y:h.y});if(t.length>14)t.shift();});
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.strokeStyle=col;
  if(!lowFx)for(const t of trails){for(let i=1;i<t.length;i++){const u=i/t.length;ctx.globalAlpha=u*.5;ctx.lineWidth=u*hands[0].r*.7;ctx.beginPath();ctx.moveTo(t[i-1].x,t[i-1].y);ctx.lineTo(t[i].x,t[i].y);ctx.stroke();}}
  ctx.globalAlpha=1;
  for(const h of hands){const s=h.r*1.9;ctx.globalAlpha=.75;ctx.drawImage(tintDot(col),h.x-s,h.y-s,s*2,s*2);}
  ctx.restore();
  for(const h of hands){
    ctx.save();ctx.translate(h.x,h.y);
    ctx.fillStyle='rgba(255,255,255,.10)';ctx.beginPath();ctx.arc(0,0,h.r,0,7);ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(0,0,h.r,0,7);ctx.stroke();
    ctx.rotate(now/260);ctx.strokeStyle=col;ctx.beginPath();
    for(let q=0;q<3;q++){ctx.moveTo(Math.cos(q*2.09)*(h.r+7),Math.sin(q*2.09)*(h.r+7));ctx.arc(0,0,h.r+7,q*2.09,q*2.09+1.1);}
    ctx.globalAlpha=.35;ctx.lineWidth=16;ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=7;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();
    ctx.restore();
  }
}
function frame(now){
  requestAnimationFrame(frame);
  const dt=clamp((now-lastNow)/1000,0,.05);lastNow=now;
  if(ac)music.tick();
  perf(dt,state==='play');
  detect(now);
  const tgt=curJ?(curJ[0].x-W/2)/W:0;par=lerp(par,tgt,Math.min(1,dt*3));
  if(state==='play')update(dt,now);
  else{
    hands=(state==='count'||state==='over')&&(mode==='demo'||(mode==='cam'&&camOK)||mode==='touch')?getHands(dt):[];
    if(state==='count'){
      cd-=dt;const c=Math.ceil(cd);
      if(c!==lastCd){lastCd=c;if(c>0){bigText(String(c));sfx.count(1);}else{bigText('¡YA!');sfx.count(0);}}
      if(cd<=-.6){bigText('');state='play';hud();}
    }
    /* lluvia de ambiente en el menú */
    if(state==='menu'||state==='over'){ambT-=dt;if(ambT<=0){ambT=.55;const t=Math.random()<.12?BOMB:TYPES[Math.floor(Math.random()*5)];const a=mkItem(t);a.vy*=.7;amb.push(a);}}
  }
  for(const a of amb){a.y+=a.vy*dt;a.rot+=a.spin*dt;a.ph+=dt;}amb=amb.filter(a=>a.y<H+a.s);
  if(state==='play'&&amb.length)amb=[];
  shown=lerp(shown,score,Math.min(1,dt*10));const sv=Math.round(shown);if(el.score.textContent!==String(sv))el.score.textContent=sv;
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake*26,(Math.random()-.5)*shake*26);shake=Math.max(0,shake-dt*3);}
  drawBg(now,dt);
  const k=now<slowUntil?.45:1;
  for(const a of amb)drawItem(a,1);
  for(const it of items)drawItem(it,k);
  drawSkeleton();drawHands(now);drawFx(dt);
  ctx.restore();
  if(!lowFx)drawVignette(.8);drawFlash(dt);
}

/* ---------- botones y arranque ---------- */
async function onPlay(){
  audio();goFS();
  if(mode==='cam'&&!camOK){
    try{el.btn.disabled=true;el.btn.textContent='Abriendo cámara…';await initCamera();}
    catch(e){console.error(e);el.msg.textContent='No he podido abrir la cámara. Permite el acceso o juega con el ratón o el dedo.';el.btn.disabled=false;el.btn.textContent='Reintentar';el.btnDemo.hidden=false;return;}
  }
  el.btn.disabled=false;startGame();
}
el.btn.onclick=onPlay;
el.btnDemo.onclick=()=>{mode='touch';audio();goFS();startGame();};
$('#fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else goFS();};
$('#snd').onclick=()=>{audio();setMute(!muted);};
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')$('#fs').click();if(e.key==='m'||e.key==='M')$('#snd').click();});
onResize.push(()=>{sceneKey='';sprKey='';});
resize();setMute(muted);

(async function boot(){
  hud();requestAnimationFrame(frame);
  el.btnDemo.hidden=false;
  if(demo){el.msg.textContent='Modo demo: unas manos virtuales juegan solas.';el.btn.textContent='VER DEMO';el.btn.disabled=false;return;}
  try{await initModel();el.msg.textContent='¡Listo! Pulsa jugar y permite la cámara.';el.btn.textContent='¡JUGAR!';el.btn.disabled=false;}
  catch(e){console.error(e);el.msg.textContent='No he podido cargar el detector de poses (¿sin conexión?). Puedes jugar con el ratón o el dedo.';el.btn.textContent='Reintentar';el.btn.disabled=false;el.btn.onclick=()=>location.reload();}
})();
</script>
