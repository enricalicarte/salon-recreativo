<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lluvia Loca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--neon:#35f0ff;--pink:#ff3d8b;--yellow:#ffd93d;--green:#5dff9a;--violet:#8a5cff;--ink:#140832}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#07051a;overflow:hidden;color:#fff;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#stage{touch-action:none;position:fixed;left:0;top:0;width:100vw;height:100dvh;display:block}
#cam{position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}
.disp{font-family:"Lilita One","Nunito",system-ui,sans-serif;font-weight:400;letter-spacing:.5px}
/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));pointer-events:none;z-index:5;transition:opacity .3s}
.hud.off{opacity:0}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.22);box-shadow:0 8px 30px rgba(10,0,40,.35),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px}
.sc{justify-self:start;padding:8px 16px 8px 14px;min-width:120px}
.sc small{display:block;font-size:11px;font-weight:900;letter-spacing:2px;color:#cfd2ff;opacity:.85}
#score{font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(28px,6vw,46px);line-height:1;text-shadow:0 0 18px rgba(53,240,255,.8),0 3px 0 rgba(20,8,50,.6)}
#score.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.18)}}
#lives{display:flex;gap:4px;margin-top:4px}
#lives i{width:18px;height:16px;display:block;background:var(--pink);clip-path:path('M9 16 L1.6 8.6 A4.4 4.4 0 0 1 9 3 A4.4 4.4 0 0 1 16.4 8.6 Z');filter:drop-shadow(0 0 4px var(--pink))}
#lives i.x{background:rgba(255,255,255,.25);filter:none}
.r{justify-self:end;display:flex;gap:8px}
.ib{pointer-events:auto;width:46px;height:46px;border-radius:14px;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.ib svg{width:22px;height:22px}
#big{position:fixed;left:0;right:0;top:40%;text-align:center;font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(40px,12vw,120px);line-height:1;color:#fff;
  text-shadow:0 0 30px var(--neon),0 6px 0 rgba(20,8,50,.7);pointer-events:none;z-index:6;transform:translateY(-50%);-webkit-text-stroke:2px rgba(20,8,50,.5)}
#big.small{font-size:clamp(26px,6vw,56px)}
#big.pop{animation:bigpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bigpop{0%{transform:translateY(-50%) scale(.3);opacity:0}100%{transform:translateY(-50%) scale(1);opacity:1}}
#toast{position:fixed;left:0;right:0;top:24%;text-align:center;font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(30px,8vw,76px);pointer-events:none;z-index:6;opacity:0;transform:scale(.6);
  transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1);-webkit-text-stroke:2px rgba(20,8,50,.55)}
#toast.on{opacity:1;transform:scale(1)}
#toast.gold{background:linear-gradient(180deg,#fff6b0,#ffc400 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,196,0,.7)) drop-shadow(0 4px 0 rgba(20,8,50,.6))}
#toast.good{color:var(--green);text-shadow:0 0 24px rgba(93,255,154,.8),0 4px 0 rgba(20,8,50,.6)}
#toast.bad{color:#ff5c6c;text-shadow:0 0 24px rgba(255,60,90,.8),0 4px 0 rgba(20,8,50,.6)}
#toast.rainbow{background:linear-gradient(90deg,#ff3d8b,#ffd93d,#5dff9a,#35f0ff,#b05cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(20,8,50,.6)) drop-shadow(0 0 20px rgba(255,255,255,.5))}
/* menú y resultados */
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;background:radial-gradient(ellipse at center,rgba(20,8,60,.35),rgba(5,3,20,.78));z-index:10;padding:20px;transition:opacity .35s}
.panel.hide{opacity:0;pointer-events:none}
.card{max-width:520px;width:100%;text-align:center;padding:26px 24px 22px;border-radius:28px;margin:auto}
.logo{margin:0 0 4px;font-family:"Lilita One",system-ui,sans-serif;font-weight:400;white-space:nowrap;font-size:clamp(46px,12.5vw,92px);line-height:.9;letter-spacing:1px;transform:rotate(-3deg)}
.logo span{display:block;background:linear-gradient(180deg,#fff 0%,#ffe6f3 40%,#ff3d8b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #3a0a3a) drop-shadow(0 0 26px rgba(255,61,139,.7))}
.logo span+span{background:linear-gradient(180deg,#fff 0%,#c9fbff 40%,#18c8e8 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 0 #082a4a) drop-shadow(0 0 26px rgba(53,240,255,.7));margin-left:.4em}
.tag{font-weight:900;color:#e6e2ff;font-size:clamp(15px,3.6vw,18px);margin:12px 0 4px}
#msg{font-size:clamp(14px,3.4vw,17px);margin:6px 0 16px;color:#cfd2ff;min-height:1.4em}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 18px}
.stats div{padding:10px 8px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.stats b{display:block;font-family:"Lilita One",system-ui,sans-serif;font-weight:400;font-size:clamp(26px,6vw,38px);line-height:1.1}
.stats small{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#cfd2ff;margin:0}
.stats .main{grid-column:1/-1}.stats .main b{font-size:clamp(44px,11vw,68px);color:var(--yellow);text-shadow:0 0 22px rgba(255,200,0,.6)}
.rec{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:99px;background:linear-gradient(90deg,#ff3d8b,#ffb300);font-size:12px;font-weight:900;letter-spacing:1px;animation:bump 1s infinite}
.btn{display:block;width:100%;padding:16px 20px;margin:8px 0;border:0;border-radius:18px;font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(22px,5.4vw,28px);letter-spacing:1px;color:#2a1200;
  background:linear-gradient(180deg,#fff27a,#ffc400 55%,#ff9500);box-shadow:0 6px 0 #a35200,0 0 34px rgba(255,180,0,.55),inset 0 2px 0 rgba(255,255,255,.7);cursor:pointer;transition:transform .08s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35200}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:wait;transform:none}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.28);font-family:"Nunito",system-ui,sans-serif;font-weight:900;font-size:16px;letter-spacing:0;padding:12px}
.how{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.how span{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.09);font-size:13px;font-weight:800}
.panel small.note{display:block;margin-top:12px;color:#a9acd9;font-size:12px;line-height:1.4}
@media (max-height:640px){.card{padding:16px 20px 14px}.logo{font-size:clamp(44px,11vh,80px)}.tag{margin-top:6px}.how{margin:8px 0 0}.how span{padding:4px 8px;font-size:12px}#msg{margin:4px 0 8px}.btn{padding:11px 16px;margin:6px 0}.panel small.note{margin-top:6px}.stats{margin:8px 0 10px;gap:6px}.stats div{padding:6px}}
[hidden]{display:none!important}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
.modes button{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;font:inherit;transition:transform .1s,border-color .2s,background .2s}
.modes button b{font-family:"Lilita One",system-ui,sans-serif;font-weight:400;font-size:clamp(18px,4.4vw,22px);letter-spacing:.5px}
.modes button span{font-size:12px;font-weight:800;color:#cfd2ff}
.modes button i{font-style:normal;font-size:24px;line-height:1}
.modes button.on{border-color:#ffd93d;background:linear-gradient(180deg,rgba(255,217,61,.25),rgba(255,149,0,.12));box-shadow:0 0 20px rgba(255,200,0,.35);transform:translateY(-2px)}
.modes.np{grid-template-columns:1fr 1fr}
.modes.np button b{font-size:clamp(16px,4vw,20px)}
.modes.three{grid-template-columns:repeat(3,1fr)}
.modes.three button span{font-size:11px}
.sc.p1 #score,.sc.p1 .s2{text-shadow:0 0 18px rgba(53,240,255,.8),0 3px 0 rgba(20,8,50,.6)}
.sc.p2{justify-self:end;text-align:right}.sc.p2 .s2{text-shadow:0 0 18px rgba(255,61,139,.8),0 3px 0 rgba(20,8,50,.6);color:#ffd6e8}
.sc .s2{font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(28px,6vw,46px);line-height:1}
.sc .pc{font-family:"Lilita One",system-ui,sans-serif;font-size:12px;letter-spacing:1px;color:#5dff9a;min-height:14px;margin-top:2px}
.sc .pc.fever{color:#ffd93d}
.sc.out{opacity:.45;filter:grayscale(1)}
.r.col{flex-direction:column;align-items:flex-end}
.r.col .btns{display:flex;gap:8px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 6px}
.vs div{padding:12px 8px;border-radius:18px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14)}
.vs div.win{border-color:#ffd93d;background:linear-gradient(180deg,rgba(255,217,61,.25),rgba(255,149,0,.1));box-shadow:0 0 24px rgba(255,200,0,.4)}
.vs b{display:block;font-family:"Lilita One",system-ui,sans-serif;font-weight:400;font-size:clamp(34px,9vw,56px);line-height:1}
.vs small{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#cfd2ff}
.vs .x{font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(18px,5vw,26px);color:#ffd93d}
.vs .c1 b{color:#35f0ff}.vs .c2 b{color:#ff3d8b}
.hud .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(180deg,rgba(40,20,90,.7),rgba(20,8,50,.6))}

.tm{position:relative;width:clamp(74px,15vw,96px);aspect-ratio:1;justify-self:center}
.tm svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 4px 14px rgba(10,0,40,.4))}
.tm .tb{fill:rgba(20,8,50,.45);stroke:rgba(255,255,255,.18);stroke-width:8}
.tm .tf{fill:none;stroke:var(--yellow);stroke-width:8;stroke-linecap:round;stroke-dasharray:100;transition:stroke .3s;filter:drop-shadow(0 0 6px rgba(255,217,61,.8))}
.tm b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(28px,6vw,38px);text-shadow:0 3px 0 rgba(20,8,50,.6)}
.tm.hurry .tf{stroke:#ff4d6d;filter:drop-shadow(0 0 8px rgba(255,77,109,.9))}
.tm.hurry b{animation:bump .5s infinite;color:#ffd0d8}
#combo{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);white-space:nowrap;font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(16px,3.6vw,22px);padding:4px 12px;border-radius:99px;
  background:linear-gradient(90deg,#16c46a,#5dff9a);color:#05301a;box-shadow:0 0 18px rgba(93,255,154,.6);opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#combo.fever{background:linear-gradient(90deg,#ff3d8b,#ffc400,#ff3d8b);background-size:200% 100%;color:#2a0a00;box-shadow:0 0 26px rgba(255,196,0,.9);animation:slide 1s linear infinite}
@keyframes slide{to{background-position:200% 0}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div class="hud off" id="hud">
  <div class="sc glass p1"><small id="lab1">PUNTOS</small><div id="score">0</div><div id="lives"></div><div class="pc" id="pc1"></div></div>
  <div class="tm" id="tm"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="tb"/><circle id="rp" cx="50" cy="50" r="44" pathLength="100" class="tf"/></svg><b id="time" class="disp">60</b><div id="combo"></div></div>
  <div class="r col"><div class="sc glass p2" id="sc2" hidden><small>JUGADOR 2</small><div class="s2" id="score2">0</div><div id="lives2"></div><div class="pc" id="pc2"></div></div>
    <div class="btns"><button class="ib glass" id="snd" title="Sonido" aria-label="Sonido"></button><button class="ib glass" id="fs" title="Pantalla completa" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
</div>
<div id="big"></div>
<div id="toast"></div>

<div id="panel" class="panel">
  <div class="card glass">
    <h1 class="logo"><span>LLUVIA</span><span>LOCA</span></h1>
    <div class="tag" id="tag">¡Atrapa la fruta con tus propias manos!</div>
    <div class="modes np" id="npSel"><button data-np="1" class="on"><i>🧍</i><b>1 JUGADOR</b></button><button data-np="2"><i>🧍🧍</i><b>2 JUGADORES</b></button></div>
    <div class="modes three" id="m2Sel" hidden><button data-m="duelo" class="on"><i>⚔️</i><b>DUELO</b><span>Pantalla partida</span></button><button data-m="coop"><i>🤝</i><b>EQUIPO</b><span>Puntos en común</span></button><button data-m="ataque"><i>🌩️</i><b>ATAQUE</b><span>Tu color, y a fastidiar</span></button></div>
    <div class="how" id="how"><span>🍎 Fruta +10</span><span>🪙 Moneda +50</span><span>⏳ Cámara lenta</span><span>💣 ¡Ni tocarla!</span></div>
    <div class="stats" id="res" hidden></div>
    <p id="msg">Cargando detector de poses…</p>
    <button class="btn" id="btn" disabled>Cargando…</button>
    <button class="btn ghost" id="btnDemo" hidden>Jugar sin cámara (ratón o dedo)</button>
    <small class="note" id="note">Ponte de frente a 1,5–2 m y que se te vean las manos.<br>El vídeo se procesa en tu dispositivo y no se envía a ningún sitio.</small>
  </div>
</div>
<script type="module">
/* ===== Base común de los juegos con cámara: lienzo, audio, música, cámara, MediaPipe, recorte del jugador y efectos ===== */
const $=s=>document.querySelector(s);
const cv=$('#stage'),ctx=cv.getContext('2d'),video=$('#cam');
let W=0,H=0,DPR=1;
const onResize=[];
function resize(){
  W=innerWidth;H=innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,W*H>1000000?1.25:2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const f of onResize)f();
}
addEventListener('resize',resize);
/* calidad adaptativa: si el dispositivo no llega a ~35 fps se apagan los efectos más caros (?hq la fuerza alta) */
const lerp=(a,b,t)=>a+(b-a)*t;
const HQ=new URLSearchParams(location.search).has('hq');
let lowFx=false,fpsAvg=60,fpsT=0;
function perf(dt,active){if(HQ||lowFx||!active||dt<=0)return;fpsAvg=lerp(fpsAvg,1/dt,.05);fpsT+=dt;if(fpsT>3&&fpsAvg<35){lowFx=true;console.info('Efectos reducidos para ir fluido');}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}

/* ---------- audio: efectos y música ---------- */
let ac=null,master=null,noiseBuf=null;
let muted=false;try{muted=localStorage.getItem('camgames-mute')==='1';}catch(e){}
function audio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}
  if(ac&&ac.state!=='running'){try{ac.resume();}catch(e){}}
}
/* al volver a la pestaña (o tras una llamada en iOS) se reanudan el audio y el bloqueo de pantalla */
let wakeOn=false;
function wake(){wakeOn=true;try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(ac&&ac.state!=='running'){try{ac.resume();}catch(e){}}if(wakeOn)wake();});
function setMute(m){muted=m;try{localStorage.setItem('camgames-mute',m?'1':'0');}catch(e){}if(master)master.gain.setTargetAtTime(m?0:1,ac.currentTime,.05);const b=$('#snd');if(b)b.innerHTML=m?ICON_OFF:ICON_ON;}
const ICON_ON='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function tone(f,d=.12,type='sine',vol=.15,slide=0,at=0,dest){
  if(!ac)return;const t=(at||ac.currentTime),o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.02);
}
function noise(d=.1,vol=.1,hp=4000,at=0,dest){
  if(!ac)return;const t=at||ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+d+.02);
}
const sfx={
  ok(){tone(660,.1,'triangle',.16);setTimeout(()=>tone(990,.16,'triangle',.16),80);},
  perfect(){[660,880,1320,1760].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.15),i*70));},
  bad(){tone(160,.5,'sawtooth',.22,-110);noise(.35,.25,300);},
  boom(){tone(90,.6,'sine',.5,-60);noise(.5,.35,150);},
  tick(){tone(1200,.04,'square',.05);},
  whoosh(){if(!ac)return;const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;f.type='bandpass';f.Q.value=1.2;
    f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3000,t+.35);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.3,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+.45);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.5);},
  calib(){tone(520,.1,'triangle');setTimeout(()=>tone(780,.14,'triangle'),80);},
  count(n){tone(n?660:1320,n?.15:.4,'square',.08);}
};
/* música: secuenciador sencillo (bombo, charles, bajo y arpegio) */
const music={g:null,next:0,step:0,bpm:116,prog:[[110,130.8,164.8],[87.3,110,130.8],[130.8,164.8,196],[98,123.5,146.8]],lead:true,
  start(){if(!ac||this.g)return;this.g=ac.createGain();this.g.gain.value=0;this.g.gain.linearRampToValueAtTime(.55,ac.currentTime+1);this.g.connect(master);this.next=ac.currentTime+.1;this.step=0;},
  stop(){if(!this.g)return;const g=this.g;g.gain.setTargetAtTime(0,ac.currentTime,.2);setTimeout(()=>{try{g.disconnect();}catch(e){}},800);this.g=null;},

    let w=0,h=0;auraOn=[false,false];
    ms.forEach((m,i)=>{
      const slot=maskSlot[i];if(slot==null||slot<0||slot>1)return;
      w=m.width;h=m.height;const f=m.getAsFloat32Array(),c=mCvs[slot],x=mCxs[slot];
      if(c.width!==w||c.height!==h){c.width=w;c.height=h;mImgs[slot]=x.createImageData(w,h);}
      const u=new Uint32Array(mImgs[slot].data.buffer);
      for(let k=0;k<f.length;k++){const v=f[k];const a=v<.3?0:v>.7?255:((v-.3)*637)|0;u[k]=(a<<24)|0xffffff;}
      x.putImageData(mImgs[slot],0,0);auraOn[slot]=true;

    mCx.globalCompositeOperation='copy';let first=true;
    for(let k=0;k<2;k++){if(!auraOn[k])continue;mCx.globalCompositeOperation=first?'copy':'lighter';mCx.drawImage(mCvs[k],0,0);first=false;}

function coverMap(){const vw=video.videoWidth||16,vh=video.videoHeight||9,s=Math.max(W/vw,H/vh);return{vw,vh,s,ox:(W-vw*s)/2,oy:(H-vh*s)/2};}

  if(!prev)return{j:out,f:fo,lost:0};
  prev.lost=0;prev.j=prev.j.map((o,i)=>({x:o.x+(out[i].x-o.x)*.55,y:o.y+(out[i].y-o.y)*.55,v:out[i].v}));
  prev.f=(prev.f||fo).map((o,i)=>({x:o.x+(fo[i].x-o.x)*.8,y:o.y+(fo[i].y-o.y)*.8,v:fo[i].v}));return prev;

const hipX=j=>(j[7].x+j[8].x)/2;

  if(demo||!landmarker||!camOK||video.readyState<2||video.currentTime===lastVT)return;

  const slotOf=new Array(dets.length).fill(-1);
  if(players===1){if(dets.length)slotOf[0]=0;}
  else if(dets.length===2){
    const x0=hipX(dets[0].j),x1=hipX(dets[1].j);let swap=x0>x1;
    if(bodies[0]&&bodies[1]){const a=Math.abs(x0-hipX(bodies[0].j))+Math.abs(x1-hipX(bodies[1].j)),b=Math.abs(x1-hipX(bodies[0].j))+Math.abs(x0-hipX(bodies[1].j));swap=b<a;}

/* ---------- cuerpos virtuales para la demo: cada uno va a por lo que le toca ---------- */
function wantsItem(pi,it){
  if(it.t.k==='bomb')return false;
  if(np===1)return true;
  if(gm2==='duelo')return it.p===pi;
  if(gm2==='ataque')return it.p<0||it.p===pi;
  return true;
}
function demoBody(pi,dt){
  const d=dh[pi],cx0=np===1?W/2:W*(pi?.72:.28);
  const c=items.filter(i=>wantsItem(pi,i)&&i.y>-i.s&&(np===1||Math.abs(i.x-cx0)<W*.32)).sort((a,b)=>b.y-a.y);
  for(let h=0;h<2;h++){
    const tg=c[h],q=d[h];
    let tx=cx0+(h?1:-1)*W*.12,ty=H*.6;
    if(tg){tx=tg.x;ty=clamp(tg.y,H*.3,H*.82);}
    let dx=tx-q.x,dy=ty-q.y;const L=Math.hypot(dx,dy),mx=H*1.5*dt;
    if(L>mx){dx*=mx/L;dy*=mx/L;}
    /* esquivar las bombas */
    for(const bm of items){if(bm.t.k!=='bomb'||bm.dead)continue;const ex=q.x-bm.x,ey=q.y-bm.y,D=Math.hypot(ex,ey)||1;if(D<bm.s*1.9){const f=(bm.s*1.9-D)*.9;dx+=ex/D*f;dy+=ey/D*f;}}
    q.x+=dx;q.y+=dy;
  }
  const a=d[0].x<d[1].x?d[0]:d[1],b=a===d[0]?d[1]:d[0];
  const cx=cx0+((a.x+b.x)/2-cx0)*.15,sy=H*.42,Pt=(x,y)=>({x,y,v:1});
  const s1=Pt(cx-H*.09,sy),s2=Pt(cx+H*.09,sy);
  return[Pt(cx,H*.28),s1,s2,Pt((s1.x+a.x)/2,(s1.y+a.y)/2+H*.04),Pt((s2.x+b.x)/2,(s2.y+b.y)/2+H*.04),Pt(a.x,a.y),Pt(b.x,b.y),
    Pt(cx-H*.06,H*.66),Pt(cx+H*.06,H*.66),Pt(cx-H*.07,H*.8),Pt(cx+H*.07,H*.8),Pt(cx-H*.07,H*.94),Pt(cx+H*.07,H*.94)];
}
/* manos de cada jugador: la muñeca prolongada un poco hacia la palma */
function getHands(dt){
  const out=[];demoJ=[null,null];
  if(mode==='touch'){let i=0;for(const p of ptrs.values()){const pi=np===2?(p.x<W/2?0:1):0;out.push({id:'t'+(i++),p:pi,x:p.x,y:p.y,r:Math.max(H*.1,54)});}return out;}
  for(let pi=0;pi<np;pi++){
    const j=mode==='demo'?(demoJ[pi]=demoBody(pi,dt)):(bodies[pi]&&bodies[pi].j);
    if(!j)continue;
    const sh=Math.hypot(j[1].x-j[2].x,j[1].y-j[2].y)||H*.2;
    const r=clamp(sh*.5,H*.07,H*.13);
    [[5,3],[6,4]].forEach(([w,e],k)=>{const wr=j[w],eb=j[e];if(wr.v<.3)return;out.push({id:pi*2+k,p:pi,x:wr.x+(wr.x-eb.x)*.25,y:wr.y+(wr.y-eb.y)*.25,r});});
  }
  return out;
}
const bodyOf=pi=>mode==='demo'?demoJ[pi]:(bodies[pi]&&bodies[pi].j);

/* ---------- sprites de los objetos: burbuja brillante con el emoji dentro ---------- */
let spr={},sprKey='';
function sprite(t,owner){
  const s=size(),k=s+'|'+DPR;if(k!==sprKey){spr={};sprKey=k;}
  const key=t.k+t.e+(owner>=0?owner:'');if(spr[key])return spr[key];
  const R=s*(t.k==='mega'?1.05:.62),pad=s*.4,D=(R+pad)*2,c=mkCanvas(D*DPR,D*DPR),g=c.getContext('2d');
  g.scale(DPR,DPR);g.translate(D/2,D/2);
  const col=owner>=0?PC[owner]:RIM[t.k];
  g.shadowColor=col;g.shadowBlur=pad*.85;g.beginPath();g.arc(0,0,R,0,7);g.fillStyle=col;g.fill();g.shadowBlur=0;
  const bg=g.createRadialGradient(-R*.35,-R*.4,R*.05,0,0,R);
  if(t.k==='bomb'){bg.addColorStop(0,'#6a2036');bg.addColorStop(1,'#16040b');}
  else if(t.k==='gold'){bg.addColorStop(0,'#fffbe6');bg.addColorStop(.55,'#ffe680');bg.addColorStop(1,'#ffb300');}
  else{bg.addColorStop(0,'#ffffff');bg.addColorStop(.65,'#f7f4ff');bg.addColorStop(1,owner>=0?PCL[owner]:TINT[t.k]);}
  g.beginPath();g.arc(0,0,R,0,7);g.fillStyle=bg;g.fill();
  g.lineWidth=R*.14;g.strokeStyle=col;g.stroke();
  if(t.k==='mega'){g.lineWidth=R*.06;g.setLineDash([R*.25,R*.12]);g.strokeStyle='#35f0ff';g.beginPath();g.arc(0,0,R*1.12,0,7);g.stroke();g.strokeStyle='#ff3d8b';g.beginPath();g.arc(0,0,R*1.12,Math.PI*.5,Math.PI*1.5);g.stroke();g.setLineDash([]);}
  g.lineWidth=R*.05;g.strokeStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(0,0,R*1.07,-2.6,-1.2);g.stroke();
  g.font=Math.round(R*1.26)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';g.textAlign='center';g.textBaseline='middle';
  g.shadowColor='rgba(0,0,0,.25)';g.shadowBlur=4;g.shadowOffsetY=2;g.fillText(t.e,0,R*.05);g.shadowColor='transparent';
  g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.ellipse(-R*.36,-R*.52,R*.36,R*.15,-.55,0,7);g.fill();
  return spr[key]={c,D};
}

/* ---------- paisaje: atardecer de neón con aurora, sol a rayas, montañas con parallax, palmeras y rejilla ---------- */
let sky=null,skyGrad=null,mtn=[],palmCv=null,hz=0,sceneKey='',shoot=null;
function buildScene(){
  const k=W+'x'+H+'|'+DPR;if(k===sceneKey)return;sceneKey=k;
  hz=H*.64;
  sky=mkCanvas(W*DPR,H*DPR);const g=sky.getContext('2d');g.scale(DPR,DPR);
  const stops=[[0,'#120a4a'],[.4,'#4a2290'],[.75,'#c8448f'],[.92,'#ff8a6b'],[1,'#ffc27a']];
  const sg=g.createLinearGradient(0,0,0,hz);stops.forEach(([o,c])=>sg.addColorStop(o,c));g.fillStyle=sg;g.fillRect(0,0,W,hz+2);
  skyGrad=ctx.createLinearGradient(0,0,0,hz);stops.forEach(([o,c])=>skyGrad.addColorStop(o,c));
  const fg=g.createLinearGradient(0,hz,0,H);fg.addColorStop(0,'#2a1260');fg.addColorStop(.25,'#160a40');fg.addColorStop(1,'#07041a');g.fillStyle=fg;g.fillRect(0,hz,W,H-hz);
  /* montañas: tres capas más anchas que la pantalla para el parallax */
  const L=[['#8a3fa6','rgba(255,170,210,.55)',.22,.11],['#5a2690','rgba(255,140,200,.4)',.15,.16],['#2f1466','rgba(200,120,255,.35)',.09,.22]];
  mtn=L.map(([c,rim,amp,step],li)=>{
    const w=W*1.25,cc=mkCanvas(w*DPR,(hz+4)*DPR),x=cc.getContext('2d');x.scale(DPR,DPR);
    const pts=[];const n=Math.ceil(1/step*1.25)+2;
    for(let i=0;i<=n;i++){const px=i*W*step,top=hz-(H*amp)*(.4+.6*rnd(i*3+li*17));pts.push([px-W*step*.5,hz-(H*amp)*(.15+.25*rnd(i*5+li*11))],[px,top]);}
    x.beginPath();x.moveTo(0,hz+4);for(const[a,b]of pts)x.lineTo(a,b);x.lineTo(w,hz+4);x.closePath();
    const mg=x.createLinearGradient(0,hz-H*amp,0,hz);mg.addColorStop(0,c);mg.addColorStop(1,'#1a0b44');x.fillStyle=mg;x.fill();
    x.strokeStyle=rim;x.lineWidth=2;x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.stroke();
    return cc;
  });
  /* palmera (silueta con brillo de contorno) */
  const ph=Math.min(H*.6,W*.5),pw=ph*.9;palmCv=mkCanvas(pw*DPR,ph*DPR);const p=palmCv.getContext('2d');p.scale(DPR,DPR);
  const bx=pw*.3,tx=pw*.5,ty=ph*.12;
  p.lineCap='round';p.strokeStyle=p.fillStyle='#0d0626';p.shadowColor='rgba(255,90,170,.6)';p.shadowBlur=10;
  p.lineWidth=ph*.05;p.beginPath();p.moveTo(bx,ph);p.quadraticCurveTo(bx+ph*.02,ph*.5,tx,ty);p.stroke();
  for(let k2=0;k2<8;k2++){const a=-Math.PI/2+(k2-3.5)*.5,Lf=ph*(.36+.1*rnd(k2+3));
    p.lineWidth=ph*.035;p.beginPath();p.moveTo(tx,ty);p.quadraticCurveTo(tx+Math.cos(a)*Lf*.6,ty+Math.sin(a)*Lf*.6-ph*.07,tx+Math.cos(a)*Lf,ty+Math.sin(a)*Lf+ph*.14);p.stroke();
    for(let q=1;q<6;q++){const u=q/6,fx=tx+Math.cos(a)*Lf*u,fy=ty+Math.sin(a)*Lf*u-ph*.05*Math.sin(u*Math.PI)+ph*.14*u*u;p.lineWidth=ph*.012;p.beginPath();p.moveTo(fx,fy);p.lineTo(fx+Math.cos(a+1.2)*ph*.05,fy+ph*.05);p.stroke();}}
  p.beginPath();p.arc(tx,ty+ph*.02,ph*.03,0,7);p.fill();
}
function drawSun(now){
  const R=Math.min(W,H)*.21,x=W/2-par*W*.015,y=hz-R*.5;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.5+.08*Math.sin(now/700);
  const s=R*4.4;ctx.drawImage(tintDot('#ff9a5c'),x-s/2,y-s/2,s,s);ctx.restore();
  ctx.save();ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.clip();
  const g=ctx.createLinearGradient(0,y-R,0,y+R);g.addColorStop(0,'#fffbb0');g.addColorStop(.45,'#ffc65c');g.addColorStop(.8,'#ff6a7a');g.addColorStop(1,'#ff3d9b');
  ctx.fillStyle=g;ctx.fillRect(x-R,y-R,R*2,R*2);
  ctx.fillStyle=skyGrad;
  for(let k=0;k<8;k++){const p=((k+now*.00022)%8)/8,yy=y-R*.05+p*R*1.1,h=R*(.015+p*.1);ctx.fillRect(x-R,yy,R*2,h);}
  ctx.restore();
}
function drawAurora(now){
  ctx.save();ctx.globalCompositeOperation='lighter';
  const cols=['93,255,154','53,240,255','255,61,180'];
  for(let b=0;b<3;b++){
    const base=H*(.09+b*.075),amp=H*.035,hh=H*(.075+b*.015),ys=[];
    for(let i=0;i<=24;i++)ys.push(base+Math.sin(i*.55+now/1500+b*2)*amp+Math.sin(i*.21-now/2600)*amp*.8);
    const gr=ctx.createLinearGradient(0,base-hh-amp,0,base+hh+amp);gr.addColorStop(0,'rgba('+cols[b]+',0)');gr.addColorStop(.5,'rgba('+cols[b]+','+(.11+.04*Math.sin(now/900+b))+')');gr.addColorStop(1,'rgba('+cols[b]+',0)');
    ctx.fillStyle=gr;ctx.beginPath();
    for(let i=0;i<=24;i++)ctx.lineTo(i/24*W,ys[i]-hh);
    for(let i=24;i>=0;i--)ctx.lineTo(i/24*W,ys[i]+hh);
    ctx.fill();

}
function drawStars(now,dt){

  if(shoot){shoot.t+=dt;const L=W*.18,k=shoot.t/.9,hx=shoot.x+Math.cos(shoot.a)*W*.35*k,hy=shoot.y+Math.sin(shoot.a)*W*.35*k;
    const g=ctx.createLinearGradient(hx,hy,hx-Math.cos(shoot.a)*L,hy-Math.sin(shoot.a)*L);g.addColorStop(0,'rgba(255,255,255,'+(1-k)+')');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=g;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx-Math.cos(shoot.a)*L,hy-Math.sin(shoot.a)*L);ctx.stroke();if(k>=1)shoot=null;}
}
function drawGrid(now){

let gridPh=0;

/* ---------- zonas de los jugadores (duelo: mitades; ataque: mitades solapadas) ---------- */
function zone(pi){
  const s=size();
  if(np===2&&gm2==='duelo')return pi?[W/2+s*.8,W-s]:[s,W/2-s*.8];
  if(np===2&&gm2==='ataque')return pi?[W*.4,W-s]:[s,W*.6];
  return[s,W-s];
}
function drawArena(now){
  if(state==='menu'||!versus())return;
  if(gm2==='duelo'){
    const x=W/2,a=.55+.25*Math.sin(now/300);
    ctx.save();ctx.globalCompositeOperation='lighter';
    const g=ctx.createLinearGradient(x-W*.14,0,x+W*.14,0);g.addColorStop(0,'rgba(53,240,255,0)');g.addColorStop(.5,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,61,139,0)');
    ctx.fillStyle=g;ctx.fillRect(x-W*.14,0,W*.28,H);
    ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.setLineDash([18,14]);ctx.lineDashOffset=-now/25;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);
    ctx.font=Math.round(H*.05)+'px "Lilita One",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(53,240,255,.22)';ctx.fillText('JUGADOR 1',W*.25,H*.08);ctx.fillStyle='rgba(255,61,139,.22)';ctx.fillText('JUGADOR 2',W*.75,H*.08);
    for(let pi=0;pi<2;pi++)if(P[pi].out){ctx.fillStyle='rgba(0,0,10,.45)';ctx.fillRect(pi?W/2:0,0,W/2,H);ctx.fillStyle='rgba(255,255,255,.7)';ctx.font=Math.round(H*.08)+'px "Lilita One",system-ui,sans-serif';ctx.fillText('ELIMINADO',W*(pi?.75:.25),H/2);}
    ctx.restore();
  }
  /* borde que brilla cuando un jugador sufre un ataque */
  for(let pi=0;pi<2;pi++)if(zapGlow[pi]>0){ctx.save();ctx.globalAlpha=zapGlow[pi]*(.5+.5*Math.sin(now/60));const g=ctx.createLinearGradient(pi?W:0,0,pi?W*.6:W*.4,0);g.addColorStop(0,'rgba(255,217,61,.55)');g.addColorStop(1,'rgba(255,217,61,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();}
}

/* ---------- objetos ---------- */
function pickType(){
  if(Math.random()<Math.min(.26,.10+elapsed*.0028))return BOMB;
  let r=Math.random()*TOT_W;
  for(const t of TYPES){if((r-=t.w)<=0)return t.k==='heart'&&P.every(p=>p.lives>=5)?TYPES[0]:t;}
  return TYPES[0];
}
function mkItem(t,x,speedK=1,owner=-1){
  const s=size()*(t.k==='mega'?1.7:1),[x0,x1]=owner>=0?zone(owner):[s,W-s];
  return{t,s,p:owner,x:x??x0+Math.random()*(x1-x0),y:-s,vy:H*Math.min(.62,.30+elapsed*.0055)*(.85+Math.random()*.35)*speedK,vx:(Math.random()-.5)*W*.03,rot:Math.random()*6,spin:(Math.random()-.5)*3,ph:Math.random()*6,dead:false};
}
function spawnOne(){
  if(np===1){items.push(mkItem(pickType()));return;}
  if(gm2==='coop'){items.push(mkItem(pickType()));return;}
  /* duelo y ataque: se alterna el dueño para que sea justo; en ataque las bombas y los extras son de nadie */
  let owner=spawnSide;spawnSide=1-spawnSide;
  if(P[owner].out){owner=1-owner;if(P[owner].out)return;}
  let t=pickType();
  if(gm2==='ataque'){
    if(Math.random()<.12)t=Math.random()<.5?STORM:ZAP;
    const neutral=t.k==='bomb'||t.k==='heart'||t.k==='slow';
    items.push(mkItem(t,undefined,1,neutral?-1:owner));
    if(neutral)items[items.length-1].x=size()+Math.random()*(W-2*size());
  }else items.push(mkItem(t,undefined,1,owner));
}
function kOf(it,now){
  const pi=it.p>=0?it.p:0;
  if(solo())return now<P[0].slow?.45:1;
  if(it.p<0)return 1;
  return (now<P[pi].slow?.45:1)*(now<P[pi].fast?1.8:1);
}
function drawItem(it,k){
  const sp=sprite(it.t,gm2==='ataque'&&np===2?it.p:-1),D=sp.D,bomb=it.t.k==='bomb';
  const sc=clamp((it.y+it.s*1.2)/(it.s*1.2),.35,1)*(bomb?1+Math.sin(it.ph*12)*.06:1);
  if(!lowFx)for(let i=3;i>=1;i--){ctx.globalAlpha=.09*(4-i);const q=sc*(1-i*.09),tx=it.x-it.vx*k*.03*i,ty=it.y-it.vy*k*.03*i;ctx.drawImage(sp.c,tx-D*q/2,ty-D*q/2,D*q,D*q);}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(it.x,it.y);ctx.rotate(Math.sin(it.rot)*.35);ctx.scale(sc,sc);ctx.drawImage(sp.c,-D/2,-D/2,D,D);ctx.restore();
  if(bomb){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.ph*2);ctx.setLineDash([it.s*.18,it.s*.14]);ctx.lineWidth=3;ctx.strokeStyle='rgba(255,50,70,'+(.45+.45*Math.sin(it.ph*12))+')';
    ctx.beginPath();ctx.arc(0,0,it.s*.85*sc,0,7);ctx.stroke();ctx.restore();
    if(Math.random()<.5)parts.push({x:it.x+it.s*.28,y:it.y-it.s*.42,vx:(Math.random()-.5)*120,vy:-60-Math.random()*120,life:.5,dec:2.5,c:Math.random()<.5?'#ffd93d':'#ff7a1f',r:2+Math.random()*2,g:300,k:'dot',rot:0});}

/* ---------- bucle de juego ---------- */
function update(dt,now){
  elapsed+=dt;timeLeft-=dt;
  spawnT-=dt;
  if(spawnT<=0){spawnOne();spawnT=Math.max(.36,.9-elapsed*.009)*(.7+Math.random()*.6)*(anyFever()?.75:1)*(np===2&&gm2!=='coop'?.55:np===2?.8:1);}
  if(np===2&&gm2==='coop'){megaT-=dt;if(megaT<=0){megaT=9+Math.random()*4;const m=mkItem(MEGA,W*(.35+Math.random()*.3),.55);m.vx=0;items.push(m);toast('¡COGEDLA LOS DOS!','good');}}
  hands=getHands(dt);
  for(const it of items){
    if(it.dead)continue;
    const k=kOf(it,now);
    it.y+=it.vy*k*dt;it.x+=it.vx*k*dt;it.rot+=it.spin*dt;it.ph+=dt;
    if(it.p>=0&&np===2&&gm2==='duelo'){const[x0,x1]=zone(it.p);if(it.x<x0){it.x=x0;it.vx=Math.abs(it.vx);}if(it.x>x1){it.x=x1;it.vx=-Math.abs(it.vx);}}
    if(it.t.k==='mega'){
      if(it.y>H+it.s){it.dead=true;const p=P[0];if(p.combo>0){p.combo=0;setAura();hud();}pop(it.x,H-60,'✗','#ff8a8a',.8);continue;}
      /* hace falta una mano de cada jugador a la vez */
      const near=[false,false];for(const h of hands)if(Math.hypot(it.x-h.x,it.y-h.y)<h.r+it.s*.4)near[h.p]=true;
      it.touch=near[0]&&near[1]?3:near[0]?1:near[1]?2:0;
      if(near[0]&&near[1])grab(it,hands[0],now);
      continue;
    }
    for(const h of hands){
      if(np===2&&gm2==='duelo'&&it.p!==h.p)continue;
      if(versus()&&P[h.p].out)continue;
      if(Math.hypot(it.x-h.x,it.y-h.y)<h.r+it.s*.35){grab(it,h,now);break;}
    }
    if(state!=='play')break;
    if(!it.dead&&it.y>H+it.s){
      it.dead=true;
      if(it.t.k==='fruit'||it.t.k==='gold'||it.t.k==='mega'){const p=P[solo()?0:Math.max(0,it.p)];if(p.combo>0){p.combo=0;setAura();hud();tone(200,.18,'sine',.08,-60);}pop(it.x,H-60,'✗','#ff8a8a',.8);}
    }
  }
  items=items.filter(i=>!i.dead);
  for(let pi=0;pi<2;pi++)zapGlow[pi]=Math.max(0,zapGlow[pi]-dt*.25);
  if(timeLeft<=10&&!last10){last10=true;toast('¡ÚLTIMOS 10!','bad');music.bpm=132;}
  if(timeLeft<=0){timeLeft=0;endGame('¡Tiempo!');}
  if(mode==='cam'){
    for(let pi=0;pi<np;pi++)noBodyT[pi]=bodies[pi]||(versus()&&P[pi].out)?0:noBodyT[pi]+dt;
    const msg=np===1?(noBodyT[0]>.8?'¡No te veo!':''):noBodyT[0]>.8&&noBodyT[1]>.8?'¡No os veo!':noBodyT[0]>.8?'Jugador 1, ¡no te veo!':noBodyT[1]>.8?'Jugador 2, ¡no te veo!':'';
    if(msg){bigText(msg);$('#big').classList.toggle('small',np===2);}else if(/veo/.test($('#big').textContent)){bigText('');$('#big').classList.remove('small');}
  }
  const sec=Math.ceil(timeLeft);if(sec!==lastSec){lastSec=sec;hud();if(sec<=5&&sec>0)sfx.tick();}
}
function drawSkeleton(){
  if(mode==='cam')return;  /* con cámara real te ves a ti, sin esqueleto */
  const B=[[1,2],[1,3],[3,5],[2,4],[4,6],[1,7],[2,8],[7,8],[7,9],[9,11],[8,10],[10,12]];
  for(let pi=0;pi<np;pi++){const j=demoJ[pi];if(!j)continue;
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=handCol(pi);const lw=Math.max(6,H*.012);
    ctx.beginPath();for(const[a,b]of B){ctx.moveTo(j[a].x,j[a].y);ctx.lineTo(j[b].x,j[b].y);}ctx.moveTo(j[0].x+H*.045,j[0].y);ctx.arc(j[0].x,j[0].y,H*.045,0,7);
    ctx.globalAlpha=.25;ctx.lineWidth=lw*3;ctx.stroke();ctx.globalAlpha=.9;ctx.lineWidth=lw;ctx.stroke();ctx.restore();}
}
function drawHands(now){
  if(!hands.length){trails={};return;}
  const seen={};
  for(const h of hands){const t=trails[h.id]||(trails[h.id]=[]);t.push({x:h.x,y:h.y});if(t.length>14)t.shift();seen[h.id]=1;}
  for(const k in trails)if(!seen[k])delete trails[k];
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  if(!lowFx)for(const h of hands){const t=trails[h.id];ctx.strokeStyle=handCol(h.p);for(let i=1;i<t.length;i++){const u=i/t.length;ctx.globalAlpha=u*.5;ctx.lineWidth=u*h.r*.7;ctx.beginPath();ctx.moveTo(t[i-1].x,t[i-1].y);ctx.lineTo(t[i].x,t[i].y);ctx.stroke();}}
  ctx.globalAlpha=1;
  for(const h of hands){const s=h.r*1.9;ctx.globalAlpha=.75;ctx.drawImage(tintDot(handCol(h.p)),h.x-s,h.y-s,s*2,s*2);}
  ctx.restore();
  for(const h of hands){
    const col=handCol(h.p),fv=fever(solo()?0:h.p);
    ctx.save();ctx.translate(h.x,h.y);
    ctx.fillStyle='rgba(255,255,255,.10)';ctx.beginPath();ctx.arc(0,0,h.r,0,7);ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(0,0,h.r,0,7);ctx.stroke();
    ctx.rotate(now/260);ctx.strokeStyle=fv&&np===2?'#ffd93d':col;ctx.beginPath();
    for(let q=0;q<3;q++){ctx.moveTo(Math.cos(q*2.09)*(h.r+7),Math.sin(q*2.09)*(h.r+7));ctx.arc(0,0,h.r+7,q*2.09,q*2.09+1.1);}
    ctx.globalAlpha=.35;ctx.lineWidth=16;ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=7;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();
    if(np===2){ctx.rotate(-now/260);ctx.fillStyle=col;ctx.font='bold '+Math.round(h.r*.5)+'px Nunito,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h.p?'2':'1',0,-h.r-16);}
    ctx.restore();
  }
}
function frame(now){
  requestAnimationFrame(frame);

  }
  for(const a of amb){a.y+=a.vy*dt;a.rot+=a.spin*dt;a.ph+=dt;}amb=amb.filter(a=>a.y<H+a.s);
  if(state==='play'&&amb.length)amb=[];
  if(P.length){for(let pi=0;pi<2;pi++){const p=P[pi];p.shown=lerp(p.shown,p.score,Math.min(1,dt*10));const sv=Math.round(p.shown),e=pi?el.score2:el.score;if(e.textContent!==String(sv))e.textContent=sv;}}
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake*26,(Math.random()-.5)*shake*26);shake=Math.max(0,shake-dt*3);}

}

  if(demo){el.msg.textContent='Modo demo: unas manos virtuales juegan solas.';el.btn.textContent='VER DEMO';el.btn.disabled=false;return;}
  try{await initModel();el.msg.textContent='¡Listo! Pulsa jugar y permite la cámara.';el.btn.textContent='¡JUGAR!';el.btn.disabled=false;}
  catch(e){console.error(e);el.msg.textContent='No he podido cargar el detector de poses (¿sin conexión?). Puedes jugar con el ratón o el dedo.';el.btn.textContent='Reintentar';el.btn.disabled=false;el.btn.onclick=()=>location.reload();}
})();
</script>
</body>
