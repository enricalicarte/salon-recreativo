tick = dt => { tickRondes(dt); panells.forEach((p, i) => { p.scale.lerp(new THREE.Vector3(1,1,1), dt * 8); p.rotation.y = Math.sin(rellotge.elapsedTime * 1.5 + i) * .05;

let ronda = 0, punts = 0, viu = false, bloquejat = false, ratxa = 0, tempsRonda = 0, tempsMax = 12;
const N_RONDES = (window.CQ && CQ.repte) ? 10 : 100, PER_NIVELL = 10; let ronda0 = 0; // 10 preguntes per nivell × 10 nivells
let quizAcabat = false, nivell = 0, encertsNivell = 0, puntsNivell = 0, millorNivell = Number(localStorage.getItem('catquiz-' + JOC + '-niv') || 0);
const usades = new Set(); // cap pregunta repetida dins d'una partida
function noRepetida(llista, clau){ const lliures = llista.filter(x => !usades.has(clau(x))); const b = lliures.length ? lliures : llista; const x = window.CQ ? CQ.tria(b) : tria(b); usades.add(clau(x)); return x; }
const barra = document.getElementById('barra');
function comenca(){ ronda0 = (window.CQ && CQ.escola) ? CQ.nivellInici * PER_NIVELL : 0; ronda = ronda0; punts = 0; if (window.CQ) CQ.res = []; ratxa = 0; encerts = 0; encertsNivell = 0; puntsNivell = 0; usades.clear(); document.getElementById('punts').textContent = 0; aplicaTema(0);
  document.getElementById('inici').hidden = true; document.getElementById('final').hidden = true; so('clic'); viu = true; novaRonda(); }
function acaba(){ viu = false; so('win'); avisa('fi');
  const clau = 'catquiz-' + JOC, millor = Math.max(Number(localStorage.getItem(clau) || 0), punts); localStorage.setItem(clau, millor);
  document.getElementById('punts-final').textContent = punts;
  document.getElementById('text-final').textContent = ((window.CQ && CQ.repte) ? '' : (punts >= millor && punts > 0 ? 'Nou rècord! ' : `El teu rècord és ${millor}. `)) + ((window.CQ && CQ.repte) ? `Repte del dia: ${encerts} de 10 encertades.` : `Has completat ${Math.floor((ronda-ronda0)/PER_NIVELL)} nivells · ${encerts} de ${ronda-ronda0} encertades.`);
  document.getElementById('titol-final').textContent = encerts === N_RONDES ? 'Perfecte!' : encerts >= 7 ? 'Molt bé!' : encerts >= 4 ? 'No està malament' : 'A practicar!';
  document.getElementById('final').hidden = QUIZ && DEMO; if (DEMO) setTimeout(comenca, QUIZ ? 6000 : 2500); }
let encerts = 0;
async function novaRonda(){ if (quizAcabat) return; if (ronda >= N_RONDES) return acaba(); ronda++; bloquejat = true; tempsRonda = tempsMax;
  const nou = Math.floor((ronda - 1) / PER_NIVELL); // 0..9
  if (window.CQ && CQ.repte) { nivell = ronda - 1; if (ronda === 1) aplicaTema(0); }
  else if (nou !== nivell || ronda === ronda0 + 1) {
    if (ronda > ronda0 + 1) { // resum del nivell acabat: estrelles + bonus per nivell perfecte
      const estr = encertsNivell >= 10 ? 3 : encertsNivell >= 7 ? 2 : encertsNivell >= 4 ? 1 : 0, bonus = encertsNivell >= 10 ? 100 : encertsNivell >= 8 ? 40 : 0;
      if (bonus) { punts += bonus; popPunts('punts', punts); }
      if (nivell + 1 > millorNivell) { millorNivell = nivell + 1; localStorage.setItem('catquiz-' + JOC + '-niv', millorNivell); }
      await pantallaNivell(nou + 1, TEMES[nou].nom, `${encertsNivell}/10 encerts · +${puntsNivell + bonus} punts` + (bonus ? ` (${bonus} de bonus!)` : ''), estr, 3000);
    } else await pantallaNivell(1, TEMES[0].nom, '', -1, 1800);
    nivell = nou; encertsNivell = 0; puntsNivell = 0; aplicaTema(nivell);
  }
  bloquejat = false; tempsRonda = tempsMax;
  document.getElementById('ronda').textContent = (window.CQ && CQ.repte) ? `Repte · ${ronda}/10` : `N${nivell+1} · ${((ronda-1)%PER_NIVELL)+1}/${PER_NIVELL}`; popPill('ronda'); prepara();
  if (DEMO) setTimeout(bot, 1300); }
function resultat(ok, punt = 10){ bloquejat = true; if (window.CQ) CQ.marca(ok);
  if (ok) { encerts++; encertsNivell++; ratxa++; const b = ratxa >= 6 ? 3 : ratxa >= 3 ? 2 : 1, guany = punt * b + Math.ceil(tempsRonda); punts += guany; puntsNivell += guany; popPunts('punts', punts); so(b > 1 ? 'bonus' : 'ok'); if (b > 1) mostra(`Ratxa ×${ratxa}! 🔥 (punts ×${b})`, 900); }
  else { ratxa = 0; so('mal'); }
  setTimeout(novaRonda, ok ? 1100 : 2000); }
document.getElementById('btn-inici').onclick = comenca; document.getElementById('btn-reinici').onclick = comenca;
if (DEMO) { document.getElementById('inici').hidden = true; setTimeout(comenca, 500); }
async function bot(){ if (!viu) return; if (bloquejat) { setTimeout(bot, 700); return; }
  if (QUIZ && ronda === 2 && !bot.fet) { bot.fet = true; avisa('quiz'); await espera(5200); }
  if (ronda === 1) bot.fet = false; respostaBot();
  if (QUIZ && bot.fet && ronda === 2) setTimeout(() => { avisa('fi'); quizAcabat = true; }, 1400); } // en mode quiz, el reel acaba després de la revelació
function tickRondes(dt){ if (!viu || bloquejat || (window.CQ && CQ.escola)) return; tempsRonda -= dtReal; if (barra) barra.style.transform = `scaleX(${Math.max(0, tempsRonda / tempsMax)})`;
  if (tempsRonda <= 0) { mostra('Temps!'); fallaTemps(); } }

window.__fi = () => acaba(false); // per a proves automàtiques
function anima(){
  requestAnimationFrame(anima);
  const dtR = Math.min(rellotge.getDelta(), 1); dtReal = dtR; const dt = Math.min(dtR, .05), t = rellotge.elapsedTime;
  mouNuvols(dt); mouConfeti(dt); mouIlles(dt); solMesh.userData.raigs.rotation.z += dt * .15;
  tick(dt, t);
  renderer.render(scene, camera);
}

  c.position.set((Math.random() - .5) * 34, (Math.random() - .5) * 22, -16 - Math.random() * 26); c.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3); c.userData = { vy: .15 + Math.random() * .35, vr: (Math.random() - .5) * .4 }; scene.add(c); CUBS_NEO.push(c); }

(function(){
  var el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen, q = new URLSearchParams(location.search);
  if (!req || q.has('espectador') || q.has('demo') || q.has('video')) return;
