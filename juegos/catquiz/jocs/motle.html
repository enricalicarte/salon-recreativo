function franja(n){ // les paraules estan ordenades de més fàcils a més difícils: cada nivell n'agafa una desena part

  return PARAULES.slice(a, Math.max(a + 5, b)); }

function entra(){
  if (!viu) return;
  if (col < 5) { mostra('Falten lletres'); so('mal'); for (const m of daus[fila]) m.userData.sacseig = .3; return; }
  const intent = graella[fila].join(''), estats = Array(5).fill('no'), resta = secret.split('');
  for (let i = 0; i < 5; i++) if (intent[i] === secret[i]) { estats[i] = 'be'; resta[i] = null; }
  for (let i = 0; i < 5; i++) if (estats[i] !== 'be') { const j = resta.indexOf(intent[i]); if (j > -1) { estats[i] = 'quasi'; resta[j] = null; } }

function feedback(intent, sol){ const e = Array(5).fill('n'), r = sol.split('');

function mida(){
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  // Encaixa la graella (5×6 daus) a l'espai que queda per sobre del teclat i la capçalera
  const tq = document.getElementById('teclat'), rq = tq.getBoundingClientRect(), teclatH = rq.height ? innerHeight - rq.top + 18 : tq.offsetHeight + 24, capH = 70; // tot el que queda per sota de la part de dalt del teclat
  const kb = teclatH / innerHeight, top = capH / innerHeight, lliure = 1 - kb - top;
