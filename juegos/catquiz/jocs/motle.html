<script type="module">
// Pantalla fixa: sense zoom ni desplaçament lateral (gestos de pinça i doble toc bloquejats)

document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let darrerToc = 0; document.addEventListener('touchend', e => { const t = Date.now(); if (t - darrerToc < 300 && !e.target.closest('button,a')) e.preventDefault(); darrerToc = t; }, { passive: false });
addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
import * as THREE from 'three';
await document.fonts.ready;
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';


// ===== Kit d'espectacle (cel-shading, cel, sol, illes flotants, confeti, compte enrere) =====
const grad = new THREE.DataTexture(new Uint8Array([135,135,135,255, 200,200,200,255, 255,255,255,255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = o => new THREE.MeshToonMaterial({ gradientMap: grad, ...o });
const confetis = [], geoConf = new THREE.BoxGeometry(.22, .22, .06), colsConf = [0xFF3E9A, 0xFFD600, 0x33E0FF, 0x7CE800, 0x9B5CFF, 0xFF8C1A];
function confeti(pos, n = 18, forca = 6){ for (let i = 0; i < n; i++) {
  const c = new THREE.Mesh(geoConf, toon({ color: colsConf[i % 6] })); c.position.copy(pos);
  c.userData = { v: new THREE.Vector3((Math.random()-.5)*forca, Math.random()*forca + 2, (Math.random()-.5)*forca), r: new THREE.Vector3(Math.random()*8, Math.random()*8, Math.random()*8), t: 1.2 + Math.random()*.6 };
  scene.add(c); confetis.push(c); } }
function mouConfeti(dt){ for (let i = confetis.length-1; i >= 0; i--) { const c = confetis[i]; c.userData.t -= dt; c.userData.v.y -= 14 * dt;
  c.position.addScaledVector(c.userData.v, dt); c.rotation.x += c.userData.r.x*dt; c.rotation.y += c.userData.r.y*dt; c.scale.setScalar(Math.min(1, c.userData.t*2));
  if (c.userData.t <= 0) { scene.remove(c); confetis.splice(i, 1); } } }
function celISol(){
  const g = new THREE.SphereGeometry(180, 24, 16), col = [], p = g.attributes.position, dalt = new THREE.Color(0x1E7BE0), baix = new THREE.Color(0xBDF0FF);
  for (let i = 0; i < p.count; i++) { const k = THREE.MathUtils.clamp(p.getY(i) / 180 * .5 + .5, 0, 1); const c = baix.clone().lerp(dalt, Math.pow(k, .7)); col.push(c.r, c.g, c.b); }

  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
  const sol = new THREE.Mesh(new THREE.SphereGeometry(7, 20, 14), new THREE.MeshBasicMaterial({ color: 0xFFF4A0, fog: false })); sol.position.set(-45, 55, -120); scene.add(sol);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(11, 20, 14), new THREE.MeshBasicMaterial({ color: 0xFFE060, transparent: true, opacity: .35, fog: false })); sol.add(halo);
  const raigs = new THREE.Group(); for (let i = 0; i < 12; i++) { const r = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 26), new THREE.MeshBasicMaterial({ color: 0xFFE060, transparent: true, opacity: .18, side: THREE.DoubleSide, fog: false })); r.rotation.z = i * Math.PI/6; raigs.add(r); }
  sol.add(raigs); sol.userData.raigs = raigs; return sol;
}
const illes = [];
function illa(x, y, z, s = 1){ const g = new THREE.Group();
  const top = contorn(new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2, .7, 9), toon({ color: 0x7CE800 })), .04); g.add(top);
  const base = contorn(new THREE.Mesh(new THREE.ConeGeometry(2, 3, 9), toon({ color: 0xA8683A })), .04); base.rotation.x = Math.PI; base.position.y = -1.8; g.add(base);
  for (let i = 0; i < 2; i++) { const tr = new THREE.Mesh(new THREE.CylinderGeometry(.15, .2, 1), toon({ color: 0x8A5A2B })); tr.position.set(-.8 + i*1.5, .8, (i-.5)*.8); g.add(tr);
    const cop = contorn(new THREE.Mesh(new THREE.SphereGeometry(.7 + Math.random()*.3, 12, 10), toon({ color: [0x4CD100, 0xFF3E9A, 0xFFD600][Math.floor(Math.random()*3)] })), .06); cop.position.set(tr.position.x, 1.6, tr.position.z); g.add(cop); }
  g.position.set(x, y, z); g.scale.setScalar(s); g.userData = { y0: y, f: Math.random()*6 }; scene.add(g); illes.push(g); return g; }
let tKit = 0; function mouIlles(dt){ tKit += dt; for (const g of illes) { g.position.y = g.userData.y0 + Math.sin(tKit * .8 + g.userData.f) * .35; g.rotation.y += dt * .05; } }
function compte(fi){ const el = document.createElement('div'); el.className = 'compte'; document.body.appendChild(el); let n = 3;
  const tic = () => { el.textContent = n > 0 ? n : 'JA!'; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); so(n > 0 ? 'clic' : 'win'); if (n-- > 0) setTimeout(tic, 650); else { setTimeout(() => el.remove(), 600); fi(); } }; tic(); }
function popPill(id){ const e = document.getElementById(id); if (!e) return; e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
// Estil Stumble Guys: contorn (casc invertit) i núvols de fons
const matContorn = new THREE.MeshBasicMaterial({ color: 0x1D2B64, side: THREE.BackSide });
function contorn(m, g = .06){ const c = new THREE.Mesh(m.geometry, matContorn); c.scale.setScalar(1 + g); c.renderOrder = -1; m.add(c); return m; }
const matNuvol = toon({ color: 0xFFFFFF });
function nuvol(x, y, z, s = 1){ const n = new THREE.Group();
  for (const [dx, dy, r] of [[0,0,1],[1.1,.2,.8],[-1.1,.1,.75],[.4,.55,.7],[-.5,.5,.65]]) { const b = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), matNuvol); b.position.set(dx, dy, 0); contorn(b, .05); n.add(b); }
  n.position.set(x, y, z); n.scale.setScalar(s); n.userData.v = .2 + Math.random() * .3; scene.add(n); return n; }
const nuvols = []; function mouNuvols(dt){ for (const n of nuvols) { n.position.x += n.userData.v * dt; if (n.position.x > 40) n.position.x = -40; } }

// ===== Motor d'àudio 100% procedural (Web Audio) =====
// Bus mestre amb guany i compressor → SFX per oscil·ladors amb variació aleatòria de to → música per seqüenciador amb lookahead
const AUDIO = { ctx: null, master: null, mus: null, soroll: null, actiu: localStorage.getItem('catquiz-musica') !== '0' };
function audioInit(){ if (AUDIO.ctx) return AUDIO.ctx; const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
  AUDIO.ctx = new C(); AUDIO.master = AUDIO.ctx.createGain(); AUDIO.master.gain.value = .8;
  const comp = AUDIO.ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4; AUDIO.master.connect(comp); comp.connect(AUDIO.ctx.destination);
  AUDIO.mus = AUDIO.ctx.createGain(); AUDIO.mus.gain.value = .22; AUDIO.mus.connect(AUDIO.master);
  const b = AUDIO.ctx.createBuffer(1, AUDIO.ctx.sampleRate, AUDIO.ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; AUDIO.soroll = b;
  return AUDIO.ctx; }
// Una nota: oscil·lador + envolupant (attack/decay) i lliscament de to opcional
function nota(f, t, dur, o = {}){ const c = AUDIO.ctx, osc = c.createOscillator(), g = c.createGain(); osc.type = o.tipus || 'square';
  osc.frequency.setValueAtTime(f, t); if (o.fins) osc.frequency.exponentialRampToValueAtTime(o.fins, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.vol ?? .1, t + (o.atac ?? .005)); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  osc.connect(g); g.connect(o.dest || AUDIO.master); osc.start(t); osc.stop(t + dur + .02); }
function percussio(t, tipus){ const c = AUDIO.ctx; // bombo = sinus amb caiguda de to; caixa/xarles = soroll filtrat
  if (tipus === 'bombo') { nota(150, t, .18, { tipus: 'sine', fins: 45, vol: .5, dest: AUDIO.mus }); return; }
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = AUDIO.soroll; f.type = tipus === 'xarles' ? 'highpass' : 'bandpass'; f.frequency.value = tipus === 'xarles' ? 7000 : 1800;
  g.gain.setValueAtTime(tipus === 'xarles' ? .08 : .25, t); g.gain.exponentialRampToValueAtTime(.001, t + (tipus === 'xarles' ? .04 : .14)); s.connect(f); f.connect(g); g.connect(AUDIO.mus); s.start(t); s.stop(t + .2); }
// SFX: cada crida varia el to ±6% perquè no sonin repetitius
const SFX = { ok:[660,1320,.14,'square'], mal:[220,90,.35,'sawtooth'], clic:[520,520,.05,'square'], win:[523,1568,.45,'square'], bonus:[880,1760,.2,'triangle'], pop:[500,800,.1,'triangle'], tic:[900,900,.05,'sine'] };
function so(tipus){ try { if (!audioInit()) return; const [f0, f1, dur, tp] = SFX[tipus] || SFX.clic, v = 1 + (Math.random() - .5) * .12, t = AUDIO.ctx.currentTime;
  if (tipus === 'win') { [0, 4, 7, 12].forEach((s, i) => nota(523 * Math.pow(2, s / 12) * v, t + i * .09, .25, { tipus: 'square', vol: .09 })); return; }
  nota(f0 * v, t, dur, { tipus: tp, fins: f1 * v, vol: .1 }); if (tipus === 'clic' && AUDIO.actiu) musicaInici(); } catch (e) {} }
// Seqüenciador: planifica amb 120 ms d'antelació des d'un temporitzador de 25 ms (el rellotge precís és el de l'AudioContext)
const SEQ = { bpm: 126, pas: 0, seguent: 0, timer: null, lookahead: .12, interval: 25, estil: 'quiz' };
const ESCALA = [0, 2, 4, 7, 9, 12, 14, 16]; // pentatònica major sobre Do
const ESTILS = {
  quiz:    { bpm: 126, base: 261.63, baix: [0,0,7,0, 5,5,0,5, 3,3,0,3, 5,5,7,7], ritme: 'bombo.xarles.caixa.xarles' },
  suspens: { bpm: 100, base: 220,    baix: [0,0,0,3, 0,0,0,5, 0,0,0,3, 7,7,5,3], ritme: 'bombo.xarles.xarles.xarles', menor: true },
};
let melodia = [];
function novaMelodia(){ const e = ESTILS[SEQ.estil]; let g = 3; melodia = Array.from({ length: 32 }, (_, i) => { if (i % 2 && Math.random() < .55) return null; g = Math.max(0, Math.min(ESCALA.length - 1, g + Math.round((Math.random() - .5) * 3))); return e.menor ? [0,3,5,7,10,12,15,17][g] : ESCALA[g]; }); }
function tocaPas(p, t){ const e = ESTILS[SEQ.estil], r = e.ritme.split('.');
  if (p % 4 === 0) percussio(t, r[0]); if (p % 4 === 2) percussio(t, 'xarles'); if (p % 8 === 4) percussio(t, r[2]); if (p % 2) percussio(t, 'xarles');
  if (p % 2 === 0) { const s = e.baix[(p / 2) % 16]; nota(e.base / 2 * Math.pow(2, s / 12), t, .22, { tipus: 'triangle', vol: .16, dest: AUDIO.mus }); }
  const m = melodia[p % 32]; if (m !== null && m !== undefined) nota(e.base * 2 * Math.pow(2, m / 12) * (1 + (Math.random() - .5) * .004), t, .16, { tipus: 'square', vol: .05, dest: AUDIO.mus, atac: .01 });
  if (p === 31 && Math.random() < .4) novaMelodia(); }

  AUDIO.mus.gain.cancelScheduledValues(AUDIO.ctx.currentTime); AUDIO.mus.gain.setTargetAtTime(.22, AUDIO.ctx.currentTime, .3); SEQ.timer = setInterval(planifica, SEQ.interval); }
function musicaAtura(){ if (!SEQ.timer) return; clearInterval(SEQ.timer); SEQ.timer = null; AUDIO.mus.gain.setTargetAtTime(0, AUDIO.ctx.currentTime, .4); }
Object.assign(window, { AUDIO, SEQ, so, musicaCommuta: () => musicaCommuta() }); // accessibles des de la consola
function musicaCommuta(){ AUDIO.actiu = !AUDIO.actiu; localStorage.setItem('catquiz-musica', AUDIO.actiu ? '1' : '0'); if (AUDIO.actiu) musicaInici(); else musicaAtura(); return AUDIO.actiu; }

// Paraules de 5 lletres, sense accents. Amplia-la lliurement.

','REINA','RENOU','REPTE','ROBAR','RUSCS','SABEM','SABER','SALAT','SANTS','SEGLE','SEGUR','SENSE','SERPS','SETGE','SOLES','SOPAR','SORTS','SUAUS','TASCA','TEMPS','TENDA','TEULA','TIRAR','TITOL','TOTAL','TRIST','TRUCS','TURBO','UNGLA','URPES','VALOR','VELLS','VENIR','VERBS','VESPA','VIURE','VOLAR','VOLTA','XARXA','XERRA','XICOT','XIFRA','XINES','XOCAR','ABRIL','ACTES','ACTOR','AGAFA','AGUDA','AIRES','AJUDA','ALBES','ALCEN','ALLAU','ALTES','AMANT','AMPLE','ANELL','ANIMA','ARENA','ARMES','ARROS','ASSEU','ATLES','AVANT','BADIA','BAIXA','BALES','BANYS','BARBA','BARRA','BATRE','BEURE','BIGES','BLAVA','BOLES','BOMBA','BONIC','BOTES','BRISA','BROMA','BRUTS','BUFAR','BULLS','BURRO','BUSOS','CABAL','CABRE','CAFES','CAIRE','CALDO','CANES','CANYA','CAPSA','CARBO','CARRO','CAURE','CAVAR','CEDIR','CERTS','CITES','CIVIL','CLARA','CLIMA','CLOSA','COLLA','COLZE','COMTE','CONTE','CORBS','CORNS','COSIR','COVES','CRIAR','CULPA','CURAR','DANSA','DEBAT','DENSA','DESIG','DEUTE','DIETA','DIGNE','DINAR','DIVAN','DOBLE','DOLOR','DONAR','DRAPS','DROGA','DUNES','DURAR','EDATS','EINES','EIXOS','ENUIG','ENVIA','EQUIP','ERROR','ESCUT','ESPIA','ESQUI','ESTAT','ESTIL','EXTRA','FADES','FALTA','FANAL','FARTS','FATAL','FAVES','FEBRE','FERIR','FIBRA','FIDEL','FILAR','FINAL','FIRMA','FLUIX','FONDO','FRASE','FRESA','FRUIR','FUMAT','FUNDA','GALES','GANES','GASOS','GENIS','GENTS','GESTA','GIRES','GORRA','GRANA','GRATA','GREIX','GRISA','GRUES','GUIES','HABIL','HORES','HOSTE','IDEES','IGUAL','IMANT','INDEX','JARDI','JOIES','JUNTS','JUSTS','LLANA','LLARS','LLAST','LLAVI','LLEST','LLIGA','LLOSA','LLUNY','LOCAL','LOGIC','MAGRE','MANAR','MANSA','MARCA','MARIT','MARXA','MATAR','MEDIA','MENAR','MERLA','METRE','MIRAT','MISSA','MOBIL','MODES','MOLTS','MONTS','MORIR','MORTS','MOSCA','MOTIU','MUDAR','MURAL','NACRE','NAVAL','NEGAR','NENES','NEULA','NINES','NOCES','NOIES','NOTES','NUSOS','OBERT','OBRES','ODIAR','OLLES','ONCLE','OPERA','ORGUE','OSSOS','PACTE','PAGAR','PAGES','PALES','PANYS','PARAR','PARES','PARLA','PATIR','PAUSA','PEBRE','PEDAL','PELAR','PENYA','PESOS','PETAR','PILAR','PISTA','PLAER','PLANA','PLENA','PLOMS','POBRE','POEMA','POLIT','PORTS','POSTS','PREGA','PREMI','PRESA','PRIMA','PUJAR','PUNTA','QUOTA','RABIA','RACES','RADAR','RAMES','RAONS','REBRE','RECTE','REGNE','REIAL','RENDA','RESTA','RETRE','ROBES','ROCES','RODAR','RONDA','ROSAT','RUBIS','RUINA','SABIA','SABOR','SACRE','SALES','SALTS','SANAR','SEGON','SERIE','SEURE','SIGNE','SOBRE','SOCIS','SOLAR','SOLCS','SONAR','SOPES','SUMAR','TACTE','TALLA','TARDA','TEMES','TEMOR','TENIR','TERME','TOCAR','TORNS','TORTA','TRAMA','TRENA','TRIAR','TRONC','TURBA','UNITS','USUAL','VALER','VAPOR','VARIA','VEINS','VELES','VENDA','VERGE','VIALS','VIDES','VILES','VINYA','VIRUS','VISTA','VITAL','VOCAL','VOLER','VOLTS','VORES','XALET','XAPES','ZONES'];
const FILES = [['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L','Ç'],['ENTRA','Z','X','C','V','B','N','M','ESBORRA']];

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5EC8FF);
const camera = new THREE.PerspectiveCamera(40, 1, .1, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x3f7fd0, 1.5));
const llum = new THREE.DirectionalLight(0xffffff, 1.4); llum.position.set(3, 6, 8); scene.add(llum);

const COL = { buit:'#FFFFFF', be:'#7CE800', quasi:'#FFD600', no:'#6E7BB5' };
const solMesh = celISol(); illa(-15, -9, -30, 1.4); illa(16, -7, -34, 1.2); illa(-18, 10, -44, 1);
for (let i = 0; i < 6; i++) nuvols.push(nuvol(-25 + i*10, -6 + Math.random()*14, -14 - Math.random()*8, 1.2 + Math.random()));
const plataforma = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3, 1, 8), toon({ color: 0x7CE800 })); plataforma.position.y = -5.4; contorn(plataforma, .03); scene.add(plataforma);
function textura(ch, fons, tinta = '#1B1140'){
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.fillStyle = fons; g.fillRect(0,0,128,128);
  g.fillStyle = tinta; g.font = "86px 'Lilita One', Fredoka, Arial"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, 64, 70);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function matsDau(ch, fons, tinta){
  const llis = toon({ color: fons }), front = toon({ map: textura(ch, fons, tinta) });
  return [llis, llis, llis, llis, front, llis]; // només la cara frontal (+z) porta la lletra
}
const geo = new RoundedBoxGeometry(1, 1, 1, 3, .18);
const daus = [];
for (let f = 0; f < 6; f++) { daus.push([]); for (let c = 0; c < 5; c++) {
  const m = new THREE.Mesh(geo, matsDau('', COL.buit, '#1D2B64'));
  m.position.set((c-2)*1.15, (2.5-f)*1.15, 0); contorn(m, .05); scene.add(m); daus[f].push(m);
}}

const DEMO = new URLSearchParams(location.search).has('demo'); // ?demo → el joc juga sol (per gravar reels)
const QUIZ = new URLSearchParams(location.search).has('quiz'); // ?demo&quiz → pausa abans de resoldre (format CatQuiz)
let fetQuiz = false;
const avisa = tipus => { try { parent.postMessage({ catquiz: tipus }, '*'); } catch (e) {} };
let secret, fila, col, graella, viu = false, anims = [], diari = false, candidats = [];
const stats = JSON.parse(localStorage.getItem('catquiz-motle') || '{"jugades":0,"guanyades":0,"ratxa":0,"millor":0}');
function pintaStats(){ document.getElementById('ratxa').textContent = stats.jugades ? `Partides: ${stats.jugades} · Guanyades: ${stats.guanyades} · Ratxa: ${stats.ratxa} (millor ${stats.millor})` : ''; }
pintaStats();
const tecles = {};
function pinta(m, ch, estat){
  m.material[4].map.dispose(); m.material = matsDau(ch, COL[estat], estat === 'no' ? '#FFFFFF' : '#1D2B64');
}
function mostra(txt){ const e = document.getElementById('missatge'); e.textContent = txt; e.classList.add('on'); clearTimeout(e.t); e.t = setTimeout(() => e.classList.remove('on'), 1600); }
function comenca(esDiari = false){
  diari = esDiari; so('clic');
  const dia = Math.floor(Date.now() / 864e5);
  secret = esDiari ? PARAULES[dia % PARAULES.length] : PARAULES[Math.floor(Math.random()*PARAULES.length)]; fila = 0; col = 0; viu = true; anims = [];
  graella = Array.from({length:6}, () => Array(5).fill(''));
  for (const f of daus) for (const m of f) { pinta(m, '', 'buit'); m.rotation.set(0,0,0); m.scale.setScalar(1); }
  for (const t of Object.values(tecles)) t.className = 'tecla' + (t.classList.contains('ampla') ? ' ampla' : '');
  document.getElementById('intents').textContent = '1 / 6';
  document.getElementById('inici').hidden = true; document.getElementById('final').hidden = true;
  if (DEMO) { candidats = PARAULES.slice(); fetQuiz = false; setTimeout(bot, 900); }
}
function lletra(ch){
  if (!viu || col >= 5) return;
  graella[fila][col] = ch; pinta(daus[fila][col], ch, 'buit'); daus[fila][col].scale.setScalar(1.25); col++;
}
function esborra(){ if (!viu || col === 0) return; col--; graella[fila][col] = ''; pinta(daus[fila][col], '', 'buit'); }
function entra(){
  if (!viu) return;
  if (col < 5) { mostra('Falten lletres'); so('mal'); for (const m of daus[fila]) m.userData.sacseig = .3; return; }
  const intent = graella[fila].join(''), estats = Array(5).fill('no'), resta = secret.split('');
  for (let i = 0; i < 5; i++) if (intent[i] === secret[i]) { estats[i] = 'be'; resta[i] = null; }
  for (let i = 0; i < 5; i++) if (estats[i] !== 'be') { const j = resta.indexOf(intent[i]); if (j > -1) { estats[i] = 'quasi'; resta[j] = null; } }
  for (let i = 0; i < 5; i++) {
    const m = daus[fila][i], ch = intent[i], estat = estats[i];
    anims.push({ m, retard: i * .18, t: 0, fet: false, ch, estat });
    const k = tecles[ch]; if (k) { const ordre = ['no','quasi','be']; const actual = ordre.findIndex(s => k.classList.contains(s));
      if (ordre.indexOf(estat) > actual) { k.classList.remove('no','quasi','be'); k.classList.add(estat); } }
  }
  const guanyat = intent === secret; fila++; col = 0;
  setTimeout(() => {
    if (guanyat) acaba(true); else if (fila === 6) acaba(false);
    else { document.getElementById('intents').textContent = `${fila+1} / 6`; popPill('intents'); }
  }, 1300);
  if (guanyat || fila === 6) { viu = false; so(guanyat ? 'win' : 'mal'); if (guanyat) setTimeout(() => { for (const m of daus[fila-1]) confeti(m.position, 16, 7); }, 1200);
    stats.jugades++; if (guanyat) { stats.guanyades++; stats.ratxa++; stats.millor = Math.max(stats.millor, stats.ratxa); } else stats.ratxa = 0;
    localStorage.setItem('catquiz-motle', JSON.stringify(stats)); pintaStats(); }
  else so('ok');
}
function acaba(guanyat){
  document.getElementById('titol-final').textContent = guanyat ? ['Increïble!','Genial!','Molt bé!','Ben fet!','Ufff!','Pels pèls!'][fila-1] : 'Oh no!';
  document.getElementById('text-final').textContent = (guanyat ? `L'has encertada en ${fila} ${fila===1?'intent':'intents'}.` : `La paraula era ${secret}.`) + (diari ? ' Demà n\'hi haurà una altra.' : '');
  document.getElementById('final').hidden = QUIZ; avisa('fi');
  if (DEMO) setTimeout(() => comenca(false), QUIZ ? 6000 : 2200);
}
const teclat = document.getElementById('teclat');
for (const f of FILES) { const d = document.createElement('div'); d.className = 'fila';
  for (const k of f) { const b = document.createElement('button'); b.className = 'tecla' + (k.length > 1 ? ' ampla' : ''); b.textContent = k === 'ESBORRA' ? '⌫' : k;
    b.onclick = () => k === 'ENTRA' ? entra() : k === 'ESBORRA' ? esborra() : lletra(k); d.appendChild(b); tecles[k] = b; } teclat.appendChild(d); }
addEventListener('keydown', e => {
  if (e.key === 'Enter') { if (!viu && !document.getElementById('inici').hidden) comenca(); else entra(); return; }
  if (e.key === 'Backspace') return esborra();
  const ch = e.key.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  if (/^[A-ZÇ]$/.test(ch)) lletra(ch);
});
function feedback(intent, sol){ const e = Array(5).fill('n'), r = sol.split('');
  for (let i = 0; i < 5; i++) if (intent[i] === sol[i]) { e[i] = 'b'; r[i] = null; }
  for (let i = 0; i < 5; i++) if (e[i] === 'n') { const j = r.indexOf(intent[i]); if (j > -1) { e[i] = 'q'; r[j] = null; } }
  return e.join(''); }
function bot(){ // juga sol: tria un candidat coherent amb les pistes rebudes fins ara
  if (!viu) return;
  if (QUIZ && !fetQuiz && (fila >= 2 || candidats.length <= 4)) { fetQuiz = true; avisa('quiz'); setTimeout(bot, 5200); return; } // pausa: "Quina és?"
  const intent = QUIZ && fetQuiz ? secret : (candidats[Math.floor(Math.random()*candidats.length)] || PARAULES[0]);
  [...intent].forEach((ch, i) => setTimeout(() => lletra(ch), 220 * i));
  setTimeout(() => { entra(); const fb = feedback(intent, secret); candidats = candidats.filter(c => feedback(intent, c) === fb); setTimeout(bot, 1700); }, 220 * 5 + 300);
}
if (DEMO) { document.getElementById('inici').hidden = true; setTimeout(() => comenca(false), 500); }
document.getElementById('btn-inici').onclick = () => comenca(false);
document.getElementById('btn-diari').onclick = () => comenca(true);
document.getElementById('btn-reinici').onclick = () => { document.getElementById('final').hidden = true; document.getElementById('inici').hidden = false; };

function mida(){
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  // Encaixa la graella (5×6 daus) a l'espai que queda per sobre del teclat i la capçalera
  const teclatH = document.getElementById('teclat').offsetHeight + 24, capH = 70;
  const kb = teclatH / innerHeight, top = capH / innerHeight, lliure = 1 - kb - top;
  const tg = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(6.6 / (2 * tg * camera.aspect), 7.6 / (lliure * 2 * tg));
  const alt = 2 * d * tg, centreY = (kb - top) / 2 * alt; // desplaça el punt de mira perquè la graella quedi centrada a l'espai lliure
  camera.position.set(0, .4 - centreY, d); camera.lookAt(0, .4 - centreY, 0);
}
addEventListener('resize', mida); addEventListener('load', mida); mida();

const rellotge = new THREE.Clock();
const btnMusica = document.getElementById('btn-musica'); if (btnMusica) { btnMusica.style.opacity = AUDIO.actiu ? 1 : .5; btnMusica.onclick = () => { btnMusica.style.opacity = musicaCommuta() ? 1 : .5; }; }
window.__fi = () => acaba(false); // per a proves automàtiques
function anima(){
  requestAnimationFrame(anima);
  const dt = Math.min(rellotge.getDelta(), .05); mouNuvols(dt); mouConfeti(dt); mouIlles(dt); solMesh.userData.raigs.rotation.z += dt * .15;
  for (const a of anims) {
    a.t += dt; const p = Math.max(0, Math.min(1, (a.t - a.retard) / .5));
    a.m.rotation.x = p * Math.PI * 2;
    if (!a.fet && p >= .5) { a.fet = true; pinta(a.m, a.ch, a.estat); if (a.estat === 'be') confeti(a.m.position, 8, 4); }
  }
  anims = anims.filter(a => a.t - a.retard < .5);
  for (const f of daus) for (let i = 0; i < 5; i++) { const m = f[i]; m.scale.lerp(new THREE.Vector3(1,1,1), dt * 10);
    if (m.userData.sacseig > 0) { m.userData.sacseig -= dt; m.position.x = (i-2)*1.15 + Math.sin(m.userData.sacseig * 60) * .12; } else m.position.x = (i-2)*1.15; }
  scene.rotation.y = Math.sin(rellotge.elapsedTime * .5) * .06;
  renderer.render(scene, camera);
}
anima();
