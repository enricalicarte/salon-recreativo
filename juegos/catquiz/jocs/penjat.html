<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

  :root{--cel:#5EC8FF;--cel2:#1E7BE0;--marí:#1D2B64;--rosa:#FF3E9A;--taronja:#FF8C1A;--groc:#FFD600;--llima:#7CE800;--lila:#9B5CFF;--neu:#FFFFFF;--tinta:#1D2B64}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;background:linear-gradient(180deg,var(--cel) 0%,var(--cel2) 100%);color:var(--neu);user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block}
  .titol,h1{font-family:'Lilita One','Fredoka',sans-serif;font-weight:400;font-style:italic;letter-spacing:.01em;color:var(--neu);-webkit-text-stroke:2.5px var(--marí);paint-order:stroke fill;text-shadow:0 5px 0 var(--marí),0 9px 0 rgba(0,0,0,.25)}

  .pill{font-family:'Lilita One',sans-serif;font-style:italic;background:var(--neu);color:var(--marí);font-size:22px;padding:6px 18px;border-radius:999px;border:3px solid var(--marí);box-shadow:0 5px 0 var(--marí);text-decoration:none;pointer-events:auto;white-space:nowrap;transform:rotate(-2deg)}
  .pill.acc{background:var(--groc)} .pill.temps{background:var(--llima)} .pill.cat{background:var(--llima)} .pill.err{background:var(--rosa);color:var(--neu);-webkit-text-stroke:1px var(--marí)}
  a.tornar{pointer-events:auto}
  .capa{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.35),rgba(29,43,100,.65));text-align:center;padding:24px;z-index:9}
  .capa[hidden]{display:none}
  .caixa{background:var(--neu);color:var(--marí);border:4px solid var(--marí);border-radius:32px;box-shadow:0 12px 0 var(--marí),0 22px 0 rgba(0,0,0,.2);padding:30px 34px 34px;max-width:440px;position:relative;animation:apareix .45s cubic-bezier(.2,1.5,.4,1)}

  p{margin:16px 0 22px;font-size:18px;line-height:1.35;color:#3A4A8A;font-weight:500}
  button,.gros{font-family:'Lilita One',sans-serif;font-size:24px;font-style:italic;letter-spacing:.02em;background:linear-gradient(180deg,#FFB53A,var(--taronja));color:var(--neu);-webkit-text-stroke:1.5px var(--marí);paint-order:stroke fill;border:3px solid var(--marí);border-radius:999px;padding:12px 32px;cursor:pointer;box-shadow:0 7px 0 #B34A00,0 12px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s;margin:4px}
  button:active,.gros:active{transform:translateY(6px);box-shadow:0 1px 0 #B34A00}
  button.acc{background:linear-gradient(180deg,#C79BFF,var(--lila));box-shadow:0 7px 0 #5A2BB0,0 12px 0 rgba(0,0,0,.2)}
  .gran{font-family:'Lilita One',sans-serif;font-size:72px;font-style:italic;color:var(--rosa);-webkit-text-stroke:2.5px var(--marí);paint-order:stroke fill;text-shadow:0 6px 0 var(--marí);line-height:1}
  .missatge,.pista{position:fixed;top:70px;left:50%;transform:translateX(-50%) rotate(-2deg);font-family:'Lilita One',sans-serif;font-style:italic;background:var(--rosa);color:var(--neu);-webkit-text-stroke:1px var(--marí);border:3px solid var(--marí);border-radius:999px;padding:8px 22px;font-size:21px;box-shadow:0 5px 0 var(--marí);pointer-events:none;white-space:nowrap;z-index:3}

  .tecla.ampla{flex:1.6 1 0;max-width:82px;font-size:15px}
  .teclat.pla{flex-direction:row;gap:5px} .teclat.pla .tecla{flex:0 0 auto;width:min(46px,calc(10% - 5px))}

  .caixa{max-height:92vh;overflow:auto}

  .capa::before{content:'';position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.09) 0 9deg,rgba(255,255,255,0) 9deg 18deg);animation:gira 40s linear infinite;pointer-events:none}

  .caixa button,.caixa .gros{font-size:21px;padding:11px 26px}

  button,.gros{position:relative;overflow:hidden}
  .compte{position:fixed;inset:0;display:grid;place-items:center;font-family:'Lilita One',sans-serif;font-style:italic;font-size:min(34vh,50vw);color:var(--groc);-webkit-text-stroke:5px var(--marí);paint-order:stroke fill;text-shadow:0 10px 0 var(--marí),0 18px 0 rgba(0,0,0,.25);pointer-events:none;z-index:20}
  .compte.pop{animation:compte .65s cubic-bezier(.2,1.6,.4,1)}
  @keyframes compte{from{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(3deg);opacity:1}to{transform:scale(1) rotate(0)}}
  .pill.pop{animation:pillpop .35s cubic-bezier(.2,1.8,.4,1)}
  @keyframes pillpop{50%{transform:rotate(-2deg) scale(1.3);background:var(--groc)}}
  h1{animation:titol 2.2s ease-in-out infinite}
  @keyframes titol{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(-1deg) scale(1.04)}}
</style>

<div class="hud"><a class="pill" href="../index.html">← CatQuiz</a><button class="pill" id="btn-musica" style="font-size:16px;padding:5px 10px;cursor:pointer">🎵</button><span class="pill cat" id="cat"></span><span class="pill err" id="errors">0 / 8</span></div>

<div class="capa" id="inici"><div class="caixa"><h1>Penjat 3D</h1><p>Tria una categoria. Cada lletra que falli munta una peça del ninot. Amb vuit errors, s'ha acabat. La pista et revela una lletra a canvi de dos errors.</p><p id="ratxa" style="margin:0 0 12px;font-size:15px"></p><div class="cats" id="cats"></div></div></div>
<div class="capa" id="final" hidden><div class="caixa"><h1 id="titol-final"></h1><p id="text-final"></p><button class="gros" id="btn-reinici">Una altra</button></div></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }

<script type="module">
// Pantalla fixa: sense zoom ni desplaçament lateral (gestos de pinça i doble toc bloquejats)
for (const ev of ['gesturestart','gesturechange','gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let darrerToc = 0; document.addEventListener('touchend', e => { const t = Date.now(); if (t - darrerToc < 300 && !e.target.closest('button,a')) e.preventDefault(); darrerToc = t; }, { passive: false });
addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
import * as THREE from 'three';
await document.fonts.ready;
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';


// ===== Kit d'espectacle (cel-shading, cel, sol, illes flotants, confeti, compte enrere) =====
const grad = new THREE.DataTexture(new Uint8Array([135,135,135,255, 200,200,200,255, 255,255,255,255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = o => new THREE.MeshToonMaterial({ gradientMap: grad, ...o });
const confetis = [], geoConf = new THREE.BoxGeometry(.22, .22, .06), colsConf = [0xFF3E9A, 0xFFD600, 0x33E0FF, 0x7CE800, 0x9B5CFF, 0xFF8C1A];
function confeti(pos, n = 18, forca = 6){ for (let i = 0; i < n; i++) {
  const c = new THREE.Mesh(geoConf, toon({ color: colsConf[i % 6] })); c.position.copy(pos);
  c.userData = { v: new THREE.Vector3((Math.random()-.5)*forca, Math.random()*forca + 2, (Math.random()-.5)*forca), r: new THREE.Vector3(Math.random()*8, Math.random()*8, Math.random()*8), t: 1.2 + Math.random()*.6 };
  scene.add(c); confetis.push(c); } }
function mouConfeti(dt){ for (let i = confetis.length-1; i >= 0; i--) { const c = confetis[i]; c.userData.t -= dt; c.userData.v.y -= 14 * dt;
  c.position.addScaledVector(c.userData.v, dt); c.rotation.x += c.userData.r.x*dt; c.rotation.y += c.userData.r.y*dt; c.scale.setScalar(Math.min(1, c.userData.t*2));
  if (c.userData.t <= 0) { scene.remove(c); confetis.splice(i, 1); } } }
function celISol(){
  const g = new THREE.SphereGeometry(180, 24, 16), col = [], p = g.attributes.position, dalt = new THREE.Color(0x1E7BE0), baix = new THREE.Color(0xBDF0FF);
  for (let i = 0; i < p.count; i++) { const k = THREE.MathUtils.clamp(p.getY(i) / 180 * .5 + .5, 0, 1); const c = baix.clone().lerp(dalt, Math.pow(k, .7)); col.push(c.r, c.g, c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
  const sol = new THREE.Mesh(new THREE.SphereGeometry(7, 20, 14), new THREE.MeshBasicMaterial({ color: 0xFFF4A0, fog: false })); sol.position.set(-45, 55, -120); scene.add(sol);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(11, 20, 14), new THREE.MeshBasicMaterial({ color: 0xFFE060, transparent: true, opacity: .35, fog: false })); sol.add(halo);
  const raigs = new THREE.Group(); for (let i = 0; i < 12; i++) { const r = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 26), new THREE.MeshBasicMaterial({ color: 0xFFE060, transparent: true, opacity: .18, side: THREE.DoubleSide, fog: false })); r.rotation.z = i * Math.PI/6; raigs.add(r); }
  sol.add(raigs); sol.userData.raigs = raigs; return sol;
}
const illes = [];
function illa(x, y, z, s = 1){ const g = new THREE.Group();
  const top = contorn(new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2, .7, 9), toon({ color: 0x7CE800 })), .04); g.add(top);
  const base = contorn(new THREE.Mesh(new THREE.ConeGeometry(2, 3, 9), toon({ color: 0xA8683A })), .04); base.rotation.x = Math.PI; base.position.y = -1.8; g.add(base);
  for (let i = 0; i < 2; i++) { const tr = new THREE.Mesh(new THREE.CylinderGeometry(.15, .2, 1), toon({ color: 0x8A5A2B })); tr.position.set(-.8 + i*1.5, .8, (i-.5)*.8); g.add(tr);
    const cop = contorn(new THREE.Mesh(new THREE.SphereGeometry(.7 + Math.random()*.3, 12, 10), toon({ color: [0x4CD100, 0xFF3E9A, 0xFFD600][Math.floor(Math.random()*3)] })), .06); cop.position.set(tr.position.x, 1.6, tr.position.z); g.add(cop); }
  g.position.set(x, y, z); g.scale.setScalar(s); g.userData = { y0: y, f: Math.random()*6 }; scene.add(g); illes.push(g); return g; }
let tKit = 0; function mouIlles(dt){ tKit += dt; for (const g of illes) { g.position.y = g.userData.y0 + Math.sin(tKit * .8 + g.userData.f) * .35; g.rotation.y += dt * .05; } }
function compte(fi){ const el = document.createElement('div'); el.className = 'compte'; document.body.appendChild(el); let n = 3;
  const tic = () => { el.textContent = n > 0 ? n : 'JA!'; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); so(n > 0 ? 'clic' : 'win'); if (n-- > 0) setTimeout(tic, 650); else { setTimeout(() => el.remove(), 600); fi(); } }; tic(); }
function popPill(id){ const e = document.getElementById(id); if (!e) return; e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
// Estil Stumble Guys: contorn (casc invertit) i núvols de fons
const matContorn = new THREE.MeshBasicMaterial({ color: 0x1D2B64, side: THREE.BackSide });
function contorn(m, g = .06){ const c = new THREE.Mesh(m.geometry, matContorn); c.scale.setScalar(1 + g); c.renderOrder = -1; m.add(c); return m; }
const matNuvol = toon({ color: 0xFFFFFF });
function nuvol(x, y, z, s = 1){ const n = new THREE.Group();
  for (const [dx, dy, r] of [[0,0,1],[1.1,.2,.8],[-1.1,.1,.75],[.4,.55,.7],[-.5,.5,.65]]) { const b = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), matNuvol); b.position.set(dx, dy, 0); contorn(b, .05); n.add(b); }
  n.position.set(x, y, z); n.scale.setScalar(s); n.userData.v = .2 + Math.random() * .3; scene.add(n); return n; }
const nuvols = []; function mouNuvols(dt){ for (const n of nuvols) { n.position.x += n.userData.v * dt; if (n.position.x > 40) n.position.x = -40; } }

// ===== Motor d'àudio 100% procedural (Web Audio) =====
// Bus mestre amb guany i compressor → SFX per oscil·ladors amb variació aleatòria de to → música per seqüenciador amb lookahead
const AUDIO = { ctx: null, master: null, mus: null, soroll: null, actiu: localStorage.getItem('catquiz-musica') !== '0' };
function audioInit(){ if (AUDIO.ctx) return AUDIO.ctx; const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
  AUDIO.ctx = new C(); AUDIO.master = AUDIO.ctx.createGain(); AUDIO.master.gain.value = .8;
  const comp = AUDIO.ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4; AUDIO.master.connect(comp); comp.connect(AUDIO.ctx.destination);
  AUDIO.mus = AUDIO.ctx.createGain(); AUDIO.mus.gain.value = .22; AUDIO.mus.connect(AUDIO.master);
  const b = AUDIO.ctx.createBuffer(1, AUDIO.ctx.sampleRate, AUDIO.ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; AUDIO.soroll = b;
  return AUDIO.ctx; }
// Una nota: oscil·lador + envolupant (attack/decay) i lliscament de to opcional
function nota(f, t, dur, o = {}){ const c = AUDIO.ctx, osc = c.createOscillator(), g = c.createGain(); osc.type = o.tipus || 'square';
  osc.frequency.setValueAtTime(f, t); if (o.fins) osc.frequency.exponentialRampToValueAtTime(o.fins, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.vol ?? .1, t + (o.atac ?? .005)); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  osc.connect(g); g.connect(o.dest || AUDIO.master); osc.start(t); osc.stop(t + dur + .02); }
function percussio(t, tipus){ const c = AUDIO.ctx; // bombo = sinus amb caiguda de to; caixa/xarles = soroll filtrat
  if (tipus === 'bombo') { nota(150, t, .18, { tipus: 'sine', fins: 45, vol: .5, dest: AUDIO.mus }); return; }
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = AUDIO.soroll; f.type = tipus === 'xarles' ? 'highpass' : 'bandpass'; f.frequency.value = tipus === 'xarles' ? 7000 : 1800;
  g.gain.setValueAtTime(tipus === 'xarles' ? .08 : .25, t); g.gain.exponentialRampToValueAtTime(.001, t + (tipus === 'xarles' ? .04 : .14)); s.connect(f); f.connect(g); g.connect(AUDIO.mus); s.start(t); s.stop(t + .2); }
// SFX: cada crida varia el to ±6% perquè no sonin repetitius
const SFX = { ok:[660,1320,.14,'square'], mal:[220,90,.35,'sawtooth'], clic:[520,520,.05,'square'], win:[523,1568,.45,'square'], bonus:[880,1760,.2,'triangle'], pop:[500,800,.1,'triangle'], tic:[900,900,.05,'sine'] };
function so(tipus){ try { if (!audioInit()) return; const [f0, f1, dur, tp] = SFX[tipus] || SFX.clic, v = 1 + (Math.random() - .5) * .12, t = AUDIO.ctx.currentTime;
  if (tipus === 'win') { [0, 4, 7, 12].forEach((s, i) => nota(523 * Math.pow(2, s / 12) * v, t + i * .09, .25, { tipus: 'square', vol: .09 })); return; }
  nota(f0 * v, t, dur, { tipus: tp, fins: f1 * v, vol: .1 }); if (tipus === 'clic' && AUDIO.actiu) musicaInici(); } catch (e) {} }
// Seqüenciador: planifica amb 120 ms d'antelació des d'un temporitzador de 25 ms (el rellotge precís és el de l'AudioContext)
const SEQ = { bpm: 126, pas: 0, seguent: 0, timer: null, lookahead: .12, interval: 25, estil: 'quiz' };
const ESCALA = [0, 2, 4, 7, 9, 12, 14, 16]; // pentatònica major sobre Do
const ESTILS = {
  quiz:    { bpm: 126, base: 261.63, baix: [0,0,7,0, 5,5,0,5, 3,3,0,3, 5,5,7,7], ritme: 'bombo.xarles.caixa.xarles' },
  suspens: { bpm: 100, base: 220,    baix: [0,0,0,3, 0,0,0,5, 0,0,0,3, 7,7,5,3], ritme: 'bombo.xarles.xarles.xarles', menor: true },
};
let melodia = [];
function novaMelodia(){ const e = ESTILS[SEQ.estil]; let g = 3; melodia = Array.from({ length: 32 }, (_, i) => { if (i % 2 && Math.random() < .55) return null; g = Math.max(0, Math.min(ESCALA.length - 1, g + Math.round((Math.random() - .5) * 3))); return e.menor ? [0,3,5,7,10,12,15,17][g] : ESCALA[g]; }); }
function tocaPas(p, t){ const e = ESTILS[SEQ.estil], r = e.ritme.split('.');
  if (p % 4 === 0) percussio(t, r[0]); if (p % 4 === 2) percussio(t, 'xarles'); if (p % 8 === 4) percussio(t, r[2]); if (p % 2) percussio(t, 'xarles');
  if (p % 2 === 0) { const s = e.baix[(p / 2) % 16]; nota(e.base / 2 * Math.pow(2, s / 12), t, .22, { tipus: 'triangle', vol: .16, dest: AUDIO.mus }); }
  const m = melodia[p % 32]; if (m !== null && m !== undefined) nota(e.base * 2 * Math.pow(2, m / 12) * (1 + (Math.random() - .5) * .004), t, .16, { tipus: 'square', vol: .05, dest: AUDIO.mus, atac: .01 });
  if (p === 31 && Math.random() < .4) novaMelodia(); }

function bot(){ // juga sol: lletra més freqüent entre les paraules de la categoria compatibles amb el que se sap
