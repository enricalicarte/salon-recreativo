const ESTILS = {

const DEMO = new URLSearchParams(location.search).has('demo'); // ?demo → juga sol (reels)
const QUIZ = new URLSearchParams(location.search).has('quiz'); // ?demo&quiz → pausa "Quina és?"
const avisa = tipus => { try { parent.postMessage({ catquiz: tipus }, '*'); } catch (e) {} };
const espera = ms => new Promise(r => setTimeout(r, ms));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
const barreja = a => a.slice().sort(() => Math.random() - .5);
const tria = a => a[Math.floor(Math.random() * a.length)];

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5EC8FF);
const camera = new THREE.PerspectiveCamera(42, 1, .1, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x3f7fd0, 1.5));
const llum = new THREE.DirectionalLight(0xffffff, 1.4); llum.position.set(3, 8, 6); scene.add(llum);

const illes = [];
function illa(x, y, z, s = 1){ const g = new THREE.Group();
  const top = contorn(new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2, .7, 9), toon({ color: 0x7CE800 })), .04); g.add(top);
  const base = contorn(new THREE.Mesh(new THREE.ConeGeometry(2, 3, 9), toon({ color: 0xA8683A })), .04); base.rotation.x = Math.PI; base.position.y = -1.8; g.add(base);
  for (let i = 0; i < 2; i++) { const tr = new THREE.Mesh(new THREE.CylinderGeometry(.15, .2, 1), toon({ color: 0x8A5A2B })); tr.position.set(-.8 + i*1.5, .8, (i-.5)*.8); g.add(tr);
    const cop = contorn(new THREE.Mesh(new THREE.SphereGeometry(.7 + Math.random()*.3, 12, 10), toon({ color: [0x4CD100, 0xFF3E9A, 0xFFD600][Math.floor(Math.random()*3)] })), .06); cop.position.set(tr.position.x, 1.6, tr.position.z); g.add(cop); }
  g.position.set(x, y, z); g.scale.setScalar(s); g.userData = { y0: y, f: Math.random()*6 }; scene.add(g); illes.push(g); return g; }
let tKit = 0; function mouIlles(dt){ tKit += dt; for (const g of illes) { g.position.y = g.userData.y0 + Math.sin(tKit * .8 + g.userData.f) * .35; g.rotation.y += dt * .05; } }
function compte(fi){ const el = document.createElement('div'); el.className = 'compte'; document.body.appendChild(el); let n = 3;
  const tic = () => { el.textContent = n > 0 ? n : 'JA!'; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); so(n > 0 ? 'clic' : 'win'); if (n-- > 0) setTimeout(tic, 650); else { setTimeout(() => el.remove(), 600); fi(); } }; tic(); }
function popPill(id){ const e = document.getElementById(id); if (!e) return; e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
// Estil Stumble Guys: contorn (casc invertit) i núvols de fons
const matContorn = new THREE.MeshBasicMaterial({ color: 0x1D2B64, side: THREE.BackSide });
function contorn(m, g = .06){ const c = new THREE.Mesh(m.geometry, matContorn); c.scale.setScalar(1 + g); c.renderOrder = -1; m.add(c); return m; }
const matNuvol = toon({ color: 0xFFFFFF });
function nuvol(x, y, z, s = 1){ const n = new THREE.Group();
  for (const [dx, dy, r] of [[0,0,1],[1.1,.2,.8],[-1.1,.1,.75],[.4,.55,.7],[-.5,.5,.65]]) { const b = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), matNuvol); b.position.set(dx, dy, 0); contorn(b, .05); n.add(b); }
  n.position.set(x, y, z); n.scale.setScalar(s); n.userData.v = .2 + Math.random() * .3; scene.add(n); return n; }
const nuvols = []; function mouNuvols(dt){ for (const n of nuvols) { n.position.x += n.userData.v * dt; if (n.position.x > 40) n.position.x = -40; } }

const solMesh = celISol(); illa(-17, -8, -34, 1.5); illa(18, -5, -38, 1.3); illa(-15, 12, -48, 1);
for (let i = 0; i < 6; i++) nuvols.push(nuvol(-25 + i*10, 3 + Math.random()*8, -16 - Math.random()*8, 1.2 + Math.random()));

// Textures amb text (cara frontal) i panells
function textura(txt, fons, tinta, w = 128, mida = 82){
  const c = document.createElement('canvas'); c.width = w; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = fons; g.fillRect(0, 0, w, 128); g.fillStyle = tinta; g.textAlign = 'center'; g.textBaseline = 'middle';
  let f = mida; do { g.font = `${f}px 'Lilita One', Fredoka, Arial`; f -= 4; } while (g.measureText(txt).width > w - 24 && f > 20);
  g.fillText(txt, w / 2, 70); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function matsDau(ch, fons, tinta){ const llis = toon({ color: fons }); return [llis, llis, llis, llis, toon({ map: textura(ch, fons, tinta) }), llis]; }
function matsPanell(txt, fons, tinta, w){ const llis = toon({ color: fons }); return [llis, llis, llis, llis, toon({ map: textura(txt, fons, tinta, Math.round(w * 128), 64) }), llis]; }
const geoDau = new RoundedBoxGeometry(1, 1, 1, 3, .18);
function dau(ch, fons, tinta, g = .05){ return contorn(new THREE.Mesh(geoDau, matsDau(ch, fons, tinta)), g); }
function panell(txt, fons, tinta, w = 5.2, h = 1.1){ const m = contorn(new THREE.Mesh(new RoundedBoxGeometry(w, h, .5, 3, .2), matsPanell(txt, fons, tinta, w / h)), .04); m.userData.w = w; return m; }
function repinta(m, txt, fons, tinta){ if (m.userData.w) m.material = matsPanell(txt, fons, tinta, m.userData.w / 1.1); else m.material = matsDau(txt, fons, tinta); }

// Encaixa una escena d'AMPLE×ALT unitats entre la capçalera (TOP px) i la zona de baix (BOT px)
let AMPLE = 7, ALT = 8, CY = 0;
function mida(){
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const kb = (90) / innerHeight, top = 125 / innerHeight, lliure = 1 - kb - top;
  const tg = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(AMPLE / (2 * tg * camera.aspect), ALT / (lliure * 2 * tg));
  const centreY = (kb - top) / 2 * (2 * d * tg);
  camera.position.set(0, CY - centreY + .3, d); camera.lookAt(0, CY - centreY, 0);
}
addEventListener('resize', mida); addEventListener('load', mida); mida();
const raig = new THREE.Raycaster(), punter = new THREE.Vector2();
function sota(e, llista){ punter.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); raig.setFromCamera(punter, camera); const h = raig.intersectObjects(llista, false)[0]; return h ? h.object : null; }
function mostra(txt, ms = 1500){ const e = document.getElementById('missatge'); e.textContent = txt; e.classList.add('on'); clearTimeout(e.t); e.t = setTimeout(() => e.classList.remove('on'), ms); }
function popPunts(id, v){ const e = document.getElementById(id); e.textContent = v; popPill(id); }
const rellotge = new THREE.Clock();
let tick = () => {};

const ACCENTS = ["cançó", "camí", "cafè", "avió", "balcó", "carbó", "cartró", "castellà", "català", "nació", "ració", "passió", "missió", "setè", "sisè", "cinquè", "desè", "això", "allò", "però", "perquè", "després", "també", "ningú", "algú", "cadascú", "vostè", "mercè", "fàcil", "difícil", "ràpid", "àgil", "útil", "dèbil", "hàbil", "mòbil", "tèxtil", "tòxic", "història", "memòria", "glòria", "victòria", "fúria", "òpera", "època", "líquid", "màquina", "pàgina", "música", "física", "química", "lògica", "màgic", "tràgic", "òrgan", "òscar", "ànec", "àngel", "àrab", "àrea", "àlbum", "àtom", "èxit", "èlit", "ídol", "ínfim", "últim", "única", "pròxim", "pròleg", "còpia", "còlera", "dòlar", "bòbila", "sofà", "mamà", "papà", "divà", "paràsit", "paràlisi", "préssec", "préstec", "pèsol", "pèl", "pèrdua", "pèndol", "cérvol", "règim", "règia", "ciència", "paciència", "consciència", "experiència", "essència", "presència", "fàbrica", "tràfic", "espès", "francès", "anglès", "japonès", "xinès", "pagès", "món", "raó", "lliçó", "vermelló", "òliba", "òrbita", "túnel", "cúpula", "fúnebre", "rúbrica", "púrpura", "ràdio", "dàlia", "àcid", "àguila", "àlgebra", "àmbit", "àncora", "ànima", "àpat", "àrbitre", "àvia", "àvid", "èpic", "èter", "ésser", "interès", "progrés", "exprés", "accés", "succés", "excés", "procés", "congrés", "través", "cortès", "marquès", "diàleg", "catàleg", "epíleg", "anàlisi", "síntesi", "hipòtesi", "èmfasi", "òptim", "òptica", "òxid", "úlcera", "càlcul", "càrrec", "càstig", "càmera", "càntir", "càrrega", "càpsula", "càlid", "límit", "lírica", "lícit", "línia", "sòlid", "sòcol", "tècnic", "tèrmic", "tècnica", "dèficit", "dècada", "dèbit", "dèria", "gènere", "gènesi", "genèric", "mèrit", "mètode", "mètric", "mèdic", "número", "núvol", "núvia", "públic", "pública", "músic", "múscul", "múltiple", "sàvia", "sàtira", "sàlvia", "màrtir", "màxim", "màster", "ràbia", "ràfega", "tòpic", "tòrrid", "còdol", "còmic", "còmode", "bíblia", "bíceps", "símbol", "síndria", "sílex", "sínia", "títol", "típic", "tímid", "cínic", "cítric", "vídeo", "víctima", "píndola", "pícnic", "hàbit", "hàmster", "fórmula", "fòssil", "fòrum", "vèrtex", "sènior", "sèrie", "sèsam", "pèrgola", "pèrfid", "òbit", "camió", "lleó", "ratolí", "jardí", "matí", "sabó", "botó", "telèfon", "telègraf", "paràgraf", "paràbola", "anàleg", "èxode"];
const JOC = 'accents';
const VOC = { a:['a','à'], e:['e','è','é'], i:['i','í'], o:['o','ò','ó'], u:['u','ú'] };
const sense = w => w.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function variants(w){ // totes les maneres d'accentuar una sola vocal (o cap)
  const base = sense(w), out = new Set([base]);
  for (let i = 0; i < base.length; i++) { const v = VOC[base[i]]; if (!v) continue; for (const a of v) out.add(base.slice(0, i) + a + base.slice(i + 1)); }
  out.delete(w); return [...out];
}
let panells = [], correcte = null;
const COLS = ['#FF3E9A','#FFD600','#33E0FF'];
AMPLE = 6.8; ALT = 6; CY = .3; mida();
function prepara(){
  for (const p of panells) scene.remove(p); panells = [];
  const w = tria(ACCENTS), ops = barreja([w, ...barreja(variants(w)).slice(0, 2)]);
  document.getElementById('pregunta').innerHTML = `Com s'escriu?<small>Tria la forma correcta</small>`;
  ops.forEach((o, i) => { const p = panell(o, COLS[i], '#1D2B64', 4.6, 1.2); p.position.set(0, 1.6 - i * 1.6, 0); p.scale.setScalar(.01); p.userData.ok = o === w; p.userData.w0 = o; scene.add(p); panells.push(p); if (o === w) correcte = p; });
}
function respon(p){
  if (!viu || bloquejat) return;
  if (p.userData.ok) { repinta(p, p.userData.w0, '#7CE800', '#1D2B64'); confeti(p.position, 24, 7); resultat(true); }
  else { repinta(p, p.userData.w0, '#6E7BB5', '#fff'); repinta(correcte, correcte.userData.w0, '#7CE800', '#1D2B64'); p.userData.sacseig = .35; mostra(`Era «${correcte.userData.w0}»`, 1800); resultat(false); }
}
function fallaTemps(){ bloquejat = true; repinta(correcte, correcte.userData.w0, '#7CE800', '#1D2B64'); ratxa = 0; so('mal'); setTimeout(novaRonda, 1800); }
function respostaBot(){ respon(correcte); }
renderer.domElement.addEventListener('pointerdown', e => { const p = sota(e, panells); if (p) respon(p); });
addEventListener('keydown', e => { const i = Number(e.key) - 1; if (panells[i]) respon(panells[i]); if (e.key === 'Enter' && !viu) comenca(); });
tick = dt => { tickRondes(dt); panells.forEach((p, i) => { p.scale.lerp(new THREE.Vector3(1,1,1), dt * 8); p.rotation.y = Math.sin(rellotge.elapsedTime * 1.5 + i) * .05;
  if (p.userData.sacseig > 0) { p.userData.sacseig -= dt; p.position.x = Math.sin(p.userData.sacseig * 60) * .15; } else p.position.x = 0; }); };

let ronda = 0, punts = 0, viu = false, bloquejat = false, ratxa = 0, tempsRonda = 0, tempsMax = 10;
const N_RONDES = 10;
const barra = document.getElementById('barra');
function comenca(){ ronda = 0; punts = 0; ratxa = 0; encerts = 0; document.getElementById('punts').textContent = 0;
  document.getElementById('inici').hidden = true; document.getElementById('final').hidden = true; so('clic'); viu = true; novaRonda(); }
function acaba(){ viu = false; so('win'); avisa('fi');
  const clau = 'catquiz-' + JOC, millor = Math.max(Number(localStorage.getItem(clau) || 0), punts); localStorage.setItem(clau, millor);
  document.getElementById('punts-final').textContent = punts;
  document.getElementById('text-final').textContent = (punts >= millor && punts > 0 ? 'Nou rècord! ' : `El teu rècord és ${millor}. `) + `${encerts} de ${N_RONDES} encertades.`;
  document.getElementById('titol-final').textContent = encerts === N_RONDES ? 'Perfecte!' : encerts >= 7 ? 'Molt bé!' : encerts >= 4 ? 'No està malament' : 'A practicar!';
  document.getElementById('final').hidden = QUIZ && DEMO; if (DEMO) setTimeout(comenca, QUIZ ? 6000 : 2500); }
let encerts = 0;
function novaRonda(){ if (ronda >= N_RONDES) return acaba(); ronda++; bloquejat = false; tempsRonda = tempsMax;
  document.getElementById('ronda').textContent = `${ronda} / ${N_RONDES}`; popPill('ronda'); prepara();
  if (DEMO) setTimeout(bot, 1300); }
function resultat(ok, punt = 10){ bloquejat = true;
  if (ok) { encerts++; ratxa++; const b = ratxa >= 3 ? 2 : 1; punts += punt * b + Math.ceil(tempsRonda); popPunts('punts', punts); so(b > 1 ? 'bonus' : 'ok'); if (b > 1) mostra(`Ratxa ×${ratxa}! 🔥`, 900); }
  else { ratxa = 0; so('mal'); }
  setTimeout(novaRonda, ok ? 1100 : 2000); }
document.getElementById('btn-inici').onclick = comenca; document.getElementById('btn-reinici').onclick = comenca;
if (DEMO) { document.getElementById('inici').hidden = true; setTimeout(comenca, 500); }
async function bot(){ if (!viu || bloquejat) return;
  if (QUIZ && ronda === 2 && !bot.fet) { bot.fet = true; avisa('quiz'); await espera(5200); }
  if (ronda === 1) bot.fet = false; respostaBot(); }
function tickRondes(dt){ if (!viu || bloquejat) return; tempsRonda -= dt; if (barra) barra.style.transform = `scaleX(${Math.max(0, tempsRonda / tempsMax)})`;
  if (tempsRonda <= 0) { mostra('Temps!'); fallaTemps(); } }


const btnMusica = document.getElementById('btn-musica'); if (btnMusica) { btnMusica.style.opacity = AUDIO.actiu ? 1 : .5; btnMusica.onclick = () => { btnMusica.style.opacity = musicaCommuta() ? 1 : .5; }; }
window.__fi = () => acaba(false); // per a proves automàtiques
function anima(){
  requestAnimationFrame(anima);
  const dt = Math.min(rellotge.getDelta(), .05), t = rellotge.elapsedTime;
  mouNuvols(dt); mouConfeti(dt); mouIlles(dt); solMesh.userData.raigs.rotation.z += dt * .15;
  tick(dt, t);
  renderer.render(scene, camera);
}
anima();
