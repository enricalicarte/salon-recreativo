<div class="capa" id="inici"><div class="caixa"><h1>Esquiva!</h1><p>Mou-te amb les fletxes, A/D o tocant a la meitat esquerra o dreta de la pantalla. Esquiva els blocs i recull monedes (+10). Salta amb espai, fletxa amunt o tocant a dalt de la pantalla: els blocs baixets es poden saltar! L'escut blau t'absorbeix un cop.</p><button id="btn-inici">Comença</button></div></div>

<script type="module">

  const c = new THREE.Mesh(geoConf, toon({ color: colsConf[i % 6] })); c.position.copy(pos);

  sol.add(raigs); sol.userData.raigs = raigs; return sol;
}
const illes = [];
function illa(x, y, z, s = 1){ const g = new THREE.Group();
  const top = contorn(new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2, .7, 9), toon({ color: 0x7CE800 })), .04); g.add(top);
  const base = contorn(new THREE.Mesh(new THREE.ConeGeometry(2, 3, 9), toon({ color: 0xA8683A })), .04); base.rotation.x = Math.PI; base.position.y = -1.8; g.add(base);

    const cop = contorn(new THREE.Mesh(new THREE.SphereGeometry(.7 + Math.random()*.3, 12, 10), toon({ color: [0x4CD100, 0xFF3E9A, 0xFFD600][Math.floor(Math.random()*3)] })), .06); cop.position.set(tr.position.x, 1.6, tr.position.z); g.add(cop); }

let tKit = 0; function mouIlles(dt){ tKit += dt; for (const g of illes) { g.position.y = g.userData.y0 + Math.sin(tKit * .8 + g.userData.f) * .35; g.rotation.y += dt * .05; } }
function compte(fi){ const el = document.createElement('div'); el.className = 'compte'; document.body.appendChild(el); let n = 3;
  const tic = () => { el.textContent = n > 0 ? n : 'JA!'; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); so(n > 0 ? 'clic' : 'win'); if (n-- > 0) setTimeout(tic, 650); else { setTimeout(() => el.remove(), 600); fi(); } }; tic(); }

// Estil Stumble Guys: contorn (casc invertit) i núvols de fons
const matContorn = new THREE.MeshBasicMaterial({ color: 0x1D2B64, side: THREE.BackSide });
function contorn(m, g = .06){ const c = new THREE.Mesh(m.geometry, matContorn); c.scale.setScalar(1 + g); c.renderOrder = -1; m.add(c); return m; }

// ===== Motor d'àudio 100% procedural (Web Audio) =====

const AUDIO = { ctx: null, master: null, mus: null, soroll: null, actiu: localStorage.getItem('catquiz-musica') !== '0' };
function audioInit(){ if (AUDIO.ctx) return AUDIO.ctx; const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;

// SFX: cada crida varia el to ±6% perquè no sonin repetitius
const SFX = { ok:[660,1320,.14,'square'], mal:[220,90,.35,'sawtooth'], clic:[520,520,.05,'square'], win:[523,1568,.45,'square'], bonus:[880,1760,.2,'triangle'], pop:[500,800,.1,'triangle'], tic:[900,900,.05,'sine'] };
function so(tipus){ try { if (!audioInit()) return; const [f0, f1, dur, tp] = SFX[tipus] || SFX.clic, v = 1 + (Math.random() - .5) * .12, t = AUDIO.ctx.currentTime;

// Seqüenciador: planifica amb 120 ms d'antelació des d'un temporitzador de 25 ms (el rellotge precís és el de l'AudioContext)
const SEQ = { bpm: 126, pas: 0, seguent: 0, timer: null, lookahead: .12, interval: 25, estil: 'quiz' };
const ESCALA = [0, 2, 4, 7, 9, 12, 14, 16]; // pentatònica major sobre Do
const ESTILS = {
  quiz:    { bpm: 126, base: 261.63, baix: [0,0,7,0, 5,5,0,5, 3,3,0,3, 5,5,7,7], ritme: 'bombo.xarles.caixa.xarles' },
  suspens: { bpm: 100, base: 220,    baix: [0,0,0,3, 0,0,0,5, 0,0,0,3, 7,7,5,3], ritme: 'bombo.xarles.xarles.xarles', menor: true },

function tocaPas(p, t){ const e = ESTILS[SEQ.estil], r = e.ritme.split('.');
  if (p % 4 === 0) percussio(t, r[0]); if (p % 4 === 2) percussio(t, 'xarles'); if (p % 8 === 4) percussio(t, r[2]); if (p % 2) percussio(t, 'xarles');

function musicaInici(estil = SEQ.estil){ if (!audioInit() || SEQ.timer) return; SEQ.estil = estil; SEQ.bpm = ESTILS[estil].bpm; novaMelodia(); SEQ.pas = 0; SEQ.seguent = AUDIO.ctx.currentTime + .05;
  AUDIO.mus.gain.cancelScheduledValues(AUDIO.ctx.currentTime); AUDIO.mus.gain.setTargetAtTime(.22, AUDIO.ctx.currentTime, .3); SEQ.timer = setInterval(planifica, SEQ.interval); }
function musicaAtura(){ if (!SEQ.timer) return; clearInterval(SEQ.timer); SEQ.timer = null; AUDIO.mus.gain.setTargetAtTime(0, AUDIO.ctx.currentTime, .4); }
Object.assign(window, { AUDIO, SEQ, so, musicaCommuta: () => musicaCommuta() }); // accessibles des de la consola
function musicaCommuta(){ AUDIO.actiu = !AUDIO.actiu; localStorage.setItem('catquiz-musica', AUDIO.actiu ? '1' : '0'); if (AUDIO.actiu) musicaInici(); else musicaAtura(); return AUDIO.actiu; }

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x5EC8FF);
scene.fog = new THREE.Fog(0x8FDCFF, 60, 150);
const solMesh = celISol(); for (const [x, y, z] of [[-26, 4, -55], [24, 7, -70], [-30, 9, -95], [30, 3, -40]]) illa(x, y, z, 2.4);
for (let i = 0; i < 7; i++) nuvols.push(nuvol(-30 + i*10, 8 + Math.random()*6, -60 - Math.random()*20, 2 + Math.random()));
const camera = new THREE.PerspectiveCamera(60, 1, .1, 200);
camera.position.set(0, 6, 12); camera.lookAt(0, 0, -10);
scene.add(new THREE.HemisphereLight(0xffffff, 0x3f7fd0, 1.4));
const llum = new THREE.DirectionalLight(0xffffff, 1.5); llum.position.set(4, 10, 6); scene.add(llum);

const CARRILS = [-3, 0, 3];
const terra = new THREE.Mesh(new THREE.PlaneGeometry(12, 200), toon({ color: 0x9B5CFF }));
terra.rotation.x = -Math.PI/2; terra.position.z = -60; scene.add(terra);
for (const x of [-4.5, -1.5, 1.5, 4.5]) {
  const l = new THREE.Mesh(new THREE.PlaneGeometry(.15, 200), toon({ color: 0xFFD600 }));
  l.rotation.x = -Math.PI/2; l.position.set(x, .01, -60); scene.add(l);
}
const geoCos = new THREE.CapsuleGeometry(.55, .7, 6, 14); geoCos.translate(0, .25, 0);
const jugador = new THREE.Mesh(geoCos, toon({ color: 0xFF3E9A }));
const ombra = new THREE.Mesh(new THREE.CircleGeometry(.75, 20), new THREE.MeshBasicMaterial({ color: 0x1D2B64, transparent: true, opacity: .35 })); ombra.rotation.x = -Math.PI/2; ombra.position.y = .02; scene.add(ombra);
const peus = [-1, 1].map(s => { const p = contorn(new THREE.Mesh(new THREE.SphereGeometry(.28, 10, 8), toon({ color: 0x1E7BE0 })), .1); p.position.set(s*.32, -.45, .1); jugador.add(p); return p; });
const casc = contorn(new THREE.Mesh(new THREE.SphereGeometry(.6, 14, 10, 0, Math.PI*2, 0, Math.PI/2), toon({ color: 0xFFD600 })), .06); casc.position.y = .85; jugador.add(casc);
jugador.material.color.setHex(0xFF3E9A); jugador.position.y = .7; contorn(jugador); scene.add(jugador);
const vorals = [-6.2, 6.2].map(x => { const v = new THREE.Mesh(new THREE.BoxGeometry(.6, 1.2, 200), toon({ color: 0x7CE800 })); v.position.set(x, .6, -60); scene.add(v); return v; });
const ulls = new THREE.Group();
for (const s of [-1, 1]) { const u = new THREE.Mesh(new THREE.SphereGeometry(.17, 12, 10), new THREE.MeshBasicMaterial({ color: 0xFFFFFF })); u.position.set(s*.24, .5, .48); const pupil = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 6), new THREE.MeshBasicMaterial({ color: 0x1D2B64 })); pupil.position.z = .12; u.add(pupil); ulls.add(u); }
const somriure = new THREE.Mesh(new THREE.TorusGeometry(.18, .05, 6, 12, Math.PI), new THREE.MeshBasicMaterial({ color: 0x1D2B64 })); somriure.rotation.z = Math.PI; somriure.position.set(0, .28, .55); jugador.add(somriure);
jugador.add(ulls);

const geoBloc = new RoundedBoxGeometry(2, 2, 2, 4, .3);
const geoMoneda = new THREE.CylinderGeometry(.6, .6, .18, 20), matMoneda = toon({ color: 0xFFD600, emissive: 0xAA7700 });
const marques = [];
for (let i = 0; i < 20; i++) for (const x of [-1.5, 1.5]) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(.18, 1.6), toon({ color: 0xE8C25A }));
  m.rotation.x = -Math.PI/2; m.position.set(x, .02, -i*4); scene.add(m); marques.push(m);
}
let bonus = 0, sacseig = 0, decisio = 0, vy = 0, escut = false, nivell = 1;
const geoBaix = new RoundedBoxGeometry(2, .9, 2, 4, .2), geoEscut = new THREE.OctahedronGeometry(.7), matEscut = toon({ color: 0x33E0FF });
const bombolla = new THREE.Mesh(new THREE.SphereGeometry(1.25, 20, 14), toon({ color: 0x33E0FF, transparent: true, opacity: .45 })); bombolla.visible = false; jugador.add(bombolla);
const nivellEl = document.createElement('span'); nivellEl.className = 'pill temps'; nivellEl.textContent = 'Nivell 1'; document.querySelector('.hud').insertBefore(nivellEl, document.getElementById('punts'));
const DEMO = new URLSearchParams(location.search).has('demo'); // ?demo → el joc juga sol (per gravar reels)

const colorsBloc = [0xFF8C1A, 0x1E7BE0, 0xFF3E9A];
let blocs = [], carril = 1, punts = 0, viu = false, vel = 18, temps = 0, propera = 0;
const millorGuardat = () => Number(localStorage.getItem('catquiz-esquiva') || 0);

function nouBloc(){
  const b = contorn(new THREE.Mesh(geoBloc, toon({ color: colorsBloc[Math.floor(Math.random()*3)] })), .05);
  const lliure = Math.floor(Math.random()*3);
  const n = Math.random() < .35 ? 2 : 1;
  const cs = [0,1,2].filter(c => c !== lliure).sort(() => Math.random()-.5).slice(0, n);
  for (const c of cs) { const m = b.clone(); if (temps > 8 && Math.random() < .4) { m.geometry = geoBaix; m.children[0].geometry = geoBaix; m.userData.baix = true; m.position.set(CARRILS[c], .45, -70); } else m.position.set(CARRILS[c], 1, -70); scene.add(m); blocs.push(m); }
  if (!escut && Math.random() < .08) { const e = contorn(new THREE.Mesh(geoEscut, matEscut), .1); e.position.set(CARRILS[lliure], 1.3, -78); e.userData.escut = true; scene.add(e); blocs.push(e); }
  if (Math.random() < .55) { const c = contorn(new THREE.Mesh(geoMoneda, matMoneda), .1); c.rotation.x = Math.PI/2; c.position.set(CARRILS[lliure], 1.2, -74); c.userData.moneda = true; scene.add(c); blocs.push(c); }
}
function comenca(){
  for (const b of blocs) scene.remove(b); blocs = [];
  punts = 0; bonus = 0; vel = 18; temps = 0; propera = 0; carril = 1; viu = false; compte(() => viu = true); vy = 0; escut = false; bombolla.visible = false; nivell = 1; nivellEl.textContent = 'Nivell 1'; so('clic');
  jugador.position.x = 0; jugador.rotation.set(0,0,0);
  document.getElementById('inici').hidden = true; document.getElementById('final').hidden = true;
}
function acaba(){
  viu = false; sacseig = .8; so('mal'); confeti(jugador.position, 30, 9);
  const millor = Math.max(millorGuardat(), punts); localStorage.setItem('catquiz-esquiva', millor);
  document.getElementById('punts-final').textContent = punts;
  document.getElementById('millor').textContent = punts >= millor && punts > 0 ? 'Nou rècord!' : `El teu rècord és ${millor}.`;
  document.getElementById('final').hidden = false;
  if (DEMO) setTimeout(comenca, 1800);
}
document.getElementById('btn-inici').onclick = comenca;
if (DEMO) { document.getElementById('inici').hidden = true; setTimeout(comenca, 500); }
document.getElementById('btn-reinici').onclick = comenca;

const mou = d => { if (viu) carril = Math.max(0, Math.min(2, carril + d)); };
addEventListener('keydown', e => {
  if (['ArrowLeft','a','A'].includes(e.key)) mou(-1);
  if (['ArrowRight','d','D'].includes(e.key)) mou(1);
  if (e.key === ' ' && !viu) comenca(); else if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && viu) salta();
});
renderer.domElement.addEventListener('pointerdown', e => { if (e.clientY < innerHeight * .4) salta(); else mou(e.clientX < innerWidth/2 ? -1 : 1); });
function salta(){ if (viu && jugador.position.y <= .72) { vy = 11; so('clic'); } }

const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .4, .5, .92)); composer.addPass(new OutputPass());
function mida(){ renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', mida); mida();

const rellotge = new THREE.Clock();
const btnMusica = document.getElementById('btn-musica'); if (btnMusica) { btnMusica.style.opacity = AUDIO.actiu ? 1 : .5; btnMusica.onclick = () => { btnMusica.style.opacity = musicaCommuta() ? 1 : .5; }; }
window.__fi = () => acaba(false); // per a proves automàtiques
function anima(){
  requestAnimationFrame(anima);
  const dt = Math.min(rellotge.getDelta(), .05); mouNuvols(dt); mouConfeti(dt); mouIlles(dt); solMesh.userData.raigs.rotation.z += dt * .15;
  camera.fov += ((viu ? 60 + Math.min(20, (vel - 18) * .5) : 60) - camera.fov) * dt * 2; camera.updateProjectionMatrix();
  peus.forEach((p, i) => p.position.y = -.45 + (jugador.position.y > .8 ? .15 : Math.max(0, Math.sin(temps * 16 + i * Math.PI)) * .22)); ombra.position.x = jugador.position.x; ombra.scale.setScalar(1 - (jugador.position.y - .7) * .25);
  if (viu) {
    temps += dt; vel = 18 + temps * 1.2; propera -= dt;
    const n = 1 + Math.floor(temps / 15); if (n !== nivell) { nivell = n; nivellEl.textContent = `Nivell ${n}`; so('bonus'); sacseig = .4; }
    vy -= 30 * dt; jugador.position.y = Math.max(.7, jugador.position.y + vy * dt); if (jugador.position.y <= .7) vy = 0;
    if (propera <= 0) { nouBloc(); propera = Math.max(.45, 1.1 - temps * .02); }
    punts = Math.floor(temps * 10) + bonus; document.getElementById('punts').textContent = punts;
    for (const b of blocs) {
      b.position.z += vel * dt; if (b.userData.moneda) b.rotation.z += dt * 4; else b.rotation.x += dt * 2;
      if (b.userData.escut) b.rotation.y += dt * 3;
      if (b.visible && Math.abs(b.position.z - jugador.position.z) < 1.6 && Math.abs(b.position.x - jugador.position.x) < 1.6) {
        if (b.userData.moneda) { b.visible = false; bonus += 10; so('bonus'); jugador.scale.setScalar(1.35); confeti(b.position, 12, 5); popPill('punts'); }
        else if (b.userData.escut) { b.visible = false; escut = true; bombolla.visible = true; so('win'); confeti(b.position, 24, 7); }
        else if (b.userData.baix && jugador.position.y > 1.6) { /* saltat! */ }
        else if (escut) { escut = false; bombolla.visible = false; b.visible = false; sacseig = .5; so('mal'); }
        else acaba();
      }
    }
    for (const m of marques) { m.position.z += vel * dt; if (m.position.z > 12) m.position.z -= 80; }
    if (DEMO && (decisio -= dt) <= 0) { // bot: evita carrils amb bloc a prop, prefereix monedes
      decisio = .12; const perill = [0,0,0], moneda = [0,0,0];
      for (const b of blocs) { if (!b.visible || b.position.z > 2 || b.position.z < -28) continue;
        const c = CARRILS.indexOf(b.position.x); if (b.userData.moneda || b.userData.escut) moneda[c] = 1; else perill[c] = 1; }
      const baixDavant = blocs.some(b => b.userData.baix && b.visible && CARRILS.indexOf(b.position.x) === carril && b.position.z > -9 && b.position.z < -3); if (baixDavant) salta();
      if (perill[carril] && !baixDavant) { const ops = [carril-1, carril+1].filter(c => c >= 0 && c < 3 && !perill[c]); if (ops.length) carril = ops.sort((a,b) => moneda[b]-moneda[a])[0]; }
      else { const ops = [carril-1, carril+1].filter(c => c >= 0 && c < 3 && !perill[c] && moneda[c]); if (ops.length && !moneda[carril]) carril = ops[0]; }
    }
    blocs = blocs.filter(b => { if (b.position.z > 15) { scene.remove(b); return false; } return true; });
  } else if (!document.getElementById('inici').hidden) {
    jugador.rotation.y += dt;
  }
  const objectiu = CARRILS[carril];
  jugador.position.x += (objectiu - jugador.position.x) * Math.min(1, dt * 14);
  jugador.rotation.z = (jugador.position.x - objectiu) * .25;
  if (jugador.position.y <= .7) jugador.position.y = .7 + Math.abs(Math.sin(temps * 12)) * .1;
  jugador.scale.lerp(new THREE.Vector3(1,1,1), dt * 8);
  sacseig *= .9; camera.position.set((Math.random()-.5)*sacseig, 6 + (Math.random()-.5)*sacseig, 12);
  composer.render();
}
anima();
