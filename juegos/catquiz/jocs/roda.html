<style>
:root{
  --tile:#5fd068; --tile2:#3fae4b; --title:#0b8a1e; --accent:#62d96b;
  --sky1:#f4fbf2; --sky2:#cfe8c4; --sky3:#4e7f2d; --hill1:#3d6b24; --hill2:#2b4f17;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;justify-content:center;background:#111}
#game{position:relative;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 38%,var(--sky3) 100%);transition:background .6s}
#decor{position:absolute;inset:0;pointer-events:none}
#decor svg{position:absolute;bottom:0;left:0;width:100%;height:55%}
#decor .hill1{fill:var(--hill1);transition:fill .6s}
#decor .hill2{fill:var(--hill2);transition:fill .6s}
#fade{position:absolute;top:0;left:0;right:0;height:34%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
#top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0}
.pill{background:rgba(255,255,255,.85);border-radius:20px;padding:5px 12px;font-weight:800;color:#444;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:18px;color:#444;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}
#title{position:relative;z-index:2;text-align:center;font-weight:900;font-size:clamp(26px,8vw,40px);line-height:1.05;color:var(--title);margin:6px 10px 0;letter-spacing:.5px;text-transform:uppercase;transition:color .6s;text-shadow:0 1px 0 rgba(255,255,255,.5)}
#gridArea{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 10px}
#grid{display:grid;gap:4px}
.cell{border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;
  background:rgba(255,255,255,.55);box-shadow:0 2px 3px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.5);transition:background .25s}
.cell.on{background:linear-gradient(180deg,var(--tile),var(--tile2));text-shadow:0 2px 3px rgba(0,0,0,.3)}
.cell.pop{animation:pop .45s ease}
.cell.target{outline:3px dashed #fff;animation:blink .8s infinite}
@keyframes pop{0%{transform:scale(.3);filter:brightness(2)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.5}}
#preview{position:relative;z-index:2;height:44px;display:flex;align-items:center;justify-content:center}
#word{min-width:90px;padding:4px 26px;border-radius:6px;background:rgba(255,255,255,.88);font-weight:900;letter-spacing:5px;color:#555;font-size:22px;text-align:center;opacity:0;transform:scale(.8);transition:all .15s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
#word.show{opacity:1;transform:scale(1)}
#word.ok{background:var(--tile);color:#fff}
#word.bad{background:#e66;color:#fff;animation:shake .35s}
#word.bonus{background:#ffc83d;color:#fff}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#bottom{position:relative;z-index:2;flex-shrink:0;width:100%;height:min(82vw,350px);margin-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:center;justify-content:center}
#wheel{position:relative;width:min(70vw,300px);height:min(70vw,300px);border-radius:50%;background:rgba(244,244,240,.94);box-shadow:0 6px 18px rgba(0,0,0,.3);touch-action:none;margin-top:0}
#ring{position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(255,255,255,.7);pointer-events:none}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.letter{position:absolute;width:21%;height:21%;margin:-10.5% 0 0 -10.5%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(26px,9vw,40px);color:#444;transition:left .45s,top .45s,background .12s,color .12s;pointer-events:none}
.letter.sel{background:var(--tile);color:#fff}
#shuffle{position:absolute;left:50%;top:50%;width:15%;height:15%;transform:translate(-50%,-50%);border-radius:50%;border:0;background:rgba(0,0,0,.06);font-size:22px;color:#777;cursor:pointer;z-index:3}
.side{position:absolute;z-index:3;width:56px;height:56px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#4f7686,#1f4150);color:#fff;font-size:26px;box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:pointer}
.side small{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);background:#f2f2ee;color:#444;font-size:12px;font-weight:900;padding:1px 8px;border-radius:3px;white-space:nowrap}
#hintBtn{right:14px;top:4px}
#targetBtn{left:14px;top:4px}
#bonusBtn{left:14px;bottom:16px;font-size:22px}
.side.active{box-shadow:0 0 0 4px #ffe36a,0 3px 8px rgba(0,0,0,.35)}
#toast{position:absolute;z-index:6;left:50%;top:22%;transform:translate(-50%,-10px);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:18px;font-weight:700;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:absolute;inset:0;z-index:10;background:rgba(10,20,10,.72);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff;padding:24px}
.overlay.show{display:flex}
.overlay h1{margin:0 0 6px;font-size:36px;font-weight:900;letter-spacing:1px}
.overlay p{margin:6px 0 18px;font-size:17px;opacity:.9;max-width:320px}
.big{border:0;border-radius:30px;padding:14px 38px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(180deg,var(--tile),var(--tile2));box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer}
.bonuslist{max-height:55%;overflow:auto;background:rgba(255,255,255,.95);color:#333;border-radius:14px;padding:14px 18px;font-weight:800;line-height:1.7;max-width:340px}
.bonuslist span{display:inline-block;margin:2px 4px;padding:0 8px;border-radius:6px;background:#eee}
.bonuslist span.got{background:var(--tile);color:#fff}
.confetti{position:absolute;top:-20px;width:10px;height:14px;z-index:11;animation:fall 2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- Generador de crucigrama ---------- */
function buildLayout(words){
  let best=null;
  for(let t=0;t<600;t++){
    const ws=[...new Set(words)].sort((a,b)=>b.length-a.length||Math.random()-.5);
    if(t%3===2)ws.sort(()=>Math.random()-.5);
    const cells=new Map(),dirs=new Map(),placed=[];
    const key=(r,c)=>r+","+c;
    const can=(w,r,c,d)=>{
      const dr=d?1:0,dc=d?0:1;
      if(cells.has(key(r-dr,c-dc))||cells.has(key(r+dr*w.length,c+dc*w.length)))return false;
      let cross=0;
      for(let i=0;i<w.length;i++){
        const rr=r+dr*i,cc=c+dc*i,ex=cells.get(key(rr,cc));
        if(ex!==undefined){
          if(ex!==w[i]||dirs.get(key(rr,cc)).has(d))return false;
          cross++;
        }else if(cells.has(key(rr+dc,cc+dr))||cells.has(key(rr-dc,cc-dr)))return false;
      }
      return placed.length===0||(cross>0&&cross<w.length);
    };
    const put=(w,r,c,d)=>{
      const dr=d?1:0,dc=d?0:1;
      for(let i=0;i<w.length;i++){
        const k=key(r+dr*i,c+dc*i);cells.set(k,w[i]);
        if(!dirs.has(k))dirs.set(k,new Set());dirs.get(k).add(d);
      }
      placed.push({w,r,c,d});
    };
    put(ws[0],0,0,0);
    for(let n=1;n<ws.length;n++){
      const w=ws[n],cands=[];
      for(const [k,ch] of cells){
        const [cr,cc]=k.split(",").map(Number);
        for(let i=0;i<w.length;i++)if(w[i]===ch)for(let d=0;d<2;d++){
          const r=cr-(d?i:0),c=cc-(d?0:i);
          if(can(w,r,c,d))cands.push([r,c,d]);
        }
      }
      if(cands.length){const [r,c,d]=cands[Math.floor(Math.random()*cands.length)];put(w,r,c,d)}
    }
    let minR=1e9,minC=1e9,maxR=-1e9,maxC=-1e9;
    for(const k of cells.keys()){const [r,c]=k.split(",").map(Number);minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c)}
    const rows=maxR-minR+1,cols=maxC-minC+1;
    const score=placed.length*1000-rows*cols*5-Math.abs(rows-cols)*8-Math.max(rows,cols)*60;
    if(!best||score>best.score)best={score,rows,cols,minR,minC,placed};
  }
  const list=best.placed.map(p=>({w:p.w,r:p.r-best.minR,c:p.c-best.minC,d:p.d}));
  return {rows:best.rows,cols:best.cols,words:list};
}

  order=L.letters.split("");shuffleArr(order);
  $("bonusCount").textContent="0";
  renderGrid();renderWheel();updateCoins();setWord("");
}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}

/* ---------- Tablero ---------- */
const cellLetter=new Map();
function renderGrid(){
  const g=$("grid");g.innerHTML="";cellLetter.clear();
  layout.words.forEach(o=>{for(let i=0;i<o.w.length;i++){
    const r=o.r+(o.d?i:0),c=o.c+(o.d?0:i);cellLetter.set(r+","+c,o.w[i])}});
  const area=$("gridArea").getBoundingClientRect();
  const s=Math.floor(Math.min((area.width-20)/layout.cols,(area.height-12)/layout.rows,64));
  g.style.gridTemplateColumns="repeat("+layout.cols+","+s+"px)";
  g.style.gridAutoRows=s+"px";
  for(let r=0;r<layout.rows;r++)for(let c=0;c<layout.cols;c++){
    const k=r+","+c,d=document.createElement("div");
    if(cellLetter.has(k)){
      d.className="cell";d.dataset.k=k;d.style.fontSize=Math.floor(s*.62)+"px";
      if(revealed.has(k)){d.classList.add("on");d.textContent=cellLetter.get(k)}
      d.addEventListener("pointerdown",()=>onCellTap(k));
    }else d.style.visibility="hidden";
    g.appendChild(d);
  }
}
function cellEl(k){return $("grid").querySelector('[data-k="'+k+'"]')}
function reveal(k,anim){
  if(revealed.has(k))return;
  revealed.add(k);const e=cellEl(k);if(!e)return;
  e.classList.add("on");e.textContent=cellLetter.get(k);
  if(anim){e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}
}
function wordCells(o){const a=[];for(let i=0;i<o.w.length;i++)a.push((o.r+(o.d?i:0))+","+(o.c+(o.d?0:i)));return a}
function isFound(o){return wordCells(o).every(k=>revealed.has(k))}
function checkWin(){
  if(layout.words.every(isFound)&&!locked){
    locked=true;sfx.win();confetti();
    const reward=20+layout.words.length*2;coins+=reward;levelIdx++;save();updateCoins();
    setTimeout(()=>{$("winMsg").textContent="+"+reward+" monedes"+(foundBonus.size?" · "+foundBonus.size+(foundBonus.size>1?" paraules extra":" paraula extra"):"");$("winOv").classList.add("show")},900);
  }
}

/* ---------- Rueda ---------- */
let wheelSize=0;
function letterPos(i,n){
  const a=-Math.PI/2+i*2*Math.PI/n;
  return {x:50+34*Math.cos(a),y:50+34*Math.sin(a)};
}
function renderWheel(){
  const w=$("wheel");w.querySelectorAll(".letter").forEach(e=>e.remove());
  const n=order.length;
  order.forEach((ch,i)=>{
    const p=letterPos(i,n),d=document.createElement("div");
    d.className="letter";d.textContent=ch;d.dataset.i=i;
    d.style.left=p.x+"%";d.style.top=p.y+"%";w.appendChild(d);
  });
  drawLines();
}
function centerOf(i){const p=letterPos(i,order.length),r=$("wheel").getBoundingClientRect();return {x:p.x/100*r.width,y:p.y/100*r.height}}
function drawLines(){
  const svg=$("lines"),r=$("wheel").getBoundingClientRect();
  svg.setAttribute("viewBox","0 0 "+r.width+" "+r.height);
  let pts=path.map(centerOf);
  let s="";
  if(pts.length){
    const col=getComputedStyle(document.documentElement).getPropertyValue("--tile");
    const sw=r.width*.1;
    const all=pts.slice();if(pointer)all.push(pointer);
    s='<polyline fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" opacity=".9" points="'+all.map(p=>p.x+","+p.y).join(" ")+'"/>';
  }
  svg.innerHTML=s;
  $("wheel").querySelectorAll(".letter").forEach(e=>e.classList.toggle("sel",path.includes(+e.dataset.i)));
}
function hit(x,y){
  const r=$("wheel").getBoundingClientRect(),rad=r.width*.11;
  for(let i=0;i<order.length;i++){const c=centerOf(i);if(Math.hypot(c.x-x,c.y-y)<rad)return i}
  return -1;
}
function setWord(txt,cls){
  const w=$("word");w.textContent=txt;w.className=txt?"show "+(cls||""):"";
}
function localXY(e){const r=$("wheel").getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
const wheel=$("wheel");
wheel.addEventListener("pointerdown",e=>{
  if(locked)return;
  wheel.setPointerCapture(e.pointerId);
  const p=localXY(e);pointer=p;path=[];
  const h=hit(p.x,p.y);
  if(h>=0){path=[h];sfx.tick(0)}
  setWord(path.map(i=>order[i]).join(""));drawLines();
});
wheel.addEventListener("pointermove",e=>{
  if(!path.length)return;
  const p=localXY(e);pointer=p;const h=hit(p.x,p.y);
  if(h>=0){
    if(path.length>1&&h===path[path.length-2]){path.pop();sfx.tick(path.length)}
    else if(!path.includes(h)){path.push(h);sfx.tick(path.length)}
    setWord(path.map(i=>order[i]).join(""));
  }
  drawLines();
});
function endSel(){
  if(!path.length){pointer=null;return}
  const word=path.map(i=>order[i]).join("");
  path=[];pointer=null;drawLines();
  submit(word);
}
wheel.addEventListener("pointerup",endSel);
wheel.addEventListener("pointercancel",endSel);

function submit(word){
  if(word.length<2){setWord("");return}
  const o=layout.words.find(x=>x.w===word);
  if(o){
    if(isFound(o)){setWord(word,"bad");sfx.bad();toast("Ja la tens");}
    else{
      setWord(word,"ok");sfx.ok();
      wordCells(o).forEach((k,i)=>setTimeout(()=>reveal(k,true),i*70));
      setTimeout(checkWin,wordCells(o).length*70+50);
    }
  }else if(bonusWords.includes(word)){
    if(foundBonus.has(word)){setWord(word,"bad");sfx.bad();toast("Ja la tens");}
    else{foundBonus.add(word);coins+=5;save();updateCoins();setWord(word,"bonus");sfx.bonus();
      $("bonusCount").textContent=foundBonus.size;toast("Paraula extra! +5 🪙");}
  }else{setWord(word,"bad");sfx.bad()}
  setTimeout(()=>{if(!path.length)setWord("")},800);
}

/* ---------- Botones ---------- */
$("shuffle").addEventListener("click",()=>{
  if(locked)return;
  const cur=order.join("");let tries=0;
  do{shuffleArr(order);tries++}while(order.join("")===cur&&tries<10);
  path=[];pointer=null;
  const w=$("wheel");w.querySelectorAll(".letter").forEach((e,i)=>{
    const p=letterPos(i,order.length);e.textContent=order[i];e.style.left=p.x+"%";e.style.top=p.y+"%"});
  drawLines();sfx.tick(2);
});
function spend(n){
  if(coins<n){toast("Et falten monedes 🪙");sfx.bad();return false}
  coins-=n;save();updateCoins();sfx.coin();return true;
}
function hiddenCells(){return [...cellLetter.keys()].filter(k=>!revealed.has(k))}
$("hintBtn").addEventListener("click",()=>{
  if(locked)return;
  const h=hiddenCells();if(!h.length)return;
  if(!spend(HINT_COST))return;
  reveal(h[Math.floor(Math.random()*h.length)],true);setTimeout(checkWin,300);
});
$("targetBtn").addEventListener("click",()=>{
  if(locked)return;
  targetMode=!targetMode;
  $("targetBtn").classList.toggle("active",targetMode);
  $("grid").querySelectorAll(".cell").forEach(e=>e.classList.toggle("target",targetMode&&!revealed.has(e.dataset.k)));
  if(targetMode)toast("Toca la casella que vulguis revelar");
});
function onCellTap(k){
  if(!targetMode||revealed.has(k)||locked)return;
  if(!spend(TARGET_COST))return;
  targetMode=false;$("targetBtn").classList.remove("active");
  $("grid").querySelectorAll(".cell").forEach(e=>e.classList.remove("target"));
  reveal(k,true);setTimeout(checkWin,300);
}
$("bonusBtn").addEventListener("click",()=>{
  const bl=$("bonusList");
  bl.innerHTML=bonusWords.length?bonusWords.map(w=>'<span class="'+(foundBonus.has(w)?"got":"")+'">'+(foundBonus.has(w)?w:w.replace(/./g,"•"))+"</span>").join(""):"Aquest nivell no té paraules extra.";
  $("bonusOv").classList.add("show");
});
$("closeBonus").addEventListener("click",()=>$("bonusOv").classList.remove("show"));
$("nextBtn").addEventListener("click",()=>{$("winOv").classList.remove("show");loadLevel()});
$("shareBtn").addEventListener("click",e=>{e.stopPropagation();if(window.CQ)CQ.comparteix("He superat el nivell "+levelIdx+" de la Roda de paraules de CatQuiz 🎡 Hi jugues?","https://www.catquiz.cat/jocs/roda.html");try{gtag("event","comparteix",{joc:"roda"})}catch(er){}});

/* ---------- Pantalla completa ---------- */
function goFull(){
  const el=document.documentElement;
  try{
    if(!document.fullscreenElement){
      const p=(el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen);
      if(p){const r=p.call(el);if(r&&r.catch)r.catch(()=>{})}
      if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("portrait").catch(()=>{});
    }else{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  }catch(e){}
}
$("fsBtn").addEventListener("click",goFull);
$("playBtn").addEventListener("click",()=>{
  $("startOv").classList.remove("show");
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(!document.fullscreenElement&&!ESPECT)goFull();
});

/* ---------- Utilidades ---------- */
function updateCoins(){$("coins").textContent="🪙 "+coins}
let tt=null;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1400)}
function confetti(){
  const cols=["#ff5a5f","#ffd23f","#3bceac","#4d9de0","#e15554","#9b5de5"],g=$("game");
  for(let i=0;i<60;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"%";c.style.background=cols[i%cols.length];
    c.style.animationDelay=Math.random()*.6+"s";c.style.animationDuration=1.6+Math.random()*1.4+"s";
    g.appendChild(c);setTimeout(()=>c.remove(),3500);
  }
}
window.addEventListener("resize",()=>{renderGrid();drawLines()});
document.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- Mode espectador / demo ---------- */
const Q=new URLSearchParams(location.search),ESPECT=Q.has("espectador")||Q.has("demo");
const bsm=$("btn-musica");if(bsm){bsm.textContent=SO_ON?"🔊":"🔇";bsm.addEventListener("click",()=>{SO_ON=!SO_ON;try{localStorage.setItem("catquiz-efectes",SO_ON?"1":"0")}catch(e){}bsm.textContent=SO_ON?"🔊":"🔇"})}
if(ESPECT){
  levelIdx=Math.floor(Math.random()*40);coins=150;
  for(const ev of ["pointerdown","click","keydown"])document.addEventListener(ev,e=>{if(e.isTrusted&&!e.target.closest("#tornar,#btn-musica"))
    {e.stopPropagation();e.preventDefault()}},true);
  $("startOv").classList.remove("show");
  const espera=ms=>new Promise(r=>setTimeout(r,ms));
  (async function bot(){
    await espera(1200);
    for(;;){
      if($("winOv").classList.contains("show")){await espera(2200);$("winOv").classList.remove("show");loadLevel();await espera(1200);continue}
      const pend=layout.words.filter(o=>!isFound(o));
      if(!pend.length){await espera(600);continue}
      let o=pend[Math.floor(Math.random()*pend.length)];
      if(Math.random()<.18&&bonusWords.length){o={w:bonusWords[Math.floor(Math.random()*bonusWords.length)]}}
      // tria índexs de la roda per a cada lletra
      const usat=new Set(),idx=[];
      for(const ch of o.w){const i=order.findIndex((c,j)=>c===ch&&!usat.has(j));if(i<0)break;usat.add(i);idx.push(i)}
      if(idx.length!==o.w.length){await espera(400);continue}
      path=[];
      for(const i of idx){path.push(i);pointer=centerOf(i);sfx.tick(path.length);setWord(path.map(k=>order[k]).join(""));drawLines();await espera(260)}
      await espera(250);endSel();await espera(1300+Math.random()*900);
    }
  })();
}
loadLevel();
})();
</script>
