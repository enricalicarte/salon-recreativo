// Textures amb text (cara frontal) i panells
function textura(txt, fons, tinta, w = 128, mida = 82){
  const c = document.createElement('canvas'); c.width = w; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = fons; g.fillRect(0, 0, w, 128); g.fillStyle = tinta; g.textAlign = 'center'; g.textBaseline = 'middle';
  let f = mida; do { g.font = `${f}px 'Lilita One', Fredoka, Arial`; f -= 4; } while (g.measureText(txt).width > w - 24 && f > 20);
  g.fillText(txt, w / 2, 70); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function matsDau(ch, fons, tinta){ const llis = toon({ color: fons }); return [llis, llis, llis, llis, toon({ map: textura(ch, fons, tinta) }), llis]; }
function matsPanell(txt, fons, tinta, w){ const llis = toon({ color: fons }); return [llis, llis, llis, llis, toon({ map: textura(txt, fons, tinta, Math.round(w * 128), 64) }), llis]; }
const geoDau = new RoundedBoxGeometry(1, 1, 1, 3, .18);
function dau(ch, fons, tinta, g = .05){ return contorn(new THREE.Mesh(geoDau, matsDau(ch, fons, tinta)), g); }
function panell(txt, fons, tinta, w = 5.2, h = 1.1){ const m = contorn(new THREE.Mesh(new RoundedBoxGeometry(w, h, .5, 3, .2), matsPanell(txt, fons, tinta, w / h)), .04); m.userData.w = w; return m; }

// Encaixa una escena d'AMPLE×ALT unitats entre la capçalera (TOP px) i la zona de baix (BOT px)
let AMPLE = 7, ALT = 8, CY = 0;
function mida(){
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const kb = (90) / innerHeight, top = 125 / innerHeight, lliure = 1 - kb - top;
  const tg = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(AMPLE / (2 * tg * camera.aspect), ALT / (lliure * 2 * tg));
  const centreY = (kb - top) / 2 * (2 * d * tg);
  camera.position.set(0, CY - centreY + .3, d); camera.lookAt(0, CY - centreY, 0);
}
addEventListener('resize', mida); addEventListener('load', mida); mida();

<script>

var ICO_PC = ['<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>']; // Si el navegador no ho permet (iPhone), no es mostra.
(function(){
  var el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen, q = new URLSearchParams(location.search);
  if (!req || q.has('espectador') || q.has('demo') || q.has('video')) return;
  var dins = function(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); };
  var entra = function(){ if (dins()) return; try { var p = req.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function(){}); } catch (e) {} };
  var surt = function(){ var x = document.exitFullscreen || document.webkitExitFullscreen; if (x && dins()) try { x.call(document); } catch (e) {} };
  document.addEventListener('click', function(e){ if (e.target.closest('#btn-inici, #btn-reinici, #btn-diari, .cats .gros, .capa button.gros, .carta button')) entra(); }, true);
  var b = document.createElement('button'); b.id = 'btn-pc'; b.className = 'pill'; b.type = 'button'; b.title = 'Pantalla completa'; b.setAttribute('aria-label', 'Pantalla completa'); b.innerHTML = ICO_PC[0];
  b.addEventListener('click', function(e){ e.stopPropagation(); dins() ? surt() : entra(); });
  var mus = document.getElementById('btn-musica') || document.getElementById('musica');
  if (mus && mus.parentNode) mus.parentNode.insertBefore(b, mus.nextSibling); else { b.style.cssText = 'position:fixed;top:12px;right:12px;z-index:30'; document.body.appendChild(b); }
  var upd = function(){ b.innerHTML = ICO_PC[dins() ? 1 : 0]; b.setAttribute('aria-label', dins() ? 'Surt de pantalla completa' : 'Pantalla completa'); b.title = dins() ? 'Surt de pantalla completa' : 'Pantalla completa'; };
  document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd);
})();
</script>
</body>
</html>
