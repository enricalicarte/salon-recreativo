// ===== Motor d'àudio 100% procedural (Web Audio) =====

const AUDIO = { ctx: null, master: null, mus: null, soroll: null, actiu: localStorage.getItem('catquiz-musica') !== '0' };

const SFX = { ok:[660,1320,.14,'square'], mal:[220,90,.35,'sawtooth'], clic:[520,520,.05,'square'], win:[523,1568,.45,'square'], bonus:[880,1760,.2,'triangle'], pop:[500,800,.1,'triangle'], tic:[900,900,.05,'sine'] };

const SEQ = { bpm: 126, pas: 0, seguent: 0, timer: null, lookahead: .12, interval: 25, estil: 'quiz' };
const ESCALA = [0, 2, 4, 7, 9, 12, 14, 16]; // pentatònica major sobre Do
const ESTILS = {

const DEMO = new URLSearchParams(location.search).has('demo'); // ?demo → juga sol (reels)
const QUIZ = new URLSearchParams(location.search).has('quiz'); // ?demo&quiz → pausa "Quina és?"
const avisa = tipus => { try { parent.postMessage({ catquiz: tipus }, '*'); } catch (e) {} };
const espera = ms => new Promise(r => setTimeout(r, ms));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
const barreja = a => a.slice().sort(() => Math.random() - .5);
const tria = a => a[Math.floor(Math.random() * a.length)];

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5EC8FF);
const camera = new THREE.PerspectiveCamera(42, 1, .1, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x3f7fd0, 1.5));
const llum = new THREE.DirectionalLight(0xffffff, 1.4); llum.position.set(3, 8, 6); scene.add(llum);
// ===== Kit d'espectacle (cel-shading, cel, sol, illes flotants, confeti, compte enrere) =====
const grad = new THREE.DataTexture(new Uint8Array([135,135,135,255, 200,200,200,255, 255,255,255,255]), 3, 1, THREE.RGBAFormat);

const toon = o => new THREE.MeshToonMaterial({ gradientMap: grad, ...o });

function confeti(pos, n = 18, forca = 6){ for (let i = 0; i < n; i++) {
  const c = new THREE.Mesh(geoConf, toon({ color: colsConf[i % 6] })); c.position.copy(pos);
  c.userData = { v: new THREE.Vector3((Math.random()-.5)*forca, Math.random()*forca + 2, (Math.random()-.5)*forca), r: new THREE.Vector3(Math.random()*8, Math.random()*8, Math.random()*8), t: 1.2 + Math.random()*.6 };

function mouConfeti(dt){ for (let i = confetis.length-1; i >= 0; i--) { const c = confetis[i]; c.userData.t -= dt; c.userData.v.y -= 14 * dt;

function celISol(){

    // troba la paraula a la graella i selecciona-la
    for (let r = 0; r < N && trobades.size < paraules.length; r++) for (let c = 0; c < N; c++) for (const dir of [[0,1],[1,0],[1,1]]) { let ok = true;
      for (let i = 0; i < w.length; i++) { const rr = r + i*dir[0], cc = c + i*dir[1]; if (rr >= N || cc >= N || graella[rr][cc] !== w[i]) { ok = false; break; } }
      if (ok && !trobades.has(w)) { const cs = []; for (let i = 0; i < w.length; i++) cs.push(daus[(r + i*dir[0]) * N + c + i*dir[1]]); selCeles = cs; pinta(); await espera(500); comprova(cs); selCeles = []; pinta(); r = N; break; } } } }
document.getElementById('btn-inici').onclick = comenca; document.getElementById('btn-reinici').onclick = comenca;
if (DEMO) { document.getElementById('inici').hidden = true; setTimeout(comenca, 500); }
addEventListener('keydown', e => { if (e.key === 'Enter' && !viu) comenca(); });
tick = dt => { if (viu) { temps -= dt; document.getElementById('temps').textContent = Math.ceil(temps); if (temps <= 0) acaba(false); }
  for (const d of daus) { d.scale.lerp(new THREE.Vector3(1,1,1), dt * 8); if (d.userData.gir > 0) { const p = Math.min(dt * 6, d.userData.gir); d.rotation.y += p; d.userData.gir -= p; } } };


const btnMusica = document.getElementById('btn-musica'); if (btnMusica) { btnMusica.style.opacity = AUDIO.actiu ? 1 : .5; btnMusica.onclick = () => { btnMusica.style.opacity = musicaCommuta() ? 1 : .5; }; }
window.__fi = () => acaba(false); // per a proves automàtiques
function anima(){
  requestAnimationFrame(anima);
  const dt = Math.min(rellotge.getDelta(), .05), t = rellotge.elapsedTime;
  mouNuvols(dt); mouConfeti(dt); mouIlles(dt); solMesh.userData.raigs.rotation.z += dt * .15;
  tick(dt, t);
  renderer.render(scene, camera);
}
anima();
