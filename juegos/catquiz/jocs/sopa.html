function textura(txt, fons, tinta, w = 128, mida = 82){
  const c = document.createElement('canvas'); c.width = w; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = fons; g.fillRect(0, 0, w, 128); g.fillStyle = tinta; g.textAlign = 'center'; g.textBaseline = 'middle';
  let f = mida; do { g.font = `${f}px 'Lilita One', Fredoka, Arial`; f -= 4; } while (g.measureText(txt).width > w - 24 && f > 20);
  g.fillText(txt, w / 2, 70); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function matsDau(ch, fons, tinta){ const llis = toon({ color: fons }); return [llis, llis, llis, llis, toon({ map: textura(ch, fons, tinta) }), llis]; }
function matsPanell(txt, fons, tinta, w){ const llis = toon({ color: fons }); return [llis, llis, llis, llis, toon({ map: textura(txt, fons, tinta, Math.round(w * 128), 64) }), llis]; }
const geoDau = new RoundedBoxGeometry(1, 1, 1, 3, .18);
function dau(ch, fons, tinta, g = .05){ return contorn(new THREE.Mesh(geoDau, matsDau(ch, fons, tinta)), g); }
function panell(txt, fons, tinta, w = 5.2, h = 1.1){ const m = contorn(new THREE.Mesh(new RoundedBoxGeometry(w, h, .5, 3, .2), matsPanell(txt, fons, tinta, w / h)), .04); m.userData.w = w; return m; }
function repinta(m, txt, fons, tinta){ if (m.userData.w) m.material = matsPanell(txt, fons, tinta, m.userData.w / 1.1); else m.material = matsDau(txt, fons, tinta); }

// Encaixa una escena d'AMPLE×ALT unitats entre la capçalera (TOP px) i la zona de baix (BOT px)
let AMPLE = 7, ALT = 8, CY = 0;
function mida(){
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const llistaH = (document.getElementById('llista').offsetHeight || 120) + 34, pregH = (document.getElementById('pregunta').offsetHeight || 80) + 110;
  const kb = llistaH / innerHeight, top = pregH / innerHeight, lliure = 1 - kb - top;
  const tg = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(AMPLE / (2 * tg * camera.aspect), ALT / (lliure * 2 * tg));
  const centreY = (kb - top) / 2 * (2 * d * tg);
  camera.position.set(0, CY - centreY + .3, d); camera.lookAt(0, CY - centreY, 0);
}

  const br = document.getElementById('btn-reinici'); if (br) br.textContent = guanyat && nivell < 9 ? 'Nivell següent →' : 'Torna-hi';
  document.getElementById('final').hidden = QUIZ && DEMO; if (DEMO) setTimeout(() => comenca(guanyat), QUIZ ? 6000 : 2500); }
function celes(a, b){ // cel·les entre dos daus si estan alineats (H, V o diagonal)
  const dr = Math.sign(b.userData.r - a.userData.r), dc = Math.sign(b.userData.c - a.userData.c), n = Math.max(Math.abs(b.userData.r - a.userData.r), Math.abs(b.userData.c - a.userData.c));
  if (dr && dc && Math.abs(b.userData.r - a.userData.r) !== Math.abs(b.userData.c - a.userData.c)) return null;
  const out = []; for (let i = 0; i <= n; i++) { const d = daus[(a.userData.r + i*dr) * N + (a.userData.c + i*dc)]; if (!d) return null; out.push(d); } return out;
}
function pinta(){ for (const d of daus) if (!d.userData.ok) d.material = matsDau(graella[d.userData.r][d.userData.c], selCeles.includes(d) ? '#FFD600' : '#FFFFFF', '#1D2B64'); }
function ini(e){ if (!viu) return; const d = sota(e, daus); if (!d) return; selInici = d; selFi = d; selCeles = [d]; pinta(); }
function mou(e){ if (!selInici) return; const d = sota(e, daus); if (!d || d === selFi) return; const cs = celes(selInici, d); if (cs) { selFi = d; selCeles = cs; pinta(); } }
function fi(){ if (!selInici) return; comprova(selCeles); selInici = null; selCeles = []; pinta(); }
function comprova(cs){
  const w = cs.map(d => graella[d.userData.r][d.userData.c]).join(''), rev = [...w].reverse().join('');
  const hit = paraules.find(p => (p === w || p === rev) && !trobades.has(p));
  if (hit) { trobades.add(hit); punts += hit.length * 10 + Math.ceil(temps / 10); document.getElementById('punts').textContent = punts; popPill('punts'); so('bonus');
    const col = ['#FF3E9A','#7CE800','#33E0FF','#9B5CFF','#FF8C1A','#FFD600'][trobades.size % 6];
    for (const d of cs) { d.userData.ok = true; d.material = matsDau(graella[d.userData.r][d.userData.c], col, '#1D2B64'); confeti(d.position, 4, 4); d.userData.gir = Math.PI * 2; }
    document.getElementById('w-' + hit).classList.add('ok'); if (trobades.size === paraules.length) setTimeout(() => acaba(true), 600);
    if (QUIZ && DEMO && trobades.size === 3 && !comprova.quiz) { comprova.quiz = true; avisa('quiz'); }
  } else if (cs.length > 1) so('mal');
}
renderer.domElement.addEventListener('pointerdown', ini); renderer.domElement.addEventListener('pointermove', mou); addEventListener('pointerup', fi);
async function bot(){ comprova.quiz = false; for (const w of paraules) { if (!viu) return; await espera(ESPECT ? 2600 + Math.random()*1500 : 1400); if (QUIZ && trobades.size === 3) await espera(5200);
    // troba la paraula a la graella i selecciona-la
    for (let r = 0; r < N && trobades.size < paraules.length; r++) for (let c = 0; c < N; c++) for (const dir of [[0,1],[1,0],[1,1]]) { let ok = true;
      for (let i = 0; i < w.length; i++) { const rr = r + i*dir[0], cc = c + i*dir[1]; if (rr >= N || cc >= N || graella[rr][cc] !== w[i]) { ok = false; break; } }
      if (ok && !trobades.has(w)) { const cs = []; for (let i = 0; i < w.length; i++) cs.push(daus[(r + i*dir[0]) * N + c + i*dir[1]]); selCeles = cs; pinta(); await espera(500); comprova(cs); selCeles = []; pinta(); r = N; break; } } } }
document.getElementById('btn-inici').onclick = () => comenca(false); document.getElementById('btn-reinici').onclick = () => comenca(document.getElementById('titol-final').textContent.includes('Nivell'));
if (DEMO) { document.getElementById('inici').hidden = true; setTimeout(comenca, 500); }
addEventListener('keydown', e => { if (e.key === 'Enter' && !viu) comenca(); });
tick = dt => { if (viu) { temps -= dt; document.getElementById('temps').textContent = Math.ceil(temps); if (temps <= 0) acaba(false); }
  for (const d of daus) { d.scale.lerp(new THREE.Vector3(1,1,1), dt * 8); if (d.userData.gir > 0) { const p = Math.min(dt * 6, d.userData.gir); d.rotation.y += p; d.userData.gir -= p; } } };


const btnMusica = document.getElementById('btn-musica'); if (btnMusica) { btnMusica.style.opacity = AUDIO.actiu ? 1 : .5; btnMusica.onclick = () => { btnMusica.style.opacity = musicaCommuta() ? 1 : .5; }; }

function anima(){
  requestAnimationFrame(anima);
  const dt = Math.min(rellotge.getDelta(), .05), t = rellotge.elapsedTime;
  mouNuvols(dt); mouConfeti(dt); mouIlles(dt); solMesh.userData.raigs.rotation.z += dt * .15;
  tick(dt, t);
  renderer.render(scene, camera);
}
