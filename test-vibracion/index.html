<body><h1>Prueba de vibración</h1>
<p>Toca cada botón y fíjate si el móvil vibra. Abajo verás qué responde el navegador.</p>
<div class="g">
<button data-v="15">Corta (15 ms)</button>
<button data-v="40">Media (40 ms)</button>
<button data-v="200">Larga (200 ms)</button>
<button data-v="[100,80,100,80,300]">Patrón</button>
</div>
<p style="margin-top:14px">Y lo mismo dentro de un recuadro, como cuando juegas desde la ficha del Salón:</p>
<iframe id="fr" title="prueba dentro de recuadro"></iframe>
<div id="log"></div>
<script>
const log=(t,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=t;document.getElementById('log').prepend(d);};
log('Navegador: '+navigator.userAgent);
log('¿Tiene vibración?: '+('vibrate' in navigator?'sí':'NO'),('vibrate' in navigator)?'ok':'ko');
function vib(v,where){let r;try{r=navigator.vibrate(v);}catch(e){r='error: '+e.message;}
  log((where||'Página')+' → vibrate('+JSON.stringify(v)+') = '+r,r===true?'ok':'ko');}
document.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>vib(JSON.parse(b.dataset.v)));
const fr=document.getElementById('fr');
fr.srcdoc='<style>body{margin:0;display:grid;place-items:center;height:100vh;font:700 16px system-ui}button{font:700 16px system-ui;border:0;border-radius:14px;padding:16px 22px;background:#38b6ff}</style><button>Vibrar dentro del recuadro (200 ms)</button><script>document.querySelector("button").onclick=function(){var r;try{r=navigator.vibrate(200)}catch(e){r="error"}parent.postMessage({r:r},"*")}<\/script>';
addEventListener('message',e=>{if(e.data&&'r' in e.data)log('Recuadro → vibrate(200) = '+e.data.r,e.data.r===true?'ok':'ko');});
</script></body></html>
